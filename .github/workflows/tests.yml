name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[test]' setuptools wheel
      - run: python -m pytest
      - run: python examples/custom_bot.py

  integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[test,export,catanatron,gym]' setuptools wheel
      - name: Verify optional dependencies are importable
        run: python -c 'import onnx, onnxruntime, catanatron.game, gymnasium, pettingzoo'
      - run: python -m pytest -m ''
