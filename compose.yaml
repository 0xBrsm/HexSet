services:
  catan-web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: catan-web:local
    container_name: catan-web
    restart: unless-stopped
    ports:
      - "8770:8770"
    volumes:
      # Bind-mounted, not baked into the image (see docker/Dockerfile): a
      # code edit is `git pull` + `docker compose restart`, index.html
      # changes don't even need that much since it's read fresh per request.
      - ./src:/app/src:ro
      - ./models:/app/models
    # agent:agents, matching scribe's own stack — runs without sudo.
    user: "1001:1002"
    read_only: true
    # onnxruntime/numpy may want scratch space; the root filesystem being
    # read-only shouldn't mean they get a write error for it.
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
