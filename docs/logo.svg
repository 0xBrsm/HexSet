<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Wheel graph: a hex ring of six nodes plus a hub, one line per edge,
       traced from the photographed source icon (see commit message).
       Scaled 1.4x about the canvas center so the ring bleeds to (and
       slightly past, top/bottom) the viewBox edges — no border margin. -->
  <g stroke="#1076a4" stroke-width="22.4" stroke-linecap="round">
    <line x1="100"   y1="100"   x2="100"   y2="13.2"/>
    <line x1="100"   y1="100"   x2="175.2" y2="56.6"/>
    <line x1="100"   y1="100"   x2="175.2" y2="143.4"/>
    <line x1="100"   y1="100"   x2="100"   y2="186.8"/>
    <line x1="100"   y1="100"   x2="24.8"  y2="143.4"/>
    <line x1="100"   y1="100"   x2="24.8"  y2="56.6"/>
    <line x1="100"   y1="13.2"  x2="175.2" y2="56.6"/>
    <line x1="175.2" y1="56.6"  x2="175.2" y2="143.4"/>
    <line x1="175.2" y1="143.4" x2="100"   y2="186.8"/>
    <line x1="100"   y1="186.8" x2="24.8"  y2="143.4"/>
    <line x1="24.8"  y1="143.4" x2="24.8"  y2="56.6"/>
    <line x1="24.8"  y1="56.6"  x2="100"   y2="13.2"/>
  </g>
  <g fill="#1076a4">
    <circle cx="100"   cy="100"   r="30.8"/>
    <circle cx="100"   cy="13.2"  r="25.2"/>
    <circle cx="175.2" cy="56.6"  r="25.2"/>
    <circle cx="175.2" cy="143.4" r="25.2"/>
    <circle cx="100"   cy="186.8" r="25.2"/>
    <circle cx="24.8"  cy="143.4" r="25.2"/>
    <circle cx="24.8"  cy="56.6"  r="25.2"/>
  </g>
</svg>
