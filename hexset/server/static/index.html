// everywhere else in the app, so subtracting through it was a control nobody
// could see. A resource already on the other side is dimmed: the two halves of
// a trade are disjoint (see `round_bundle_from_wire`), as is one the hand
// doesn't hold at all.
function composerRow(p, which, allowAny = false) {
  const mine = which === "give" ? tradeGive : tradeWant;
  const other = which === "give" ? tradeWant : tradeGive;
  const row = html("div", {class: "trade-row"});
  for (let r = 0; r < board.resources.length; r++) {
    const name = board.resources[r];
    const ceiling = which === "give"
      ? giveCeiling(p, r)
      : BANK_RATE * board.resources.length;
    // A give side loaded from someone else's ask (countering) can start
    // above what the hand actually holds — shaded rather than left to a
    // sentence below the rows to explain.
    const held = p.hand ? (p.hand[name] || 0) : 0;
    const shortfall = which === "give" && mine[r] > held;
    const stack = html("div", {class: "pick-stack"});
    stack.appendChild(pickCard(r, {
      selected: mine[r] > 0,
      disabled: other[r] > 0 || ceiling === 0,
      shortfall,
      count: mine[r],
      forceCount: true,
      title: shortfall ? `You only hold ${held} ${name}`
        : mine[r] < ceiling ? `Add a ${name}` : name,
      onClick: () => {
        if (mine[r] < ceiling) { mine[r] += 1; renderModal(); }
      },
    }));
    // Hidden rather than absent when there is nothing to take off, so the
    // tiles above stay on one baseline as counts come and go.
    const minus = html("button", {
      class: mine[r] > 0 ? "pick-minus" : "pick-minus hidden",
      title: `One fewer ${name}`,
      "aria-label": `One fewer ${name}`,
    }, "\u2212");
    minus.addEventListener("click", () => { mine[r] -= 1; renderModal(); });
    stack.appendChild(minus);
    row.appendChild(stack);
  }
  if (allowAny) row.appendChild(anyStack(p, which));
  return row;
}

// The sixth tile of an offer's rows: any cards, on one side at a time. An
// offer holding them is an invitation to counter -- on the give side, name
// the card you want; on the get side, pick the card you give -- and is never
// taken as it stands (see answer_round in hexset.server._webplay).
function anyStack(p, which) {
  const count = which === "give" ? tradeGiveAny : tradeWantAny;
  const otherAny = which === "give" ? tradeWantAny : tradeGiveAny;
  const ceiling = BANK_RATE * board.resources.length;
  const disabled = otherAny > 0;
  const classes = ["pick-card"];
  if (count > 0) classes.push("selected");
  if (disabled) classes.push("disabled");
  const tile = anyCardTile({
    extraClasses: classes,
    title: "Add any card",
  });
  if (count > 0) tile.appendChild(html("div", {class: "count"}, String(count)));
  if (!disabled) {
    tile.addEventListener("click", () => {
      if (count >= ceiling) return;
      if (which === "give") tradeGiveAny += 1; else tradeWantAny += 1;
      renderModal();
    });
  }
  const stack = html("div", {class: "pick-stack"});
  stack.appendChild(tile);
  const minus = html("button", {
    class: count > 0 ? "pick-minus" : "pick-minus hidden",
    title: "One fewer any card", "aria-label": "One fewer any card",
  }, "\u2212");
  minus.addEventListener("click", () => {
    if (which === "give") tradeGiveAny -= 1; else tradeWantAny -= 1;
    renderModal();
  });
  stack.appendChild(minus);
  return stack;
}

// A trade nobody is editing: the cards in it and nothing else, read as
// "[left] for [right]". Whose deal it is comes from the colour pip beside the
// line, and the pip is always the seat *giving* — so left of "for" is what
// that seat hands over, which makes a seat's accept the mirror of the offer it
// answers rather than a repeat of it. `leftShortfall`/`rightShortfall`, if
// given, mark which of that side's resources this seat doesn't hold enough
// of, shaded in place of a sentence explaining the same thing below the row.
// `small` is the 30x40 tile, for a line that shares its row with a swatch and
// a button (a pane row, a quoted offer).
function tradeLine(left, right, {leftShortfall, rightShortfall, small, leftAny = 0, rightAny = 0} = {}) {
  const line = html("div", {class: small ? "trade-line small" : "trade-line"});
  line.appendChild(bundleChips(left, {shortfall: leftShortfall, any: leftAny}));
  line.appendChild(html("span", {class: "trade-arrow"}, "for"));
  line.appendChild(bundleChips(right, {shortfall: rightShortfall, any: rightAny}));
  return line;
}

// `bundleWords`, with a side's any cards: "1 Wood and any 1 card", "any 2 cards".
function bundleWordsAny(counts, anyCount) {
  const words = bundleWords(counts);
  if (!anyCount) return words;
  const extra = `any ${anyCount} card${anyCount === 1 ? "" : "s"}`;
  return words === "nothing" ? extra : `${words} and ${extra}`;
}

// `[2, 0, 0, 0, 1]` -> "2 Wood and 1 Ore"; nothing picked -> "nothing".
function bundleWords(counts) {
  const parts = [];
  for (let r = 0; r < board.resources.length; r++) {
    if (counts[r]) parts.push(`${counts[r]} ${board.resources[r]}`);
  }
  if (!parts.length) return "nothing";
  if (parts.length === 1) return parts[0];
  return `${parts.slice(0, -1).join(", ")} and ${parts[parts.length - 1]}`;
}

function resetComposer() {
  tradeGive = [0, 0, 0, 0, 0];
  tradeWant = [0, 0, 0, 0, 0];
  tradeGiveAny = 0;
  tradeWantAny = 0;
  counterOf = null;
}

// Load the composer from a signed bundle seen from this seat: positive is
// what this seat gets.
function loadComposer(signed) {
  tradeGive = signed.map((n) => Math.max(0, -n));
  tradeWant = signed.map((n) => Math.max(0, n));
  tradeGiveAny = 0;
  tradeWantAny = 0;
}

// The six modes, and what puts each one up:
//   "trade"          clicking a resource card in hand (renderHand)
//   "monopoly"       clicking the Monopoly card in hand (devCardPlay)
//   "year-of-plenty" clicking the Year of Plenty card in hand (devCardPlay)
//   "discard"        cards owed to the bank after a seven (syncModal)
//   "steal"          a robber hex with more than one victim (syncModal)
//   "new-game"       the header's New game button (newGame)
function openModal(mode, {give = null, seat = null} = {}) {
  modalMode = mode;
  if (mode === "pick-bot") {
    const player = state.players.find((p) => p.seat === seat) || {};
    const closed = (state.locked || []).includes(seat);
    const current = player.bot || (closed ? CLOSE_SEAT : "");
    pickBot = {seat, model: current, was: current};
  }
  if (mode === "new-game") {
    // Every open starts from what the server deals when told nothing.
    newGameBoard = "spiral";
    newGameDuel = false;
  } else if (mode === "trade") {
    // `give` is the resource clicked in the hand (see renderHand()), one of it.
    resetComposer();
    if (give !== null) tradeGive[give] = 1;
  } else if (mode === "year-of-plenty") {
    yopPicks = [];
  } else if (mode === "monopoly") {
    monopolyPick = null;
  }
  document.getElementById("modal").classList.add("show");
  // The bot picker has its own, wider layout (#modal-inner.pick).
  document.getElementById("modal-inner").classList.toggle("pick", mode === "pick-bot");
  // See the CSS comment on #undo-build.reach-modal: every other mode leaves
  // the corner button behind the backdrop like any other board control, only
  // "steal" needs it reaching through.
  document.getElementById("undo-build").classList.toggle("reach-modal", mode === "steal");
  renderModal();
  // After renderModal, not before: the clamp measures the box, and what the
  // mode just drew is what decides its height.
  applyModalDrag();
}

function closeModal() {
  // Closing the victim list is backing out to the hex list, not out of the
  // move: the board's highlights were never cleared to get here, so dropping
  // the pending hex is the whole undo — and it's also what stops syncModal
  // from putting the same list straight back up on the next render.
  if (modalMode === "steal") pendingRobberHex = null;
  modalMode = null;
  document.getElementById("modal").classList.remove("show");
  document.getElementById("modal-inner").classList.remove("pick");
  document.getElementById("undo-build").classList.remove("reach-modal");
}

// Called every render(). The three MODAL_AUTO modes are conditions rather
// than clicks — an offer is waiting, cards are owed, a hex with more than one
// neighbour has been picked — so this is the single place that decides which
// of them (if any) should be up, and closes whichever no longer should be.
// The click-driven three are left alone entirely.
function syncModal() {
  const g = groupActions(state.legal_actions);
  const live = g.discard.length ? "discard"
    : pendingRobberHex !== null ? "steal"
    : null;
  if (live) {
    if (modalMode !== live) openModal(live);
    else renderModal();
  } else if (MODAL_AUTO.has(modalMode)) {
    closeModal();
  } else if (modalMode === null && ((state.pending || []).length || state.trade_round)) {
    // An offer to answer, or this seat's own round still open (a reload
    // mid-negotiation) -- put the trade modal up on its own.
    openModal("trade");
  } else if (modalMode === "trade") {
    // Keep offers and answers current across every poll without resetting
    // what is mid-composition -- and close once there is nothing left to
    // show: the offer answered, the round over, the turn moved on.
    const myTurn = state.phase === "MAIN" && state.to_move === state.seat;
    if (!(state.pending || []).length && !state.trade_round && !myTurn) closeModal();
    else renderModal();
  }
}

function renderModal() {
  const title = document.getElementById("modal-title");
  const body = document.getElementById("modal-body");
  const actions = document.getElementById("modal-actions");
  body.innerHTML = "";
  actions.innerHTML = "";
  // Hidden by default and put back by whichever mode has a way out (see
  // modalCloseGlyph), so a mode that doesn't need to say anything about it
  // doesn't have to.
  const close = document.getElementById("modal-close");
  close.hidden = true;
  close.onclick = null;

  // The one mode about no game in particular, so it reads nothing off
  // `state`, which a page that could not deal or find one does not have.
  if (modalMode === "new-game") renderNewGameMode(title, body, actions);
  else {
    const g = groupActions(state.legal_actions);
    if (modalMode === "discard") renderDiscardMode(g, title, body);
    else if (modalMode === "steal") renderStealMode(g, title, body);
    else if (modalMode === "monopoly") renderMonopolyMode(g, title, body, actions);
    else if (modalMode === "year-of-plenty") renderYearOfPlentyMode(g, title, body, actions);
    else if (modalMode === "pick-bot") renderPickBotMode(title, body);
    else renderTradeMode(title, body, actions);
  }

  // A forced discard, an acceptance pane and a counter being written all
  // have nothing to put in the button column, and an empty gutter reads as a
  // button that failed to render rather than as no button at all.
  actions.style.display = actions.children.length ? "" : "none";
}

// One card at a time, which is how the engine models it too (see
// `legal_actions` under Phase.DISCARD): this comes straight back up with one
// fewer owed until the quota is met, so there's nothing to confirm and no
// button column at all.
function renderDiscardMode(g, title, body) {
  const owed = state.discard_quota[state.seat];
  title.textContent = `Discard ${owed} card${owed === 1 ? "" : "s"}`;
  body.appendChild(html("div", {class: "modal-note"}, "Half your hand, rounded down — pick one."));
  const p = state.players.find((pl) => pl.seat === state.seat);
  const byResource = {};
  for (const a of g.discard) byResource[a.a] = a;
  const row = html("div", {class: "pick-row"});
  for (let r = 0; r < board.resources.length; r++) {
    const name = board.resources[r];
    const a = byResource[r];
    // All five, with the ones the human doesn't hold dimmed rather than
    // dropped: the row keeps the same shape from one discard to the next
    // instead of reflowing under the cursor between clicks.
    row.appendChild(pickCard(r, {
      count: p.hand[name], disabled: !a,
      title: a ? `Discard ${name}` : name,
      onClick: () => sendAction(a),
    }));
  }
  body.appendChild(row);
}

// The second half of a robber move: the hex is already picked (it's the one
// still highlighted behind this), and this is who to rob on it. Seats, not
// resources, so plain buttons with the player list's own colour swatch.
function renderStealMode(g, title, body) {
  const move = robberMove(g);
  const options = (move && move.targets[pendingRobberHex]) || [];
  title.textContent = "Steal from";
  modalCloseGlyph("Back to the hexes", closeModal);
  const row = html("div", {class: "steal-row"});
  for (const a of options) {
    const btn = html("button", {class: "steal-option"});
    if (a.b < state.players.length) {
      const swatch = html("div", {class: "swatch"});
      swatch.style.background = SEAT_COLORS[a.b].fill;
      swatch.style.borderColor = SEAT_COLORS[a.b].stroke;
      btn.appendChild(swatch);
      btn.appendChild(document.createTextNode(seatFullLabel(a.b)));
    } else {
      btn.appendChild(document.createTextNode("Nobody"));
    }
    btn.addEventListener("click", () => { closeModal(); sendAction(a); });
    row.appendChild(btn);
  }
  body.appendChild(row);
}

// One tap picks, same as Monopoly's own single choice; a second, separate
// tap on Confirm is what actually sends it — picking alone doesn't commit,
// matching Year of Plenty (renderYearOfPlentyMode) so every dev card that
// takes cards from other players gets a chance to back out first.
// What the next table is dealt as. Duel is the duel variant
// (hexset.rules.DUEL_VARIANT_GAME), played at two seats, so the server deals
// it with the other two closed for good; Standard is dealt at four seats.
// Either way the playing seats can still be closed before the first move,
// down to one person practising alone.
function renderNewGameMode(title, body, actions) {
  title.textContent = "New game";
  // With no table behind the page (the front door) there is nothing to go
  // back to, so the modal has no way out but Deal.
  if (state) modalCloseGlyph("Cancel", closeModal);
  body.appendChild(choiceGroup("Board", "board", [["spiral", "Spiral"], ["random", "Random"]],
    newGameBoard, (value) => { newGameBoard = value; renderModal(); }));
  body.appendChild(choiceGroup("Rules", "duel", [[false, "Standard"], [true, "Duel"]],
    newGameDuel, (value) => { newGameDuel = value; renderModal(); }));
  const deal = modalActionButton("check", "Deal");
  deal.id = "deal-new-game";
  deal.addEventListener("click", dealNewGame);
  actions.appendChild(deal);
}

// One seat's bot: a card per bot this game type offers (its name, version and
// description, `GET /api/models`), the one seated marked. Tapping a card
// seats that bot; before the first move the foot can leave the seat open or
// close it instead.
function renderPickBotMode(title, body) {
  const {seat, was} = pickBot;
  title.textContent = `${colorName(seat)} seat`;
  modalCloseGlyph("Cancel", closeModal);
  const entries = modelsByType[state.game_type] || {};
  const names = Object.keys(entries);
  if (was && was !== CLOSE_SEAT && !names.includes(was)) names.push(was);
  names.sort((a, b) => a.localeCompare(b));
  const list = html("div", {class: "bot-cards"});
  for (const name of names) {
    const info = entries[name] || {};
    const seated = was === name;
    const card = html("button", {
      type: "button", class: `bot-card${seated ? " seated" : ""}`, "data-model": name,
      "aria-pressed": String(seated),
    });
    const head = html("div", {class: "bot-card-head"});
    const nameNode = html("b", {class: "bot-card-name"});
    nameNode.textContent = info.label || name;
    head.appendChild(nameNode);
    if (info.version) {
      const version = html("span", {class: "bot-card-version"});
      version.textContent = info.version;
      head.appendChild(version);
    }
    if (seated) head.appendChild(html("span", {class: "bot-card-seated"}, "Seated"));
    card.appendChild(head);
    const about = html("div", {class: `bot-card-about${info.description ? "" : " none"}`});
    about.textContent = info.description || "No description.";
    card.appendChild(about);
    card.addEventListener("click", () => chooseBot(name));
    list.appendChild(card);
  }
  body.appendChild(list);
  if (!state.started && !(state.fixed_seats || []).includes(seat)) {
    const foot = html("div", {class: "bot-pick-foot"});
    for (const [value, text] of [["", "Leave open"], [CLOSE_SEAT, "Close seat"]]) {
      const on = was === value;
      const btn = html("button", {
        type: "button", "data-choice": "seat", "data-value": value, "aria-pressed": String(on),
        class: on ? "chosen" : "",
      }, text);
      btn.addEventListener("click", () => chooseBot(value));
      foot.appendChild(btn);
    }
    body.appendChild(foot);
  }
}

// The pick shows on its row at once, dimmed, while the server seats it: the
// first seat of a model can wait on it loading. A refusal puts the row back.
async function chooseBot(model) {
  const {seat, was} = pickBot;
  closeModal();
  if (model === was) return;
  pendingSeat = {seat, label: model === CLOSE_SEAT ? "(closed)" : model ? botLabel(model) : "(empty)"};
  render();
  try {
    if (model === CLOSE_SEAT) await closeSeat(seat);
    else if (model === "") await reopenSeat(seat);
    else await swapBot(seat, model);
  } finally {
    pendingSeat = null;
    render();
  }
}

// A caption over one button per option, the chosen one pressed. `key` names
// the group for whoever reads the buttons back (data-choice).
function choiceGroup(label, key, options, chosen, onPick) {
  const group = html("div", {class: "choice-group"});
  group.appendChild(html("div", {class: "choice-label"}, label));
  const row = html("div", {class: "choice-row", role: "group", "aria-label": label});
  for (const [value, text] of options) {
    const on = value === chosen;
    const btn = html("button", {
      class: on ? "primary" : "", "aria-pressed": String(on),
      "data-choice": key, "data-value": String(value),
    }, text);
    btn.addEventListener("click", () => onPick(value));
    row.appendChild(btn);
  }
  group.appendChild(row);
  return group;
}

function renderMonopolyMode(g, title, body, actions) {
  title.textContent = "Play Monopoly";
  modalCloseGlyph("Cancel", closeModal);
  body.appendChild(html("div", {class: "modal-note"},
    "Take every card of one resource from every other player, then confirm."));
  const row = html("div", {class: "pick-row"});
  for (const a of g.monopoly) {
    row.appendChild(pickCard(a.a, {
      selected: monopolyPick === a.a,
      title: `Take every ${board.resources[a.a]}`,
      onClick: () => { monopolyPick = a.a; renderModal(); },
    }));
  }
  body.appendChild(row);
  if (monopolyPick !== null) {
    const a = g.monopoly.find((a) => a.a === monopolyPick);
    const btn = modalActionButton("check", "Confirm");
    btn.addEventListener("click", () => { monopolyPick = null; closeModal(); sendAction(a); });
    actions.appendChild(btn);
  }
}

// The pair `g.yearOfPlenty` actually offers for two resource names, order
// not mattering — combinations_with_replacement (see YEAR_OF_PLENTY_PAIRS)
// never emits both orders, so one direction check would silently miss the
// other.
function yopAction(g, name0, name1) {
  return g.yearOfPlenty.find((a) => {
    const [n0, n1] = board.year_of_plenty_pairs[a.a];
    return (n0 === name0 && n1 === name1) || (n0 === name1 && n1 === name0);
  });
}

// Two taps, same card allowed twice — the bank-availability check already
// baked into `g.yearOfPlenty` (see `_card_actions`) is what disables a
// resource here, so a card greys out exactly when the bank can no longer
// cover it, including a second copy of one already picked. The pick itself
// doesn't send anything — Confirm only shows up once both slots are filled,
// so there's always a chance to look the pair over (or Cancel) before either
// card leaves the bank.
function renderYearOfPlentyMode(g, title, body, actions) {
  title.textContent = "Play Year of Plenty";
  modalCloseGlyph("Cancel", closeModal);
  body.appendChild(html("div", {class: "modal-note"},
    "Take two cards from the bank — click a card, then click it again for a second, then confirm."));
  const row = html("div", {class: "pick-row"});
  const first = yopPicks.length ? board.resources[yopPicks[0]] : null;
  for (let r = 0; r < board.resources.length; r++) {
    const name = board.resources[r];
    const count = yopPicks.filter((p) => p === r).length;
    const available = first === null
      ? g.yearOfPlenty.some((a) => board.year_of_plenty_pairs[a.a].includes(name))
      : !!yopAction(g, first, name);
    row.appendChild(pickCard(r, {
      selected: count > 0,
      count,
      forceCount: true,
      disabled: yopPicks.length >= 2 || !available,
      title: name,
      onClick: () => {
        yopPicks.push(r);
        renderModal();
      },
    }));
  }
  body.appendChild(row);
  if (yopPicks.length === 2) {
    const a = yopAction(g, board.resources[yopPicks[0]], board.resources[yopPicks[1]]);
    const btn = modalActionButton("check", "Confirm");
    btn.addEventListener("click", () => { yopPicks = []; closeModal(); sendAction(a); });
    actions.appendChild(btn);
  }
}

// A bundle as a row of card tiles, one per resource in it, count badges as a
// hand card gets them. `shortfall[r]`, if given, shades that resource's tile
// to mark it short of the hand instead of saying so in a sentence.
function bundleChips(counts, {shortfall, any = 0} = {}) {
  const row = html("div", {class: "pick-row"});
  for (let r = 0; r < board.resources.length; r++) {
    const n = counts[r];
    if (!n) continue;
    const extraClasses = shortfall && shortfall[r] ? ["shortfall"] : [];
    const card = resourceCardTile(board.resources[r], {extraClasses});
    if (n > 1) card.appendChild(html("div", {class: "count"}, String(n)));
    row.appendChild(card);
  }
  if (any > 0) {
    const card = anyCardTile({title: `Any ${any} card${any === 1 ? "" : "s"}`});
    if (any > 1) card.appendChild(html("div", {class: "count"}, String(any)));
    row.appendChild(card);
  }
  return row;
}

function seatSwatch(seat) {
  const swatch = html("div", {class: "swatch"});
  swatch.style.background = SEAT_COLORS[seat].fill;
  swatch.style.borderColor = SEAT_COLORS[seat].stroke;
  return swatch;
}

// The colour pip that names the seat beside a trade line. Which seat that is
// follows one convention throughout the modal: the pip is the seat *giving*,
// so left of "for" is always what the pip hands over (see tradeLine).
function seatPip(seat) {
  const pip = seatSwatch(seat);
  pip.classList.add("seat-pip");
  return pip;
}

// A 40px square holding a row's place where a button would be but isn't —
// a seat that has not answered yet — so the checks down a pane stay on one x.
function buttonGap() {
  return html("div", {class: "modal-btn-gap"});
}

function answerOffer(offer, kind, bundle) {
  return blocking(async () => {
    const body = {actor: offer.actor, received: offer.bundle, kind};
    if (bundle) body.bundle = bundle;
    const {ok, data} = await postJSON(`/api/games/${tableCode}/trade/round/answer`, body);
    if (ok) { state = data; resetComposer(); }
    showNotice(ok ? "" : (data.error || "That offer isn't open any more."));
    render();
    if (ok) settle();
  });
}

function postRound(path, body) {
  return blocking(async () => {
    const {ok, data} = await postJSON(`/api/games/${tableCode}${path}`, body);
    if (ok) { state = data; resetComposer(); }
    showNotice(ok ? "" : (data.error || "That did not go through."));
    render();
    if (ok) settle();
  });
}

// The acceptance pane: this seat's own open offer on top, a rule, then one
// row for every other seat in seat order — its colour pip, whatever it
// answered, and the check that takes that deal. Read down, it is the table's
// answer to one question, which is why every seat gets a row whether it has
// answered or not: a seat still to answer dims its pip and says nothing,
// exactly what is known about it, where a list of only the answers so far
// left "who is left" to be worked out from the seats that aren't in it.
//
// Every line is drawn from the giving seat's own side (see tradeLine), so an
// accept is our offer mirrored and a counter is what that seat would hand
// over first — the pip beside a row and the cards left of "for" always agree.
// An answer this hand can't cover has no check: a counter's cards we are
// short of are shaded, as on an offer received.
function acceptancePane(round, p) {
  const wrap = html("div", {class: "pane"});
  const signed = round.offer.bundle;   // positive is what this seat gets
  const iGive = signed.map((n) => Math.max(0, -n));
  const iGet = signed.map((n) => Math.max(0, n));

  // No pip on our own row: the pane is ours, and the pip is what says whose
  // answer a row below is.
  const ours = html("div", {class: "pane-row"});
  const anyCards = round.offer.any || 0;   // signed like the bundle: positive is ours to take
  ours.appendChild(tradeLine(iGive, iGet,
    {small: true, leftAny: Math.max(0, -anyCards), rightAny: Math.max(0, anyCards)}));
  wrap.appendChild(ours);
  wrap.appendChild(html("div", {class: "pane-rule"}));

  // Only the seats still in the game: a closed seat was never asked and
  // has no row, so a three-seat table reads as three, not four with a blank.
  const locked = state.locked || [];
  const seats = state.players.map((pl) => pl.seat).filter((seat) => !locked.includes(seat)).sort((a, b) => a - b);
  for (const seat of seats) {
    if (seat === state.seat) continue;
    const answer = (round.responses || []).find((r) => r.seat === seat);
    const row = html("div", {class: answer ? "pane-row" : "pane-row quiet"});
    row.appendChild(seatPip(seat));
    if (!answer) {
      // No text and no chip: the dim pip and the empty row are the whole
      // message, and a "waiting…" beside each of them was three copies of it.
      row.appendChild(html("div", {class: "modal-fill"}));
      row.appendChild(buttonGap());
      wrap.appendChild(row);
      continue;
    }
    if (answer.kind === "pass") {
      // A pass is an answer, not silence: the row reads at full strength so
      // it is told apart from a seat still to answer, and says the one word
      // that is the whole of what the seat said.
      row.appendChild(html("div", {class: "pane-pass"}, "Passed"));
      row.appendChild(buttonGap());
      wrap.appendChild(row);
      continue;
    }
    if (answer.kind === "accept") {
      // An accept mirrors our own offer, already drawn in "ours" above this
      // row's rule -- redrawing the identical cards here said the same thing
      // twice. Same treatment as "Passed": the one word is the whole answer.
      row.appendChild(html("div", {class: "pane-pass"}, "Accepted"));
      if (handCovers(p, iGive)) {
        const take = modalActionButton("check", `Trade with ${seatFullLabel(seat)}`);
        take.addEventListener("click",
          () => { closeModal(); postRound("/trade/round/choose", {seat: answer.seat, bundle: answer.bundle}); });
        row.appendChild(take);
      } else {
        row.appendChild(buttonGap());
      }
      wrap.appendChild(row);
      continue;
    }
    // A counter's bundle is signed towards us the same way the offer is, so
    // what that seat gives is what we get -- and unlike a plain accept, this
    // is new information the offer above didn't already say.
    const theirGive = answer.bundle.map((n) => Math.max(0, n));
    const theirWant = answer.bundle.map((n) => Math.max(0, -n));
    const shortfall = theirWant.map((n, r) => n > (p.hand[board.resources[r]] || 0));
    row.appendChild(tradeLine(theirGive, theirWant, {small: true, rightShortfall: shortfall}));
    if (!handCovers(p, theirWant)) {
      row.appendChild(buttonGap());
      wrap.appendChild(row);
      continue;
    }
    // Gray, not accent: the row above already reads as a deal on offer, not
    // one struck -- the accent is reserved for the one check that takes a
    // trade exactly as this seat asked for it (see the "accept" branch
    // above), so a counter's own check doesn't compete with it for "the
    // thing to press."
    const take = modalActionButton("check", `Trade with ${seatFullLabel(seat)}`, {primary: false});
    take.addEventListener("click",
      () => { closeModal(); postRound("/trade/round/choose", {seat: answer.seat, bundle: answer.bundle}); });
    row.appendChild(take);
    wrap.appendChild(row);
  }
  return wrap;
}

// Whether the give side is actually in this hand. Checked here as well as
// server-side because the answer is also what shades the short cards in the
// give row, rather than the composer refusing the request silently.
function handCovers(p, give) {
  return give.every((n, r) => n <= (p.hand[board.resources[r]] || 0));
}

function composerReady(p) {
  const gives = tradeGive.reduce((a, b) => a + b, 0) + tradeGiveAny;
  const gets = tradeWant.reduce((a, b) => a + b, 0) + tradeWantAny;
  if (tradeGiveAny && tradeWantAny) return false;
  return gives > 0 && gets > 0 && handCovers(p, tradeGive);
}

// A trade between seats moves what this seat's own gate will move,
// which the give row deliberately lets you exceed — the bank's own rate can be
// 4 (see giveCeiling). So the offer button has its own check, and the note
// line says which of the two ceilings the current pile is over.
function offerableToPlayers() {
  return true;   // no card limit but the hand, which giveCeiling already binds
}

// The line above the rows while composing. One sentence that names the deal
// as it stands and, when a route out is shut, why — an empty composer, a hand
// that can't cover it, a pile too big for the table's rule, or a turn that
// isn't yours. The buttons alone can only go grey; this is where the reason
// lives.
function dealSummary(p, myTurn) {
  const gives = tradeGive.reduce((a, b) => a + b, 0) + tradeGiveAny;
  const gets = tradeWant.reduce((a, b) => a + b, 0) + tradeWantAny;
  if (!gives && !gets) return "Tap a card to give, and a card to get.";
  if (!gives) return "Pick what you are giving.";
  if (!gets) return "Pick what you want back.";
  const deal = `${bundleWordsAny(tradeGive, tradeGiveAny)} for ${bundleWordsAny(tradeWant, tradeWantAny)}.`;
  if (!myTurn) return `${deal} You can only trade on your own turn.`;
  if (!offerableToPlayers()) {
    return `${deal} Too many cards to offer a player — the bank will still take it at its rate.`;
  }
  return deal;
}

// One layout, four states. Each names itself in the title row and puts its
// one way out under the close glyph there; what differs below is only whether
// the trade is a composer, a read-only line, or a pane of them:
//
//   compose   my turn, nothing open   Trade Offer          composer; Offer, Bank/Port
//   round     my offer is out         Trade Acceptance     a pane, a check per answer
//   offer     another seat's offer    Trade Offer Received their line + Accept, then a composer + Send
//
// The read-only states used to draw the editable rows greyed out — ten tiles
// with two of them lit — which is why they now draw a line of just the cards
// in the trade instead. Direction is one rule throughout: the colour pip is
// the seat giving, so left of "for" is what that seat hands over.
function renderTradeMode(title, body, actions) {
  const p = state.players.find((pl) => pl.seat === state.seat);
  const myTurn = state.phase === "MAIN" && state.to_move === state.seat;
  // A counter half-written against an offer that is no longer standing —
  // the actor took a different deal, or their turn simply ended while the
  // reply sat here — is a reply with nowhere to go. Dropped before the mode
  // is read, so the modal falls back to whatever the table is actually
  // doing rather than staying on a dead offer.
  if (counterOf && !(state.pending || []).some((o) => o.actor === counterOf.actor)) {
    resetComposer();
  }
  const offer = (state.pending || [])[0] || null;
  const round = state.trade_round;
  const mode = offer ? "offer" : round ? "round" : "compose";
  // An incoming offer is answered in the one layout: their offer quoted on
  // top with the button that takes it, a reply being built beneath. The
  // reply starts as their own offer from this side -- countering is almost
  // always an edit of what you were sent -- loaded once per offer, so a poll
  // never resets a reply mid-edit.
  if (offer && !(counterOf && counterOf.actor === offer.actor
      && counterOf.bundle.every((n, r) => n === offer.bundle[r]))) {
    counterOf = offer;
    loadComposer(offer.bundle.map((n) => -n));
  }

  if (mode === "compose") {
    title.textContent = "Trade Offer";
    modalCloseGlyph("Cancel", closeModal);
    body.appendChild(composerRows(p, {allowAny: true}));

    // Offer above Bank/Port: the table is what the composer is for, and the
    // bank is the fallback when nobody at it wants the deal.
    const ready = myTurn && composerReady(p) && offerableToPlayers();
    // dealSummary is the reason a route out is shut — an empty composer, a
    // hand that can't cover it, a pile over the table's rule, a turn that
    // isn't yours. It used to be drawn as a sentence under the rows; now it
    // is what the greyed-out button says when you ask it why.
    const send = modalActionButton("send", ready ? "Offer this to every other player"
      : dealSummary(p, myTurn));
    if (ready) {
      send.addEventListener("click", () => postRound("/trade/round",
        {give: tradeGive, want: tradeWant, give_any: tradeGiveAny, want_any: tradeWantAny}));
    } else {
      send.disabled = true;
    }
    actions.appendChild(send);

    // A bank/port trade is `ratio` of one resource for one of another, at the
    // rate this seat's ports set (`state.trade_ratios`). The composition has
    // to *be* that trade for the button to fire — the give pile is what
    // leaves the hand, so a button that took four cards off a row reading
    // "1 Wood" was the UI telling one story and the engine doing another.
    const give = tradeGive.findIndex((n) => n > 0);
    const want = tradeWant.findIndex((n) => n > 0);
    const oneEach = tradeGive.filter((n) => n > 0).length === 1 && tradeWant.filter((n) => n > 0).length === 1;
    const atRate = oneEach && give >= 0 && want >= 0 && !tradeGiveAny && !tradeWantAny
      && tradeGive[give] === state.trade_ratios[board.resources[give]]
      && tradeWant[want] === 1;
    const bank = atRate
      ? state.legal_actions.find((a) => a.type === "BANK_TRADE" && a.a === give && a.b === want)
      : null;
    actions.appendChild(bankTradeButton(bank, give));
    return;
  }

  if (mode === "round") {
    // No action column: the checks live in the pane's own rows, one per
    // answer, and turning the whole round down is the close glyph.
    title.textContent = "Trade Acceptance";
    const offers = (round.responses || []).filter((r) => r.kind !== "pass").length;
    // Closing is leaving: the round is declined and the modal goes, rather
    // than falling back to the composer because it is still this seat's
    // turn.
    modalCloseGlyph(offers ? "Turn every answer down and close the round"
      : "Close the round", () => { closeModal(); postRound("/trade/round/choose", {decline: true}); });
    body.appendChild(acceptancePane(round, p));
    return;
  }

  // offer: their offer stays on screen above the reply being built, signed
  // towards the actor: their give is what lands in this hand, their want is
  // what leaves it. No action column -- Accept, the primary way out, sits on
  // their row; Send, the quieter one, on the reply's, at the same x. Passing
  // is the close glyph, and closes the modal with it.
  title.textContent = "Trade Offer Received";
  modalCloseGlyph("Pass — turn this offer down", () => { closeModal(); answerOffer(offer, "pass"); });
  const theirGive = offer.bundle.map((n) => Math.max(0, -n));
  const theirWant = offer.bundle.map((n) => Math.max(0, n));
  const anyCards = offer.any || 0;   // signed towards the actor: positive is theirs to take
  const shortfall = theirWant.map((n, r) => n > (p.hand[board.resources[r]] || 0));
  const quoted = html("div", {class: "counter-row"});
  quoted.appendChild(seatPip(offer.actor));
  quoted.appendChild(tradeLine(theirGive, theirWant, {small: true, rightShortfall: shortfall,
    leftAny: Math.max(0, -anyCards), rightAny: Math.max(0, anyCards)}));
  quoted.appendChild(html("div", {class: "modal-fill"}));
  // An offer with any cards can't be taken as it stands, only countered.
  const asStands = modalActionButton("check", "Take this trade");
  if (!anyCards && handCovers(p, theirWant)) asStands.addEventListener("click", () => answerOffer(offer, "accept"));
  else asStands.disabled = true;
  quoted.appendChild(asStands);
  body.appendChild(quoted);
  body.appendChild(html("div", {class: "pane-rule"}));


  const reply = html("div", {class: "counter-row"});
  // The one word that says what the rows beneath their offer are for: a
  // reply, not a fresh trade. Small and muted, set in the gutter the pip
  // occupies on their row, so the two rows read as offer and answer.
  reply.appendChild(html("div", {class: "reply-cap"}, "Counter"));
  reply.appendChild(composerRows(p));
  reply.appendChild(html("div", {class: "modal-fill"}));
  const ready = composerReady(p) && offerableToPlayers();
  const send = modalActionButton("send", ready ? "Send this back as your counter"
    : dealSummary(p, true), {primary: false});
  if (ready) {
    // signed towards the actor: what they get is what I give
    send.addEventListener("click", () => answerOffer(offer, "counter", tradeGive.map((g, r) => g - tradeWant[r])));
  } else {
    send.disabled = true;
  }
  reply.appendChild(send);
  body.appendChild(reply);
}

// The bank's own rate, which is the worst one available; anything cheaper is
// a port the human has a building on — 3:1 generic or 2:1 for this one
// resource. See hexset.board.ports (BASE_TRADE_RATIO / GENERIC_RATIO /
// SPECIFIC_RATIO) and hexset.economy.trade_ratios, which returns the cheapest
// rate per resource without saying where it came from; the number is the only
// thing that distinguishes them, so it's what this reads.
const BANK_RATE = 4;

// Give-N-for-1 to the bank, or to a port if the human has settled one that
// covers this resource. The glyph says which — a ship for a port, matching
// the markers on the board's own coast, and a bank front otherwise — and the
// rate goes under it, so "give 2" and "give 4" don't look like the same
// button.
//
// `action` is null while there's no such trade to make yet (a half-picked
// pair, or a rate the hand can't cover): the button stays put and disabled,
// and once a give is picked it still carries that resource's rate, which is
// the reason it's out of reach when it is.
function bankTradeButton(action, give) {
  const ratio = give < 0 ? null : state.trade_ratios[board.resources[give]];
  const viaPort = ratio !== null && ratio < BANK_RATE;
  const label = ratio === null
    ? "Trade with the bank — pick one resource to give and one to get"
    : `Give ${ratio} ${board.resources[give]} for 1, ${viaPort ? `through your ${ratio}:1 port` : "to the bank"}`;
  const btn = modalActionButton(viaPort ? "ship" : "bank", label,
    {primary: false, sub: ratio === null ? "Bank" : `${ratio}:1`});
  if (action) btn.addEventListener("click", () => { closeModal(); sendAction(action); });
  else btn.disabled = true;
  return btn;
}

// The inline sidebar log only ever shows the current round's lines (every
// seat's actions within one lap of the table, not just one seat's). The full
// history is one tap away via the hamburger's full-screen sheet, which keeps
// everything — and is drawn only while it's actually up (see setLogOpen),
// since by the late game that's hundreds of rows to rebuild for something
// nobody is looking at.
function renderLog() {
  const currentRound = (entry) => entry.slice(0, entry.indexOf("\t")) === String(state.round);
  drawLog("log", state.log.filter(currentRound));
  if (logSheetOpen && menuTab === "log") drawLog("log-full", state.log);
}

function drawLog(id, entries) {
  const logEl = document.getElementById(id);
  const atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
  logEl.innerHTML = "";
  let shown = null;
  for (const entry of entries) {
    // "round\ttext" from the server: the round heads its own lines.
    const tab = entry.indexOf("\t");
    const round = tab === -1 ? null : entry.slice(0, tab);
    const text = tab === -1 ? entry : entry.slice(tab + 1);
    if (round !== null && round !== shown) {
      logEl.appendChild(html("div", {class: "log-round"}, `ROUND ${Number(round)}`));
      shown = round;
    }
    logEl.appendChild(logLine(text));
  }
  if (atBottom) logEl.scrollTop = logEl.scrollHeight;
}

// What the server's log line says, read back into parts: a seat ("Red
// (Ada)", `_who`), the hex the robber went to ("8 Wood"), a roll, a count of
// a resource ("2 Brick"), or a resource on its own. The server writes the
// log as plain words for every client; only this page dresses it.
const LOG_RESOURCES = "Wood|Brick|Sheep|Wheat|Ore";
const LOG_PART = new RegExp(
  "(?<seat>(?<color>Red|Green|Purple|Blue|Seat \\d+) \\((?<label>[^()]*)\\))" +
  `|(?<=robber to )(?<hex>\\d+) (?<hexres>${LOG_RESOURCES})\\b` +
  "|(?<=rolled )(?<roll>\\d+)(?=\\.)" +
  `|\\b(?<count>\\d+) (?<res>${LOG_RESOURCES})\\b` +
  `|\\b(?<bare>${LOG_RESOURCES})\\b`, "g");

function seatOfColor(word) {
  const at = SEAT_COLOR_NAMES.indexOf(word);
  if (at >= 0) return at;
  const n = /^Seat (\d+)$/.exec(word);
  return n ? Number(n[1]) - 1 : null;
}

// The kind of action a line tells, as the icon its chip wears.
function logIcon(text) {
  if (/ wins with /.test(text)) return "victory-point";
  if (/ rolled \d/.test(text)) return "dice";
  if (/ moved the robber /.test(text)) return "robber";
  const bank = / traded (\d+) \w+ for (\d+) \w+ with the bank\./.exec(text);
  if (bank) return Number(bank[1]) >= 4 * Number(bank[2]) ? "bank" : "ship";
  const played = / played (?:a )?(Knight|Road Building|Monopoly|Year of Plenty)/.exec(text);
  if (played) return DEV_CARD_ICONS[played[1] === "Year of Plenty" ? "Year Of Plenty" : played[1]];
  if (/ (placed|built|bought) /.test(text)) return "hammer";
  if (/ (offers|counters|accepts|declines|traded|discarded) |^Everyone declines/.test(text)) return "card";
  return null;
}

function logGlyph(resource) {
  const glyph = html("span", {class: "log-glyph", title: resource});
  glyph.appendChild(iconSvg(RESOURCE_ICONS[resource], {fill: CAPTION_INK[resource]}));
  return glyph;
}

// One sentence of a log line as page nodes: each seat by what it is called
// alone ("Rehex", not "Red (Rehex)") in its colour, cards as glyphs,
// a roll or the robber's hex as a number token (6 and 8 red, a seven dark).
// `seats` collects the seats it names, in order.
function logWords(text, seats) {
  const nodes = [];
  let at = 0, lastWasCard = false;
  const words = (chunk) => {
    // Between two cards a comma becomes a space: the glyphs separate them.
    if (lastWasCard && chunk === ", ") { nodes.push(document.createTextNode(" ")); return; }
    if (chunk) { nodes.push(document.createTextNode(chunk)); lastWasCard = false; }
  };
  const token = (value) => {
    const n = Number(value);
    const pill = html("span", {class: `log-roll${n === 6 || n === 8 ? " hot" : ""}${n === 7 ? " seven" : ""}`});
    pill.textContent = value;
    return pill;
  };
  for (const m of text.matchAll(LOG_PART)) {
    const g = m.groups;
    words(text.slice(at, m.index));
    at = m.index + m[0].length;
    if (g.seat) {
      const seat = seatOfColor(g.color);
      seats.push(seat);
      const name = html("span", {class: "log-seat"});
      name.textContent = g.label;
      if (seat !== null && seatInk(seat)) name.style.color = seatInk(seat);
      nodes.push(name);
      lastWasCard = false;
    } else if (g.hex) {
      nodes.push(token(g.hex), document.createTextNode(" "), logGlyph(g.hexres));
      lastWasCard = false;
    } else if (g.roll) {
      nodes.push(token(g.roll));
      lastWasCard = false;
    } else if (g.res) {
      nodes.push(document.createTextNode(`${g.count} `), logGlyph(g.res));
      lastWasCard = true;
    } else {
      nodes.push(logGlyph(g.bare));
      lastWasCard = true;
    }
  }
  words(text.slice(at));
  return nodes;
}

// Where a line's sentences part: before each that starts with a seat, or
// with "Everyone" or "Traded with" (a trade round's closing words).
const LOG_SENTENCE = /(?<=\.) (?=(?:Red|Green|Purple|Blue|Seat \d+) \(|Everyone |Traded with )/;

// One line of the log: its chip, of what kind of action it tells, in the
// colour of the seat it starts with; its first sentence, then each further
// one (a roll's takings, a trade round's answers) on a line of its own.
function logLine(text) {
  const row = html("div", {class: "log-line"});
  const seats = [];
  const body = html("span", {class: "log-text"});
  text.split(LOG_SENTENCE).forEach((sentence, i) => {
    const nodes = logWords(sentence, seats);
    if (i === 0) { body.append(...nodes); return; }
    const sub = html("span", {class: "log-sub"});
    sub.append(...nodes);
    body.appendChild(sub);
  });
  const actor = seats.length ? seats[0] : null;
  const icon = logIcon(text);
  const chip = html("span", {class: "log-chip"});
  if (actor !== null && seatInk(actor)) chip.style.setProperty("--seat", seatInk(actor));
  if (icon) chip.appendChild(iconSvg(icon));
  if (icon === "victory-point") row.classList.add("win");
  row.appendChild(chip);
  row.appendChild(body);
  return row;
}

// --- Boot -----------------------------------------------------------------

document.getElementById("new-game").addEventListener("click", newGame);
// A server keeps rankings only when it is given a ranker; a 404 here is
// the usual answer, and the menu then has no Rankings tab.
fetch("/api/rankings", {cache: "no-store"}).then((res) => {
  document.querySelector('#menu-tabs [data-tab="rankings"]').hidden = !res.ok;
}).catch(() => {});
// The tabs the server adds for this client, after the page's own; an older
// server answers 404 and adds none.
fetch("/api/menu", {cache: "no-store"}).then((res) => (res.ok ? res.json() : {tabs: []})).then((menu) => {
  const tabs = document.getElementById("menu-tabs");
  (menu.tabs || []).forEach((tab, i) => {
    const button = document.createElement("button");
    button.dataset.tab = `server-${i}`;
    button.dataset.src = tab.url;
    button.setAttribute("aria-pressed", "false");
    button.textContent = tab.label;
    button.addEventListener("click", () => showMenuTab(button.dataset.tab));
    tabs.appendChild(button);
  });
}).catch(() => {});
// A corner button is only on screen when its action is on offer (see
// renderBoardButtons), so re-reading it here always finds the same one that
// put the button up.
for (const [id, type] of [["roll-dice", "ROLL"], ["buy-dev-card", "BUY_DEV_CARD"]]) {
  document.getElementById(id).addEventListener("click", () => {
    const action = legalAction(type);
    if (action) sendAction(action);
  });
}
document.getElementById("end-turn").addEventListener("click", () => {
  // Works unchanged while holding a setup turn: the server offers END_TURN
  // in legal_actions for exactly that seat, so this finds it the same way it
  // finds a Main-phase one (GameSession.legal_wire_actions).
  const action = legalAction("END_TURN");
  if (action) sendAction(action);
});
document.getElementById("undo-build").addEventListener("click", undoBuild);
// Backdrop click closes the modes that are safe to walk away from — see
// MODAL_DISMISSIBLE. The two it leaves alone are the two the game is waiting
// on, and they'd reopen themselves via syncModal on the next render anyway.
// A trade modal with an offer to answer stays up: a bot's turn is held on
// the answer (see renderStatus's WAITING FOR YOUR ANSWER), so Pass is the way
// out, not the backdrop.
function modalDismissible() {
  if (!MODAL_DISMISSIBLE.has(modalMode)) return false;
  if (modalMode === "new-game" && !state) return false;
  return !(modalMode === "trade" && (state.pending || []).length);
}
document.getElementById("modal").addEventListener("click", (e) => {
  if (e.target.id === "modal" && modalDismissible()) closeModal();
});
// Press-and-drag the title bar to reposition the modal. Where it was left is
// remembered the way a seat's token is — one offset for every mode, kept
// across opens and across reloads, written on release rather than on every
// pointermove.
function loadModalDrag() {
  try {
    const saved = JSON.parse(localStorage.getItem("hexset.modaldrag"));
    if (Number.isFinite(saved?.x) && Number.isFinite(saved?.y)) return saved;
  } catch { /* private mode, or a key some older build wrote */ }
  return {x: 0, y: 0};
}

function saveModalDrag() {
  try { localStorage.setItem("hexset.modaldrag", JSON.stringify(modalDrag)); }
  catch { /* private mode: it still drags, the position just won't come back */ }
}

// A position saved on a wide window can put the whole box off a narrow one,
// and a modal nobody can reach is a game nobody can finish. The offset is
// from center, so half the slack either way is exactly what keeps it on.
function applyModalDrag() {
  const inner = document.getElementById("modal-inner");
  const box = inner.getBoundingClientRect();
  const maxX = Math.max(0, (window.innerWidth - box.width) / 2);
  const maxY = Math.max(0, (window.innerHeight - box.height) / 2);
  modalDrag = {
    x: Math.min(maxX, Math.max(-maxX, modalDrag.x)),
    y: Math.min(maxY, Math.max(-maxY, modalDrag.y)),
  };
  inner.style.transform = `translate(${modalDrag.x}px, ${modalDrag.y}px)`;
}

(function wireModalDrag() {
  const head = document.getElementById("modal-head");
  const inner = document.getElementById("modal-inner");
  let dragging = false;
  let start = {x: 0, y: 0};
  let startDrag = {x: 0, y: 0};
  head.addEventListener("pointerdown", (e) => {
    // The close glyph lives in the handle: a press on it is a press of it,
    // not the start of a drag.
    if (e.target.closest("#modal-close")) return;
    dragging = true;
    start = {x: e.clientX, y: e.clientY};
    startDrag = {...modalDrag};
    head.setPointerCapture(e.pointerId);
  });
  head.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    modalDrag = {
      x: startDrag.x + (e.clientX - start.x),
      y: startDrag.y + (e.clientY - start.y),
    };
    inner.style.transform = `translate(${modalDrag.x}px, ${modalDrag.y}px)`;
  });
  const stopDrag = () => {
    if (!dragging) return;
    dragging = false;
    saveModalDrag();
  };
  head.addEventListener("pointerup", stopDrag);
  head.addEventListener("pointercancel", stopDrag);
})();

const logSheet = document.getElementById("log-sheet");
function setLogOpen(open) {
  logSheetOpen = open;
  logSheet.classList.toggle("show", open);
  if (!open) return;
  // At the front door there is no game yet: no code to hand out, no log
  // (showMenuTab hides the code there).
  document.getElementById("this-game-code").textContent = tableCode;
  showMenuTab(menuTab);
}

function showMenuTab(tab) {
  menuTab = tab;
  for (const button of document.querySelectorAll("#menu-tabs button")) {
    button.setAttribute("aria-pressed", String(button.dataset.tab === tab));
  }
  document.getElementById("log-full").hidden = tab !== "log";
  document.getElementById("history").hidden = tab !== "history";
  const src = document.querySelector(`#menu-tabs [data-tab="${tab}"]`)?.dataset.src;
  // This game's code and link belong to the log and the history, not to a
  // page of its own.
  document.getElementById("this-game").hidden = !state || Boolean(src);
  // A tab the server adds is a page of its own and takes the page's width
  // (#log-sheet.page); the rankings fit the panel.
  logSheet.classList.toggle("page", Boolean(src) && tab !== "rankings");
  let frame = null;
  for (const each of document.querySelectorAll("#menu-frames iframe")) {
    each.hidden = each.dataset.tab !== tab;
    if (!each.hidden) frame = each;
  }
  if (src) {
    if (!frame) {
      frame = document.createElement("iframe");
      frame.dataset.tab = tab;
      frame.title = document.querySelector(`#menu-tabs [data-tab="${tab}"]`).textContent;
      frame.src = src;
      document.getElementById("menu-frames").appendChild(frame);
    }
    return;
  }
  if (tab === "history") { renderHistory(); return; }
  // Drawn on the way up rather than on every render — renderLog skips it
  // while it's closed.
  drawLog("log-full", state ? state.log : []);
  const full = document.getElementById("log-full");
  full.scrollTop = full.scrollHeight;
}

const GAME_TYPE_NAMES = {"standard": "Standard", "duel-variant": "Duel"};
let historyDrawn = 0;  // bumped per draw, so a slow read cannot draw over a newer list

// The History tab: every game this browser has played (playedGames), drawn
// at once from what is kept, then each row the record cannot settle read
// from the table one at a time and drawn again. A code the server has
// nothing behind is forgotten. One read at a time, not one each at once: a
// finished game the server has let go of is rebuilt from its journal to answer.
async function renderHistory() {
  const drawn = ++historyDrawn;
  drawHistory();
  for (const {code, record} of playedGames()) {
    if (record && record.over) continue;
    const view = await readPlayedGame(code);
    if (drawn !== historyDrawn) return;
    if (view === "gone") {
      forgetSeat(code);
      try { localStorage.removeItem(`hexset.game.${code}`); } catch { /* private mode */ }
    } else if (view && !view.error) {
      try {
        localStorage.setItem(`hexset.game.${code}`, JSON.stringify(recordOf(view, record)));
      } catch { /* private mode */ }
    } else {
      continue;
    }
    drawHistory();
  }
}

function drawHistory() {
  const list = document.getElementById("history");
  list.innerHTML = "";
  const games = playedGames();
  if (!games.length) {
    list.appendChild(html("div", {class: "history-note"}, "Games you play in this browser show here."));
    return;
  }
  for (const {code, record} of games) {
    const current = code === tableCode;
    const row = html(current ? "div" : "a", current ? {class: "history-row current"} : {class: "history-row", href: `/${code}`});
    const main = html("div", {class: "history-main"});
    const what = html("div", {class: "history-what"});
    what.appendChild(html("b")).textContent = code;
    const when = record?.at
      ? new Date(record.at).toLocaleString(undefined, {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"})
      : null;
    const parts = [record && (GAME_TYPE_NAMES[record.type] || record.type), when, current && "this game"];
    what.appendChild(document.createTextNode(parts.filter(Boolean).map((p) => ` · ${p}`).join("")));
    main.appendChild(what);
    const others = (record?.names || []).filter((name, seat) => name && seat !== record.seat);
    if (others.length) main.appendChild(html("div", {class: "history-who"})).textContent = `vs ${others.join(", ")}`;
    row.appendChild(main);
    const won = Boolean(record?.over) && record.winner !== null && record.winner === record.seat;
    let result = "";
    if (record && !record.over) result = "In progress";
    else if (record && record.winner !== null && record.seat !== null) result = won ? "Won" : "Lost";
    else if (record && record.winner !== null) result = `${record.names[record.winner] || "?"} won`;
    else if (record) result = "No winner";
    row.appendChild(html("div", {class: won ? "history-result won" : "history-result"})).textContent = result;
    list.appendChild(row);
  }
}

// The link to this game, which is the whole of it: whoever opens it is at
// this table. A browser that will not let the page write the clipboard (an
// insecure origin, a refused permission) shows the link to copy by hand.
async function copyGameLink() {
  const link = `${location.origin}/${tableCode}`;
  const button = document.getElementById("copy-link");
  try {
    await navigator.clipboard.writeText(link);
    button.textContent = "Copied";
    setTimeout(() => { button.textContent = "Copy link"; }, 1500);
  } catch {
    window.prompt("Copy this link", link);
  }
}

document.getElementById("open-log").addEventListener("click", () => setLogOpen(true));
document.getElementById("close-log").addEventListener("click", () => setLogOpen(false));
document.getElementById("copy-link").addEventListener("click", copyGameLink);
for (const button of document.querySelectorAll("#menu-tabs button")) {
  button.addEventListener("click", () => showMenuTab(button.dataset.tab));
}
// Escape unwinds the innermost thing first: whichever modal mode can be
// walked away from, then the menu.
// Caught on the way down, so a tap on a stat opens the glossary and goes no
// further: at a table being read, the row under it opens that seat's hand.
document.getElementById("players").addEventListener("click", (e) => {
  const chip = e.target.closest(".stat");
  if (!chip) return;
  e.stopPropagation();
  openGlossary(chip);
}, true);
document.addEventListener("click", (e) => {
  if (!e.target.closest("#glossary")) closeGlossary();
});
window.addEventListener("resize", closeGlossary);
new ResizeObserver(() => fitCorners()).observe(document.getElementById("board-pane"));
new ResizeObserver(() => fitPage()).observe(document.querySelector("body > header"));
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!document.getElementById("glossary").hidden) { closeGlossary(); return; }
  if (modalDismissible()) { closeModal(); return; }
  setLogOpen(false);
});

(async function init() {
  // After the first paint, so the page shows before the water's pictures are worked out.
  setTimeout(() => { try { paintWater(); } catch (e) { /* the gradient alone */ } }, 0);
  await loadModels();
  // A code in the URL is somebody handing us one specific table, and it is
  // the only thing we try: dealing a different game instead would move the
  // address out from under a link that was shared on purpose, and the two
  // games would look identical afterwards. So a full or dead code says so
  // and stops there. With no code, we resume the most recently active game
  // we sit at that is still going (activeCode), else the last game we sat
  // at, and ask what to deal if there is neither.
  const asked = tableCode;
  if (asked) {
    state = await resumeGame(asked);
  } else {
    state = await resumeGame((await activeCode()) || lastCode());
    if (!state) { openModal("new-game"); return; }
  }
  if (!state) {
    document.getElementById("phase").textContent =
      (seatError || "COULD NOT DEAL A GAME").toUpperCase();
    return;
  }
  // After the game, not alongside it: which board route to ask depends on
  // whether we ended up with a seat at it.
  await loadBoard();
  render();
  settle();
  // Sound left on last time: the clips load now, to play from the first click.
  if (soundOn()) readyAudio();
})();
</script>
</body>
</html>
