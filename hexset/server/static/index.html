  document.getElementById("captions").innerHTML = "";
}

// --- What each seat's cards did, on its row
//
// `rowBadges` outlives the row itself: renderPlayers rebuilds every row on
// each render and puts back any badge still showing.

const rowBadges = new Map();  // seat -> {items: [{card, n}], until}

// `items` is [{card, n}]: `card` a resource name, "dev" for a development
// card, or null for a card this reader is not told; `n` signed.
function showBadge(seat, items) {
  items = items.filter((it) => it.n);
  if (!items.length) return;
  rowBadges.set(seat, {items, until: performance.now() + PLAY_MS.badge});
  const row = document.querySelector(`#players .player-row[data-seat="${seat}"]`);
  if (row) attachBadge(row, seat);
  setTimeout(() => {
    const entry = rowBadges.get(seat);
    if (entry && entry.until <= performance.now()) {
      rowBadges.delete(seat);
      const shown = document.querySelector(`#players .player-row[data-seat="${seat}"] .row-badge`);
      if (shown) shown.remove();
    }
  }, PLAY_MS.badge + 20);
}

function clearBadges() {
  rowBadges.clear();
  for (const node of document.querySelectorAll("#players .row-badge")) node.remove();
}

function attachBadge(row, seat) {
  const entry = rowBadges.get(seat);
  const old = row.querySelector(".row-badge");
  if (old) old.remove();
  if (!entry || entry.until <= performance.now()) return;
  // Inside the name's cell, so it ends where the numbers begin.
  const cell = row.querySelector(".player-name") || row;
  const badge = html("div", {class: "row-badge"});
  for (const {card, n} of entry.items) {
    const item = html("span", {class: `badge-item ${n > 0 ? "gain" : "loss"}`});
    item.appendChild(html("b", {}, `${n > 0 ? "+" : "−"}${Math.abs(n)}`));
    if (card === "dev") {
      const tile = html("div", {class: "card badge-card dev"});
      tile.appendChild(iconSvg("dev-card"));
      item.appendChild(tile);
    } else if (card) {
      item.appendChild(resourceCardTile(card, {extraClasses: ["badge-card"], title: card}));
    } else {
      item.appendChild(html("div", {class: "card badge-card unknown", title: "A card"}, "?"));
    }
    badge.appendChild(item);
  }
  cell.appendChild(badge);
}

// Signed counts by resource name (or null), per seat, to badges.
function badgeTally() {
  const out = new Map();
  return {
    add(seat, card, n) {
      if (!out.has(seat)) out.set(seat, new Map());
      const m = out.get(seat);
      m.set(card, (m.get(card) || 0) + n);
    },
    show() {
      for (const [seat, m] of out) showBadge(seat, [...m].map(([card, n]) => ({card, n})));
    },
  };
}

function tradeBadges(trade) {
  const t = badgeTally();
  for (const name of cardsOf(trade.gave)) { t.add(trade.a, name, -1); t.add(trade.b, name, 1); }
  for (const name of cardsOf(trade.got)) { t.add(trade.b, name, -1); t.add(trade.a, name, 1); }
  t.show();
}

// `trades` false leaves the exchanges cleared with the entry to the caller.
function badgesFor(e, {trades = true} = {}) {
  const t = badgeTally();
  const gains = (g) => {
    for (const [seat, counts] of Object.entries(g || {})) {
      for (const name of cardsOf(counts)) t.add(Number(seat), name, 1);
    }
  };
  switch (e.kind) {
    case "roll": gains(e.gains); break;
    case "build": gains(e.gains); break;
    case "buy": t.add(e.actor, "dev", 1); break;
    case "play":
      if (e.card === "Monopoly") {
        let total = 0;
        for (const [seat, n] of Object.entries(e.taken || {})) { t.add(Number(seat), e.resource, -n); total += n; }
        t.add(e.actor, e.resource, total);
      } else if (e.card === "Year Of Plenty") {
        for (const name of e.resources || []) t.add(e.actor, name, 1);
      }
      break;
    case "robber":
      if (e.stole) { t.add(e.victim, e.card || null, -1); t.add(e.actor, e.card || null, 1); }
      break;
    case "bank":
      for (const name of cardsOf(e.gave)) t.add(e.actor, name, -1);
      for (const name of cardsOf(e.got)) t.add(e.actor, name, 1);
      break;
    case "discard":
      for (const card of e.cards || [e.card]) t.add(e.actor, card || null, -1);
      break;
    default: break;
  }
  t.show();
  if (trades) for (const trade of e.trades || []) tradeBadges(trade);
}

// --- What moves on the board

const DIE_PIPS = {
  1: [[50, 50]], 2: [[28, 28], [72, 72]], 3: [[26, 26], [50, 50], [74, 74]],
  4: [[28, 28], [72, 28], [28, 72], [72, 72]],
  5: [[26, 26], [74, 26], [50, 50], [26, 74], [74, 74]],
  6: [[28, 24], [72, 24], [28, 50], [72, 50], [28, 76], [72, 76]],
};

function drawDie(node, face) {
  node.innerHTML = "";
  const svg = el("svg", {viewBox: "0 0 100 100"});
  for (const [cx, cy] of DIE_PIPS[face]) svg.appendChild(el("circle", {cx, cy, r: 9, fill: "#2b2118"}));
  node.appendChild(svg);
}

// The two faces of a total: the feed says only the sum.
function splitRoll(total) {
  const low = Math.max(1, total - 6), high = Math.min(6, total - 1);
  const first = low + Math.floor(Math.random() * (high - low + 1));
  return [first, total - first];
}

// The dice, then what they produced and what each seat collected. `before`
// is the position the roll was made in, for where the robber stood.
// Rolls playing now: a guide note's time on the board waits for them.
let rollsPlaying = 0;

async function playRoll(e, before) {
  rollsPlaying += 1;
  try {
    await playRollOnce(e, before);
  } finally {
    rollsPlaying -= 1;
    if (!rollsPlaying) renderGuideBubbles();
  }
}

async function playRollOnce(e, before) {
  const tray = document.getElementById("dice-tray");
  const dice = [...tray.querySelectorAll(".die")];
  const faces = splitRoll(e.value);
  tray.hidden = false;
  sound("roll");
  if (!REDUCED_MOTION && !anim.skip) {
    const spins = dice.map((d, i) => d.animate([
      {transform: "translateY(-30px) rotate(0deg)"},
      {transform: "translateY(4px) rotate(400deg)", offset: 0.7},
      {transform: "translateY(0) rotate(360deg)"},
    ], {duration: PLAY_MS.dice, easing: "ease-out", delay: i * 40}));
    const shuffle = setInterval(() => dice.forEach((d) => drawDie(d, 1 + Math.floor(Math.random() * 6))), 70);
    // The faces shuffle only while the dice are in the air: they land at
    // 70% of the spin (its keyframes), and settle on their own faces there.
    const landed = Promise.all(spins.map(track));
    await pause(PLAY_MS.dice * 0.7);
    clearInterval(shuffle);
    dice.forEach((d, i) => drawDie(d, faces[i]));
    await landed;
  }
  dice.forEach((d, i) => drawDie(d, faces[i]));
  await pause(PLAY_MS.settle);
  // The dice leave the board for the roller's row while it shows what they
  // produced, so they cover no number that lights.
  const left = diceLeave(tray, e.actor);
  if (e.value !== 7) await playProduction(e.value, before || state, e.gains);
  await left;
}

// The dice cross from the middle of the board to `seat`'s row, shrinking
// into its last-roll number. With reduced motion, or no row to go to, they
// only go.
function diceLeave(tray, seat) {
  const from = tray.getBoundingClientRect();
  const row = seatRow(seat);
  const to = row ? (row.querySelector(".stat.roll") || row).getBoundingClientRect() : null;
  tray.hidden = true;
  if (REDUCED_MOTION || anim.skip || !to || !to.width || !from.width) return Promise.resolve();
  const ghost = html("div", {class: "dice-ghost"});
  for (const die of tray.children) ghost.appendChild(die.cloneNode(true));
  document.getElementById("fly-layer").appendChild(ghost);
  // A row with no roll yet takes them at its right end, where the number will be.
  const x = row.querySelector(".stat.roll") ? to.left + to.width / 2 : to.right - 14;
  const y = to.top + to.height / 2;
  const at = (px, py, scale) => `translate(${px}px, ${py}px) scale(${scale})`;
  return track(ghost.animate([
    {transform: at(from.left, from.top, 1), opacity: 1},
    {transform: at(x - from.width / 2, y - from.height / 2, 0.3), opacity: 0.2},
  ], {duration: PLAY_MS.fly, easing: "ease-out", fill: "both"})).then(() => ghost.remove());
}

// The resource a terrain's hexes yield.
const TERRAIN_RESOURCE = Object.fromEntries(Object.entries(RESOURCE_TERRAIN).map(([name, terrain]) => [terrain, name]));

// What a roll produced, shown where it came from. Every hex with the rolled
// number lights gold and its number jumps; each building on it that collects
// rings in its seat's colour and sends its cards to that seat's row, one for
// a settlement and two for a city. The hex under the robber, which produces
// nothing, rings red at the robber instead. `position` is the view the roll
// was made in. `gains` is the roll's own account of what each seat
// collected, and no seat is shown more of a resource than it says: a
// resource the bank ran short of sends nothing.
function playProduction(value, position, gains) {
  const layer = animLayer();
  const owed = new Map();  // "seat/resource" -> cards not yet shown
  for (const [seat, counts] of Object.entries(gains || {})) {
    for (const name of cardsOf(counts)) owed.set(`${seat}/${name}`, (owed.get(`${seat}/${name}`) || 0) + 1);
  }
  const playing = [];
  let produced = false, flights = 0;
  for (const h of board.hexes) {
    if (h.token !== value) continue;
    if (h.id === position.robber) {
      const spot = robberSpot(h);
      playing.push(flare(layer, el("circle", {cx: spot.x, cy: spot.y, r: 40, fill: "url(#light-red)", class: "roll-light"}),
        spot, [[0.5, 0], [1, 1], [1.1, 0]]));
      playing.push(flare(layer, ringAt(spot, 19, "#ff4d4d", "#5a0b0b"), spot, [[1, 1], [2, 0]]));
      continue;
    }
    produced = true;
    playing.push(flare(layer, el("circle", {cx: h.x, cy: h.y, r: 50, fill: "url(#light-gold)", class: "roll-light"}),
      h, [[0.5, 0], [1, 1], [1.08, 0]]));
    playing.push(flare(layer, ringAt(h, 15, "#ffd75a", "#6b4a00"), h, [[1, 1], [2.6, 0]]));
    const token = document.getElementById(`hex-token-${h.id}`);
    if (token && !REDUCED_MOTION) {
      playing.push(track(token.animate(scaledAbout(h, [[1, 1], [1.3, 1], [1, 1]]),
        {duration: PLAY_MS.flash * 0.7, easing: "ease-out"})));
    }
    const resource = TERRAIN_RESOURCE[h.terrain];
    for (const vid of h.vertex_ids) {
      const seat = position.vertex_owner[vid];
      const key = `${seat}/${resource}`;
      const cards = Math.min(position.vertex_building[vid], owed.get(key) || 0);
      if (seat < 0 || cards <= 0) continue;
      owed.set(key, owed.get(key) - cards);
      const v = vertexById[vid];
      playing.push(flare(layer, ringAt(v, 13, SEAT_COLORS[seat].fill, SEAT_COLORS[seat].stroke), v, [[1, 1], [2.2, 0]]));
      for (let i = 0; i < cards; i++) playing.push(flyCard(resource, h, seat, flights++));
    }
  }
  if (produced) sound("produce");
  return Promise.all(playing);
}

// A ring of radius `r` about a board point: `color` over a wider, darker
// casing, so it shows on a tile of its own colour.
function ringAt(at, r, color, casing) {
  return el("g", {class: "roll-ring"},
    el("circle", {cx: at.x, cy: at.y, r, stroke: casing, "stroke-width": 5, opacity: 0.55}),
    el("circle", {cx: at.x, cy: at.y, r, stroke: color, "stroke-width": 3}));
}

// Keyframes that take a board node through `steps`, [scale, opacity] pairs
// evenly spaced, scaled about the board point `at`.
function scaledAbout(at, steps) {
  return steps.map(([scale, opacity]) => ({
    opacity,
    transform: `translate(${at.x}px, ${at.y}px) scale(${scale}) translate(${-at.x}px, ${-at.y}px)`,
  }));
}

// Adds `node` to `layer`, plays it through `steps` (scaledAbout) and removes
// it. With reduced motion it keeps its size and only fades.
function flare(layer, node, at, steps) {
  layer.appendChild(node);
  const frames = scaledAbout(at, REDUCED_MOTION ? steps.map(([, opacity]) => [1, opacity]) : steps);
  return track(node.animate(frames, {duration: PLAY_MS.flash, easing: "ease-out", fill: "both"}))
    .then(() => node.remove());
}

// One card from a hex to `seat`'s row, along an arc, the `order`-th of its
// roll. Nothing crosses with reduced motion, or where the row is not on
// screen: the row's badge says what the seat collected either way.
function flyCard(name, hex, seat, order) {
  const row = seatRow(seat);
  const start = onScreen(hex);
  if (REDUCED_MOTION || anim.skip || !row || !start) return Promise.resolve();
  const to = (row.querySelector(".stat.cards") || row).getBoundingClientRect();
  if (!to.width) return Promise.resolve();
  const end = {x: to.left + to.width / 2, y: to.top + to.height / 2};
  const rise = Math.min(70, Math.hypot(end.x - start.x, end.y - start.y) * 0.22);
  const bend = {x: (start.x + end.x) / 2, y: Math.min(start.y, end.y) - rise};
  const card = resourceCardTile(name, {extraClasses: ["fly-card"], title: ""});
  document.getElementById("fly-layer").appendChild(card);
  // The card's middle rides the curve: 11 and 15 are half its width and height.
  const frames = [];
  for (let i = 0; i <= 10; i++) {
    const t = i / 10, u = 1 - t;
    const x = u * u * start.x + 2 * u * t * bend.x + t * t * end.x;
    const y = u * u * start.y + 2 * u * t * bend.y + t * t * end.y;
    const scale = t < 0.2 ? 0.5 + 2.5 * t : 1 - 0.5 * Math.max(0, t - 0.6) / 0.4;
    frames.push({transform: `translate(${x - 11}px, ${y - 15}px) scale(${scale})`, opacity: t === 0 ? 0 : t === 1 ? 0.3 : 1});
  }
  return track(card.animate(frames, {
    duration: PLAY_MS.fly, delay: order * PLAY_MS.stagger, easing: "ease-in-out", fill: "both",
  })).then(() => card.remove());
}

async function playBuild(e) {
  const color = SEAT_COLORS[e.actor];
  // A road drops in under the buildings, as it lies once it is built.
  const layer = e.piece === "road" ? document.getElementById("road-anim-layer") : animLayer();
  let node, cx, cy;
  if (e.piece === "road") {
    const edge = board.edges[e.at];
    if (!edge) return;
    const p0 = vertexById[edge.v0], p1 = vertexById[edge.v1];
    const gapAt = roadEndGaps({id: edge.id, owner: e.actor});
    const lines = roadLines({v0: p0, v1: p1, gap0: gapAt(edge, edge.v0), gap1: gapAt(edge, edge.v1)}, color);
    node = el("g", {class: "anim-piece"},
      el("g", {class: "road-casts"}, lines.cast), lines.casing, lines.fill, lines.shade, lines.light);
    cx = (p0.x + p1.x) / 2; cy = (p0.y + p1.y) / 2;
  } else {
    const v = vertexById[e.at];
    if (!v) return;
    cx = v.x; cy = v.y;
    node = buildingPiece(v, e.piece === "city", color);
    node.setAttribute("class", "anim-piece");
  }
  const wrap = el("g", {});
  wrap.appendChild(node);
  layer.appendChild(wrap);
  sound(e.piece);
  const frames = REDUCED_MOTION
    ? [{opacity: 0}, {opacity: 1}]
    : [
        {opacity: 0, transform: `translate(${cx}px, ${cy - 26}px) scale(1.5) translate(${-cx}px, ${-cy}px)`},
        {opacity: 1, transform: `translate(${cx}px, ${cy}px) scale(0.95) translate(${-cx}px, ${-cy}px)`, offset: 0.75},
        {opacity: 1, transform: "none"},
      ];
  await track(wrap.animate(frames, {duration: PLAY_MS.drop, easing: "ease-in", fill: "both"}));
  // The board draws the piece itself from here (advance).
  wrap.remove();
}

async function playRobber(e) {
  const robber = document.querySelector("#robber-layer .robber");
  const target = hexById[e.hex];
  robberSound(e);
  // The number it stood beside counts again from the moment it leaves.
  markBlocked(null);
  if (robber && target && !REDUCED_MOTION) {
    const fromX = Number(robber.getAttribute("x")) + ROBBER_SIZE / 2;
    const fromY = Number(robber.getAttribute("y")) + ROBBER_SIZE / 2;
    const spot = robberSpot(target);
    const dx = spot.x - fromX, dy = spot.y - fromY;
    await track(robber.animate([
      {transform: "translate(0, 0)"},
      {transform: `translate(${dx / 2}px, ${dy / 2 - 30}px)`, offset: 0.5},
      {transform: `translate(${dx}px, ${dy}px)`},
    ], {duration: PLAY_MS.robber, easing: "ease-in-out", fill: "forwards"}));
  } else {
    await pause(PLAY_MS.robber);
  }
  if (target) markBlocked(target.id);
}

// A click on the board while a turn is playing does nothing: the controls
// under it belong to the board as it was, and the turn plays out in full.
// The corner toggles (#table-controls) are this browser's settings, not the
// board's, and the guide's bubbles are the seat's own: both work while it
// plays.
document.getElementById("board-pane").addEventListener("click", (event) => {
  if (!anim.running || event.target.closest("#table-controls, #guide-hint, .guide-bubble")) return;
  event.stopPropagation();
  event.preventDefault();
}, true);

// --- Sound
//
// Recorded clips (`static/sounds`, CC0), loaded once a browser turns sound
// on and measured as they load (`clipLoudness`), so each kind of action plays
// at its own level whatever the recording. A kind with several takes never
// plays the same one twice running.

// `level` is how loud a kind of action sounds, against the dice at 1: what
// comes up most is quietest. A piece, the robber and a card's handling each
// have one take, a single hit, so each always sounds the same and like
// nothing else: the road a bright tick, the settlement a dull clack, the city
// a clack between them in tone, pitched down to sound heavier.
const SOUNDS = {
  roll: {files: ["dice-throw-1", "dice-throw-2", "dice-throw-3"], level: 1},
  produce: {files: ["card-slide-1", "card-slide-3", "card-slide-8"], level: 0.45},
  road: {files: ["chip-lay-1"], level: 0.7},
  settlement: {files: ["chip-lay-3"], level: 0.8},
  city: {files: ["chips-stack-3"], level: 0.8, rate: 0.75},
  robber: {files: ["die-throw-4"], level: 0.8, rate: 0.72},
  steal: {files: ["card-shove-1"], level: 0.6},
  buy: {files: ["cards-pack-take-out-2"], level: 0.5},
  play: {files: ["cards-pack-open-2"], level: 0.5},
  bank: {files: ["chips-collide-2", "chips-collide-4"], level: 0.5},
  trade: {files: ["card-place-1", "card-place-2", "card-place-3", "card-place-4"], level: 0.5},
  discard: {files: ["card-fan-1"], level: 0.5},
  end: {files: ["dice-grab-1", "dice-grab-2"], level: 0.4},
  win: {files: ["jingles_PIZZI10"], level: 0.9},
  lose: {files: ["jingles_PIZZI07"], level: 0.9},
};

// The gain that plays a clip of loudness 1 (`clipLoudness`) as loud as the
// dice should be.
const SOUND_REFERENCE = 0.026;

let audio = null;
let soundsLoading = null;
const soundBuffers = new Map();  // file -> AudioBuffer
const soundLoudness = new Map(); // file -> clipLoudness
const lastTake = new Map();      // kind -> the file played last

function soundOn() {
  try { return localStorage.getItem("hexset.sound") === "on"; } catch (e) { return false; }
}

// The context and every clip, fetched once. A context made before any click
// starts suspended; the first click on the page resumes it.
function readyAudio() {
  if (!audio) {
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return false; }
  }
  if (!soundsLoading) {
    const files = [...new Set(Object.values(SOUNDS).flatMap((k) => k.files))];
    soundsLoading = Promise.all(files.map((name) => fetch(`/sounds/${name}.ogg`)
      .then((r) => r.arrayBuffer())
      .then((data) => audio.decodeAudioData(data))
      .then((buffer) => {
        soundBuffers.set(name, buffer);
        soundLoudness.set(name, clipLoudness(buffer));
      })
      .catch(() => {})));
  }
  return true;
}

// How loud a clip sounds, so every one can be played at its kind's level
// whatever its recording: the RMS of the part that sounds (10 ms windows
// within 40 dB of its peak), weighted by how long that part lasts up to
// 300 ms, since a short click sounds quieter than a held sound as strong.
function clipLoudness(buffer) {
  const x = buffer.getChannelData(0), w = Math.max(1, Math.floor(buffer.sampleRate / 100));
  let peak = 0;
  for (let i = 0; i < x.length; i++) peak = Math.max(peak, Math.abs(x[i]));
  let sum = 0, n = 0, windows = 0;
  for (let i = 0; i + w <= x.length; i += w) {
    let e = 0;
    for (let j = 0; j < w; j++) e += x[i + j] * x[i + j];
    if (Math.sqrt(e / w) > peak * 0.01) { sum += e; n += w; windows++; }
  }
  const rms = Math.sqrt(sum / Math.max(n, 1));
  return Math.max(rms * Math.sqrt(Math.min(windows * 10, 300) / 300), 1e-4);
}

function setSound(on) {
  try { localStorage.setItem("hexset.sound", on ? "on" : "off"); } catch (e) { /* private mode */ }
  if (on && readyAudio() && audio.state === "suspended") audio.resume();
  renderTableControls();
}

function sound(kind) {
  if (!soundOn() || anim.skip || !readyAudio()) return;
  if (audio.state === "suspended") audio.resume();
  const spec = SOUNDS[kind];
  if (!spec) return;
  const choices = spec.files.filter((f) => f !== lastTake.get(kind));
  const name = choices[Math.floor(Math.random() * choices.length)] || spec.files[0];
  const buffer = soundBuffers.get(name);
  if (!buffer) return;  // still loading: this one goes unheard
  lastTake.set(kind, name);
  const src = audio.createBufferSource(), amp = audio.createGain();
  src.buffer = buffer;
  // Its kind's own pitch (`rate`) and level, varied only a touch.
  src.playbackRate.value = (spec.rate || 1) * (0.98 + Math.random() * 0.04);
  const gain = spec.level * SOUND_REFERENCE / (soundLoudness.get(name) || SOUND_REFERENCE);
  amp.gain.value = Math.min(gain, 3) * (0.94 + Math.random() * 0.12);
  src.connect(amp).connect(audio.destination);
  src.start();
}

// The sound of an entry whose playback makes none of its own.
function soundFor(e) {
  if (e.kind === "build") sound(e.piece);
  else if (e.kind === "robber") robberSound(e);
  else if (e.kind === "buy") sound("buy");
  else if (e.kind === "play") sound("play");
  else if (e.kind === "bank") sound("bank");
  else if (e.kind === "discard") sound("discard");
  else if (e.kind === "end") sound("end");
  else if ((e.trades || []).length) sound("trade");
}

// A game ending, as `next` comes in after `prev`: the winner's jingle to the
// seat that won and to anyone watching, the other to every seat that lost.
function endSound(prev, next) {
  if (!prev || prev.game_over || !next || !next.game_over) return;
  const watching = next.seat === null || next.seat === undefined;
  sound(watching || next.winner === next.seat ? "win" : "lose");
}

// The robber lands, then a card is taken, if one was.
function robberSound(e) {
  sound("robber");
  if (e.stole) setTimeout(() => sound("steal"), 260);
}

// A browser lets a page play sound only after a click on it.
document.addEventListener("pointerdown", () => {
  if (soundOn() && readyAudio() && audio.state === "suspended") audio.resume();
}, {once: true});

// --- The table's controls (top left of the board)

function renderTableControls() {
  // Sound is up at every table, a finished one too, so it can be set
  // between games; the setting is this browser's (soundOn).
  document.getElementById("sound-toggle").setAttribute("aria-pressed", String(soundOn()));
}

document.getElementById("sound-toggle").addEventListener("click", () => setSound(!soundOn()));

// --- Replay -------------------------------------------------------------
//
// Stepping a game a move at a time, for anybody at it — a spectator, or a
// seat, whether or not the game has ended. Each reads the position back in
// their own terms: the server redacts a replayed position for whoever asked
// for it, so a seat sees it as it saw it, and only a reader with no seat here
// gets the omniscient one. `replayStep` null means live; a number means the
// page is showing the board after that many steps (0 is the deal). The strip
// in the bar (drawStrip) shows the whole game, and a tap or drag on it, the
// arrows, or a row of the guide's review moves the board.
//
// Every position is a read of /api/table/<code>/replay, because only the
// server can say what a past position was — the engine is Python and the
// journal is the game. Nothing is cached on either side: an undo rewrites a
// game's history rather than appending to it, so a step number is not a
// stable name for a position.

function replaying() {
  return replayStep !== null;
}

// The *game*, as against the position being read — the same object while the
// page is following along, and `liveState` while a round is pinned. Stepping
// back puts a mid-game view in `state`, one where nobody has won yet and
// whose `to_move` is the first seat at every round, so anything asking it
// about the game gets an answer about the position instead. The title
// (renderStatus), the poll's own stopping test (nothingToWatch) and the
// version it polls from (settle) all want the game, and all read this.
//
// It does not go stale: the poll runs on through a pinned round and lands
// each version here (applyLive).
function liveView() {
  return replaying() && liveState ? liveState : state;
}

// What the arrows step from: the position shown while pinned, and the
// game's own newest step while live (the strip's timeline counts them).
function replayAnchor() {
  return replaying() ? replayStep : (timeline ? timeline.steps : 0);
}

// The position after `step` steps, as the server rebuilds it for this
// reader (redacted for a seat, as live). The step landed on, which the
// server clamps, or `null` if the read failed and nothing moved. A newer
// request overtakes an older one still out, so a drag lands where it ends.
let replaySeq = 0;
async function showStep(step) {
  const seq = ++replaySeq;
  let view = null;
  try {
    view = await getJSON(`/api/table/${tableCode}/replay?step=${Math.max(0, step)}`);
  } catch (e) {
    view = null;
  }
  if (seq !== replaySeq) return null;
  if (!view || view.error || !view.replay) return null;
  // Where live was, remembered once on the way out: stepping on from one past
  // position to the next must not overwrite it with another past position.
  if (!replaying()) liveState = state;
  replayStep = view.replay.step;
  replayLastStep = view.replay.last_step;
  state = view;
  render();
  // Restarted rather than retired: the loop that was running polled from a
  // version now behind `liveState`, and this one lands live versions there
  // (applyLive) instead of replacing the position being read.
  settle();
  return view.replay.step;
}

// Back to following the game. `liveState` is put up rather than re-fetched:
// the poll kept running behind the pinned board and landed every version in
// it (applyLive), so it is the game as of a moment ago.
function exitReplay() {
  if (!replaying()) return;
  replaySeq++;
  replayStep = null;
  if (liveState) state = liveState;
  liveState = null;
  render();
  settle();
}

// The strip's data, read again whenever the game has moved on (a live
// version the strip has not seen), at most one read at a time.
let timelineVersion = null, timelineLoading = false;
async function loadTimeline() {
  const live = liveView();
  if (!tableCode || !live || timelineLoading || timelineVersion === live.version) return;
  timelineLoading = true;
  const version = live.version;
  try {
    const data = await getJSON(`/api/table/${tableCode}/timeline`);
    if (data && !data.error) { timeline = data; timelineVersion = version; }
  } catch (e) { /* the strip keeps what it had */ }
  timelineLoading = false;
  drawStrip();
}

// The strip: a slice a step, the seat's win chance (where its guide read
// one) as a filled shape over a faint even line, a tick under each graded
// move of the seat's in its grade's colour, and the playhead at the position
// shown (at the end while live).
const STRIP_MARKS = {brilliant: "#dfe6ee", inaccuracy: "#e8c45a", mistake: "#f0965a", blunder: "#ff4f4f"};
// The strip's length in steps by game type: about a typical game's, so a
// game in play grows from the left and the strip holds still; a longer game
// fits the strip. A game type not listed always fits.
const STRIP_SPAN = {"duel-variant": 250};
function stripSpan() {
  const steps = timeline ? timeline.steps : 0;
  return Math.max(steps, STRIP_SPAN[liveView() && liveView().game_type] || 0) || 1;
}
function drawStrip(at = null) {
  const svg = document.getElementById("replay-strip-svg");
  const box = document.getElementById("replay-strip");
  const w = box.clientWidth || 1, h = box.clientHeight || 1;
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  const steps = timeline ? timeline.steps : 0;
  const span = stripSpan();
  const here = at !== null ? at : replayAnchor();
  const x = (i) => (i / span) * w;
  const top = 2;
  const y = (v) => h - 2 - v * (h - 2 - top);
  let out = `<line x1="0" x2="${w}" y1="${y(0.5).toFixed(1)}" y2="${y(0.5).toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
  const chance = timeline && timeline.chance;
  const seat = liveView() ? liveView().seat : null;
  const ink = seat !== null && seat !== undefined && SEAT_COLORS[seat] ? SEAT_COLORS[seat].fill : "var(--accent)";
  if (chance && steps) {
    const pts = chance.map((v, i) => (v === null ? null : [x(i), y(v)]));
    let d = "", open = false, startX = 0, lastX = 0;
    pts.forEach((p) => {
      if (!p) { if (open) { d += `L${lastX.toFixed(1)},${h} L${startX.toFixed(1)},${h} Z`; open = false; } return; }
      if (!open) { d += `M${p[0].toFixed(1)},${h} L${p[0].toFixed(1)},${p[1].toFixed(1)} `; startX = p[0]; open = true; }
      else d += `L${p[0].toFixed(1)},${p[1].toFixed(1)} `;
      lastX = p[0];
    });
    if (open) d += `L${lastX.toFixed(1)},${h} L${startX.toFixed(1)},${h} Z`;
    out += `<path d="${d}" fill="${ink}" fill-opacity="0.28" stroke="${ink}" stroke-opacity="0.8" stroke-width="1"/>`;
  }
  for (const m of (timeline && timeline.marks) || []) {
    const colour = STRIP_MARKS[m.class];
    if (!colour) continue;
    const mx = x(m.step + 0.5);
    out += `<rect x="${(mx - 1.5).toFixed(1)}" y="${h - 5}" width="3" height="5" fill="${colour}"/>`;
  }
  const px = Math.min(w - 1, Math.max(1, x(here)));
  out += `<line x1="${px.toFixed(1)}" x2="${px.toFixed(1)}" y1="${top}" y2="${h}" stroke="var(--ink)" stroke-width="2"/>`;
  svg.innerHTML = out;
  const round = timeline && steps && here > 0 ? timeline.items[Math.min(here, steps) - 1].round : (liveView() ? liveView().round || 0 : 0);
  const back = replaying();
  const roundPill = document.getElementById("replay-round");
  roundPill.textContent = back ? `R${round}»` : `R${round}`;
  roundPill.classList.toggle("back", back);
  roundPill.title = back ? "Back to the game" : `Round ${round}`;
  roundPill.setAttribute("aria-label", roundPill.title);
  const pct = stripChance(at);
  const pctPill = document.getElementById("replay-pct");
  // Once the seat's guide is shown the pill keeps its place at every step,
  // empty where there is no value, so nothing in the strip moves.
  const guideShown = Boolean(pct) || stripChanceShown();
  pctPill.hidden = !guideShown;
  pctPill.classList.toggle("empty", !pct);
  pctPill.textContent = pct;
  const hintEl = document.getElementById("replay-hint");
  hintEl.textContent = finePointer() ? "← → TO STEP" : "SWIPE THE BOARD TO STEP";
  hintEl.hidden = !(back && swipeHintDue());
  drawReviewGraph(at);
}

// Whether this device steps a game with the arrow keys rather than a swipe:
// a mouse or a trackpad, that hovers.
function finePointer() {
  return window.matchMedia("(hover: hover) and (pointer: fine)").matches;
}

// Whether the strip shows the seat's win chance pill at all: a seat whose
// guide is on and wanted.
function stripChanceShown() {
  const view = liveView();
  const guide = guideView();
  return Boolean(view && view.seat !== null && view.seat !== undefined && guide && guide.on && guideWanted());
}

// The seat's win chance at the position the playhead is on, as its guide
// read it: live, the guide's newest (`guide.chance`); at a past position,
// the strip's value there; at a finished game's end, the result. Empty
// without a guide on, "–" where nothing was read there.
function stripChance(at = null) {
  const view = liveView();
  const guide = guideView();
  if (!view || view.seat === null || view.seat === undefined || !(guide && guide.on) || !guideWanted()) return "";
  const pct = (v) => (v === null || v === undefined ? "–" : `${Math.round(v * 100)}%`);
  const here = at !== null ? at : replayAnchor();
  if (!replaying() && at === null) {
    if (view.game_over) return pct(view.winner === view.seat ? 1 : 0);
    return pct(guide.chance && guide.chance.value);
  }
  if (state.game_over && at === null) return pct(state.winner === view.seat ? 1 : 0);
  const series = timeline && timeline.chance;
  return pct(series ? series[Math.min(here, series.length - 1)] : null);
}

// Whether the position up can be played on at a new table (`POST
// /api/playfrom`): a past position of a game the seat plays with the guide
// shown, not one the game ended at. The corner's undo then offers it.
function playFromHere() {
  const view = liveView();
  const guide = guideView();
  return replaying() && Boolean(view) && view.seat !== null && view.seat !== undefined
    && Boolean(guide && guide.offered) && guideWanted() && !state.game_over;
}

// A new table at the position up, the guide on and the game's moves so far
// its history; the page moves there. This game stays as it is. Asked from
// the confirmation the corner's undo opens at a past position (play-from).
function playFrom() {
  if (!playFromHere()) return;
  const step = replayStep;
  closeModal();
  return blocking(async () => {
    const {ok, data} = await postJSON("/api/playfrom", {step});
    if (!ok) { showNotice(data.error || "Could not continue from here."); return; }
    rememberSeat(data.code, data.token);
    location.href = `/${data.code}`;
  });
}

// Shown at every game, whoever is reading it. A seat stepping back keeps its
// own view of the position and loses only its controls while it looks
// (frozen()); `>|` gives the turn straight back.
function renderReplay() {
  drawStrip();
  loadTimeline();
}

// Nothing here ever disables: the ends are clamped by the server, and
// stepping forward onto the newest step is caught up, which is live.
async function stepReplay(to) {
  const from = replayAnchor();
  if (to > from && !replaying()) return;
  if (!timeline) await loadTimeline();
  const at = await showStep(Math.max(0, to));
  if (at === null) return;
  if (to > from && at >= replayLastStep) exitReplay();
}

// Tap or drag along a graph of the game (the strip, the review's graph):
// the playhead follows the finger at once and the board follows it, the last
// position asked for winning. `span` is the steps the graph's width stands
// for; `dragging(on)`, where given, hears when a drag starts and ends.
function bindScrub(box, span, dragging = null) {
  let held = false, wanted = null, timer = 0;
  const stepAt = (event) => {
    const r = box.getBoundingClientRect();
    const steps = timeline ? timeline.steps : 0;
    return Math.min(steps, Math.round(Math.min(1, Math.max(0, (event.clientX - r.left) / r.width)) * span()));
  };
  const go = (step) => {
    const steps = timeline ? timeline.steps : 0;
    if (step >= steps) { exitReplay(); return; }
    showStep(step);
  };
  box.addEventListener("pointerdown", (event) => {
    if (!timeline) return;
    held = true;
    if (dragging) dragging(true);
    box.setPointerCapture(event.pointerId);
    wanted = stepAt(event);
    drawStrip(wanted);
    clearTimeout(timer);
    timer = setTimeout(() => go(wanted), 60);
  });
  box.addEventListener("pointermove", (event) => {
    if (!held) return;
    const step = stepAt(event);
    if (step === wanted) return;
    wanted = step;
    drawStrip(wanted);
    clearTimeout(timer);
    timer = setTimeout(() => go(wanted), 90);
  });
  const end = () => {
    if (!held) return;
    held = false;
    if (dragging) dragging(false);
    clearTimeout(timer);
    go(wanted);
  };
  box.addEventListener("pointerup", end);
  box.addEventListener("pointercancel", end);
  new ResizeObserver(() => drawStrip()).observe(box);
}
bindScrub(document.getElementById("replay-strip"), stripSpan);
bindScrub(document.getElementById("review-graph"), () => (timeline ? timeline.steps : 0) || 1,
          (on) => document.getElementById("guide-sheet").classList.toggle("scrubbing", on));

document.getElementById("replay-round").addEventListener("click", () => { if (replaying()) exitReplay(); });

// A move at a time: a swipe across the board (left for the next move, right
// for the one before, as pages turn), or the arrow keys. A swipe is a quick,
// mostly sideways stroke; it is not a tap, so the tap it ends on places
// nothing. From the game, a swipe right steps back into it.
(function swipeBoard() {
  const pane = document.getElementById("board-pane");
  let start = null, swallow = 0;
  pane.addEventListener("pointerdown", (event) => {
    if (event.target.closest(".guide-bubble, button, #table-controls")) { start = null; return; }
    start = {x: event.clientX, y: event.clientY, t: Date.now()};
  }, true);
  pane.addEventListener("pointerup", (event) => {
    if (!start) return;
    const dx = event.clientX - start.x, dy = event.clientY - start.y, dt = Date.now() - start.t;
    start = null;
    if (Math.abs(dx) < 40 || Math.abs(dx) < 2 * Math.abs(dy) || dt > 700) return;
    swallow = Date.now();
    swipeHinted();
    stepReplay(replayAnchor() + (dx < 0 ? 1 : -1));
  }, true);
  pane.addEventListener("click", (event) => {
    if (Date.now() - swallow < 400) { event.stopPropagation(); event.preventDefault(); }
  }, true);
})();
document.addEventListener("keydown", (event) => {
  if (event.target.closest && event.target.closest("input, textarea, select, [contenteditable]")) return;
  if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
  if (!document.getElementById("guide-sheet").hidden && reviewCovers()) return;
  event.preventDefault();
  swipeHinted();
  stepReplay(replayAnchor() + (event.key === "ArrowRight" ? 1 : -1));
});
// The mouse wheel steps only over the rounds graph itself, one step a notch
// (a trackpad's small deltas add up to a notch first), down or right for the
// next move. Anywhere else the page scrolls as ever: the board and the rest
// never step.
(function wheelStrip() {
  const box = document.getElementById("replay-strip");
  const NOTCH = 100;
  let sum = 0, idle = 0;
  box.addEventListener("wheel", (event) => {
    event.preventDefault();
    const unit = event.deltaMode === 1 ? 33 : event.deltaMode === 2 ? NOTCH * 3 : 1;
    const delta = (Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY) * unit;
    clearTimeout(idle);
    idle = setTimeout(() => { sum = 0; }, 250);
    let steps;
    if (Math.abs(delta) >= NOTCH / 2) {
      // A mouse wheel's notch, whatever size its device reports.
      steps = Math.sign(delta);
      sum = 0;
    } else {
      sum += delta;
      steps = Math.trunc(sum / NOTCH);
      sum -= steps * NOTCH;
    }
    if (!steps) return;
    swipeHinted();
    stepReplay(replayAnchor() + steps);
  }, {passive: false});
})();

// The first time a game is stepped back into, the strip says how to step;
// once a swipe has been used, never again (this browser's).
function swipeHinted() {
  try { localStorage.setItem("hexset.swipe-hinted", "1"); } catch (e) { /* no storage: shown again */ }
}
function swipeHintDue() {
  try { return localStorage.getItem("hexset.swipe-hinted") !== "1"; } catch (e) { return false; }
}

// Every action that touches the server has the same shape: refuse to
// overlap with one already running, dim the board while it's out (unless
// `dim` is false, as for the guide's own requests, which change nothing on
// the board), and undim it whatever happens. Only what goes in the middle
// differs.
async function blocking(body, dim = true) {
  if (inFlight) return;
  inFlight = true;
  const overlay = document.getElementById("overlay-blocker");
  if (dim) overlay.classList.add("show");
  try {
    await body();
  } finally {
    inFlight = false;
    overlay.classList.remove("show");
  }
}

function sendAction(action) {
  return blocking(async () => {
    // Any half-made client-side choice is spent the moment an action goes
    // out: the state coming back is the one that decides what's open now.
    pendingRobberHex = null;
    const {ok, data} = await postJSON("/api/action", {action});
    // Only take the response when it succeeded: an error body carries no
    // game-state fields at all, and the render below would throw reading
    // them off it. A move of our own plays back like anyone's.
    showNotice(ok ? "" : (data.error || "That was not legal."));
    if (ok) takeView(data, {own: true});
    else render();
    if (ok) settle();
  });
}

// A new game is a new table with its own address, so this leaves this one
// where it is — anyone still sitting here keeps playing it — and moves us to
// the new one. The button asks first what the table is dealt as, the two
// things fixed at the deal: the board and the rules (renderNewGameMode).
// Who else is playing is still chosen on the board afterwards, every seat
// the rules leave open starting empty, the same as the front door.
function newGame() {
  openModal("new-game");
}

function dealNewGame() {
  const body = {board_mode: newGameBoard, game_type: newGameDuel ? "duel-variant" : "standard"};
  closeModal();
  return blocking(async () => {
    const {ok, data} = await postJSON("/api/games", {...body, client: await clientInfo()});
    if (!ok) { showNotice(data.error || "Could not deal a new game."); return; }
    rememberSeat(data.code, data.token);
    location.href = `/${data.code}`;
  });
}

function undoBuild() {
  return blocking(async () => {
    // Same reason sendAction clears it: undoing a Knight can fire while a
    // multi-victim hex is still pending (the "Steal from" modal open over
    // it), and the state coming back has no robber move left to hold it
    // open for.
    pendingRobberHex = null;
    const {ok, data} = await postJSON("/api/undo", {});
    if (ok) state = data;
    showNotice(ok ? "" : (data.error || "Nothing to undo."));
    render();
  });
}

function showNotice(text) {
  const notice = document.getElementById("notice");
  notice.textContent = text;
  notice.classList.toggle("show", Boolean(text));
}

// A table playing a game on from another's position (POST /api/playfrom)
// says so as the page arrives, once in this tab: a caption under the bank,
// in no seat's colour, that goes as captions do.
function branchWords(branch) {
  return `New game from round ${branch.round ?? 0}`;
}
function noteBranch(view) {
  if (!view || !view.branch || !view.code) return;
  const key = `hexset.branch-noted.${view.code}`;
  try {
    if (sessionStorage.getItem(key)) return;
    sessionStorage.setItem(key, "1");
  } catch { /* no storage: said once per load */ }
  if (noteBranch.said === view.code) return;
  noteBranch.said = view.code;
  const box = document.getElementById("arrival-note");
  const pill = html("div", {class: "caption arrive"});
  pill.textContent = branchWords(view.branch);
  box.replaceChildren(pill);
  setTimeout(() => {
    pill.classList.add("gone");
    setTimeout(() => pill.remove(), 400);
  }, PLAY_MS.caption);
}

// --- Rendering ----------------------------------------------------------

function render() {
  if (!state || !board) return;
  // Drawn without playing back (a rename, a seat change, the first read):
  // what it holds has been shown.
  if (!anim.running) markSeen(liveView());
  renderTableControls();
  noteActivity(liveView());
  noteGame(liveView());
  noteBranch(liveView());
  // The highlight colour throughout the page (build targets, selection
  // borders, the active player row, ...) is the human's own seat colour
  // rather than one fixed purple — every CSS rule that used to hardcode a
  // shade of #6d5ce8 now derives it from this custom property instead (see
  // the color-mix() rules on .clickable-vertex etc.). Set on every render
  // rather than once, since a new game can seat the human differently.
  //
  // Watching rather than playing, there is no seat and so no colour of our
  // own: it falls back to the stylesheet's own #6d5ce8, which belongs to no
  // seat and highlights nothing anyone can click anyway. A finished game is
  // the same story even holding a seat — nothing is ours to click any more,
  // so the accent stops claiming a side (frozen(), not watching()) — and a
  // round already played is the same story again, for as long as it is up.
  document.documentElement.style.setProperty(
    "--accent", frozen() ? "#6d5ce8" : SEAT_COLORS[state.seat].fill);
  renderStatus();
  renderReplay();
  renderPlayers();
  renderGuide();
  renderHand();
  renderBoardDynamic();
  renderPieceSupply();
  renderBoardButtons();
  renderBank();
  renderGuideBubbles();
  renderLog();
  syncModal();
}

function renderStatus() {
  const phaseEl = document.getElementById("phase");
  // The *game*, never the round on screen — the whole of this function reads
  // `live`. Pinned to a past round the board is history, but the title is not:
  // it goes on naming whose turn it is *now*, and a finished game goes on
  // naming the winner rather than reverting to whatever phase that round was
  // in. It stays current while pinned, too — `settle` keeps polling and lands
  // its answers in `liveState` rather than on the board (see applyLive), so a
  // game that moves on while it is being read says so here.
  //
  // Nothing is given up by not describing the round. Round N is the moment
  // after the last seat ended their turn, so `to_move` is the first seat at
  // every one of them: a title asking the round would read "RED'S TURN"
  // the whole way through, whichever round you landed on. The replay bar is
  // what says where you are, and it is the one thing that should.
  const live = liveView();
  if (live.game_over) {
    if (live.winner === null) phaseEl.textContent = "GAME OVER — NO WINNER";
    else setSeatText(phaseEl, live.winner, "", " WINS");
    return;
  }
  // Nobody's decision while a seat is still empty (see api.Table.waiting_for)
  // — the same reason live.to_move is null and no row shows the active
  // highlight below.
  if (live.waiting_for && live.waiting_for.length) {
    phaseEl.textContent = "WAITING FOR SEATS";
    return;
  }
  // A bot's trade round is under way (api.Table.view's trade_wait): its
  // offer waits on a person's answer. Its turn holds until every seat it
  // waits on has had its say.
  if (live.trade_wait && live.trade_wait.length) {
    phaseEl.textContent = live.trade_wait.includes(live.seat)
      ? "ANSWER THE TRADE OFFER" : "WAITING ON A TRADE";
    return;
  }
  // Somebody else's decision to make, so the phase underneath it is beside
  // the point. True as of the last poll rather than the last render — see
  // settle() — which is as current as anything here gets.
  //
  // Owing cards to a seven is the exception, because it is not a decision
  // anybody takes in turn: every seat over the limit discards at the same
  // moment, live.to_move names only the lowest-numbered of them (see
  // hexset.game.to_move/may_act), and this seat's own discard modal is up
  // over the board right now. "RED'S TURN" behind it would be telling
  // this player to wait for something they are not waiting for. A spectator
  // has no seat, so discard_quota[null] is undefined and this stays false.
  const owing = live.phase === "DISCARD" && live.discard_quota[live.seat] > 0;
  if (live.to_move !== live.seat && !owing) {
    setSeatText(phaseEl, live.to_move, "'S", " TURN");
    return;
  }
  if (live.awaiting_confirm === live.seat) {
    phaseEl.textContent = HOLDING_SETUP_TURN_LABEL;
    return;
  }
  phaseEl.textContent = PHASE_LABELS[live.phase] || live.phase;
}

// One icon + (optional) number, for the player list's stat row — glyphs
// throughout rather than "3 VP", "Longest road" as English text.
function statChip(iconId, value, extraClass, title) {
  // A double-digit value is wide enough, inside the player row's fixed-width
  // stat columns (see .player-row's grid-template-columns), to crowd right
  // into the next column's glyph if the icon-to-number gap stays put — .wide
  // shrinks that gap instead, so the extra digit eats padding that was
  // never doing much rather than eating the next stat's breathing room.
  const wide = value !== undefined && String(value).length > 1 ? " wide" : "";
  const classes = `stat${extraClass ? ` ${extraClass}` : ""}${wide}`;
  const chip = html("span", {class: classes, title});
  chip.dataset.icon = iconId;
  chip.appendChild(iconSvg(iconId, {cls: "stat-icon"}));
  if (value !== undefined) chip.appendChild(document.createTextNode(String(value)));
  return chip;
}

// What each icon in a player's row counts, in the row's own order: the
// glossary a tap on any of them opens (openGlossary). `cls` tints the two
// awards' icons the way a held one is tinted in the row.
const GLOSSARY = [
  {icon: "victory-point", says: () => `Victory points. ${state.winning_points} wins.`},
  {icon: "card", says: () => "Resource cards held."},
  {icon: "dev-card", says: () => "Development cards held."},
  {icon: "road", cls: "road", says: () => "Roads connected. Colored when holding Longest Road (2 points)."},
  {icon: "knight", cls: "army", says: () => "Knights played. Colored when holding Largest Army (2 points)."},
  {icon: "dice", says: () => "Last roll."},
];

// The glossary for the stat `chip` tapped, that icon's line lit; the same
// chip again closes it. Under the roster, or over it where there is no room
// below, so every row stays in sight and another of its stats can be tapped
// straight away. Outside the roster's own node, so its rebuilds on each poll
// leave it alone; any click elsewhere, Escape, or a resize closes it.
function openGlossary(chip) {
  const box = document.getElementById("glossary");
  if (!box.hidden && box.dataset.icon === chip.dataset.icon) { closeGlossary(); return; }
  box.innerHTML = "";
  box.dataset.icon = chip.dataset.icon;
  for (const line of GLOSSARY) {
    const lit = line.icon === chip.dataset.icon ? " lit" : "";
    const row = html("div", {class: `glossary-line${line.cls ? ` ${line.cls}` : ""}${lit}`});
    row.dataset.icon = line.icon;
    row.appendChild(iconSvg(line.icon, {cls: "stat-icon"}));
    row.appendChild(html("span", {}, line.says()));
    box.appendChild(row);
  }
  box.appendChild(html("div", {class: "glossary-foot"}, "The highlighted row is whose turn it is."));
  box.hidden = false;
  const at = document.getElementById("players").getBoundingClientRect();
  const size = box.getBoundingClientRect();
  const left = Math.min(Math.max(8, at.right - size.width), window.innerWidth - size.width - 8);
  const below = at.bottom + 6;
  const top = below + size.height <= window.innerHeight - 8 ? below : Math.max(8, at.top - size.height - 6);
  box.style.left = `${left}px`;
  box.style.top = `${top}px`;
}

function closeGlossary() {
  document.getElementById("glossary").hidden = true;
}

// A hand column's own header: the same card/star glyph its cards use, next
// to the label — continuing the icon-forward style the player stat row
// established rather than switching back to plain text here.
function handColHeader(iconId, text) {
  const header = html("div", {class: "player-meta hand-col-header"});
  header.appendChild(iconSvg(iconId, {cls: "stat-icon"}));
  header.appendChild(document.createTextNode(text));
  return header;
}

// --- Guide ----------------------------------------------------------------
//
// A seat at a table that offers a guide (view.guide.offered) can turn it on.
// The server then reads every decision of the seat's with a choice, from the
// seat's own side, in the background (view.guide.reading), grades every move
// it plays (view.guide.notes), and shows the search's move once asked
// (POST /api/hint). Take back (POST /api/takeback) goes back to just before
// the seat's last move, the guide on or not. The review, opened from the win
// chance line, lists the graded moves, the costliest first; a row steps the
// board to that move's round.

let guideReviewOpen = false;

// The guide as the page shows it: the view on screen's, with the notes and
// the grading count of the newest view taken in, and no hint while that view
// waits. A grade can land in a view
// that waits behind a turn still playing back (the other seat rolled before
// it came), and the note is of a move already on the board.
function guideView() {
  const view = liveView();
  const guide = (view && view.guide) || null;
  const newest = newestView();
  if (guide && newest && newest !== view && newest.guide && newest.guide.on) {
    // The screen's hint is of a decision already played: none until the
    // newest view is on screen.
    return {...guide, hint: null, notes: newest.guide.notes, grading: newest.guide.grading,
            pending: newest.guide.pending, taken_back: newest.guide.taken_back};
  }
  return guide;
}

// A board place by the numbers around it: "the 5, 9 and 10" for a corner,
// "the 6 and 8" for an edge, "the 8" for a tile. A tile with no number (the
// desert) is "the desert"; a coast with none is "the coast".
function placeWords(hexes) {
  const named = hexes.map((h) => (h.token ? String(h.token) : "desert"));
  if (!named.length) return "the coast";
  if (named.length === 1) return named[0] === "desert" ? "the desert" : `the ${named[0]}`;
  return `the ${named.slice(0, -1).join(", ")} and ${named[named.length - 1]}`;
}

// A place by its number tokens, best first ("6-8-3"), as the guide names
// spots; one number is that number's spot.
function spotNumbers(hexes) {
  const pips = (t) => 6 - Math.abs(7 - t);
  const numbers = hexes.map((h) => h.token).filter(Boolean).sort((a, b) => pips(b) - pips(a) || a - b);
  if (!numbers.length) return "the coast";
  return numbers.length === 1 ? `${numbers[0]} spot` : numbers.join("-");
}
const TERRAIN_WORDS = {FOREST: "Wood", HILLS: "Brick", PASTURE: "Sheep", FIELDS: "Wheat", MOUNTAINS: "Ore"};

// Year of Plenty's card pairs by action index, in the engine's order
// (`hexset.actions.YEAR_OF_PLENTY_PAIRS`: pairs with replacement of the five
// resources).
const YEAR_OF_PLENTY_PAIRS = [0, 1, 2, 3, 4].flatMap((x) => [0, 1, 2, 3, 4].filter((y) => y >= x).map((y) => [x, y]));

// A spot as a card's title names it, with "the" as the guide's sentences
// say it: "the 8-5-10", "the 6 spot", "the coast".
function theSpot(hexes) {
  const named = spotNumbers(hexes);
  return named.startsWith("the ") ? named : `the ${named}`;
}

// A move in a few words, as a guide's card heads it ("Settlement on the
// 8-5-10", "Robber on 9 Wheat").
function shortMove(action) {
  const res = (i) => board.resources[i] || "a card";
  const corner = (v) => (board.spots && board.spots[v] ? `the ${board.spots[v]}`
    : theSpot(board.hexes.filter((h) => h.vertex_ids.includes(v))));
  switch (action.type) {
    case "SETUP_SETTLEMENT": case "BUILD_SETTLEMENT": return `Settlement on ${corner(action.a)}`;
    case "BUILD_CITY": return `City on ${corner(action.a)}`;
    case "SETUP_ROAD": case "BUILD_ROAD": {
      const e = board.edges[action.a];
      const numbers = e ? board.hexes.filter((h) => h.vertex_ids.includes(e.v0) && h.vertex_ids.includes(e.v1) && h.token) : [];
      if (!numbers.length) return "Road on the coast";
      return numbers.length === 1 ? `Road by the ${numbers[0].token}` : `Road by ${theSpot(numbers)}`;
    }
    case "MOVE_ROBBER": {
      const hex = hexById[action.a];
      if (!hex || !hex.token) return "Robber on the desert";
      return `Robber on ${hex.token} ${TERRAIN_WORDS[hex.terrain] || ""}`.trim();
    }
    case "ROLL": return "Roll";
    case "END_TURN": return "End turn";
    case "BUY_DEV_CARD": return "Buy a development card";
    case "PLAY_KNIGHT": return "Play a Knight";
    case "PLAY_ROAD_BUILDING": return "Play Road Building";
    case "PLAY_MONOPOLY": return `Monopoly on ${res(action.a)}`;
    case "PLAY_YEAR_OF_PLENTY": {
      const [x, y] = YEAR_OF_PLENTY_PAIRS[action.a] || [];
      if (x === undefined) return "Play Year of Plenty";
      return x === y ? `Year of Plenty for two ${res(x)}` : `Year of Plenty for ${res(x)} and ${res(y)}`;
    }
    case "BANK_TRADE": return `Trade ${res(action.a)} for ${res(action.b)}`;
    case "DISCARD": return `Discard ${res(action.a)}`;
    case "DISCARD_CARDS": return `Discard ${discardWords(action.cards)}`;
    default: return moveWords(action);
  }
}

// A whole discard's cards in words: "2 wood, 1 sheep, and 1 wheat".
function discardWords(cards) {
  const parts = (cards || []).map((n, r) => (n ? `${n} ${(board.resources[r] || "card").toLowerCase()}` : null)).filter(Boolean);
  if (parts.length < 3) return parts.join(" and ");
  return `${parts.slice(0, -1).join(", ")}, and ${parts.at(-1)}`;
}

function cornerWords(v) {
  return placeWords(board.hexes.filter((h) => h.vertex_ids.includes(v)));
}

function edgeWords(id) {
  const e = board.edges[id];
  return e ? placeWords(board.hexes.filter((h) => h.vertex_ids.includes(e.v0) && h.vertex_ids.includes(e.v1))) : "the coast";
}

// A phrase as the start of a sentence.
function capitalised(text) {
  return text ? text[0].toUpperCase() + text.slice(1) : text;
}

function moveWords(action) {
  const res = (i) => board.resources[i] || "a card";
  switch (action.type) {
    case "SETUP_SETTLEMENT": case "BUILD_SETTLEMENT": return `build a settlement on ${cornerWords(action.a)}`;
    case "SETUP_ROAD": case "BUILD_ROAD": return `build a road by ${edgeWords(action.a)}`;
    case "BUILD_CITY": return `build a city on ${cornerWords(action.a)}`;
    case "ROLL": return "roll the dice";
    case "END_TURN": return "end the turn";
    case "BUY_DEV_CARD": return "buy a development card";
    case "PLAY_KNIGHT": return "play a Knight";
    case "PLAY_ROAD_BUILDING": return "play Road Building";
    case "PLAY_MONOPOLY": return `play Monopoly on ${res(action.a)}`;
    case "PLAY_YEAR_OF_PLENTY": return "play Year of Plenty";
    case "MOVE_ROBBER": {
      const hex = hexById[action.a];
      const where = hex ? placeWords([hex]) : "another tile";
      const victim = state.players[action.b];
      return victim && action.b !== state.seat
        ? `move the robber to ${where} and steal from ${victim.name || "the other seat"}` : `move the robber to ${where}`;
    }
    case "BANK_TRADE": return `trade ${res(action.a)} for ${res(action.b)}`;
    case "DISCARD": return `discard ${res(action.a)}`;
    case "DISCARD_CARDS": return `discard ${discardWords(action.cards)}`;
    default: return action.type.toLowerCase().replace(/_/g, " ");
  }
}

// Where on the board a move lands, for the hint's mark; null for a move with
// no place (rolling, ending the turn, a card, a trade).
function movePlace(action) {
  if (["SETUP_SETTLEMENT", "BUILD_SETTLEMENT", "BUILD_CITY"].includes(action.type)) {
    const v = vertexById[action.a];
    return v ? {circle: {x: v.x, y: v.y, r: 16}} : null;
  }
  if (["SETUP_ROAD", "BUILD_ROAD"].includes(action.type)) {
    const e = board.edges[action.a];
    if (!e) return null;
    const p0 = vertexById[e.v0], p1 = vertexById[e.v1];
    return {line: {x1: p0.x, y1: p0.y, x2: p1.x, y2: p1.y}};
  }
  if (action.type === "MOVE_ROBBER") {
    const h = hexById[action.a];
    return h ? {circle: {x: h.x, y: h.y, r: 30}} : null;
  }
  return null;
}

// Rings the places of `actions` (one move, or a list) on the board; `null`
// clears them.
function markHint(actions) {
  const svg = document.getElementById("board-svg");
  let layer = document.getElementById("guide-layer");
  if (layer) layer.remove();
  const places = (Array.isArray(actions) ? actions : [actions]).map((a) => a && movePlace(a)).filter(Boolean);
  if (!places.length) return;
  layer = el("g", {id: "guide-layer"});
  for (const place of places) {
    if (place.circle) layer.appendChild(el("circle", {cx: place.circle.x, cy: place.circle.y, r: place.circle.r}));
    if (place.line) layer.appendChild(el("line", place.line));
  }
  svg.appendChild(layer);
}

function pct(x) {
  return `${(x * 100).toFixed(1)}%`;
}

const GUIDE_CLASS_WORDS = {
  brilliant: "Brilliant", best: "Best move", good: "Good", inaccuracy: "Inaccuracy",
  mistake: "Mistake", blunder: "Blunder", forced: "Forced",
};
// The line a card opens with after its heading, for the grades that need one.
const GUIDE_MEANING = {
  forced: "The only legal move.",
  best: "The only good move.",
  brilliant: "A hard move to find.",
};
// A card's heading word for each grade ("Best → Robber on 9 Wheat").
const GUIDE_CARD_WORDS = {
  brilliant: "Brilliant", best: "Best", good: "Good", inaccuracy: "Inaccuracy",
  mistake: "Mistake", blunder: "Blunder", forced: "Forced",
};
const GUIDE_BUBBLE_WORDS = {
  brilliant: "★ Brilliant", best: "✓ Best", good: "✓ Good", inaccuracy: "Inaccuracy",
  mistake: "Mistake", blunder: "Blunder", forced: "Forced",
};
// How long a move's bubble stays up, in milliseconds: a best or good move's,
// and a flagged one's (with the guide's move ringed) unless it is opened.
const GUIDE_PRAISE_MS = 2500;
const GUIDE_NOTE_MS = 8000;

// Whether this browser wants the guide: the compass sets it, like the sound, and
// a table that offers a guide turns it on by itself where it is wanted. Off,
// nothing of the guide shows (its bubbles, Hint, the win chance), though a
// guide already on at the table goes on reading and grading.
function guideWanted() {
  // "hexset.coach": an older key for the same setting, still read.
  try { return (localStorage.getItem("hexset.guide") ?? localStorage.getItem("hexset.coach")) === "on"; }
  catch (e) { return false; }
}

function setGuideWanted(on) {
  try { localStorage.setItem("hexset.guide", on ? "on" : "off"); } catch (e) { /* private mode */ }
}

// The seats this page has asked to turn the guide on at, by table and token,
// so it asks once for each: a restart reissues the token (reclaimSeat), and
// the guide the restart turned off is asked for again.
const guideAsked = new Set();

function guideAskKey() {
  return `${tableCode}:${tokenFor(tableCode) || ""}`;
}

// The decision whose hint the seat asked for, by table, kept for the tab's
// life: the server forgets it when it restarts, and the page asks again
// once the guide is back on at the same decision (renderGuide).
function hintAskedAt() {
  try { return JSON.parse(sessionStorage.getItem(`hexset.hint.${tableCode}`) || "null"); } catch (e) { return null; }
}

function setHintAskedAt(step) {
  try { sessionStorage.setItem(`hexset.hint.${tableCode}`, JSON.stringify(step)); } catch (e) { /* private mode */ }
}

// The hint asked again after a restart, by table, token and step: once.
const hintAskedAgain = new Set();
// The note whose bubble is opened up to its card, by noteKey.
let guideOpenNote = null;
// The hint bubble opened up to its card, by the hint's id and its place.
let guideOpenHint = null;
// When each note was first seen, by "seat:step", to let praise fade.
const guideNoteSeen = new Map();
let guideFadeTimer = null;

// A note by its id: a take back can bring a step round again, and the note
// graded there then is a new one, to be shown afresh.
function noteKey(note) {
  return `${note.seat}:${note.step}:${note.id || 0}`;
}

function flaggedNote(note) {
  return ["inaccuracy", "mistake", "blunder"].includes(note.class);
}

// Whether the seat owes a decision now: its turn, or a discard it owes
// whichever seat is to move.
function guideDecides() {
  if (!state || state.seat === null || state.seat === undefined) return false;
  if (state.phase === "DISCARD") return (state.discard_quota || [])[state.seat] > 0;
  return state.to_move === state.seat;
}

// A hint of a whole discard (`DISCARD_CARDS`), which the discard's window shows.
function discardHint(hint) {
  return Boolean(hint && hint.options && hint.options.length && hint.options[0].action.type === "DISCARD_CARDS");
}

function renderGuide() {
  const guide = guideView();
  const seated = liveView() && liveView().seat !== null && liveView().seat !== undefined;
  const offered = Boolean(seated && guide && guide.offered);
  const live = !frozen();
  const wanted = guideWanted();
  // Wanted at a table that offers it: turned on by itself, once.
  // A finished game's guide is the one its journal saved, or none: nothing to turn on.
  if (offered && live && wanted && !guide.on && !guideAsked.has(guideAskKey())) {
    guideAsked.add(guideAskKey());
    guidePost("/api/guide");
  }
  const on = offered && Boolean(guide.on) && wanted;
  // A hint asked for at this decision that the server no longer knows of
  // (it restarted): asked again, and shown once the reading lands.
  const again = `${guideAskKey()}:${guide && guide.step}`;
  // Moved on (a move, or a take back to another decision): that hint is spent.
  if (on && guide.step !== undefined && hintAskedAt() !== null && hintAskedAt() !== guide.step) setHintAskedAt(null);
  if (on && live && !replaying() && guideDecides() && !guide.hint && guide.step !== undefined
      && hintAskedAt() === guide.step && !hintAskedAgain.has(again)) {
    if (inFlight) {
      // Another request is out (the guide just asked for): once it is back.
      setTimeout(renderGuide, 300);
    } else {
      hintAskedAgain.add(again);
      guidePost("/api/hint");
    }
  }
  const button = document.getElementById("guide-on");
  button.hidden = !offered || (!on && !live);
  button.setAttribute("aria-pressed", String(on));
  const hint = document.getElementById("guide-hint");
  const myTurn = guideDecides();
  if (replaying()) {
    // Stepping back, the hint of a decision of the seat's is shown at once;
    // the button puts it away and brings it back, as live.
    hint.hidden = !(offered && wanted);
    hint.disabled = !replayHint();
    hint.classList.remove("thinking");
    hint.title = "Hint";
  } else {
    // Always there while the guide is on, faded when there is nothing to ask
    // (another seat's turn, a turn playing back, the decision still read);
    // live whenever the decision is read: it asks for the hint, puts it away
    // and brings it back.
    hint.hidden = !(offered && (on || wanted));
    hint.disabled = !on || !live || !myTurn || guide?.reading !== "ready";
    hint.classList.toggle("thinking", on && myTurn && guide?.reading === "pending");
    hint.title = guide?.reading === "pending" ? "Thinking..." : "Hint";
  }
  const notes = (offered && guide.notes) || [];
  // The review, once a move is graded, at any position and after the game.
  // The win chance pill opens the review, once a move is graded.
  const pctPill = document.getElementById("replay-pct");
  const reviewable = on && notes.some((n) => n.class !== "forced");
  pctPill.classList.toggle("reviewable", reviewable);
  pctPill.title = reviewable ? "Review your graded moves" : "Your win chance";
  pctPill.setAttribute("aria-label", pctPill.title);
  renderGuideReview(notes);
}

// The card in the hand each play of a development card spends.
const PLAYED_CARDS = {
  PLAY_KNIGHT: "Knight", PLAY_ROAD_BUILDING: "Road Building", PLAY_MONOPOLY: "Monopoly",
  PLAY_YEAR_OF_PLENTY: "Year Of Plenty",
};

// Where a bubble for `action` points, in the board pane's own pixels, and
// which way it opens: above a place on the board; at a move with no place,
// the control it is made with (rolling and ending the turn the bottom
// corner's button, opening to its left, playing a development card that card
// in the hand, in the page's pixels (`float`), buying one the deck) or the
// top of the board.
function guideAnchor(action, pane) {
  const box = pane.getBoundingClientRect();
  // `px`, `py`: the place itself, where a bubble's tail points; `pr` how far
  // short of it the tail stops (the ring's radius).
  const at = (point, dir, place = point, r = 0) => {
    const p = onScreen(point), q = onScreen(place);
    const scale = (() => { const o = onScreen({x: 0, y: 0}), u = onScreen({x: 1, y: 0}); return o && u ? Math.hypot(u.x - o.x, u.y - o.y) : 1; })();
    return p ? {x: p.x - box.left, y: p.y - box.top - (dir === "up" ? 12 : -12), dir,
                px: q.x - box.left, py: q.y - box.top, pr: r * scale} : null;
  };
  const place = movePlace(action);
  if (place && place.circle) {
    return at({x: place.circle.x, y: place.circle.y - (action.type === "MOVE_ROBBER" ? 18 : 0)}, "up",
              {x: place.circle.x, y: place.circle.y}, place.circle.r);
  }
  if (place && place.line) {
    const mid = {x: (place.line.x1 + place.line.x2) / 2, y: (place.line.y1 + place.line.y2) / 2};
    const a = at(mid, "up", mid, 4);
    const p0 = onScreen({x: place.line.x1, y: place.line.y1}), p1 = onScreen({x: place.line.x2, y: place.line.y2});
    if (a && p0 && p1) a.seg = [p0.x - box.left, p0.y - box.top, p1.x - box.left, p1.y - box.top];
    return a;
  }
  if (["ROLL", "END_TURN"].includes(action.type)) {
    // The button's own box, not as a press scales it: the bubble holds still.
    const unpressed = (id) => {
      const el = document.getElementById(id), r = el.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2, w = el.offsetWidth, h = el.offsetHeight;
      return {left: cx - w / 2, top: cy - h / 2, width: w, height: h};
    };
    const corner = unpressed(action.type === "ROLL" ? "roll-dice" : "end-turn");
    if (corner.width) return {x: corner.left - box.left - 10, y: corner.top + corner.height / 2 - box.top, dir: "left"};
    // A roll made: the corner is End turn's now, so the bubble there names the roll.
    const shared = unpressed("end-turn");
    if (action.type === "ROLL" && shared.width) {
      return {x: shared.left - box.left - 10, y: shared.top + shared.height / 2 - box.top, dir: "left", named: true};
    }
    return {x: box.width - 78, y: box.height - 42, dir: "left", named: true};
  }
  if (action.type === "DISCARD_CARDS") {
    // The hand's resource cards: those it gives, or the row where none is left.
    const row = handResourceRow();
    const cards = heldCards(action);
    const at = (cards[0] || row) && (cards[0] || row).getBoundingClientRect();
    if (!at || !at.width) return null;
    return {x: at.left + at.width / 2, y: at.top - 8, dir: "up", float: true, px: at.left + at.width / 2, py: at.top};
  }
  const held = PLAYED_CARDS[action.type] && document.querySelector(`#hand .card[data-dev="${PLAYED_CARDS[action.type]}"]`);
  const r = held && held.getBoundingClientRect();
  if (r && r.width && r.bottom > 0 && r.top < window.innerHeight) {
    // Above the card, on the page's own layer: the hand is outside the board.
    return {x: r.left + r.width / 2, y: r.top - 8, dir: "up", float: true, px: r.left + r.width / 2, py: r.top};
  }
  // The deck and the bank's piles: a bank laid out as a column (a desktop's,
  // down the board's right edge) is met from the water on its left, the tail
  // reaching the pile's own left edge (the deck is wider than the piles, and
  // `controlBoxes` keeps the two apart); a row, from under it.
  const bankBox = document.getElementById("bank").getBoundingClientRect();
  const column = bankBox.height > bankBox.width;
  const side = (r) => (column
    ? {x: r.left - box.left - 4, y: r.top + r.height / 2 - box.top, dir: "down", px: r.left - box.left - 2,
       py: r.top + r.height / 2 - box.top, bank: "column"}
    : {x: r.left + r.width / 2 - box.left, y: r.bottom - box.top + 6, dir: "down", px: r.left + r.width / 2 - box.left,
       py: r.bottom - box.top + 5, bank: "row"});
  const deck = document.getElementById("buy-dev-card");
  if (action.type === "BUY_DEV_CARD" || action.type.startsWith("PLAY_")) {
    const r = (deck.querySelector(".board-card-face") || deck).getBoundingClientRect();
    if (r.width) return side(r);
  }
  // A bank trade: at the bank's pile of the card it brings in.
  const pile = action.type === "BANK_TRADE" && board.resources[action.b]
    && document.querySelector(`#bank .bank-pile[data-resource="${board.resources[action.b]}"]`);
  const p = pile && pile.getBoundingClientRect();
  if (p && p.width) return side(p);
  const bank = document.getElementById("bank").getBoundingClientRect();
  const top = bank.width && bank.bottom - box.top < box.height / 3 && bank.left - box.left < box.width / 2 ? bank.bottom - box.top : 16;
  return {x: box.width / 2, y: top + 10, dir: "down", named: true};
}

function bubbleDiv(className, attrs = {}) {
  const div = document.createElement("div");
  div.className = className;
  for (const [k, v] of Object.entries(attrs)) div.setAttribute(k, v);
  return div;
}

// Puts `bubble` at `anchor` in `pane`, its tail on the anchor. One that
// would cover a bubble already in `placed` opens the other way from its place
// instead, where that is clear.
function placeBubble(bubble, anchor, pane, placed = [], targets = null, avoid = []) {
  if (anchor.float) {
    // At a card in the hand: the page's layer, with bubbles of its own to keep clear of.
    pane = document.getElementById("guide-float");
    placed = guideFloatPlaced;
  }
  pane.appendChild(bubble);
  const w = bubble.offsetWidth, h = bubble.offsetHeight;
  // The page's layer has no size of its own: its bounds are the window's.
  const width = anchor.float ? window.innerWidth : pane.clientWidth;
  bubble.classList.remove("below", "left");
  // A lone bank pile or the deck in the column down a desktop's board: met
  // from the water on its left, like a corner button.
  const beside = anchor.dir === "left" ? anchor
    : anchor.bank === "column" && !(targets && targets.length > 1) ? {x: anchor.px - 8, y: anchor.py} : null;
  if (beside) {
    // Beside a corner button: one shape with a short tail from its right end
    // to the button, level with the button's middle.
    anchor = beside;
    const reach = 10;
    const b = {left: Math.max(6, anchor.x - w - reach + 8), top: Math.max(6, anchor.y - h / 2), w, h};
    placed.push(b);
    bubble.style.transform = `translate(${b.left.toFixed(1)}px, ${b.top.toFixed(1)}px)`;
    const base = [b.left + b.w, b.top + b.h / 2];
    drawBubble(bubble, b, [{base, tip: [anchor.x + 8, base[1]], len: reach, edge: "right"}]);
    return true;
  }
  // A box in `placed` is kept clear of the bubble's box; a point (a road's)
  // of the bubble's pill itself, round ends and all.
  const pill = (b, [x, y]) => {
    const r = b.h / 2, cyb = b.top + r, xa = b.left + r, xb = b.left + b.w - r;
    return Math.hypot(x - Math.max(xa, Math.min(xb, x)), y - cyb) - r;
  };
  const covers = (b) => placed.some((o) => !o.seg && (o.pt ? pill(b, o.pt) < 3 : b.left < o.left + o.w + 2 && o.left < b.left + b.w + 2 &&
    b.top < o.top + o.h + 2 && o.top < b.top + b.h + 2));
  const paneH = anchor.float ? window.innerHeight : pane.clientHeight;
  const points = (targets || [{x: anchor.px ?? anchor.x, y: anchor.py ?? anchor.y, r: anchor.pr || 0, seg: anchor.seg}])
    .map((t) => ({x: t.x, y: t.y, r: t.r || 0, seg: t.seg || null}));
  // Every spot around the places, on a grid: the bubble clear of the pane's
  // edges and of every place, bubble and control in `placed`, with a tail
  // that meets each place properly (`tailsFor`); the one whose tails are
  // shortest and most even wins.
  const cx = points.reduce((t, p) => t + p.x, 0) / points.length;
  const cy = points.reduce((t, p) => t + p.y, 0) / points.length;
  let best = null;
  const search = () => {
  for (let dy = -150; dy <= 150; dy += 3) {
    for (let dx = -170; dx <= 170; dx += 3) {
      const b = {left: cx + dx - w / 2, top: cy + dy - h / 2, w, h};
      if (b.left < 6 || b.left + w > width - 6 || b.top < 2 || b.top + h > paneH - 2 || covers(b)) continue;
      // No bubble over another's tail.
      if (placed.some((o) => o.seg && segmentHits(o.seg[0], o.seg[1], b))) continue;
      const tails = tailsFor(b, points);
      // No tail through a box in the way, or across another bubble's tail.
      if (!tails || tails.some((t) => placed.some((o) => (o.seg ? crosses(t.base, t.tip, o.seg[0], o.seg[1])
        : !o.pt && segmentHits(t.base, t.tip, o))))) continue;
      const lens = tails.map((t) => t.len);
      // A flat edge's tails leave it near the end that faces their places, so
      // the bubble's words stand clear of them.
      const lo = b.left + b.h / 2 + TAIL_HALF + 2, hi = b.left + b.w - b.h / 2 - TAIL_HALF - 2;
      const offEnd = tails.reduce((sum, t) => sum + (t.edge === "top" || t.edge === "bottom"
        ? Math.abs(t.base[0] - (t.tip[0] < b.left + b.w / 2 ? lo : hi)) : 0), 0);
      // A tail from a round end only where a flat edge's will not do.
      const ends = tails.filter((t) => t.edge === "left" || t.edge === "right").length;
      // Short tails, but long enough to read as tails, not bumps.
      const reach = lens.map((l) => (l < TAIL_GOOD ? TAIL_GOOD + 2 * (TAIL_GOOD - l) : l));
      const hides = (o) => (o.pt ? pillGap(b, o.pt) < 0
        : b.left < o.left + o.w && o.left < b.left + b.w && b.top < o.top + o.h && o.top < b.top + b.h);
      const score = Math.max(...reach) + 1.5 * (Math.max(...lens) - Math.min(...lens)) + 0.4 * offEnd + 12 * ends +
        8 * avoid.filter(hides).length +
        0.02 * Math.hypot(dx, dy);
      if (!best || score < best.score) best = {b, score, tails};
    }
  }
  };
  search();
  // A bubble with nothing free nearby reaches further, rather than land on
  // another or, for several places, split into one bubble each, but never
  // past twice a tail's longest: a longer tail reads as pointing nowhere
  // (on a phone's small board most of all), and the bubble splits instead.
  for (const reach of [2]) {
    if (best) break;
    tailReach = reach;
    try { search(); } finally { tailReach = 1; }
  }
  // A bubble with no spot yet (for several places, good moves close together
  // that share one, a spot whose tails match) takes unmatched tails (any
  // length, from edge or end, a road met at a point along it from any side)
  // before it gives up. Then a bubble for several places is not drawn, and
  // the caller gives each place its own; a lone one stands at its default.
  if (!best) {
    tailLoose = true;
    for (const reach of [1, 2.5]) {
      if (best) break;
      tailReach = reach;
      try { search(); } finally { tailReach = 1; }
    }
    tailLoose = false;
  }
  if (!best && points.length > 1) { bubble.remove(); return false; }
  // A bank pile's or the deck's bubble with no spot stands beside it in the
  // water (left of a column, under a row), never over the bank's cards.
  // Two such bubbles never overlap: the later one steps away from the bank
  // (left of a column, down from a row) until it is clear.
  const b = best ? best.b
    : anchor.bank === "column" ? {left: Math.max(6, anchor.x - w - 12), top: Math.max(2, anchor.y - h / 2), w, h}
    : anchor.bank === "row" ? {left: Math.max(6, Math.min(width - w - 6, anchor.x - w / 2)), top: anchor.y + 10, w, h}
    : {left: Math.max(6, Math.min(width - w - 6, anchor.x - w / 2)), top: Math.max(2, anchor.y - h - 14), w, h};
  const hits = (q) => placed.some((o) => o.bubble && q.left < o.left + o.w && o.left < q.left + q.w
    && q.top < o.top + o.h && o.top < q.top + q.h);
  for (let n = 0; !best && anchor.bank && n < 6 && hits(b); n++) {
    if (anchor.bank === "column") b.left = Math.max(6, b.left - w - 6); else b.top += h + 6;
  }
  b.bubble = true;
  placed.push(b);
  // Its tails, for the bubbles placed after it to keep clear of.
  for (const t of (best ? best.tails : [])) placed.push({seg: [t.base, t.tip]});
  bubble.style.transform = `translate(${b.left.toFixed(1)}px, ${b.top.toFixed(1)}px)`;
  drawBubble(bubble, b, best ? best.tails : []);
  // "fallback": no spot met the rules, and the bubble stands at its default.
  return best ? true : "fallback";
}

// Half the width of a tail where it leaves its bubble, in pixels: every tail
// the same.
const TAIL_HALF = 6;
// The least gap, in pixels, between two tails of one bubble anywhere along them.
const TAIL_APART = 8;
// A tail's shortest and longest, in pixels.
const TAIL_MIN = 7;
