    (stats && stats.rounds ? ` over <b>${stats.rounds}</b> round${stats.rounds === 1 ? "" : "s"}` : "") +
    (onWin.length ? `, <b>${pct(mean)}</b> of win chance given up a move on average` : "") + `; ${tally}` +
    (tried ? `; <b>${tried}</b> taken back` : "") + `.</div>`;
  document.getElementById("review-summary").innerHTML = summary;
  // What the graph's marks are, for the kinds of mark it shows.
  const dot = (colour, ring) => `<svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="${ring ? 3.8 : 5}" ` +
    (ring ? `fill="none" stroke="${colour}" stroke-width="2.4"` : `fill="${colour}"`) + `/></svg>`;
  const shown = ["brilliant", "inaccuracy", "mistake", "blunder"].filter((c) => moments.some((m) => m.note.class === c));
  document.getElementById("review-legend").innerHTML =
    shown.map((c) => `<span>${dot(STRIP_MARKS[c], false)}${GUIDE_CLASS_WORDS[c]}</span>`).join("") +
    (tried ? `<span>${dot("var(--muted)", true)}Taken back</span>` : "");
  // The key moments scroll on their own, under the rest; drawn again on
  // every render, they keep their scroll, and bring the row of a position
  // newly stepped to into view.
  const body = document.getElementById("review-body");
  const was = body.querySelector(".guide-moves");
  const scrolled = was ? was.scrollTop : 0;
  body.innerHTML = numbers +
    (moments.length ? `<div class="guide-list-head">Key moments</div><div class="guide-moves">${moments.map(momentRow).join("")}</div>`
      : `<div class="guide-list-head">No brilliant moves, mistakes or blunders.</div>`);
  const list = body.querySelector(".guide-moves");
  if (list) {
    list.scrollTop = scrolled;
    const at = list.querySelector(".guide-move.here");
    if (at && here !== reviewShownStep) at.scrollIntoView({block: "nearest"});
  }
  reviewShownStep = here;
  for (const row of body.querySelectorAll(".guide-move")) {
    row.addEventListener("click", () => {
      // A phone's sheet covers the board: it closes to show the move.
      if (reviewCovers()) setGuideReview(false);
      stepReplay(Number(row.dataset.step));
    });
  }
  drawReviewGraph();
}

// Where a flagged move's review row points instead, as a sentence that
// names no mark on the board (the board may show another position): "A
// better move would be to trade Brick for Wood.", several of a kind by what
// they do ("... to end your turn or build a road.").
function reviewBetter(better) {
  const kinds = [];
  for (const action of better) if (!kinds.includes(action.type)) kinds.push(action.type);
  const parts = kinds.map((type) => {
    const of = better.filter((a) => a.type === type);
    if (type === "BANK_TRADE") return tradesWords(of);
    if (of.length === 1) return moveWords(of[0]);
    return (BETTER_KINDS[type] || [])[0] || moveWords(of[0]);
  });
  const list = parts.length < 3 ? parts.join(" or ") : `${parts.slice(0, -1).join(", ")}, or ${parts.at(-1)}`;
  return `A better move would be to ${list}.`;
}

// Whether the review covers the board (a phone's sheet), rather than
// standing beside it (a desktop's panel).
function reviewCovers() {
  return window.matchMedia("(max-width: 820px)").matches;
}

// The review's graph: the seat's win chance a step (the strip's data), the
// whole game across, a mark at each key moment in its grade's colour (solid
// where kept, a ring where taken back), and the playhead at `at` or the
// position shown.
function drawReviewGraph(at = null) {
  const box = document.getElementById("review-graph");
  if (!box || document.getElementById("guide-sheet").hidden) return;
  const svg = box.querySelector("svg");
  const w = box.clientWidth || 1, h = box.clientHeight || 1;
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  const steps = (timeline && timeline.steps) || 0;
  const chance = timeline && timeline.chance;
  const pad = 6;
  const x = (i) => (steps ? (i / steps) * w : 0);
  const y = (v) => h - pad - v * (h - 2 * pad);
  const view = liveView();
  const ink = view && SEAT_COLORS[view.seat] ? SEAT_COLORS[view.seat].fill : "var(--accent)";
  let out = `<line x1="0" x2="${w}" y1="${y(0.5).toFixed(1)}" y2="${y(0.5).toFixed(1)}" stroke="var(--border)" stroke-dasharray="3 3"/>`;
  if (chance && steps) {
    let d = "", open = false, startX = 0, lastX = 0;
    chance.forEach((v, i) => {
      if (v === null || v === undefined) {
        if (open) { d += `L${lastX.toFixed(1)},${h} L${startX.toFixed(1)},${h} Z`; open = false; }
        return;
      }
      const px = x(i), py = y(v);
      if (!open) { d += `M${px.toFixed(1)},${h} L${px.toFixed(1)},${py.toFixed(1)} `; startX = px; open = true; }
      else d += `L${px.toFixed(1)},${py.toFixed(1)} `;
      lastX = px;
    });
    if (open) d += `L${lastX.toFixed(1)},${h} L${startX.toFixed(1)},${h} Z`;
    out += `<path d="${d}" fill="${ink}" fill-opacity="0.3" stroke="${ink}" stroke-opacity="0.9" stroke-width="1.5"/>`;
  }
  const guide = guideView();
  const notes = ((guide && guide.notes) || []).filter((n) => n.class !== "forced");
  const valueAt = (step) => {
    for (let i = Math.min(step, (chance || []).length - 1); i >= 0; i--) if (chance[i] !== null && chance[i] !== undefined) return chance[i];
    return 0.5;
  };
  // The worse the move, the larger its mark, drawn over the lighter ones;
  // a ring thick enough to show its grade's colour where taken back.
  const order = ["brilliant", "inaccuracy", "mistake", "blunder"];
  const size = {brilliant: 4.5, inaccuracy: 4, mistake: 5, blunder: 6.5};
  const marks = reviewMoments(notes, (guide && guide.taken_back) || [])
    .sort((a, b) => order.indexOf(a.note.class) - order.indexOf(b.note.class));
  for (const m of marks) {
    const colour = STRIP_MARKS[m.note.class];
    if (!colour || !steps) continue;
    const mx = x(m.note.step + 0.5), my = y(valueAt(m.note.step)), r = size[m.note.class];
    out += m.back
      ? `<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="${(r - 1.4).toFixed(1)}" fill="var(--panel)" stroke="${colour}" stroke-width="2.8"/>`
      : `<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="${r}" fill="${colour}" stroke="var(--panel)" stroke-width="1.2"/>`;
  }
  const here = at !== null ? at : replayAnchor();
  const px = Math.min(w - 1, Math.max(1, x(Math.min(here, steps))));
  out += `<line x1="${px.toFixed(1)}" x2="${px.toFixed(1)}" y1="0" y2="${h}" stroke="var(--ink)" stroke-width="2"/>`;
  svg.innerHTML = out;
}

function setGuideReview(open) {
  guideReviewOpen = open;
  renderGuide();
}

// A request of the guide's: turning it on and asking for a hint never dim
// the board; a take back, which changes it, does.
function guidePost(path) {
  return blocking(async () => {
    pendingRobberHex = null;
    const {ok, data} = await postJSON(path, {});
    if (ok) state = data;
    showNotice(ok ? "" : (data.error || "The guide could not do that."));
    render();
    if (ok) settle();
  }, path === "/api/takeback");
}

document.getElementById("replay-pct").addEventListener("click", (event) => {
  if (event.currentTarget.classList.contains("reviewable")) setGuideReview(!guideReviewOpen);
});

document.getElementById("guide-on").addEventListener("click", () => {
  const guide = guideView();
  const on = !(guide && guide.on && guideWanted());
  setGuideWanted(on);
  if (on && !(guide && guide.on)) {
    guideAsked.add(guideAskKey());
    guidePost("/api/guide");
    return;
  }
  render();
});
document.getElementById("guide-hint").addEventListener("click", () => guideHintClick());
function guideHintClick() {
  const guide = guideView();
  const shown = replayHint() || (!replaying() && guide && guide.hint);
  if (shown) {
    const key = hintKeyOf(shown);
    if (guideDismissed.has(key)) guideDismissed.delete(key);
    else guideDismissed.add(key);
    guideOpenHint = null;
    renderGuideBubbles();
    if (modalMode === "discard") renderModal();
    return;
  }
  if (!replaying()) {
    if (guide && guide.step !== undefined) setHintAskedAt(guide.step);
    guidePost("/api/hint");
  }
}
document.getElementById("modal-hint").addEventListener("click", (event) => { event.stopPropagation(); guideHintClick(); });
document.getElementById("guide-sheet-close").addEventListener("click", () => setGuideReview(false));
document.getElementById("guide-sheet").addEventListener("click", (e) => {
  if (e.target.id === "guide-sheet") setGuideReview(false);
});
window.addEventListener("resize", () => renderGuideBubbles());

// The sidebar's width on a desktop, dragged at its left edge: no narrower
// than SIDEBAR_MIN (its width as drawn), no wider than SIDEBAR_MAX or half
// the window, kept in this browser. A double-click puts it back. The board
// and its bubbles fit the room left as it moves.
const SIDEBAR_MIN = 360, SIDEBAR_MAX = 720;
function setSidebarWidth(px, keep = false) {
  const w = Math.round(Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, window.innerWidth / 2, px)));
  document.documentElement.style.setProperty("--sidebar-width", `${w}px`);
  if (keep) {
    try { localStorage.setItem("hexset.sidebar", String(w)); } catch (e) { /* private mode */ }
  }
  return w;
}
(function sidebarResize() {
  try {
    const kept = Number(localStorage.getItem("hexset.sidebar"));
    if (kept) setSidebarWidth(kept);
  } catch (e) { /* private mode */ }
  const handle = document.getElementById("sidebar-resize");
  const sidebar = document.getElementById("sidebar");
  let held = false, frame = 0;
  handle.addEventListener("pointerdown", (event) => {
    held = true;
    handle.classList.add("held");
    handle.setPointerCapture(event.pointerId);
    event.preventDefault();
  });
  handle.addEventListener("pointermove", (event) => {
    if (!held) return;
    setSidebarWidth(sidebar.getBoundingClientRect().right - event.clientX);
    if (!frame) frame = requestAnimationFrame(() => { frame = 0; renderGuideBubbles(); });
  });
  const end = () => {
    if (!held) return;
    held = false;
    handle.classList.remove("held");
    setSidebarWidth(sidebar.getBoundingClientRect().width, true);
    renderGuideBubbles();
  };
  handle.addEventListener("pointerup", end);
  handle.addEventListener("pointercancel", end);
  handle.addEventListener("dblclick", () => {
    setSidebarWidth(SIDEBAR_MIN);
    try { localStorage.removeItem("hexset.sidebar"); } catch (e) { /* private mode */ }
    renderGuideBubbles();
  });
})();
// A bubble at a card in the hand follows the card as the page or the sidebar scrolls.
let guideScrollFrame = 0;
window.addEventListener("scroll", () => {
  if (!document.getElementById("guide-float").childElementCount || guideScrollFrame) return;
  guideScrollFrame = requestAnimationFrame(() => { guideScrollFrame = 0; renderGuideBubbles(); });
}, true);
// A tap on the board's empty space puts the guide's bubbles away: the hint
// up, or the last graded move's bubble, its card and its ring. A place to
// play, a control or a bubble is not empty space.
document.getElementById("board-pane").addEventListener("click", (event) => {
  if (event.target.closest("button, .guide-bubble, .clickable-vertex, .clickable-edge, .clickable-hex, #table-controls, #bank, #piece-supply")) return;
  const replayed = replayHint();
  if (replayed) {
    guideDismissed.add(hintKeyOf(replayed));
    guideOpenHint = null;
    renderGuideBubbles();
    return;
  }
  const guide = guideView();
  if (!guide || !guide.on || replaying()) return;
  const notes = guide.notes || [];
  if (guide.hint) guideDismissed.add(`hint:${guide.hint.id}`);
  if (notes.length) guideDismissed.add(`note:${noteKey(notes[notes.length - 1])}`);
  guideOpenNote = null;
  guideOpenHint = null;
  renderGuideBubbles();
});

function renderPlayers() {
  const container = document.getElementById("players");
  // Rebuilt whole, and rebuilt on every poll while somebody else is on move
  // (see settle) — which is exactly when an empty seat is most likely to be
  // getting a bot picked for it. An open picker lives inside this container,
  // so a rebuild would close it out from under the click; the numbers it
  // would have refreshed can wait for the tick after the choice.
  if (container.contains(document.activeElement)) return;
  container.innerHTML = "";
  for (const p of state.players) {
    // A closed seat stays on the roster, as a picker, until the first move:
    // the table can still change its mind (reopen it, seat a bot). Once play
    // starts the seats are fixed -- closing and reopening are refused
    // server-side -- and the row goes, since there is nobody in it and never
    // will be; the seats left keep their colour names (colorName), which no
    // closed seat changes. The seats
    // a fixed-seat deal (duel rules) retired have nothing to change their
    // mind about, so they never show at all.
    if (state.started && (state.locked || []).includes(p.seat)) continue;
    if ((state.fixed_seats || []).includes(p.seat)) continue;
    const color = SEAT_COLORS[p.seat];
    // Whose decision it is — and pinned to a past round, nobody's. Every
    // round's snapshot is the moment after the last seat ended their turn,
    // so `to_move` is the first seat at all of them and this would sit on
    // Red the whole way through, saying nothing except where the cut
    // falls.
    //
    // Left off rather than pointed at the live turn (`liveView`, the way the
    // title goes). Every other column in this row -- the hand, the victory
    // points, the road length -- is that round's, so a highlight naming the
    // seat on move *now* would be the one thing in it that is not, and would
    // read as though those were their cards.
    const onMove = !replaying() && state.to_move === p.seat;
    const row = html("div", {class: `player-row${onMove ? " active" : ""}`});
    row.dataset.seat = String(p.seat);
    if (rowBadges.has(p.seat)) queueMicrotask(() => attachBadge(row, p.seat));
    const swatch = html("div", {class: "swatch"});
    swatch.style.background = color.fill;
    swatch.style.borderColor = color.stroke;
    row.appendChild(swatch);

    const nameEl = html("div", {class: "player-name"});
    const kind = state.seats[p.seat] && state.seats[p.seat].kind;
    if (frozen()) {
      // Nothing here is ours to change — seating a bot needs a seat's own
      // token, and once the game is over nobody's seat may be changed at all
      // (`api.Tables.seat_bot`/`rename`, refused past `is_over`) — so every
      // row reads as text, empty ones included. What a row does instead is
      // open: every hand at the table is told to a spectator, and to
      // everyone once the game is over (`webplay`'s `reveal = over or
      // omniscient or p == viewer`), and clicking a row picks which one the
      // hand area below shows.
      nameEl.classList.add("player-name-plain");
      // Our own row keeps the name we chose rather than seatLabel's "human":
      // that name is what every other viewer's list has read all game, and
      // the game ending is no reason for it to be the one row that loses it.
      nameEl.textContent = p.seat === state.seat
        ? (state.seats[p.seat].name || "human")
        : seatLabel(p.seat);
      // Openable only while reading(): that is when more than one hand is in
      // the view to choose between. A seat pinned to a past round has exactly
      // its own, so there is nothing for a click to pick and the row should
      // not invite one.
      if (p.hand !== undefined && reading()) {
        row.classList.add("player-row-openable");
        if (openSeat === p.seat) {
          row.classList.add("player-row-open");
          row.style.setProperty("--open-ring", color.fill);
        }
        // Clicking the open row again closes it, so there is always a way
        // back to showing nobody's cards in particular.
        row.addEventListener("click", () => {
          openSeat = openSeat === p.seat ? null : p.seat;
          render();
        });
      }
    } else if (p.seat === state.seat) {
      // Your own seat, and the one thing on this row you can change. It is an
      // input for the same reason a bot seat is a <select>: the control *is*
      // the player line, with nothing extra to click first.
      //
      // The poll rebuilds this whole list every 1.5s while somebody else is
      // on move, which would take the caret with it mid-word — the guard at
      // the top of renderPlayers is what stops that, since a focused input is
      // inside this container.
      const input = html("input", {
        maxlength: "40", autocomplete: "off", spellcheck: "false",
        placeholder: "human", title: "Your name at this game",
      });
      input.value = state.seats[p.seat].name || "";
      input.addEventListener("change", () => renameSelf(input.value));
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
      nameEl.appendChild(input);
    } else if (kind === "player") {
      // Somebody else who opened this link. Their seat is theirs; there is
      // nothing here to change about it.
      nameEl.classList.add("player-name-plain");
      nameEl.textContent = state.seats[p.seat].name || colorName(p.seat);
    } else {
      // The picker *is* the player line, and it is the only place a table
      // says who else is playing: an empty seat starts blank and choosing a
      // model seats that bot there, a seat that already has one swaps it.
      // Either way it goes straight through swapBot, no separate "apply"
      // step. An empty seat holds the whole table (see renderStatus) until
      // somebody picks a bot for it, opens the link and takes it, or picks
      // "closed" to close it outright -- nothing here ever resolves itself.
      // Its name opens the bot cards (renderPickBotMode), where a bot is
      // seated or swapped, and an open seat left open or closed. A button, blurred on click: a focused control inside the
      // roster would hold off every re-render (the guard at the top).
      const closed = (state.locked || []).includes(p.seat);
      const button = html("button", {
        type: "button", class: `bot-pick${p.bot ? "" : " unset"}`, "data-seat": String(p.seat),
        title: p.bot ? "Change this bot" : "Seat a bot",
      });
      const label = html("span", {class: "bot-pick-name"});
      label.textContent = p.bot ? seatLabel(p.seat) : (closed ? "(closed)" : "(empty)");
      // A pick not yet answered shows already, dimmed (chooseBot).
      if (pendingSeat && pendingSeat.seat === p.seat) {
        label.textContent = pendingSeat.label;
        button.classList.add("pending");
        button.classList.remove("unset");
      }
      button.appendChild(label);
      button.addEventListener("click", () => { button.blur(); openModal("pick-bot", {seat: p.seat}); });
      nameEl.appendChild(button);
    }
    row.appendChild(nameEl);

    const cards = p.hand !== undefined
      ? board.resources.map((r) => p.hand[r]).reduce((a, b) => a + b, 0)
      : p.hand_size;
    // Each chip is its own grid cell now (see .player-row's
    // grid-template-columns), appended straight onto the row rather than
    // into a wrapping div — that's what lets every row share the same
    // column tracks instead of each row sizing its own flex children.
    row.appendChild(statChip("victory-point", p.victory_points, "",
      `Victory points (${state.winning_points} to win)`));
    row.appendChild(statChip("card", cards, "cards", "Resource cards"));
    row.appendChild(statChip("dev-card", p.dev_card_count, "", "Development cards"));
    // Route length and Knights played sit in every row, always — comparable
    // seat to seat, tinted only for whoever actually holds the title right
    // now (see statChip's "held" class, gated in CSS on
    // .stat.road.held/.stat.army.held).
    row.appendChild(
      statChip("road", p.road_length, `road${p.longest_road ? " held" : ""}`, "Longest road")
    );
    row.appendChild(
      statChip("knight", p.knights_played, `army${p.largest_army ? " held" : ""}`, "Largest army")
    );
    // Each seat's own last roll, not one global value — lets you compare
    // who's been running hot or cold rather than only ever seeing whoever
    // rolled most recently. It's the row's last (and only ever-absent)
    // column, so leaving it out when a seat hasn't rolled yet still leaves
    // every other row's columns aligned.
    if (p.last_roll) row.appendChild(statChip("dice", p.last_roll, "roll", "Last roll"));
    container.appendChild(row);
  }
}

// What clicking a dev card in hand does, or null if that card can't be
// played right now (it isn't legal, or it's a Victory Point, which is never
// "played" at all — it just counts). Playing a dev card is only ever done
// this way now; nothing in the actions list plays one.
//
// Two shapes, by what the card still needs to know:
//   - nothing (Road Building, Knight) — send it and let the board take over:
//     Road Building's two free roads, or the Knight's forced robber move
//     (the same Phase.ROBBER a seven enters, once the card lands)
//   - a resource (Monopoly, Year of Plenty) — open the modal that picks one
// Cancelled by closing the modal for those two; a sent Knight or Road
// Building has its own way back out instead, since neither opens one -- the
// #undo-build corner button, offered by state.can_undo for exactly as long
// as what the card opened (a free road, the forced robber move) hasn't
// landed yet. See _UNDOABLE_BUILDS.
function devCardPlay(name, g) {
  if (robberMove(g)) return null;
  if (name === "Knight" && g.simple.PLAY_KNIGHT) {
    return {title: "Play Knight", run: () => sendAction(g.simple.PLAY_KNIGHT)};
  }
  if (name === "Road Building" && g.simple.PLAY_ROAD_BUILDING) {
    return {title: "Play Road Building", run: () => sendAction(g.simple.PLAY_ROAD_BUILDING)};
  }
  if (name === "Monopoly" && g.monopoly.length) {
    return {title: "Play Monopoly", run: () => openModal("monopoly")};
  }
  if (name === "Year Of Plenty" && g.yearOfPlenty.length) {
    return {title: "Play Year of Plenty", run: () => openModal("year-of-plenty")};
  }
  return null;
}

// The human's own cards, kept in a fixed spot below the seat list (in actual
// seat order) rather than tied to wherever their seat happens to fall.
//
// Watching, there is no own seat, and this shows whichever one was clicked in
// the player list instead (openSeat) — nobody's until one is. The clicks that
// make a card do something all come off `legal_actions`, which is empty for a
// spectator, so every card here is inert without a check of its own.
//
// Once the game is over a seat's holder reads the table the same way a
// spectator does: every hand is revealed to everyone by then, so the row that
// used to be a model picker is a way to read what that seat was actually
// holding at the end — their own row included, with no hand pinned open
// until one is picked. The seat is still theirs (it is what keeps their name
// on their own row), it just stops being the view's default.
//
// Stepping back through a game is the other way round: `reading()`, not
// `frozen()`, so a seat pinned to a past round keeps its own hand as the
// view's default and sees no other. That is the whole point of replaying as
// a seat, and it is what the server sent (`api.Tables.replay_view` redacts
// the round for whoever asked). The cards are inert all the same — a replay
// read carries no `legal_actions`, so nothing below finds anything to wire.
// The hand as last drawn ({seat, counts}, a count per "r:<resource>" and
// "d:<dev card>"), and when each card the seat gained since came in, so
// renderHand marks it (markGained) for GAIN_MS whatever repaints between.
// Only a live hand is compared: stepping back, or another seat's row opened,
// starts the comparison afresh.
let handDrawn = null;
const handGained = new Map();
const GAIN_MS = 900;

function noteHand(seat, counts) {
  const now = performance.now();
  if (replaying() || seat === null || seat === undefined || !handDrawn || handDrawn.seat !== seat) {
    handGained.clear();
  } else {
    for (const [key, n] of Object.entries(counts)) {
      const had = handDrawn.counts[key] || 0;
      if (n > had) handGained.set(key, {at: now, arrived: had === 0});
    }
  }
  for (const [key, g] of handGained) if (now - g.at >= GAIN_MS) handGained.delete(key);
  handDrawn = replaying() ? null : {seat, counts};
}

// The kinds of card the seat lost to its own discard or another seat's
// steal (advance), when, and whether none of the kind is left, so renderHand
// marks each (markLost) for LOSS_MS and shows a kind gone fading where it
// stood. Cards spent or traded away are the seat's own doing and not marked.
const handLost = new Map();
const LOSS_MS = 900;
let handLostTimer = 0;

function noteLost(step, before) {
  const seat = state.seat;
  const lost = (step.kind === "discard" && step.actor === seat)
    || (step.kind === "robber" && step.stole && step.victim === seat);
  if (!lost || replaying() || seat === null || seat === undefined) return;
  const was = (before.find((p) => p.seat === seat) || {}).hand;
  const now = (state.players.find((p) => p.seat === seat) || {}).hand;
  if (!was || !now) return;
  const at = performance.now();
  for (const r of board.resources) {
    if ((now[r] || 0) < (was[r] || 0)) handLost.set(`r:${r}`, {at, gone: !now[r]});
  }
}

function markLost(card, key) {
  const l = handLost.get(key);
  if (!l) return;
  card.classList.add("lost");
  if (l.gone) card.classList.add("gone");
  card.style.setProperty("--loss-delay", `${-Math.round(performance.now() - l.at)}ms`);
}

function markGained(card, key) {
  const g = handGained.get(key);
  if (!g) return;
  card.classList.add("gained");
  if (g.arrived) card.classList.add("arrived");
  card.style.setProperty("--gain-delay", `${-Math.round(performance.now() - g.at)}ms`);
}

function renderHand() {
  const container = document.getElementById("hand");
  container.innerHTML = "";
  // Stepping back, a seat sees its own hand by default, as in play,
  // finished game or not.
  const own = reading() && !replaying() ? null : state.seat;
  const seat = reading() && openSeat !== null ? openSeat : own;
  const p = seat === null ? null : state.players.find((pp) => pp.seat === seat);
  const hasHand = Boolean(p && p.hand !== undefined);

  // Browsing with nobody picked: the columns are still laid out, invisible,
  // so the pane holds the height the cards will take, and the hint sits
  // centred over that space. Picking a row reveals the columns in the same
  // repaint -- no title names the seat; the highlighted roster row does.
  const hint = reading() && !hasHand;
  if (hint) {
    container.appendChild(html("div", {class: "hand-hint"}, "Click a player to see their cards"));
  }

  // What a click on a card does is decided by what's actually legal, which
  // is to say by the phase — and in most phases it does nothing at all.
  // legal_actions arrives empty unless the human is the one to move (see
  // GameSession.legal_wire_actions), so reading it is the whole test; there's
  // no separate game_over/to_move check to keep in sync with it.
  const g = hasHand ? groupActions(state.legal_actions) : null;
  // A card is clickable when there is a trade to make with it, which now
  // means the bank or a port and nothing else: offers between seats left the
  // engine with the one-event mechanic, so `bankTrade` is the whole of it.
  // Discarding is the other thing a resource card can do, but it happens in
  // the modal that DISCARD opens over the whole page (see syncModal), not
  // here — these cards aren't reachable while that's up.
  // `frozen()` rather than the empty `legal_actions` a replay read carries:
  // this one is not read off them, so a past round in which this seat held
  // MAIN and the move would otherwise have offered the trade modal — over a
  // hand it can no longer trade, to a server that would clear it against the
  // live game.
  const canTrade = hasHand && !frozen() && !robberMove(g) && state.phase === "MAIN" && state.to_move === state.seat;
  const counts = {};
  if (hasHand) {
    for (const r of board.resources) if (p.hand[r]) counts[`r:${r}`] = p.hand[r];
    for (const c of board.dev_cards) if (p.dev_cards[c]) counts[`d:${c}`] = p.dev_cards[c];
  }
  noteHand(hasHand ? seat : null, counts);

  // Two columns, side by side, both always present regardless of hasHand —
  // the header and the row's height hold their place even at zero cards, so
  // buying a first dev card doesn't shove the resources column around, and
  // (browsing, nobody picked yet) the pane's height doesn't change the
  // instant somebody is.
  const cols = html("div", {class: hint ? "hand-cols hand-cols-hidden" : "hand-cols"});
  const resCol = html("div", {class: "hand-col"});
  resCol.appendChild(handColHeader("card", "Resource Cards"));
  const resHand = html("div", {class: "hand"});
  const nowMs = performance.now();
  for (const [key, l] of handLost) if (nowMs - l.at >= LOSS_MS) handLost.delete(key);
  if (!hasHand || seat !== state.seat || replaying()) handLost.clear();
  if (hasHand) {
    for (const r of board.resources) {
      const n = p.hand[r];
      const lost = handLost.get(`r:${r}`);
      if (!n && lost && lost.gone) {
        // A kind just lost to the last card: it fades out where it stood.
        const ghost = resourceCardTile(r, {title: r});
        ghost.dataset.lost = r;
        markLost(ghost, `r:${r}`);
        resHand.appendChild(ghost);
        continue;
      }
      if (!n) continue;
      const idx = board.resources.indexOf(r);
      const card = resourceCardTile(r, {title: `${r}: ${n}`});
      card.dataset.resource = r;
      card.appendChild(html("div", {class: "count"}, String(n)));
      markGained(card, `r:${r}`);
      markLost(card, `r:${r}`);
      if (canTrade) {
        card.classList.add("hand-card-clickable");
        card.addEventListener("click", () => openModal("trade", {give: idx}));
      }
      resHand.appendChild(card);
    }
  }
  resCol.appendChild(resHand);
  cols.appendChild(resCol);

  const devCol = html("div", {class: "hand-col"});
  devCol.appendChild(handColHeader("dev-card", "Development Cards"));
  const devHand = html("div", {class: "hand"});
  if (hasHand) {
    for (const c of board.dev_cards) {
      const n = p.dev_cards[c];
      if (!n) continue;
      const play = devCardPlay(c, g);
      const classes = ["card"];
      if (play) classes.push("hand-card-clickable");
      const card = html("div", {class: classes.join(" "), title: play ? play.title : `${c}: ${n}`, "data-dev": c});
      card.style.background = "var(--dev-card-bg)";
      card.appendChild(iconSvg(DEV_CARD_ICONS[c], {fill: DEV_CARD_INK}));
      card.appendChild(html("div", {class: "count"}, String(n)));
      markGained(card, `d:${c}`);
      if (play) card.addEventListener("click", play.run);
      devHand.appendChild(card);
    }
  }
  devCol.appendChild(devHand);
  cols.appendChild(devCol);
  container.appendChild(cols);
  // Drawn again once the last loss has played, so a kind gone leaves.
  clearTimeout(handLostTimer);
  if (handLost.size) {
    const left = Math.max(...[...handLost.values()].map((l) => LOSS_MS - (performance.now() - l.at)));
    handLostTimer = setTimeout(renderHand, Math.max(0, left) + 20);
  }
}

// How many of each piece the human still has to place — supply caps come
// from the engine (board.piece_supply, see board_layout in webplay.py) so
// this can't drift from what can_place_settlement/_road/_city actually
// enforce; built counts are just what's already on the board in this seat's
// colour.
function renderPieceSupply() {
  const container = document.getElementById("piece-supply");
  container.innerHTML = "";
  // One seat's pieces. Playing, our own. Reading the table, the seat whose
  // row is open (openSeat), as the hand area below does, and nobody's until
  // one is: a spectator has no pieces of their own, and a finished game has
  // no own seat to default to. `reading()`, not `frozen()`, so a seat
  // stepping back still gets its own supply as it stood that round — what
  // this seat had left to place is part of that seat's view of the board
  // then. Either way the counts come off the board on screen, so a replayed
  // round shows what the seat had left at the end of it.
  // Stepping back a seat sees its own, as in play, finished game or not.
  const seat = reading() ? (openSeat ?? (replaying() ? state.seat : null)) : state.seat;
  if (seat === null || seat === undefined) return;
  const color = SEAT_COLORS[seat];
  const roadsBuilt = state.edge_owner.filter((o) => o === seat).length;
  const settlementsBuilt = state.vertex_owner.filter(
    (o, v) => o === seat && state.vertex_building[v] === 1
  ).length;
  const citiesBuilt = state.vertex_owner.filter(
    (o, v) => o === seat && state.vertex_building[v] === 2
  ).length;
  const remaining = {
    settlement: board.piece_supply.settlement - settlementsBuilt,
    city: board.piece_supply.city - citiesBuilt,
    road: board.piece_supply.road - roadsBuilt,
  };
  const plural = {settlement: "Settlements", city: "Cities", road: "Roads"};
  for (const kind of ["settlement", "city", "road"]) {
    const tile = html("div", {
      class: `supply-tile supply-${kind}`, title: `${plural[kind]}: ${remaining[kind]} left`,
    });
    tile.appendChild(pieceGlyph(kind, color));
    tile.appendChild(html("div", {class: "count"}, String(remaining[kind])));
    container.appendChild(tile);
  }
}

// A road from vertex `r.v0` to `r.v1` in a seat's `color`, as its lines from
// the bottom up: `cast`, its shadow; `casing`, the seat's near-black stroke,
// 1 unit proud of the colour on each side as a building's outline is;
// `fill`, the colour; and along the colour's two sides `light`, on the side
// facing the light, and `shade`, on the other. Round caps throughout, so
// the casing follows the colour's rounded ends. `r.gap0` and `r.gap1` end
// the road that much short of `r.v0` and `r.v1` (roadEndGaps).
function roadLines(r, color) {
  const length = Math.hypot(r.v1.x - r.v0.x, r.v1.y - r.v0.y) || 1;
  const ux = (r.v1.x - r.v0.x) / length, uy = (r.v1.y - r.v0.y) / length;
  // Across the road, toward the light.
  const lit = -uy * LIGHT.x + ux * LIGHT.y > 0 ? 1 : -1;
  const nx = -uy * lit, ny = ux * lit;
  const gap0 = r.gap0 || 0, gap1 = r.gap1 || 0;
  // The road moved by (ox, oy) and cut `trim` short at each end.
  const line = (ox, oy, trim, attrs) => el("line", {
    x1: r.v0.x + ox + ux * (trim + gap0), y1: r.v0.y + oy + uy * (trim + gap0),
    x2: r.v1.x + ox - ux * (trim + gap1), y2: r.v1.y + oy - uy * (trim + gap1),
    "stroke-linecap": "round", ...attrs,
  });
  return {
    cast: line(0, ROAD_CAST, 0, {stroke: "#000000", "stroke-width": 8}),
    casing: line(0, 0, 0, {stroke: color.stroke, "stroke-width": 8}),
    fill: line(0, 0, 0, {stroke: color.fill, "stroke-width": 6}),
    light: line(nx * 1.7, ny * 1.7, 1.5, {class: "road-light"}),
    shade: line(-nx * 1.7, -ny * 1.7, 1.5, {class: "road-shade"}),
  };
}

// Where two seats' roads meet at a vertex nobody has built on, a road that
// carries on through it (another of its own seat's roads ends there too) is
// drawn to the vertex, and a road that ends there alone stops ROAD_END_GAP
// short, so it does not lie across the road it meets. Returns (edge, vertex)
// -> that end's gap. `building`, {id, owner}, counts a road being built that
// the state does not hold yet (playBuild).
function roadEndGaps(building = null) {
  const ownerOf = (e) => (building && e.id === building.id ? building.owner : state.edge_owner[e.id]);
  const owners = new Map();
  for (const e of board.edges) {
    const owner = ownerOf(e);
    if (owner < 0) continue;
    for (const v of [e.v0, e.v1]) {
      if (!owners.has(v)) owners.set(v, []);
      owners.get(v).push(owner);
    }
  }
  return (e, v) => {
    if (state.vertex_owner[v] >= 0) return 0;
    const owner = ownerOf(e);
    const here = owners.get(v) || [];
    const mine = here.filter((o) => o === owner).length;
    return mine === 1 && here.length > 1 ? ROAD_END_GAP : 0;
  };
}

function renderBoardDynamic() {
  const buildingsLayer = document.getElementById("buildings-layer");
  const roadsLayer = document.getElementById("roads-layer");
  const robberLayer = document.getElementById("robber-layer");
  const clickLayer = document.getElementById("clickable-layer");
  const clickEdgeLayer = document.getElementById("clickable-edge-layer");
  const hexTargetLayer = document.getElementById("hex-target-layer");
  buildingsLayer.innerHTML = "";
  roadsLayer.innerHTML = "";
  robberLayer.innerHTML = "";
  clickLayer.innerHTML = "";
  clickEdgeLayer.innerHTML = "";
  hexTargetLayer.innerHTML = "";

  // Roads (roadLines), a kind of line at a time: every shadow, then every
  // casing, then every colour, so that where two seats' roads meet at a
  // vertex nobody has built on yet, the second road's casing lands under the
  // first one's colour and not across it.
  const roads = [];
  const gapAt = roadEndGaps();
  for (const e of board.edges) {
    const owner = state.edge_owner[e.id];
    if (owner < 0) continue;
    roads.push(roadLines({v0: vertexById[e.v0], v1: vertexById[e.v1],
                          gap0: gapAt(e, e.v0), gap1: gapAt(e, e.v1)}, SEAT_COLORS[owner]));
  }
  const casts = el("g", {class: "road-casts"});
  roadsLayer.appendChild(casts);
  for (const r of roads) casts.appendChild(r.cast);
  for (const part of ["casing", "fill", "shade", "light"]) {
    for (const r of roads) roadsLayer.appendChild(r[part]);
  }

  // Settlements & cities
  for (const v of board.vertices) {
    const owner = state.vertex_owner[v.id];
    if (owner < 0) continue;
    const building = state.vertex_building[v.id]; // 1 settlement, 2 city
    buildingsLayer.appendChild(buildingPiece(v, building === 2, SEAT_COLORS[owner]));
  }

  // Robber
  const robberHex = hexById[state.robber];
  if (robberHex) {
    const spot = robberSpot(robberHex);
    robberLayer.appendChild(el("use", {
      href: "#icon-robber", class: "robber",
      x: spot.x - ROBBER_SIZE / 2, y: spot.y - ROBBER_SIZE / 2, width: ROBBER_SIZE, height: ROBBER_SIZE,
    }));
  }
  markBlocked(state.robber);

  if (state.to_move !== state.seat || state.game_over) return;
  const g = groupActions(state.legal_actions);

  // Hexes into their own layer below the pieces, then edges, then vertices
  // here: a hex overlay's boundary coincides exactly with the edges around
  // it, so the broadest target has to sit underneath or it steals clicks
  // meant for a road on its rim (later siblings paint on top in SVG).
  // Vertices are the smallest, most precise targets and go last (clickable-
  // layer, above buildings-layer) so nothing else can shadow them either —
  // edges sit in their own layer under buildings-layer instead of straight
  // after the hexes, purely for paint order: see the comment by
  // clickable-edge-layer's creation.
  const move = robberMove(g);
  for (const [hid, actions] of Object.entries(move ? move.targets : {})) {
    const h = hexById[hid];
    const points = h.vertex_ids.map((v) => `${vertexById[v].x},${vertexById[v].y}`).join(" ");
    const poly = el("polygon", {points, class: "clickable-hex"});
    poly.addEventListener("click", () => {
      if (actions.length === 1) { sendAction(actions[0]); return; }
      // syncModal picks this up on the way through and opens "steal" over it.
      pendingRobberHex = Number(hid);
      render();
    });
    hexTargetLayer.appendChild(poly);
  }
  // A pending robber move owns the board until it's answered or taken back,
  // so the build targets come down with everything else (renderBoardButtons)
  // and its hexes above are all that answers a click. Free for the forced
  // one — the engine offers nothing else in Phase.ROBBER — but the rule is
  // the same either way, so it's written once.
  if (move) return;
  for (const [eid, actions] of Object.entries(g.edge)) {
    const e = board.edges[eid];
    const p0 = vertexById[e.v0], p1 = vertexById[e.v1];
    // The bar stops short of both corners, so it stays clear of whatever
    // stands on them and of the bars of the edges it meets there.
    const [a, b] = EDGE_MARK.map((t) => ({x: p0.x + (p1.x - p0.x) * t, y: p0.y + (p1.y - p0.y) * t}));
    const ends = {x1: a.x, y1: a.y, x2: b.x, y2: b.y};
    const target = el("g", {class: "clickable-edge"},
      el("line", {...ends, class: "edge-mark-rim"}),
      el("line", {...ends, class: "edge-mark"}),
      el("line", {...ends, class: "edge-hit"}));
    target.addEventListener("click", () => sendAction(actions[0]));
    clickEdgeLayer.appendChild(target);
  }
  // A city target reads as a diamond (the same rotated-square mark
  // upgrading it will actually place, see buildingPiece) rather than the
  // settlement/setup circle, so the highlight itself
  // tells you which action a vertex is offering before you click it. Sized
  // in JS rather than through the coarse-pointer CSS bump .clickable-vertex
  // uses for circles: a CSS width/height override on a <rect> would grow it
  // from its fixed x/y corner, not its center, throwing off the diamond's
  // position over the vertex.
  const coarsePointer = window.matchMedia?.("(pointer: coarse)").matches ?? false;
  for (const [vid, actions] of Object.entries(g.vertex)) {
    const v = vertexById[vid];
    let target;
    if (actions[0].type === "BUILD_CITY") {
      // 22 to mirror the settlement circle's own target-vs-actual relationship
      // (r=11 highlight around a rendered r=12 piece) — the actual city is
      // 24x24 (see buildingPiece).
      const side = coarsePointer ? 26 : 22;
      target = el("rect", {
        x: v.x - side / 2, y: v.y - side / 2, width: side, height: side,
        transform: `rotate(45 ${v.x} ${v.y})`, class: "clickable-vertex",
      });
    } else {
      // Unchanged from before: r stays a fixed attribute, and the
      // coarse-pointer CSS rule (.clickable-vertex { r: 18 }) still does the
      // touch-target bump for circles on its own.
      target = el("circle", {cx: v.x, cy: v.y, r: 11, class: "clickable-vertex"});
    }
    target.addEventListener("click", () => sendAction(actions[0]));
    clickLayer.appendChild(target);
  }
}

// The board's four corner buttons, shown exactly when what they do is on
// offer. There is no sidebar list of actions any more: rolling, ending a turn
// and buying a development card are these buttons; building and the robber
// are highlights on the board itself; a development card is played by
// clicking it in hand (devCardPlay); and every choice shaped like a menu —
// trading, discarding, the robber's victim, Monopoly's resource, Year of
// Plenty's pair — is a mode of the one modal.
function renderBoardButtons() {
  // Includes a seat holding its setup turn open: the view reports that seat
  // as `to_move` even though the engine's snake has moved on, so there is no
  // second notion of "whose turn" to keep in step here (_public_mover).
  // `frozen()` covers the game being over, and covers a round already played
  // — where `to_move` really is this seat, which is exactly the trap: the
  // corner buttons would come up on a historical position and POST to the
  // live one.
  const myTurn = !frozen() && state.to_move === state.seat;
  // A robber move is the one choice the game asks for on the board rather
  // than in the modal, and it behaves like a modal mode all the same: nothing
  // behind it is reachable until it's answered, whether Phase.ROBBER was
  // entered off a seven or off a knight -- the engine offers nothing else
  // in that phase either way, so the corners come down with everything else.
  const move = robberMove(groupActions(state.legal_actions));
  const offered = (type) => myTurn && !move && legalAction(type) !== null;
  // Not a legal_actions entry — undo is a session convenience, not a game
  // rule — so it reads the server's own can_undo flag instead of offered().
  // Left out of `offered`'s !move gate on purpose: a self-played Knight
  // stays undoable through the forced robber move it opened (see
  // _UNDOABLE_BUILDS), and can_undo is exactly what tells the two cases
  // apart -- a rolled seven clears it same as ever, since there was never a
  // card to hand back.
  // With the guide on, the corner is the guide's take back: any move of the
  // seat's, at any time, whoever has moved since (POST /api/takeback).
  const guide = guideView();
  const takeback = !frozen() && Boolean(guide && guide.on && guide.takeback);
  const undo = document.getElementById("undo-build");
  undo.title = replaying() ? "Continue from here" : takeback ? "Take back your last move" : "Undo last action";
  undo.setAttribute("aria-label", undo.title);
  // Stepping back, the undo plays on from there instead (play-from).
  showFab("undo-build", takeback || (myTurn && Boolean(state.can_undo)) || playFromHere());
  // Stepping back, a seat's corner is as it stood in play, greyed out and
  // inert: the roll where the seat had a roll to make, else End turn, and a
  // hint at either has its button to stand at.
  const hinted = new Set((replayHint()?.options || []).map((o) => o.action.type));
  const past = replaying() && state.seat !== null && state.seat !== undefined && !state.game_over;
  const pastRoll = past && state.to_move === state.seat && state.phase === "ROLL";
  showFab("roll-dice", offered("ROLL") || hinted.has("ROLL") || pastRoll);
  document.getElementById("roll-dice").disabled = !offered("ROLL");
  // End turn keeps its corner through the other seat's turn, greyed out like
  // the deck, so what is said about it has its button to stand at; the roll
  // takes the corner while the seat has a roll to make.
  const endTurn = document.getElementById("end-turn");
  showFab("end-turn", (!frozen() && !watching() && !state.game_over && !offered("ROLL"))
    || (hinted.has("END_TURN") && !hinted.has("ROLL")) || (past && !pastRoll && !hinted.has("ROLL")));
  endTurn.disabled = !offered("END_TURN");
  const buy = offered("BUY_DEV_CARD");
  showFab("buy-dev-card", buy);
  const deck = document.getElementById("buy-dev-card");
  deck.classList.add("dealt");
  deck.disabled = !buy;
  renderDeck();
}

function showFab(id, on) {
  document.getElementById(id).classList.toggle("show", on);
}

// The development cards left in the deck, on the deck's own corner card.
// Public, so every reader sees it; drawn again after each feed entry that
// plays (advance), so a card bought by another seat leaves the deck as it is
// shown being bought.
function renderDeck() {
  const left = state.dev_cards_remaining ?? 0;
  const deck = document.getElementById("buy-dev-card");
  deck.querySelector(".deck-count").textContent = String(left);
  const says = deck.disabled
    ? `Development cards: ${left} left`
    : `Buy development card (${left} left)`;
  deck.title = says;
  deck.setAttribute("aria-label", says);
}

// The bank's resource cards, one pile a resource along the board's top edge.
// Public, so every reader sees it; the piles are made once and their counts
// written on each render and after each feed entry that plays (advance).
function renderBank() {
  const bank = document.getElementById("bank");
  if (!state.bank) return;
  if (!bank.childElementCount) {
    for (const name of Object.keys(RESOURCE_ICONS)) {
      const pile = resourceCardTile(name, {extraClasses: ["bank-pile"]});
      pile.dataset.resource = name;
      const count = html("span", {class: "bank-count"});
      count.style.color = TERRAIN_ICON_INK[RESOURCE_TERRAIN[name]];
      pile.appendChild(count);
      bank.appendChild(pile);
    }
  }
  bank.classList.add("dealt");
  for (const pile of bank.children) {
    const name = pile.dataset.resource;
    const left = state.bank[name] ?? 0;
    pile.querySelector(".bank-count").textContent = String(left);
    pile.classList.toggle("empty", left === 0);
    pile.title = `Bank: ${left} ${name}`;
  }
}

// The wire action of a given type, or null. Read twice for each corner
// button — once to decide whether to show it, once when it's clicked — which
// is cheaper and harder to get wrong than parking three of them in module
// variables and keeping those in step with what's on screen.
function legalAction(type) {
  return state.legal_actions.find((a) => a.type === type) || null;
}

// --- The modal ---------------------------------------------------------------
//
// One modal, six modes — every decision in the game that isn't a place on the
// board. Three are click-driven and three open themselves; see openModal and
// syncModal below for which is which.

// Modes syncModal owns: each one appears the moment its condition does and
// goes away the moment it stops, so nothing else has to remember to open or
// close it. The other three are opened by a click and only ever closed by one.
const MODAL_AUTO = new Set(["discard", "steal"]);

// Modes Escape and a backdrop click may close. The two left out are the two
// the game is actually waiting on: an offer has to be answered, and cards owed
// to the bank after a seven have to be handed over. "steal" is here because
// closing it only backs out to the hex list, not out of the move.
const MODAL_DISMISSIBLE = new Set(["trade", "monopoly", "year-of-plenty", "steal", "new-game", "pick-bot", "play-from"]);

// One button size everywhere in the modal: a 40px square carrying a glyph
// and nothing else. `label` is the full tooltip/screen-reader sentence — the
// only place the word lives, now that the title row names the state the glyph
// is answering (an X under "Trade Offer" is Cancel, under "Trade Offer
// Received" it is Pass, and a caption saying so was the heading twice).
// `sub` is the one exception, the bank/port square's rate: see bankTradeButton.
function modalActionButton(icon, label, {primary = true, sub = ""} = {}) {
  const classes = ["modal-btn"];
  if (primary) classes.push("primary");
  if (sub) classes.push("with-rate");
  const btn = html("button", {title: label, "aria-label": label, class: classes.join(" ")});
  btn.appendChild(iconSvg(icon));
  if (sub) btn.appendChild(html("span", {class: "modal-btn-cap"}, sub));
  return btn;
}

// The mode's one way out, drawn as a plain glyph at the top right of the
// title row rather than as a button in the action column: an X is the same
// shape in all four trade states and its meaning is the state's, which the
// title already names. Called by every mode that has a way out; a mode that
// doesn't (a forced discard) simply never calls it and the glyph stays
// hidden — see renderModal, which hides it again before each render.
function modalCloseGlyph(label, onClick) {
  const btn = document.getElementById("modal-close");
  btn.hidden = false;
  btn.setAttribute("title", label);
  btn.setAttribute("aria-label", label);
  btn.onclick = onClick;
}

// One card tile — the same visual .card the hand section uses (via
// resourceCardTile), just selectable/dimmable on top of that (see .pick-card
// in the stylesheet). Every mode that picks a resource is built out of these.
// `count` badges only above 1 by default — a bare card already reads as "one"
// everywhere else in the app — but `forceCount` shows it starting at 1 too,
// for the one mode (Year of Plenty) where two single picks of different
// resources would otherwise look identically "just selected".
function pickCard(resourceIdx, {selected, disabled, shortfall, count, forceCount, title, onClick} = {}) {
  const name = board.resources[resourceIdx];
  const classes = ["pick-card"];
  if (selected) classes.push("selected");
  if (disabled) classes.push("disabled");
  if (shortfall) classes.push("shortfall");
  const card = resourceCardTile(name, {extraClasses: classes, title});
  if (count !== undefined && count > (forceCount ? 0 : 1)) {
    card.appendChild(html("div", {class: "count"}, String(count)));
  }
  if (onClick && !disabled) card.addEventListener("click", onClick);
  return card;
}

// The most of one resource this seat can put on the give side: what it holds.
// Nothing else bounds a player trade -- the seat being asked refuses what it
// will not sign -- and a bank sale is bounded by `trade_ratios[r]` (4, or 3,
// or 2 at the right port), which is never more than the hand either. Capping
// the row at three is what used to make bank trades lie: a 4:1 sale drew as
// "1 Wood" and took four. Whichever route the composition ends up taking is
// decided by which button lights up, not by what the row counts to.
function giveCeiling(p, r) {
  return p.hand ? p.hand[board.resources[r]] || 0 : 0;
}

// The composer, and the same one whether an offer is being opened or a
// counter written: give over get with "for" between them, centred across the
// rows' own width rather than the modal's. No YOU GIVE / YOU GET captions —
// two rows in that order, read through the word "for", say it already.
function composerRows(p, {allowAny = false} = {}) {
  const wrap = html("div", {class: "trade-compose"});
  wrap.appendChild(composerRow(p, "give", allowAny));
  wrap.appendChild(html("div", {class: "trade-for"}, "for"));
  wrap.appendChild(composerRow(p, "want", allowAny));
  return wrap;
}

// One side of the trade, editable: all five resources, always, so the row
// doesn't reflow under the cursor between clicks. A tap on a tile adds one of
// that card to this side, up to its ceiling and then no further — it used to
// wrap back to none there, which reads as a misclick rather than as a limit —
// and the "−" under a tile that is in the offer takes one back off. Drawn as
// its own button, not as a tap on the count badge: the badge is a label
// everywhere else in the app, so subtracting through it was a control nobody
// could see. A resource already on the other side is dimmed: the two halves of
// a trade are disjoint (see `round_bundle_from_wire`), as is one the hand
// doesn't hold at all.
function composerRow(p, which, allowAny = false) {
  const mine = which === "give" ? tradeGive : tradeWant;
  const other = which === "give" ? tradeWant : tradeGive;
  const row = html("div", {class: "trade-row"});
  for (let r = 0; r < board.resources.length; r++) {
    const name = board.resources[r];
    const ceiling = which === "give"
      ? giveCeiling(p, r)
      : BANK_RATE * board.resources.length;
    // A give side loaded from someone else's ask (countering) can start
    // above what the hand actually holds — shaded rather than left to a
    // sentence below the rows to explain.
    const held = p.hand ? (p.hand[name] || 0) : 0;
    const shortfall = which === "give" && mine[r] > held;
    const stack = html("div", {class: "pick-stack"});
    stack.appendChild(pickCard(r, {
      selected: mine[r] > 0,
      disabled: other[r] > 0 || ceiling === 0,
      shortfall,
      count: mine[r],
      forceCount: true,
      title: shortfall ? `You only hold ${held} ${name}`
        : mine[r] < ceiling ? `Add a ${name}` : name,
      onClick: () => {
        if (mine[r] < ceiling) { mine[r] += 1; renderModal(); }
      },
    }));
    // Hidden rather than absent when there is nothing to take off, so the
    // tiles above stay on one baseline as counts come and go.
    const minus = html("button", {
      class: mine[r] > 0 ? "pick-minus" : "pick-minus hidden",
      title: `One fewer ${name}`,
      "aria-label": `One fewer ${name}`,
    }, "\u2212");
    minus.addEventListener("click", () => { mine[r] -= 1; renderModal(); });
    stack.appendChild(minus);
    row.appendChild(stack);
  }
  if (allowAny) row.appendChild(anyStack(p, which));
  return row;
}

// The sixth tile of an offer's rows: any cards, on one side at a time. An
// offer holding them is an invitation to counter -- on the give side, name
// the card you want; on the get side, pick the card you give -- and is never
// taken as it stands (see answer_round in hexset.server._webplay).
function anyStack(p, which) {
  const count = which === "give" ? tradeGiveAny : tradeWantAny;
  const otherAny = which === "give" ? tradeWantAny : tradeGiveAny;
  const ceiling = BANK_RATE * board.resources.length;
  const disabled = otherAny > 0;
  const classes = ["pick-card"];
  if (count > 0) classes.push("selected");
  if (disabled) classes.push("disabled");
  const tile = anyCardTile({
    extraClasses: classes,
    title: "Add any card",
  });
  if (count > 0) tile.appendChild(html("div", {class: "count"}, String(count)));
  if (!disabled) {
    tile.addEventListener("click", () => {
      if (count >= ceiling) return;
      if (which === "give") tradeGiveAny += 1; else tradeWantAny += 1;
      renderModal();
    });
  }
  const stack = html("div", {class: "pick-stack"});
  stack.appendChild(tile);
  const minus = html("button", {
    class: count > 0 ? "pick-minus" : "pick-minus hidden",
    title: "One fewer any card", "aria-label": "One fewer any card",
  }, "\u2212");
  minus.addEventListener("click", () => {
    if (which === "give") tradeGiveAny -= 1; else tradeWantAny -= 1;
    renderModal();
  });
  stack.appendChild(minus);
  return stack;
}

// A trade nobody is editing: the cards in it and nothing else, read as
// "[left] for [right]". Whose deal it is comes from the colour pip beside the
// line, and the pip is always the seat *giving* — so left of "for" is what
// that seat hands over, which makes a seat's accept the mirror of the offer it
// answers rather than a repeat of it. `leftShortfall`/`rightShortfall`, if
// given, mark which of that side's resources this seat doesn't hold enough
// of, shaded in place of a sentence explaining the same thing below the row.
// `small` is the 30x40 tile, for a line that shares its row with a swatch and
// a button (a pane row, a quoted offer).
function tradeLine(left, right, {leftShortfall, rightShortfall, small, leftAny = 0, rightAny = 0} = {}) {
  const line = html("div", {class: small ? "trade-line small" : "trade-line"});
  line.appendChild(bundleChips(left, {shortfall: leftShortfall, any: leftAny}));
  line.appendChild(html("span", {class: "trade-arrow"}, "for"));
  line.appendChild(bundleChips(right, {shortfall: rightShortfall, any: rightAny}));
  return line;
}

// `bundleWords`, with a side's any cards: "1 Wood and any 1 card", "any 2 cards".
function bundleWordsAny(counts, anyCount) {
  const words = bundleWords(counts);
  if (!anyCount) return words;
  const extra = `any ${anyCount} card${anyCount === 1 ? "" : "s"}`;
  return words === "nothing" ? extra : `${words} and ${extra}`;
}

// `[2, 0, 0, 0, 1]` -> "2 Wood and 1 Ore"; nothing picked -> "nothing".
function bundleWords(counts) {
  const parts = [];
  for (let r = 0; r < board.resources.length; r++) {
    if (counts[r]) parts.push(`${counts[r]} ${board.resources[r]}`);
  }
  if (!parts.length) return "nothing";
  if (parts.length === 1) return parts[0];
  return `${parts.slice(0, -1).join(", ")} and ${parts[parts.length - 1]}`;
}

function resetComposer() {
  tradeGive = [0, 0, 0, 0, 0];
  tradeWant = [0, 0, 0, 0, 0];
  tradeGiveAny = 0;
  tradeWantAny = 0;
  counterOf = null;
}

// Load the composer from a signed bundle seen from this seat: positive is
// what this seat gets.
function loadComposer(signed) {
  tradeGive = signed.map((n) => Math.max(0, -n));
  tradeWant = signed.map((n) => Math.max(0, n));
  tradeGiveAny = 0;
  tradeWantAny = 0;
}

// The six modes, and what puts each one up:
//   "trade"          clicking a resource card in hand (renderHand)
//   "monopoly"       clicking the Monopoly card in hand (devCardPlay)
//   "year-of-plenty" clicking the Year of Plenty card in hand (devCardPlay)
//   "discard"        cards owed to the bank after a seven (syncModal)
//   "steal"          a robber hex with more than one victim (syncModal)
//   "new-game"       the header's New game button (newGame)
//   "play-from"      the corner's undo at a past position (playFrom)
function openModal(mode, {give = null, seat = null} = {}) {
  modalMode = mode;
  if (mode === "pick-bot") {
    const player = state.players.find((p) => p.seat === seat) || {};
    const closed = (state.locked || []).includes(seat);
    const current = player.bot || (closed ? CLOSE_SEAT : "");
    pickBot = {seat, model: current, was: current};
  }
  if (mode === "new-game") {
    // Every open starts from what the server deals when told nothing.
    newGameBoard = "spiral";
    newGameDuel = false;
  } else if (mode === "trade") {
    // `give` is the resource clicked in the hand (see renderHand()), one of it.
    resetComposer();
    if (give !== null) tradeGive[give] = 1;
  } else if (mode === "year-of-plenty") {
    yopPicks = [];
  } else if (mode === "monopoly") {
    monopolyPick = null;
  }
  document.getElementById("modal").classList.add("show");
  // The bot picker has its own, wider layout (#modal-inner.pick).
  document.getElementById("modal-inner").classList.toggle("pick", mode === "pick-bot");
  // See the CSS comment on #undo-build.reach-modal: every other mode leaves
  // the corner button behind the backdrop like any other board control, only
  // "steal" needs it reaching through.
  document.getElementById("undo-build").classList.toggle("reach-modal", mode === "steal");
  renderModal();
  // After renderModal, not before: the clamp measures the box, and what the
  // mode just drew is what decides its height.
  applyModalDrag();
}

function closeModal() {
  // Closing the victim list is backing out to the hex list, not out of the
  // move: the board's highlights were never cleared to get here, so dropping
  // the pending hex is the whole undo — and it's also what stops syncModal
  // from putting the same list straight back up on the next render.
  if (modalMode === "steal") pendingRobberHex = null;
  modalMode = null;
  document.getElementById("modal").classList.remove("show");
  document.getElementById("modal-inner").classList.remove("pick");
  document.getElementById("undo-build").classList.remove("reach-modal");
}

// Called every render(). The three MODAL_AUTO modes are conditions rather
// than clicks — an offer is waiting, cards are owed, a hex with more than one
// neighbour has been picked — so this is the single place that decides which
// of them (if any) should be up, and closes whichever no longer should be.
// The click-driven three are left alone entirely.
function syncModal() {
  const g = groupActions(state.legal_actions);
  const live = g.discard.length ? "discard"
    : pendingRobberHex !== null ? "steal"
    : null;
  if (live) {
    if (modalMode !== live) openModal(live);
    else renderModal();
  } else if (MODAL_AUTO.has(modalMode)) {
    closeModal();
  } else if (modalMode === null && ((state.pending || []).length || state.trade_round)) {
    // An offer to answer, or this seat's own round still open (a reload
    // mid-negotiation) -- put the trade modal up on its own.
    openModal("trade");
  } else if (modalMode === "trade") {
    // Keep offers and answers current across every poll without resetting
    // what is mid-composition -- and close once there is nothing left to
    // show: the offer answered, the round over, the turn moved on.
    const myTurn = state.phase === "MAIN" && state.to_move === state.seat;
    if (!(state.pending || []).length && !state.trade_round && !myTurn) closeModal();
    else renderModal();
  }
}

function renderModal() {
  const title = document.getElementById("modal-title");
  const body = document.getElementById("modal-body");
  const actions = document.getElementById("modal-actions");
  body.innerHTML = "";
  actions.innerHTML = "";
  // Hidden by default and put back by whichever mode has a way out (see
  // modalCloseGlyph), so a mode that doesn't need to say anything about it
  // doesn't have to.
  const close = document.getElementById("modal-close");
  close.hidden = true;
  close.onclick = null;
  // The guide's Hint, for the one window that has it (renderDiscardMode).
  document.getElementById("modal-hint").hidden = true;

  // The one mode about no game in particular, so it reads nothing off
  // `state`, which a page that could not deal or find one does not have.
  if (modalMode === "new-game") renderNewGameMode(title, body, actions);
  else if (modalMode === "play-from") renderPlayFromMode(title, body);
  else {
    const g = groupActions(state.legal_actions);
    if (modalMode === "discard") renderDiscardMode(g, title, body, actions);
    else if (modalMode === "steal") renderStealMode(g, title, body);
    else if (modalMode === "monopoly") renderMonopolyMode(g, title, body, actions);
    else if (modalMode === "year-of-plenty") renderYearOfPlentyMode(g, title, body, actions);
    else if (modalMode === "pick-bot") renderPickBotMode(title, body);
    else renderTradeMode(title, body, actions);
  }

  // A forced discard, an acceptance pane and a counter being written all
  // have nothing to put in the button column, and an empty gutter reads as a
  // button that failed to render rather than as no button at all.
  actions.style.display = actions.children.length ? "" : "none";
}

// The cards to give are picked here and sent together on Confirm: a tap on a
// card adds one of it, the "−" under it takes one back, and Confirm stands
// once the pick holds as many as are owed. The engine takes a discard a card
// at a time (`legal_actions` under Phase.DISCARD), so Confirm sends them one
// after another (`sendDiscard`). With the guide's take back offered, the
// window has its own Take back under Confirm: the board's corner button is
// behind the window.
//
// With the guide on, its Hint is in the window's heading, and the hint lists
// the guide's whole discards under the cards, one a line: a tap on a line's
// bubble opens its card (what the grade means and why), a tap on its cards
// picks that discard.
let discardPick = null;      // cards picked, by resource; reset when the hand or the quota moves
let discardPickKey = null;
let discardCardOpen = null;  // the hint line whose card is open, by its cards
function renderDiscardMode(g, title, body, actions) {
  const owed = state.discard_quota[state.seat];
  const p = state.players.find((pl) => pl.seat === state.seat);
  const key = JSON.stringify([state.seat, owed, p.hand]);
  if (key !== discardPickKey || !discardPick) {
    discardPick = board.resources.map(() => 0);
    discardPickKey = key;
    discardCardOpen = null;
  }
  const picked = discardPick.reduce((t, n) => t + n, 0);
  title.textContent = `Discard ${owed} card${owed === 1 ? "" : "s"}`;
  body.appendChild(html("div", {class: "modal-note"},
    `Half your hand, rounded down. Pick ${owed}, then confirm.`));
  const guide = guideView();
  const on = Boolean(guide && guide.offered && guide.on && guideWanted()) && !frozen();
  const hintButton = document.getElementById("modal-hint");
  hintButton.hidden = !on;
  hintButton.disabled = !on || guide.reading !== "ready";
  hintButton.classList.toggle("thinking", on && guide.reading === "pending");
  hintButton.title = on && guide.reading === "pending" ? "Thinking..." : "Hint";
  const hint = on && discardHint(guide.hint) && !guideDismissed.has(hintKeyOf(guide.hint)) ? guide.hint : null;
  const byResource = {};
  for (const a of g.discard) byResource[a.a] = a;
  const row = html("div", {class: "trade-row discard-row"});
  for (let r = 0; r < board.resources.length; r++) {
    const name = board.resources[r];
    const held = p.hand[name] || 0;
    const n = discardPick[r];
    // All five, with the ones the hand doesn't hold dimmed rather than
    // dropped, so the row keeps its shape. The count is the hand's; the tag
    // over a card how many of it are picked.
    const stack = html("div", {class: "pick-stack"});
    const card = pickCard(r, {
      selected: n > 0, count: held, disabled: !byResource[r],
      title: n < held ? `Discard a ${name}` : name,
      onClick: () => {
        if (discardPick[r] < held && discardPick.reduce((t, x) => t + x, 0) < owed) { discardPick[r] += 1; renderModal(); }
      },
    });
    card.dataset.resource = r;
    if (n) card.appendChild(html("div", {class: "pick-give"}, `−${n}`));
    stack.appendChild(card);
    const minus = html("button", {class: n > 0 ? "pick-minus" : "pick-minus hidden",
      title: `One fewer ${name}`, "aria-label": `One fewer ${name}`}, "\u2212");
    minus.addEventListener("click", () => { if (discardPick[r] > 0) { discardPick[r] -= 1; renderModal(); } });
    stack.appendChild(minus);
    row.appendChild(stack);
  }
  body.appendChild(row);
  if (hint) body.appendChild(discardHintCard(hint));
  const confirm = modalActionButton("check", picked === owed ? "Confirm" : `Pick ${owed - picked} more`);
  confirm.disabled = picked !== owed;
  confirm.addEventListener("click", () => {
    if (discardPick.reduce((t, x) => t + x, 0) !== owed) return;
    sendDiscard(discardPick.slice(), byResource);
  });
  actions.appendChild(confirm);
  if (on && guide.takeback) {
    const back = html("button", {class: "modal-btn", title: "Take back your last move", "aria-label": "Take back your last move"});
    back.appendChild(el("svg", {viewBox: "0 0 24 24"}, el("use", {href: "#icon-undo"})));
    back.addEventListener("click", () => { guideOpenNote = null; guidePost("/api/takeback"); });
    actions.appendChild(back);
  }
}

// The picked discard to the engine, a card at a time (it takes no other
// form), then the view after the last card. A card refused stops it there:
// the window comes back with what is still owed.
function sendDiscard(cards, byResource) {
  return blocking(async () => {
    pendingRobberHex = null;
    let last = null;
    // The hand as it stood, for the cards lost (polls may land between cards).
    const before = state.players;
    for (let r = 0; r < cards.length; r++) {
      for (let k = 0; k < cards[r]; k++) {
        const {ok, data} = await postJSON("/api/action", {action: byResource[r]});
        if (!ok) {
          showNotice(data.error || "That was not legal.");
          if (last) { takeView(last, {own: true}); settle(); } else render();
          return;
        }
        last = data;
      }
    }
    showNotice("");
    if (last) {
      takeView(last, {own: true});
      // However the view lands (drawn at once or jumped to), the cards given
      // are marked lost.
      noteLost({kind: "discard", actor: state.seat}, before);
      renderHand();
      settle();
    }
  });
}

// The discard hint under the picker: each of the guide's whole discards on
// a line, its grade's bubble and its cards. A tap on the bubble opens the
// line's card under it, as a bubble on the board opens its card, with its
// review flag; a tap on the cards picks that discard. The line matching the
// pick stands out.
function discardHintCard(hint) {
  const box = html("div", {class: "discard-hint"});
  const step = guideView().step;
  hint.options.forEach((o, i) => {
    const cardsKey = JSON.stringify(o.action.cards);
    const line = html("div", {class: `discard-hint-row${cardsKey === JSON.stringify(discardPick) ? " on" : ""}`});
    const bubble = html("span", {class: `guide-bubble hint ${o.class}`, role: "button", tabindex: "0",
      title: "What the guide says"});
    bubble.innerHTML = `<span class="guide-class ${o.class}">${GUIDE_BUBBLE_WORDS[o.class]}</span>`;
    bubble.addEventListener("click", (event) => {
      event.stopPropagation();
      discardCardOpen = discardCardOpen === cardsKey ? null : cardsKey;
      renderModal();
    });
    line.appendChild(bubble);
    // The cards it gives as their glyphs with counts, on one line.
    const cards = html("span", {class: "discard-hint-cards", role: "button", tabindex: "0",
      title: `Pick ${discardWords(o.action.cards)}`});
    o.action.cards.forEach((n, r) => {
      if (!n) return;
      const one = html("span", {class: "discard-hint-card"}, `${n}`);
      one.appendChild(logGlyph(board.resources[r]));
      cards.appendChild(one);
    });
    cards.addEventListener("click", () => { discardPick = o.action.cards.slice(); renderModal(); });
    line.appendChild(cards);
    box.appendChild(line);
    if (discardCardOpen !== cardsKey) return;
    const card = html("div", {class: `guide-bubble hint open ${o.class}`});
    const line_ = (text) => (text ? `<div class="guide-card-line">${escapeText(text)}</div>` : "");
    const meaning = GUIDE_MEANING[o.class] || "";
    const why = hintWhy(hint, [i]);
    card.innerHTML = `<div class="guide-card-move"><span class="guide-class ${o.class}">${GUIDE_CARD_WORDS[o.class]}</span> → ` +
      `${escapeText(shortMove(o.action))}</div>` +
      (hint.forced ? line_(GUIDE_MEANING.forced)
        : line_([meaning, why].filter(Boolean).join(" ")) +
          (o.class === "brilliant" ? chanceLine(o.lead, o.bound, o.objective ? o : hint) : ""));
    flagCard(card, {card: `hint:${step}:${JSON.stringify(o.action)}`, of: "hint", id: hint.id, step,
                    grade: o.class, played: null, best: hint.move});
    box.appendChild(card);
  });
  return box;
}

// The second half of a robber move: the hex is already picked (it's the one
// still highlighted behind this), and this is who to rob on it. Seats, not
// resources, so plain buttons with the player list's own colour swatch.
function renderStealMode(g, title, body) {
  const move = robberMove(g);
  const options = (move && move.targets[pendingRobberHex]) || [];
  title.textContent = "Steal from";
  modalCloseGlyph("Back to the hexes", closeModal);
  const row = html("div", {class: "steal-row"});
  for (const a of options) {
    const btn = html("button", {class: "steal-option"});
    if (a.b < state.players.length) {
      const swatch = html("div", {class: "swatch"});
      swatch.style.background = SEAT_COLORS[a.b].fill;
      swatch.style.borderColor = SEAT_COLORS[a.b].stroke;
      btn.appendChild(swatch);
      btn.appendChild(document.createTextNode(seatFullLabel(a.b)));
    } else {
      btn.appendChild(document.createTextNode("Nobody"));
    }
    btn.addEventListener("click", () => { closeModal(); sendAction(a); });
    row.appendChild(btn);
  }
  body.appendChild(row);
}

// One tap picks, same as Monopoly's own single choice; a second, separate
// tap on Confirm is what actually sends it — picking alone doesn't commit,
// matching Year of Plenty (renderYearOfPlentyMode) so every dev card that
// takes cards from other players gets a chance to back out first.
// What the next table is dealt as. Duel is the duel variant
// (hexset.rules.DUEL_VARIANT_GAME), played at two seats, so the server deals
// it with the other two closed for good; Standard is dealt at four seats.
// Either way the playing seats can still be closed before the first move,
// down to one person practising alone.
// The fork's confirmation: a new game from the position shown, this one
// left as it is. Its answers are words, Cancel and Continue, as the choice
// is one to read before it is made.
function renderPlayFromMode(title, body) {
  title.textContent = "Continue from here";
  body.appendChild(html("div", {class: "modal-note"},
    "Play the game again from this point with new cards and dice."));
  const foot = html("div", {class: "play-from-foot"});
  const cancel = html("button", {type: "button", id: "play-from-cancel"}, "Cancel");
  cancel.addEventListener("click", closeModal);
  const go = html("button", {type: "button", id: "play-from-go", class: "primary"}, "Continue");
  go.addEventListener("click", playFrom);
  foot.append(cancel, go);
  body.appendChild(foot);
}

function renderNewGameMode(title, body, actions) {
  title.textContent = "New game";
  // With no table behind the page (the front door) there is nothing to go
  // back to, so the modal has no way out but Deal.
  if (state) modalCloseGlyph("Cancel", closeModal);
  body.appendChild(choiceGroup("Board", "board", [["spiral", "Spiral"], ["random", "Random"]],
    newGameBoard, (value) => { newGameBoard = value; renderModal(); }));
  body.appendChild(choiceGroup("Rules", "duel", [[false, "Standard"], [true, "Duel"]],
    newGameDuel, (value) => { newGameDuel = value; renderModal(); }));
  const deal = modalActionButton("check", "Deal");
  deal.id = "deal-new-game";
  deal.addEventListener("click", dealNewGame);
  actions.appendChild(deal);
}

// One seat's bot: a card per bot this game type offers (its name, version and
// description, `GET /api/models`), the one seated marked. Tapping a card
// seats that bot; before the first move the foot can leave the seat open or
// close it instead.
function renderPickBotMode(title, body) {
  const {seat, was} = pickBot;
  title.textContent = `${colorName(seat)} seat`;
  modalCloseGlyph("Cancel", closeModal);
  const entries = modelsByType[state.game_type] || {};
  const names = Object.keys(entries);
  if (was && was !== CLOSE_SEAT && !names.includes(was)) names.push(was);
  names.sort((a, b) => a.localeCompare(b));
  const list = html("div", {class: "bot-cards"});
  for (const name of names) {
    const info = entries[name] || {};
    const seated = was === name;
    const card = html("button", {
      type: "button", class: `bot-card${seated ? " seated" : ""}`, "data-model": name,
      "aria-pressed": String(seated),
    });
    const head = html("div", {class: "bot-card-head"});
    const nameNode = html("b", {class: "bot-card-name"});
    nameNode.textContent = info.label || name;
    head.appendChild(nameNode);
    if (info.version) {
      const version = html("span", {class: "bot-card-version"});
      version.textContent = info.version;
      head.appendChild(version);
    }
    if (seated) head.appendChild(html("span", {class: "bot-card-seated"}, "Seated"));
    card.appendChild(head);
    // A preset's registered description; a model file's is not served.
    if (info.description) {
      const about = html("div", {class: "bot-card-about"});
      about.textContent = info.description;
      card.appendChild(about);
    }
    card.addEventListener("click", () => chooseBot(name));
    list.appendChild(card);
  }
  body.appendChild(list);
  if (!state.started && !(state.fixed_seats || []).includes(seat)) {
    const foot = html("div", {class: "bot-pick-foot"});
    for (const [value, text] of [["", "Leave open"], [CLOSE_SEAT, "Close seat"]]) {
      const on = was === value;
      const btn = html("button", {
        type: "button", "data-choice": "seat", "data-value": value, "aria-pressed": String(on),
        class: on ? "chosen" : "",
      }, text);
      btn.addEventListener("click", () => chooseBot(value));
      foot.appendChild(btn);
    }
    body.appendChild(foot);
  }
}

// The pick shows on its row at once, dimmed, while the server seats it: the
// first seat of a model can wait on it loading. A refusal puts the row back.
async function chooseBot(model) {
  const {seat, was} = pickBot;
  closeModal();
  if (model === was) return;
  pendingSeat = {seat, label: model === CLOSE_SEAT ? "(closed)" : model ? botLabel(model) : "(empty)"};
  render();
  try {
    if (model === CLOSE_SEAT) await closeSeat(seat);
    else if (model === "") await reopenSeat(seat);
    else await swapBot(seat, model);
  } finally {
    pendingSeat = null;
    render();
  }
}

// A caption over one button per option, the chosen one pressed. `key` names
// the group for whoever reads the buttons back (data-choice).
function choiceGroup(label, key, options, chosen, onPick) {
  const group = html("div", {class: "choice-group"});
  group.appendChild(html("div", {class: "choice-label"}, label));
  const row = html("div", {class: "choice-row", role: "group", "aria-label": label});
  for (const [value, text] of options) {
    const on = value === chosen;
    const btn = html("button", {
      class: on ? "primary" : "", "aria-pressed": String(on),
      "data-choice": key, "data-value": String(value),
    }, text);
