      if (shown) shown.remove();
    }
  }, PLAY_MS.badge + 20);
}

function clearBadges() {
  rowBadges.clear();
  for (const node of document.querySelectorAll("#players .row-badge")) node.remove();
}

function attachBadge(row, seat) {
  const entry = rowBadges.get(seat);
  const old = row.querySelector(".row-badge");
  if (old) old.remove();
  if (!entry || entry.until <= performance.now()) return;
  // Inside the name's cell, so it ends where the numbers begin.
  const cell = row.querySelector(".player-name") || row;
  const badge = html("div", {class: "row-badge"});
  for (const {card, n} of entry.items) {
    const item = html("span", {class: `badge-item ${n > 0 ? "gain" : "loss"}`});
    item.appendChild(html("b", {}, `${n > 0 ? "+" : "−"}${Math.abs(n)}`));
    if (card === "dev") {
      const tile = html("div", {class: "card badge-card dev"});
      tile.appendChild(iconSvg("dev-card"));
      item.appendChild(tile);
    } else if (card) {
      item.appendChild(resourceCardTile(card, {extraClasses: ["badge-card"], title: card}));
    } else {
      item.appendChild(html("div", {class: "card badge-card unknown", title: "A card"}, "?"));
    }
    badge.appendChild(item);
  }
  cell.appendChild(badge);
}

// Signed counts by resource name (or null), per seat, to badges.
function badgeTally() {
  const out = new Map();
  return {
    add(seat, card, n) {
      if (!out.has(seat)) out.set(seat, new Map());
      const m = out.get(seat);
      m.set(card, (m.get(card) || 0) + n);
    },
    show() {
      for (const [seat, m] of out) showBadge(seat, [...m].map(([card, n]) => ({card, n})));
    },
  };
}

function tradeBadges(trade) {
  const t = badgeTally();
  for (const name of cardsOf(trade.gave)) { t.add(trade.a, name, -1); t.add(trade.b, name, 1); }
  for (const name of cardsOf(trade.got)) { t.add(trade.b, name, -1); t.add(trade.a, name, 1); }
  t.show();
}

// `trades` false leaves the exchanges cleared with the entry to the caller.
function badgesFor(e, {trades = true} = {}) {
  const t = badgeTally();
  const gains = (g) => {
    for (const [seat, counts] of Object.entries(g || {})) {
      for (const name of cardsOf(counts)) t.add(Number(seat), name, 1);
    }
  };
  switch (e.kind) {
    case "roll": gains(e.gains); break;
    case "build": gains(e.gains); break;
    case "buy": t.add(e.actor, "dev", 1); break;
    case "play":
      if (e.card === "Monopoly") {
        let total = 0;
        for (const [seat, n] of Object.entries(e.taken || {})) { t.add(Number(seat), e.resource, -n); total += n; }
        t.add(e.actor, e.resource, total);
      } else if (e.card === "Year Of Plenty") {
        for (const name of e.resources || []) t.add(e.actor, name, 1);
      }
      break;
    case "robber":
      if (e.stole) { t.add(e.victim, e.card || null, -1); t.add(e.actor, e.card || null, 1); }
      break;
    case "bank":
      for (const name of cardsOf(e.gave)) t.add(e.actor, name, -1);
      for (const name of cardsOf(e.got)) t.add(e.actor, name, 1);
      break;
    case "discard":
      for (const card of e.cards) t.add(e.actor, card || null, -1);
      break;
    default: break;
  }
  t.show();
  if (trades) for (const trade of e.trades || []) tradeBadges(trade);
}

// --- What moves on the board

const DIE_PIPS = {
  1: [[50, 50]], 2: [[28, 28], [72, 72]], 3: [[26, 26], [50, 50], [74, 74]],
  4: [[28, 28], [72, 28], [28, 72], [72, 72]],
  5: [[26, 26], [74, 26], [50, 50], [26, 74], [74, 74]],
  6: [[28, 24], [72, 24], [28, 50], [72, 50], [28, 76], [72, 76]],
};

function drawDie(node, face) {
  node.innerHTML = "";
  const svg = el("svg", {viewBox: "0 0 100 100"});
  for (const [cx, cy] of DIE_PIPS[face]) svg.appendChild(el("circle", {cx, cy, r: 9, fill: "#2b2118"}));
  node.appendChild(svg);
}

// The two faces of a total: the feed says only the sum.
function splitRoll(total) {
  const low = Math.max(1, total - 6), high = Math.min(6, total - 1);
  const first = low + Math.floor(Math.random() * (high - low + 1));
  return [first, total - first];
}

// The dice, then what they produced and what each seat collected. `before`
// is the position the roll was made in, for where the robber stood.
async function playRoll(e, before) {
  const tray = document.getElementById("dice-tray");
  const dice = [...tray.querySelectorAll(".die")];
  const faces = splitRoll(e.value);
  tray.hidden = false;
  sound("roll");
  if (!REDUCED_MOTION && !anim.skip) {
    const spins = dice.map((d, i) => d.animate([
      {transform: "translateY(-30px) rotate(0deg)"},
      {transform: "translateY(4px) rotate(400deg)", offset: 0.7},
      {transform: "translateY(0) rotate(360deg)"},
    ], {duration: PLAY_MS.dice, easing: "ease-out", delay: i * 40}));
    const shuffle = setInterval(() => dice.forEach((d) => drawDie(d, 1 + Math.floor(Math.random() * 6))), 70);
    // The faces shuffle only while the dice are in the air: they land at
    // 70% of the spin (its keyframes), and settle on their own faces there.
    const landed = Promise.all(spins.map(track));
    await pause(PLAY_MS.dice * 0.7);
    clearInterval(shuffle);
    dice.forEach((d, i) => drawDie(d, faces[i]));
    await landed;
  }
  dice.forEach((d, i) => drawDie(d, faces[i]));
  await pause(PLAY_MS.settle);
  // The dice leave the board for the roller's row while it shows what they
  // produced, so they cover no number that lights.
  const left = diceLeave(tray, e.actor);
  if (e.value !== 7) await playProduction(e.value, before || state, e.gains);
  await left;
}

// The dice cross from the middle of the board to `seat`'s row, shrinking
// into its last-roll number. With reduced motion, or no row to go to, they
// only go.
function diceLeave(tray, seat) {
  const from = tray.getBoundingClientRect();
  const row = seatRow(seat);
  const to = row ? (row.querySelector(".stat.roll") || row).getBoundingClientRect() : null;
  tray.hidden = true;
  if (REDUCED_MOTION || anim.skip || !to || !to.width || !from.width) return Promise.resolve();
  const ghost = html("div", {class: "dice-ghost"});
  for (const die of tray.children) ghost.appendChild(die.cloneNode(true));
  document.getElementById("fly-layer").appendChild(ghost);
  // A row with no roll yet takes them at its right end, where the number will be.
  const x = row.querySelector(".stat.roll") ? to.left + to.width / 2 : to.right - 14;
  const y = to.top + to.height / 2;
  const at = (px, py, scale) => `translate(${px}px, ${py}px) scale(${scale})`;
  return track(ghost.animate([
    {transform: at(from.left, from.top, 1), opacity: 1},
    {transform: at(x - from.width / 2, y - from.height / 2, 0.3), opacity: 0.2},
  ], {duration: PLAY_MS.fly, easing: "ease-out", fill: "both"})).then(() => ghost.remove());
}

// The resource a terrain's hexes yield.
const TERRAIN_RESOURCE = Object.fromEntries(Object.entries(RESOURCE_TERRAIN).map(([name, terrain]) => [terrain, name]));

// What a roll produced, shown where it came from. Every hex with the rolled
// number lights gold and its number jumps; each building on it that collects
// rings in its seat's colour and sends its cards to that seat's row, one for
// a settlement and two for a city. The hex under the robber, which produces
// nothing, rings red at the robber instead. `position` is the view the roll
// was made in. `gains` is the roll's own account of what each seat
// collected, and no seat is shown more of a resource than it says: a
// resource the bank ran short of sends nothing.
function playProduction(value, position, gains) {
  const layer = animLayer();
  const owed = new Map();  // "seat/resource" -> cards not yet shown
  for (const [seat, counts] of Object.entries(gains || {})) {
    for (const name of cardsOf(counts)) owed.set(`${seat}/${name}`, (owed.get(`${seat}/${name}`) || 0) + 1);
  }
  const playing = [];
  let produced = false, flights = 0;
  for (const h of board.hexes) {
    if (h.token !== value) continue;
    if (h.id === position.robber) {
      const spot = robberSpot(h);
      playing.push(flare(layer, el("circle", {cx: spot.x, cy: spot.y, r: 40, fill: "url(#light-red)", class: "roll-light"}),
        spot, [[0.5, 0], [1, 1], [1.1, 0]]));
      playing.push(flare(layer, ringAt(spot, 19, "#ff4d4d", "#5a0b0b"), spot, [[1, 1], [2, 0]]));
      continue;
    }
    produced = true;
    playing.push(flare(layer, el("circle", {cx: h.x, cy: h.y, r: 50, fill: "url(#light-gold)", class: "roll-light"}),
      h, [[0.5, 0], [1, 1], [1.08, 0]]));
    playing.push(flare(layer, ringAt(h, 15, "#ffd75a", "#6b4a00"), h, [[1, 1], [2.6, 0]]));
    const token = document.getElementById(`hex-token-${h.id}`);
    if (token && !REDUCED_MOTION) {
      playing.push(track(token.animate(scaledAbout(h, [[1, 1], [1.3, 1], [1, 1]]),
        {duration: PLAY_MS.flash * 0.7, easing: "ease-out"})));
    }
    const resource = TERRAIN_RESOURCE[h.terrain];
    for (const vid of h.vertex_ids) {
      const seat = position.vertex_owner[vid];
      const key = `${seat}/${resource}`;
      const cards = Math.min(position.vertex_building[vid], owed.get(key) || 0);
      if (seat < 0 || cards <= 0) continue;
      owed.set(key, owed.get(key) - cards);
      const v = vertexById[vid];
      playing.push(flare(layer, ringAt(v, 13, SEAT_COLORS[seat].fill, SEAT_COLORS[seat].stroke), v, [[1, 1], [2.2, 0]]));
      for (let i = 0; i < cards; i++) playing.push(flyCard(resource, h, seat, flights++));
    }
  }
  if (produced) sound("produce");
  return Promise.all(playing);
}

// A ring of radius `r` about a board point: `color` over a wider, darker
// casing, so it shows on a tile of its own colour.
function ringAt(at, r, color, casing) {
  return el("g", {class: "roll-ring"},
    el("circle", {cx: at.x, cy: at.y, r, stroke: casing, "stroke-width": 5, opacity: 0.55}),
    el("circle", {cx: at.x, cy: at.y, r, stroke: color, "stroke-width": 3}));
}

// Keyframes that take a board node through `steps`, [scale, opacity] pairs
// evenly spaced, scaled about the board point `at`.
function scaledAbout(at, steps) {
  return steps.map(([scale, opacity]) => ({
    opacity,
    transform: `translate(${at.x}px, ${at.y}px) scale(${scale}) translate(${-at.x}px, ${-at.y}px)`,
  }));
}

// Adds `node` to `layer`, plays it through `steps` (scaledAbout) and removes
// it. With reduced motion it keeps its size and only fades.
function flare(layer, node, at, steps) {
  layer.appendChild(node);
  const frames = scaledAbout(at, REDUCED_MOTION ? steps.map(([, opacity]) => [1, opacity]) : steps);
  return track(node.animate(frames, {duration: PLAY_MS.flash, easing: "ease-out", fill: "both"}))
    .then(() => node.remove());
}

// One card from a hex to `seat`'s row, along an arc, the `order`-th of its
// roll. Nothing crosses with reduced motion, or where the row is not on
// screen: the row's badge says what the seat collected either way.
function flyCard(name, hex, seat, order) {
  const row = seatRow(seat);
  const start = onScreen(hex);
  if (REDUCED_MOTION || anim.skip || !row || !start) return Promise.resolve();
  const to = (row.querySelector(".stat.cards") || row).getBoundingClientRect();
  if (!to.width) return Promise.resolve();
  const end = {x: to.left + to.width / 2, y: to.top + to.height / 2};
  const rise = Math.min(70, Math.hypot(end.x - start.x, end.y - start.y) * 0.22);
  const bend = {x: (start.x + end.x) / 2, y: Math.min(start.y, end.y) - rise};
  const card = resourceCardTile(name, {extraClasses: ["fly-card"], title: ""});
  document.getElementById("fly-layer").appendChild(card);
  // The card's middle rides the curve: 11 and 15 are half its width and height.
  const frames = [];
  for (let i = 0; i <= 10; i++) {
    const t = i / 10, u = 1 - t;
    const x = u * u * start.x + 2 * u * t * bend.x + t * t * end.x;
    const y = u * u * start.y + 2 * u * t * bend.y + t * t * end.y;
    const scale = t < 0.2 ? 0.5 + 2.5 * t : 1 - 0.5 * Math.max(0, t - 0.6) / 0.4;
    frames.push({transform: `translate(${x - 11}px, ${y - 15}px) scale(${scale})`, opacity: t === 0 ? 0 : t === 1 ? 0.3 : 1});
  }
  return track(card.animate(frames, {
    duration: PLAY_MS.fly, delay: order * PLAY_MS.stagger, easing: "ease-in-out", fill: "both",
  })).then(() => card.remove());
}

async function playBuild(e) {
  const color = SEAT_COLORS[e.actor];
  // A road drops in under the buildings, as it lies once it is built.
  const layer = e.piece === "road" ? document.getElementById("road-anim-layer") : animLayer();
  let node, cx, cy;
  if (e.piece === "road") {
    const edge = board.edges[e.at];
    if (!edge) return;
    const p0 = vertexById[edge.v0], p1 = vertexById[edge.v1];
    const gapAt = roadEndGaps({id: edge.id, owner: e.actor});
    const lines = roadLines({v0: p0, v1: p1, gap0: gapAt(edge, edge.v0), gap1: gapAt(edge, edge.v1)}, color);
    node = el("g", {class: "anim-piece"},
      el("g", {class: "road-casts"}, lines.cast), lines.casing, lines.fill, lines.shade, lines.light);
    cx = (p0.x + p1.x) / 2; cy = (p0.y + p1.y) / 2;
  } else {
    const v = vertexById[e.at];
    if (!v) return;
    cx = v.x; cy = v.y;
    node = buildingPiece(v, e.piece === "city", color);
    node.setAttribute("class", "anim-piece");
  }
  const wrap = el("g", {});
  wrap.appendChild(node);
  layer.appendChild(wrap);
  sound(e.piece);
  const frames = REDUCED_MOTION
    ? [{opacity: 0}, {opacity: 1}]
    : [
        {opacity: 0, transform: `translate(${cx}px, ${cy - 26}px) scale(1.5) translate(${-cx}px, ${-cy}px)`},
        {opacity: 1, transform: `translate(${cx}px, ${cy}px) scale(0.95) translate(${-cx}px, ${-cy}px)`, offset: 0.75},
        {opacity: 1, transform: "none"},
      ];
  await track(wrap.animate(frames, {duration: PLAY_MS.drop, easing: "ease-in", fill: "both"}));
  // The board draws the piece itself from here (advance).
  wrap.remove();
}

async function playRobber(e) {
  const robber = document.querySelector("#robber-layer .robber");
  const target = hexById[e.hex];
  robberSound(e);
  // The number it stood beside counts again from the moment it leaves.
  markBlocked(null);
  if (robber && target && !REDUCED_MOTION) {
    const fromX = Number(robber.getAttribute("x")) + ROBBER_SIZE / 2;
    const fromY = Number(robber.getAttribute("y")) + ROBBER_SIZE / 2;
    const spot = robberSpot(target);
    const dx = spot.x - fromX, dy = spot.y - fromY;
    await track(robber.animate([
      {transform: "translate(0, 0)"},
      {transform: `translate(${dx / 2}px, ${dy / 2 - 30}px)`, offset: 0.5},
      {transform: `translate(${dx}px, ${dy}px)`},
    ], {duration: PLAY_MS.robber, easing: "ease-in-out", fill: "forwards"}));
  } else {
    await pause(PLAY_MS.robber);
  }
  if (target) markBlocked(target.id);
}

// A click on the board while a turn is playing finishes it at once, and does
// nothing else: the controls under it belong to the board as it was. The
// corner toggles (#table-controls) are this browser's settings, not the
// board's, and work while it plays.
document.getElementById("board-pane").addEventListener("click", (event) => {
  if (!anim.running || event.target.closest("#table-controls")) return;
  event.stopPropagation();
  event.preventDefault();
  anim.skip = true;
  finishAll();
}, true);

// --- Sound
//
// Recorded clips (`static/sounds`, CC0), loaded once a browser turns sound
// on and measured as they load (`clipLoudness`), so each kind of action plays
// at its own level whatever the recording. A kind with several takes never
// plays the same one twice running.

// `level` is how loud a kind of action sounds, against the dice at 1: what
// comes up most is quietest. A piece, the robber and a card's handling each
// have one take, a single hit, so each always sounds the same and like
// nothing else: the road a bright tick, the settlement a dull clack, the city
// a clack between them in tone, pitched down to sound heavier.
const SOUNDS = {
  roll: {files: ["dice-throw-1", "dice-throw-2", "dice-throw-3"], level: 1},
  produce: {files: ["card-slide-1", "card-slide-3", "card-slide-8"], level: 0.45},
  road: {files: ["chip-lay-1"], level: 0.7},
  settlement: {files: ["chip-lay-3"], level: 0.8},
  city: {files: ["chips-stack-3"], level: 0.8, rate: 0.75},
  robber: {files: ["die-throw-4"], level: 0.8, rate: 0.72},
  steal: {files: ["card-shove-1"], level: 0.6},
  buy: {files: ["cards-pack-take-out-2"], level: 0.5},
  play: {files: ["cards-pack-open-2"], level: 0.5},
  bank: {files: ["chips-collide-2", "chips-collide-4"], level: 0.5},
  trade: {files: ["card-place-1", "card-place-2", "card-place-3", "card-place-4"], level: 0.5},
  discard: {files: ["card-fan-1"], level: 0.5},
  end: {files: ["dice-grab-1", "dice-grab-2"], level: 0.4},
  win: {files: ["jingles_PIZZI10"], level: 0.9},
  lose: {files: ["jingles_PIZZI07"], level: 0.9},
};

// The gain that plays a clip of loudness 1 (`clipLoudness`) as loud as the
// dice should be.
const SOUND_REFERENCE = 0.026;

let audio = null;
let soundsLoading = null;
const soundBuffers = new Map();  // file -> AudioBuffer
const soundLoudness = new Map(); // file -> clipLoudness
const lastTake = new Map();      // kind -> the file played last

function soundOn() {
  try { return localStorage.getItem("hexset.sound") === "on"; } catch (e) { return false; }
}

// The context and every clip, fetched once. A context made before any click
// starts suspended; the first click on the page resumes it.
function readyAudio() {
  if (!audio) {
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return false; }
  }
  if (!soundsLoading) {
    const files = [...new Set(Object.values(SOUNDS).flatMap((k) => k.files))];
    soundsLoading = Promise.all(files.map((name) => fetch(`/sounds/${name}.ogg`)
      .then((r) => r.arrayBuffer())
      .then((data) => audio.decodeAudioData(data))
      .then((buffer) => {
        soundBuffers.set(name, buffer);
        soundLoudness.set(name, clipLoudness(buffer));
      })
      .catch(() => {})));
  }
  return true;
}

// How loud a clip sounds, so every one can be played at its kind's level
// whatever its recording: the RMS of the part that sounds (10 ms windows
// within 40 dB of its peak), weighted by how long that part lasts up to
// 300 ms, since a short click sounds quieter than a held sound as strong.
function clipLoudness(buffer) {
  const x = buffer.getChannelData(0), w = Math.max(1, Math.floor(buffer.sampleRate / 100));
  let peak = 0;
  for (let i = 0; i < x.length; i++) peak = Math.max(peak, Math.abs(x[i]));
  let sum = 0, n = 0, windows = 0;
  for (let i = 0; i + w <= x.length; i += w) {
    let e = 0;
    for (let j = 0; j < w; j++) e += x[i + j] * x[i + j];
    if (Math.sqrt(e / w) > peak * 0.01) { sum += e; n += w; windows++; }
  }
  const rms = Math.sqrt(sum / Math.max(n, 1));
  return Math.max(rms * Math.sqrt(Math.min(windows * 10, 300) / 300), 1e-4);
}

function setSound(on) {
  try { localStorage.setItem("hexset.sound", on ? "on" : "off"); } catch (e) { /* private mode */ }
  if (on && readyAudio() && audio.state === "suspended") audio.resume();
  renderTableControls();
}

function sound(kind) {
  if (!soundOn() || anim.skip || !readyAudio()) return;
  if (audio.state === "suspended") audio.resume();
  const spec = SOUNDS[kind];
  if (!spec) return;
  const choices = spec.files.filter((f) => f !== lastTake.get(kind));
  const name = choices[Math.floor(Math.random() * choices.length)] || spec.files[0];
  const buffer = soundBuffers.get(name);
  if (!buffer) return;  // still loading: this one goes unheard
  lastTake.set(kind, name);
  const src = audio.createBufferSource(), amp = audio.createGain();
  src.buffer = buffer;
  // Its kind's own pitch (`rate`) and level, varied only a touch.
  src.playbackRate.value = (spec.rate || 1) * (0.98 + Math.random() * 0.04);
  const gain = spec.level * SOUND_REFERENCE / (soundLoudness.get(name) || SOUND_REFERENCE);
  amp.gain.value = Math.min(gain, 3) * (0.94 + Math.random() * 0.12);
  src.connect(amp).connect(audio.destination);
  src.start();
}

// The sound of an entry whose playback makes none of its own.
function soundFor(e) {
  if (e.kind === "build") sound(e.piece);
  else if (e.kind === "robber") robberSound(e);
  else if (e.kind === "buy") sound("buy");
  else if (e.kind === "play") sound("play");
  else if (e.kind === "bank") sound("bank");
  else if (e.kind === "discard") sound("discard");
  else if (e.kind === "end") sound("end");
  else if ((e.trades || []).length) sound("trade");
}

// A game ending, as `next` comes in after `prev`: the winner's jingle to the
// seat that won and to anyone watching, the other to every seat that lost.
function endSound(prev, next) {
  if (!prev || prev.game_over || !next || !next.game_over) return;
  const watching = next.seat === null || next.seat === undefined;
  sound(watching || next.winner === next.seat ? "win" : "lose");
}

// The robber lands, then a card is taken, if one was.
function robberSound(e) {
  sound("robber");
  if (e.stole) setTimeout(() => sound("steal"), 260);
}

// A browser lets a page play sound only after a click on it.
document.addEventListener("pointerdown", () => {
  if (soundOn() && readyAudio() && audio.state === "suspended") audio.resume();
}, {once: true});

// --- The table's controls (top left of the board)

function renderTableControls() {
  // Sound is up at every table, a finished one too, so it can be set
  // between games; the setting is this browser's (soundOn).
  document.getElementById("sound-toggle").setAttribute("aria-pressed", String(soundOn()));
}

document.getElementById("sound-toggle").addEventListener("click", () => setSound(!soundOn()));
document.getElementById("chance-toggle").addEventListener("click", () => setChance(!chanceOn()));

// --- Replay -------------------------------------------------------------
//
// Stepping a game a round at a time, for anybody at it — a spectator, or a
// seat, whether or not the game has ended. Each reads the round back in their
// own terms: the server redacts a replayed round for whoever asked for it, so
// a seat sees that round as it saw it, and only a reader with no seat here
// gets the omniscient one. `replayRound` null
// means live; a number means the page is showing the board as it stood at the
// *end* of that round — what happened in it has happened, which is how the
// sidebar log reads a round too. Round 0 is the finished opening. A turn at a
// time is what the log itself is for; this steps the board.
//
// Every step is a read of /api/table/<code>/replay, because only the server
// can say what a past position was — the engine is Python and the journal is
// the game. Nothing is cached on either side: an undo rewrites a game's
// history rather than appending to it, so a round number is not a stable
// name for a position.

function replaying() {
  return replayRound !== null;
}

// The *game*, as against the position being read — the same object while the
// page is following along, and `liveState` while a round is pinned. Stepping
// back puts a mid-game view in `state`, one where nobody has won yet and
// whose `to_move` is the first seat at every round, so anything asking it
// about the game gets an answer about the position instead. The title
// (renderStatus), the poll's own stopping test (nothingToWatch) and the
// version it polls from (settle) all want the game, and all read this.
//
// It does not go stale: the poll runs on through a pinned round and lands
// each version here (applyLive).
function liveView() {
  return replaying() && liveState ? liveState : state;
}

// What the arrows step from: the round being shown while pinned, and the
// game's own current round while live, so `<` off a live game lands on the
// round before the one being played rather than back at the start.
function replayAnchor() {
  return replaying() ? replayRound : (state.round || 0);
}

// The round actually landed on, which the server clamps and is therefore the
// only authority on — `null` if the read failed and nothing moved.
async function showRound(round) {
  let view = null;
  try {
    view = await getJSON(`/api/table/${tableCode}/replay?round=${Math.max(0, round)}`);
  } catch (e) {
    view = null;
  }
  if (!view || view.error || !view.replay) return null;
  // Where live was, remembered once on the way out: stepping on from one past
  // round to the next must not overwrite it with another past position.
  if (!replaying()) liveState = state;
  replayRound = view.replay.round;
  replayLast = view.replay.last_round;
  state = view;
  render();
  // Restarted rather than retired. The loop that was running polled from a
  // version that is now behind `liveState`, and `settle` bumps `watchSeq`
  // itself, so this both retires that one and starts one that knows a round
  // is pinned — it lands in `liveState` from here on (applyLive) instead of
  // replacing the position being read.
  settle();
  return view.replay.round;
}

// Back to following the game. `liveState` is put up rather than re-fetched,
// and it is not the stale thing its name once implied: the poll kept running
// behind the pinned board and landed every version in it (applyLive), so it
// is the game as of a moment ago. `settle` picks up from its version, which
// closes whatever gap is left.
function exitReplay() {
  if (!replaying()) return;
  replayRound = null;
  if (liveState) state = liveState;
  liveState = null;
  render();
  settle();
}

// Shown at every game, whoever is reading it. A seat stepping back keeps its
// own view of the round (reading() stays false) and loses only its controls,
// which come down for as long as it is looking (frozen()); `>|` gives the
// turn straight back.
function renderReplay() {
  const at = replayAnchor();
  // Live *is* the newest round, so there is nothing forward of it to name.
  const last = replaying() ? replayLast : at;
  const label = document.getElementById("replay-label");
  label.textContent = replaying() ? `ROUND ${at} / ${last}` : `ROUND ${at}`;
  label.classList.toggle("live", !replaying());
}

// Nothing here ever disables. A button that dims the moment it lands on the
// end of the game reads as broken — it is the one you just pressed, greyed
// out, until some other click happens to revive it. Every press has somewhere
// to go instead: the ends are clamped by the server, and stepping forward off
// the last round means the reader has caught up, which is what live is.
async function stepReplay(to) {
  const from = replayAnchor();
  // Already live there is nothing newer than now, so the press is simply
  // spent — still better than a button that greys itself out to say so.
  if (to > from && !replaying()) return;
  const at = await showRound(Math.max(0, to));
  if (at === null) return;
  // Stepping forward onto the newest round is caught up, and caught up is
  // live. The newest round *is* the live position: its cut is every step
  // played, so the board it shows is the present one. Pinning there would be
  // a replay of now — the same board, with the controls held down over a
  // position the reader could actually be playing, and a second press needed
  // to say so.
  //
  // Read off the server's own clamp (`replayLast`, refreshed by the read
  // that just returned) rather than anything cached: a game that played on
  // while it was being looked at has a newer last round than the one this
  // scrub started from.
  //
  // Forward only. Arriving from above — `<` off a live game in the window
  // after the last seat's END_TURN, where the session has ticked to a round
  // nothing has happened in yet — is a deliberate look at the present, and
  // bouncing straight back to live would read as the button doing nothing.
  if (to > from && at >= replayLast) exitReplay();
}

document.getElementById("replay-first").addEventListener("click", () => stepReplay(0));
document.getElementById("replay-prev").addEventListener("click", () => stepReplay(replayAnchor() - 1));
document.getElementById("replay-next").addEventListener("click", () => stepReplay(replayAnchor() + 1));
document.getElementById("replay-live").addEventListener("click", exitReplay);

// Every action that touches the server has the same shape: refuse to
// overlap with one already running, dim the board while it's out, and
// undim it whatever happens. Only what goes in the middle differs.
async function blocking(body) {
  if (inFlight) return;
  inFlight = true;
  const overlay = document.getElementById("overlay-blocker");
  overlay.classList.add("show");
  try {
    await body();
  } finally {
    inFlight = false;
    overlay.classList.remove("show");
  }
}

function sendAction(action) {
  return blocking(async () => {
    // Any half-made client-side choice is spent the moment an action goes
    // out: the state coming back is the one that decides what's open now.
    pendingRobberHex = null;
    const {ok, data} = await postJSON("/api/action", {action});
    // Only take the response when it succeeded: an error body carries no
    // game-state fields at all, and the render below would throw reading
    // them off it. A move of our own plays back like anyone's.
    showNotice(ok ? "" : (data.error || "That was not legal."));
    if (ok) takeView(data, {own: true});
    else render();
    if (ok) settle();
  });
}

// A new game is a new table with its own address, so this leaves this one
// where it is — anyone still sitting here keeps playing it — and moves us to
// the new one. The button asks first what the table is dealt as, the two
// things fixed at the deal: the board and the rules (renderNewGameMode).
// Who else is playing is still chosen on the board afterwards, every seat
// the rules leave open starting empty, the same as the front door.
function newGame() {
  openModal("new-game");
}

function dealNewGame() {
  const body = {board_mode: newGameBoard, game_type: newGameDuel ? "duel-variant" : "standard"};
  closeModal();
  return blocking(async () => {
    const {ok, data} = await postJSON("/api/games", {...body, client: await clientInfo()});
    if (!ok) { showNotice(data.error || "Could not deal a new game."); return; }
    rememberSeat(data.code, data.token);
    location.href = `/${data.code}`;
  });
}

function undoBuild() {
  return blocking(async () => {
    // Same reason sendAction clears it: undoing a Knight can fire while a
    // multi-victim hex is still pending (the "Steal from" modal open over
    // it), and the state coming back has no robber move left to hold it
    // open for.
    pendingRobberHex = null;
    const {ok, data} = await postJSON("/api/undo", {});
    if (ok) state = data;
    showNotice(ok ? "" : (data.error || "Nothing to undo."));
    render();
  });
}

function showNotice(text) {
  const notice = document.getElementById("notice");
  notice.textContent = text;
  notice.classList.toggle("show", Boolean(text));
}

// --- Rendering ----------------------------------------------------------

function render() {
  if (!state || !board) return;
  // Drawn without playing back (a rename, a seat change, the first read):
  // what it holds has been shown.
  if (!anim.running) markSeen(liveView());
  renderTableControls();
  noteActivity(liveView());
  noteGame(liveView());
  // The highlight colour throughout the page (build targets, selection
  // borders, the active player row, ...) is the human's own seat colour
  // rather than one fixed purple — every CSS rule that used to hardcode a
  // shade of #6d5ce8 now derives it from this custom property instead (see
  // the color-mix() rules on .clickable-vertex etc.). Set on every render
  // rather than once, since a new game can seat the human differently.
  //
  // Watching rather than playing, there is no seat and so no colour of our
  // own: it falls back to the stylesheet's own #6d5ce8, which belongs to no
  // seat and highlights nothing anyone can click anyway. A finished game is
  // the same story even holding a seat — nothing is ours to click any more,
  // so the accent stops claiming a side (frozen(), not watching()) — and a
  // round already played is the same story again, for as long as it is up.
  document.documentElement.style.setProperty(
    "--accent", frozen() ? "#6d5ce8" : SEAT_COLORS[state.seat].fill);
  renderStatus();
  renderReplay();
  renderPlayers();
  renderChance();
  refreshChance();
  renderHand();
  renderBoardDynamic();
  renderPieceSupply();
  renderBoardButtons();
  renderBank();
  renderLog();
  syncModal();
}

function renderStatus() {
  const phaseEl = document.getElementById("phase");
  // The *game*, never the round on screen — the whole of this function reads
  // `live`. Pinned to a past round the board is history, but the title is not:
  // it goes on naming whose turn it is *now*, and a finished game goes on
  // naming the winner rather than reverting to whatever phase that round was
  // in. It stays current while pinned, too — `settle` keeps polling and lands
  // its answers in `liveState` rather than on the board (see applyLive), so a
  // game that moves on while it is being read says so here.
  //
  // Nothing is given up by not describing the round. Round N is the moment
  // after the last seat ended their turn, so `to_move` is the first seat at
  // every one of them: a title asking the round would read "RED'S TURN"
  // the whole way through, whichever round you landed on. The replay bar is
  // what says where you are, and it is the one thing that should.
  const live = liveView();
  if (live.game_over) {
    if (live.winner === null) phaseEl.textContent = "GAME OVER — NO WINNER";
    else setSeatText(phaseEl, live.winner, "", " WINS");
    return;
  }
  // Nobody's decision while a seat is still empty (see api.Table.waiting_for)
  // — the same reason live.to_move is null and no row shows the active
  // highlight below.
  if (live.waiting_for && live.waiting_for.length) {
    phaseEl.textContent = "WAITING FOR SEATS";
    return;
  }
  // A bot's trade round is under way (api.Table.view's trade_wait): its
  // offer waits on a person's answer. Its turn holds until every seat it
  // waits on has had its say.
  if (live.trade_wait && live.trade_wait.length) {
    phaseEl.textContent = live.trade_wait.includes(live.seat)
      ? "ANSWER THE TRADE OFFER" : "WAITING ON A TRADE";
    return;
  }
  // Somebody else's decision to make, so the phase underneath it is beside
  // the point. True as of the last poll rather than the last render — see
  // settle() — which is as current as anything here gets.
  //
  // Owing cards to a seven is the exception, because it is not a decision
  // anybody takes in turn: every seat over the limit discards at the same
  // moment, live.to_move names only the lowest-numbered of them (see
  // hexset.game.to_move/may_act), and this seat's own discard modal is up
  // over the board right now. "RED'S TURN" behind it would be telling
  // this player to wait for something they are not waiting for. A spectator
  // has no seat, so discard_quota[null] is undefined and this stays false.
  const owing = live.phase === "DISCARD" && live.discard_quota[live.seat] > 0;
  if (live.to_move !== live.seat && !owing) {
    setSeatText(phaseEl, live.to_move, "'S", " TURN");
    return;
  }
  if (live.awaiting_confirm === live.seat) {
    phaseEl.textContent = HOLDING_SETUP_TURN_LABEL;
    return;
  }
  phaseEl.textContent = PHASE_LABELS[live.phase] || live.phase;
}

// One icon + (optional) number, for the player list's stat row — glyphs
// throughout rather than "3 VP", "Longest road" as English text.
function statChip(iconId, value, extraClass, title) {
  // A double-digit value is wide enough, inside the player row's fixed-width
  // stat columns (see .player-row's grid-template-columns), to crowd right
  // into the next column's glyph if the icon-to-number gap stays put — .wide
  // shrinks that gap instead, so the extra digit eats padding that was
  // never doing much rather than eating the next stat's breathing room.
  const wide = value !== undefined && String(value).length > 1 ? " wide" : "";
  const classes = `stat${extraClass ? ` ${extraClass}` : ""}${wide}`;
  const chip = html("span", {class: classes, title});
  chip.dataset.icon = iconId;
  chip.appendChild(iconSvg(iconId, {cls: "stat-icon"}));
  if (value !== undefined) chip.appendChild(document.createTextNode(String(value)));
  return chip;
}

// What each icon in a player's row counts, in the row's own order: the
// glossary a tap on any of them opens (openGlossary). `cls` tints the two
// awards' icons the way a held one is tinted in the row.
const GLOSSARY = [
  {icon: "victory-point", says: () => `Victory points. ${state.winning_points} wins.`},
  {icon: "card", says: () => "Resource cards held."},
  {icon: "dev-card", says: () => "Development cards held."},
  {icon: "road", cls: "road", says: () => "Roads connected. Colored when holding Longest Road (2 points)."},
  {icon: "knight", cls: "army", says: () => "Knights played. Colored when holding Largest Army (2 points)."},
  {icon: "dice", says: () => "Last roll."},
];

// The glossary for the stat `chip` tapped, that icon's line lit; the same
// chip again closes it. Under the roster, or over it where there is no room
// below, so every row stays in sight and another of its stats can be tapped
// straight away. Outside the roster's own node, so its rebuilds on each poll
// leave it alone; any click elsewhere, Escape, or a resize closes it.
function openGlossary(chip) {
  const box = document.getElementById("glossary");
  if (!box.hidden && box.dataset.icon === chip.dataset.icon) { closeGlossary(); return; }
  box.innerHTML = "";
  box.dataset.icon = chip.dataset.icon;
  for (const line of GLOSSARY) {
    const lit = line.icon === chip.dataset.icon ? " lit" : "";
    const row = html("div", {class: `glossary-line${line.cls ? ` ${line.cls}` : ""}${lit}`});
    row.dataset.icon = line.icon;
    row.appendChild(iconSvg(line.icon, {cls: "stat-icon"}));
    row.appendChild(html("span", {}, line.says()));
    box.appendChild(row);
  }
  box.appendChild(html("div", {class: "glossary-foot"}, "The highlighted row is whose turn it is."));
  box.hidden = false;
  const at = document.getElementById("players").getBoundingClientRect();
  const size = box.getBoundingClientRect();
  const left = Math.min(Math.max(8, at.right - size.width), window.innerWidth - size.width - 8);
  const below = at.bottom + 6;
  const top = below + size.height <= window.innerHeight - 8 ? below : Math.max(8, at.top - size.height - 6);
  box.style.left = `${left}px`;
  box.style.top = `${top}px`;
}

function closeGlossary() {
  document.getElementById("glossary").hidden = true;
}

// A hand column's own header: the same card/star glyph its cards use, next
// to the label — continuing the icon-forward style the player stat row
// established rather than switching back to plain text here.
function handColHeader(iconId, text) {
  const header = html("div", {class: "player-meta hand-col-header"});
  header.appendChild(iconSvg(iconId, {cls: "stat-icon"}));
  header.appendChild(document.createTextNode(text));
  return header;
}

// The seat's chance of winning as the table's model rates it (`GET
// /api/chance`): read from this seat's own side, so it rests on nothing the
// seat cannot see. Shown wherever the page holds a seat: live, asked once
// per table version; at a finished game, the read at its last position still
// in play; at a pinned round, the read the replay view carries (`chance`) for
// that round. A spectator sees none. A table that answered with no model
// (`rater` null) is not asked again until its bots change. The corner toggle
// (#chance-toggle) hides it for this browser; hidden, a table is asked once,
// to know there is a model to show, and not again until its bots change.
let chanceRead = null;      // the last answer: {key, code, version, rater, chance, bots}
let chanceAsking = null;    // the `code/version` asked and not yet answered

function chanceWanted() {
  const view = liveView();
  return Boolean(view) && view.seat !== null && view.seat !== undefined;
}

// The read to show: the pinned round's own, or the live table's last answer.
function currentChance() {
  if (replaying()) return state.chance ? {rater: state.chance.rater, chance: state.chance.chance} : null;
  return chanceRead && chanceRead.code === tableCode ? chanceRead : null;
}

function chanceOn() {
  try { return localStorage.getItem("hexset.chance") !== "off"; } catch (e) { return true; }
}

function setChance(on) {
  try { localStorage.setItem("hexset.chance", on ? "on" : "off"); } catch (e) { /* private mode */ }
  renderChance();
  refreshChance();
}

function refreshChance() {
  if (!chanceWanted() || replaying()) return;
  const key = `${tableCode}/${state.version}`;
  if (chanceAsking === key || (chanceRead && chanceRead.key === key)) return;
  const bots = state.players.map((p) => p.bot || "").join("|");
  const known = chanceRead && chanceRead.code === tableCode && chanceRead.bots === bots;
  if (known && (chanceRead.rater === null || !chanceOn())) return;
  chanceAsking = key;
  getJSON("/api/chance").then((got) => {
    if (chanceAsking === key) chanceAsking = null;
    if (!got || got.error || got.version === undefined) return;
    // An answer overtaken by a later one is dropped.
    if (chanceRead && chanceRead.code === tableCode && chanceRead.version > got.version) return;
    chanceRead = {key, code: tableCode, version: got.version, rater: got.rater, chance: got.chance, bots};
    renderChance();
  }).catch(() => { if (chanceAsking === key) chanceAsking = null; });
}

function renderChance() {
  const el = document.getElementById("chance");
  const toggle = document.getElementById("chance-toggle");
  const read = currentChance();
  const on = chanceOn();
  // The toggle is up wherever there is a chance to show or hide.
  toggle.hidden = !(chanceWanted() && read && read.rater !== null);
  document.getElementById("table-controls").classList.toggle("with-chance", !toggle.hidden);
  toggle.setAttribute("aria-pressed", String(on));
  toggle.title = on ? "Win chance shown. Click to hide." : "Win chance hidden. Click to show.";
  const shown = on && chanceWanted() && read && typeof read.chance === "number";
  el.classList.toggle("held", chanceWanted());
  el.classList.toggle("show", Boolean(shown));
  if (!shown) { el.classList.remove("open"); return; }
  el.querySelector(".chance-pct").textContent = `${Math.round(read.chance * 100)}%`;
  const fill = el.querySelector(".chance-fill");
  fill.style.width = `${(read.chance * 100).toFixed(1)}%`;
  fill.style.background = SEAT_COLORS[liveView().seat].fill;
  el.querySelector(".chance-note").textContent =
    `${read.rater}'s estimate of your chance of winning, read from your view.`;
}

// A click or a tap opens the note; one anywhere else, or on the line again,
// closes it.
document.getElementById("chance").addEventListener("click", (e) => {
  const el = e.currentTarget;
  if (el.classList.contains("show")) el.classList.toggle("open");
});
document.addEventListener("click", (e) => {
  const el = document.getElementById("chance");
  if (!el.contains(e.target)) el.classList.remove("open");
});

function renderPlayers() {
  const container = document.getElementById("players");
  // Rebuilt whole, and rebuilt on every poll while somebody else is on move
  // (see settle) — which is exactly when an empty seat is most likely to be
  // getting a bot picked for it. An open picker lives inside this container,
  // so a rebuild would close it out from under the click; the numbers it
  // would have refreshed can wait for the tick after the choice.
  if (container.contains(document.activeElement)) return;
  container.innerHTML = "";
  for (const p of state.players) {
    // A closed seat stays on the roster, as a picker, until the first move:
    // the table can still change its mind (reopen it, seat a bot). Once play
    // starts the seats are fixed -- closing and reopening are refused
    // server-side -- and the row goes, since there is nobody in it and never
    // will be; the seats left keep their colour names (colorName), which no
    // closed seat changes. The seats
    // a fixed-seat deal (duel rules) retired have nothing to change their
    // mind about, so they never show at all.
    if (state.started && (state.locked || []).includes(p.seat)) continue;
    if ((state.fixed_seats || []).includes(p.seat)) continue;
    const color = SEAT_COLORS[p.seat];
    // Whose decision it is — and pinned to a past round, nobody's. Every
    // round's snapshot is the moment after the last seat ended their turn,
    // so `to_move` is the first seat at all of them and this would sit on
    // Red the whole way through, saying nothing except where the cut
    // falls.
    //
    // Left off rather than pointed at the live turn (`liveView`, the way the
    // title goes). Every other column in this row -- the hand, the victory
    // points, the road length -- is that round's, so a highlight naming the
    // seat on move *now* would be the one thing in it that is not, and would
    // read as though those were their cards.
    const onMove = !replaying() && state.to_move === p.seat;
    const row = html("div", {class: `player-row${onMove ? " active" : ""}`});
    row.dataset.seat = String(p.seat);
    if (rowBadges.has(p.seat)) queueMicrotask(() => attachBadge(row, p.seat));
    const swatch = html("div", {class: "swatch"});
    swatch.style.background = color.fill;
    swatch.style.borderColor = color.stroke;
    row.appendChild(swatch);

    const nameEl = html("div", {class: "player-name"});
    const kind = state.seats[p.seat] && state.seats[p.seat].kind;
    if (frozen()) {
      // Nothing here is ours to change — seating a bot needs a seat's own
      // token, and once the game is over nobody's seat may be changed at all
      // (`api.Tables.seat_bot`/`rename`, refused past `is_over`) — so every
      // row reads as text, empty ones included. What a row does instead is
      // open: every hand at the table is told to a spectator, and to
      // everyone once the game is over (`webplay`'s `reveal = over or
      // omniscient or p == viewer`), and clicking a row picks which one the
      // hand area below shows.
      nameEl.classList.add("player-name-plain");
      // Our own row keeps the name we chose rather than seatLabel's "human":
      // that name is what every other viewer's list has read all game, and
      // the game ending is no reason for it to be the one row that loses it.
      nameEl.textContent = p.seat === state.seat
        ? (state.seats[p.seat].name || "human")
        : seatLabel(p.seat);
      // Openable only while reading(): that is when more than one hand is in
      // the view to choose between. A seat pinned to a past round has exactly
      // its own, so there is nothing for a click to pick and the row should
      // not invite one.
      if (p.hand !== undefined && reading()) {
        row.classList.add("player-row-openable");
        if (openSeat === p.seat) {
          row.classList.add("player-row-open");
          row.style.setProperty("--open-ring", color.fill);
        }
        // Clicking the open row again closes it, so there is always a way
        // back to showing nobody's cards in particular.
        row.addEventListener("click", () => {
          openSeat = openSeat === p.seat ? null : p.seat;
          render();
        });
      }
    } else if (p.seat === state.seat) {
      // Your own seat, and the one thing on this row you can change. It is an
      // input for the same reason a bot seat is a <select>: the control *is*
      // the player line, with nothing extra to click first.
      //
      // The poll rebuilds this whole list every 1.5s while somebody else is
      // on move, which would take the caret with it mid-word — the guard at
      // the top of renderPlayers is what stops that, since a focused input is
      // inside this container.
      const input = html("input", {
        maxlength: "40", autocomplete: "off", spellcheck: "false",
        placeholder: "human", title: "Your name at this game",
      });
      input.value = state.seats[p.seat].name || "";
      input.addEventListener("change", () => renameSelf(input.value));
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
      nameEl.appendChild(input);
    } else if (kind === "player") {
      // Somebody else who opened this link. Their seat is theirs; there is
      // nothing here to change about it.
      nameEl.classList.add("player-name-plain");
      nameEl.textContent = state.seats[p.seat].name || colorName(p.seat);
    } else {
      // The picker *is* the player line, and it is the only place a table
      // says who else is playing: an empty seat starts blank and choosing a
      // model seats that bot there, a seat that already has one swaps it.
      // Either way it goes straight through swapBot, no separate "apply"
      // step. An empty seat holds the whole table (see renderStatus) until
      // somebody picks a bot for it, opens the link and takes it, or picks
      // "closed" to close it outright -- nothing here ever resolves itself.
      // Its name opens the bot cards (renderPickBotMode), where a bot is
      // seated or swapped, and an open seat left open or closed. A button, blurred on click: a focused control inside the
      // roster would hold off every re-render (the guard at the top).
      const closed = (state.locked || []).includes(p.seat);
      const button = html("button", {
        type: "button", class: `bot-pick${p.bot ? "" : " unset"}`, "data-seat": String(p.seat),
        title: p.bot ? "Change this bot" : "Seat a bot",
      });
      const label = html("span", {class: "bot-pick-name"});
      label.textContent = p.bot ? seatLabel(p.seat) : (closed ? "(closed)" : "(empty)");
      // A pick not yet answered shows already, dimmed (chooseBot).
      if (pendingSeat && pendingSeat.seat === p.seat) {
        label.textContent = pendingSeat.label;
        button.classList.add("pending");
        button.classList.remove("unset");
      }
      button.appendChild(label);
      button.addEventListener("click", () => { button.blur(); openModal("pick-bot", {seat: p.seat}); });
      nameEl.appendChild(button);
    }
    row.appendChild(nameEl);

    const cards = p.hand !== undefined
      ? board.resources.map((r) => p.hand[r]).reduce((a, b) => a + b, 0)
      : p.hand_size;
    // Each chip is its own grid cell now (see .player-row's
    // grid-template-columns), appended straight onto the row rather than
    // into a wrapping div — that's what lets every row share the same
    // column tracks instead of each row sizing its own flex children.
    row.appendChild(statChip("victory-point", p.victory_points, "",
      `Victory points (${state.winning_points} to win)`));
    row.appendChild(statChip("card", cards, "cards", "Resource cards"));
    row.appendChild(statChip("dev-card", p.dev_card_count, "", "Development cards"));
    // Route length and Knights played sit in every row, always — comparable
    // seat to seat, tinted only for whoever actually holds the title right
    // now (see statChip's "held" class, gated in CSS on
    // .stat.road.held/.stat.army.held).
    row.appendChild(
      statChip("road", p.road_length, `road${p.longest_road ? " held" : ""}`, "Longest road")
    );
    row.appendChild(
      statChip("knight", p.knights_played, `army${p.largest_army ? " held" : ""}`, "Largest army")
    );
    // Each seat's own last roll, not one global value — lets you compare
    // who's been running hot or cold rather than only ever seeing whoever
    // rolled most recently. It's the row's last (and only ever-absent)
    // column, so leaving it out when a seat hasn't rolled yet still leaves
    // every other row's columns aligned.
    if (p.last_roll) row.appendChild(statChip("dice", p.last_roll, "roll", "Last roll"));
    container.appendChild(row);
  }
}

// What clicking a dev card in hand does, or null if that card can't be
// played right now (it isn't legal, or it's a Victory Point, which is never
// "played" at all — it just counts). Playing a dev card is only ever done
// this way now; nothing in the actions list plays one.
//
// Two shapes, by what the card still needs to know:
//   - nothing (Road Building, Knight) — send it and let the board take over:
//     Road Building's two free roads, or the Knight's forced robber move
//     (the same Phase.ROBBER a seven enters, once the card lands)
//   - a resource (Monopoly, Year of Plenty) — open the modal that picks one
// Cancelled by closing the modal for those two; a sent Knight or Road
// Building has its own way back out instead, since neither opens one -- the
// #undo-build corner button, offered by state.can_undo for exactly as long
// as what the card opened (a free road, the forced robber move) hasn't
// landed yet. See _UNDOABLE_BUILDS.
function devCardPlay(name, g) {
  if (robberMove(g)) return null;
  if (name === "Knight" && g.simple.PLAY_KNIGHT) {
    return {title: "Play Knight", run: () => sendAction(g.simple.PLAY_KNIGHT)};
  }
  if (name === "Road Building" && g.simple.PLAY_ROAD_BUILDING) {
    return {title: "Play Road Building", run: () => sendAction(g.simple.PLAY_ROAD_BUILDING)};
  }
  if (name === "Monopoly" && g.monopoly.length) {
    return {title: "Play Monopoly", run: () => openModal("monopoly")};
  }
  if (name === "Year Of Plenty" && g.yearOfPlenty.length) {
    return {title: "Play Year of Plenty", run: () => openModal("year-of-plenty")};
  }
  return null;
}

// The human's own cards, kept in a fixed spot below the seat list (in actual
// seat order) rather than tied to wherever their seat happens to fall.
//
// Watching, there is no own seat, and this shows whichever one was clicked in
// the player list instead (openSeat) — nobody's until one is. The clicks that
// make a card do something all come off `legal_actions`, which is empty for a
// spectator, so every card here is inert without a check of its own.
//
// Once the game is over a seat's holder reads the table the same way a
// spectator does: every hand is revealed to everyone by then, so the row that
// used to be a model picker is a way to read what that seat was actually
// holding at the end — their own row included, with no hand pinned open
// until one is picked. The seat is still theirs (it is what keeps their name
// on their own row), it just stops being the view's default.
//
// Stepping back through a game is the other way round: `reading()`, not
// `frozen()`, so a seat pinned to a past round keeps its own hand as the
// view's default and sees no other. That is the whole point of replaying as
// a seat, and it is what the server sent (`api.Tables.replay_view` redacts
// the round for whoever asked). The cards are inert all the same — a replay
// read carries no `legal_actions`, so nothing below finds anything to wire.
function renderHand() {
  const container = document.getElementById("hand");
  container.innerHTML = "";
  const own = reading() ? null : state.seat;
  const seat = reading() && openSeat !== null ? openSeat : own;
  const p = seat === null ? null : state.players.find((pp) => pp.seat === seat);
  const hasHand = Boolean(p && p.hand !== undefined);

  // Browsing with nobody picked: the columns are still laid out, invisible,
  // so the pane holds the height the cards will take, and the hint sits
  // centred over that space. Picking a row reveals the columns in the same
  // repaint -- no title names the seat; the highlighted roster row does.
  const hint = reading() && !hasHand;
  if (hint) {
    container.appendChild(html("div", {class: "hand-hint"}, "Click a player to see their cards"));
  }

  // What a click on a card does is decided by what's actually legal, which
  // is to say by the phase — and in most phases it does nothing at all.
  // legal_actions arrives empty unless the human is the one to move (see
  // GameSession.legal_wire_actions), so reading it is the whole test; there's
  // no separate game_over/to_move check to keep in sync with it.
  const g = hasHand ? groupActions(state.legal_actions) : null;
  // A card is clickable when there is a trade to make with it, which now
  // means the bank or a port and nothing else: offers between seats left the
  // engine with the one-event mechanic, so `bankTrade` is the whole of it.
  // Discarding is the other thing a resource card can do, but it happens in
  // the modal that DISCARD opens over the whole page (see syncModal), not
  // here — these cards aren't reachable while that's up.
  // `frozen()` rather than the empty `legal_actions` a replay read carries:
  // this one is not read off them, so a past round in which this seat held
  // MAIN and the move would otherwise have offered the trade modal — over a
  // hand it can no longer trade, to a server that would clear it against the
  // live game.
  const canTrade = hasHand && !frozen() && !robberMove(g) && state.phase === "MAIN" && state.to_move === state.seat;

  // Two columns, side by side, both always present regardless of hasHand —
  // the header and the row's height hold their place even at zero cards, so
  // buying a first dev card doesn't shove the resources column around, and
  // (browsing, nobody picked yet) the pane's height doesn't change the
  // instant somebody is.
  const cols = html("div", {class: hint ? "hand-cols hand-cols-hidden" : "hand-cols"});
  const resCol = html("div", {class: "hand-col"});
  resCol.appendChild(handColHeader("card", "Resource Cards"));
  const resHand = html("div", {class: "hand"});
  if (hasHand) {
    for (const r of board.resources) {
      const n = p.hand[r];
      if (!n) continue;
      const idx = board.resources.indexOf(r);
      const card = resourceCardTile(r, {title: `${r}: ${n}`});
      card.appendChild(html("div", {class: "count"}, String(n)));
      if (canTrade) {
        card.classList.add("hand-card-clickable");
        card.addEventListener("click", () => openModal("trade", {give: idx}));
      }
      resHand.appendChild(card);
    }
  }
  resCol.appendChild(resHand);
  cols.appendChild(resCol);

  const devCol = html("div", {class: "hand-col"});
  devCol.appendChild(handColHeader("dev-card", "Development Cards"));
  const devHand = html("div", {class: "hand"});
  if (hasHand) {
    for (const c of board.dev_cards) {
      const n = p.dev_cards[c];
      if (!n) continue;
      const play = devCardPlay(c, g);
      const classes = ["card"];
      if (play) classes.push("hand-card-clickable");
      const card = html("div", {class: classes.join(" "), title: play ? play.title : `${c}: ${n}`});
      card.style.background = "var(--dev-card-bg)";
      card.appendChild(iconSvg(DEV_CARD_ICONS[c], {fill: DEV_CARD_INK}));
      card.appendChild(html("div", {class: "count"}, String(n)));
      if (play) card.addEventListener("click", play.run);
      devHand.appendChild(card);
    }
  }
  devCol.appendChild(devHand);
  cols.appendChild(devCol);
  container.appendChild(cols);
}

// How many of each piece the human still has to place — supply caps come
// from the engine (board.piece_supply, see board_layout in webplay.py) so
// this can't drift from what can_place_settlement/_road/_city actually
// enforce; built counts are just what's already on the board in this seat's
// colour.
function renderPieceSupply() {
  const container = document.getElementById("piece-supply");
  container.innerHTML = "";
  // One seat's pieces. Playing, our own. Reading the table, the seat whose
  // row is open (openSeat), as the hand area below does, and nobody's until
  // one is: a spectator has no pieces of their own, and a finished game has
  // no own seat to default to. `reading()`, not `frozen()`, so a seat
  // stepping back still gets its own supply as it stood that round — what
  // this seat had left to place is part of that seat's view of the board
  // then. Either way the counts come off the board on screen, so a replayed
  // round shows what the seat had left at the end of it.
  const seat = reading() ? openSeat : state.seat;
  if (seat === null || seat === undefined) return;
  const color = SEAT_COLORS[seat];
  const roadsBuilt = state.edge_owner.filter((o) => o === seat).length;
  const settlementsBuilt = state.vertex_owner.filter(
    (o, v) => o === seat && state.vertex_building[v] === 1
  ).length;
  const citiesBuilt = state.vertex_owner.filter(
    (o, v) => o === seat && state.vertex_building[v] === 2
  ).length;
  const remaining = {
    settlement: board.piece_supply.settlement - settlementsBuilt,
    city: board.piece_supply.city - citiesBuilt,
    road: board.piece_supply.road - roadsBuilt,
  };
  const plural = {settlement: "Settlements", city: "Cities", road: "Roads"};
  for (const kind of ["settlement", "city", "road"]) {
    const tile = html("div", {
      class: `supply-tile supply-${kind}`, title: `${plural[kind]}: ${remaining[kind]} left`,
    });
    tile.appendChild(pieceGlyph(kind, color));
    tile.appendChild(html("div", {class: "count"}, String(remaining[kind])));
    container.appendChild(tile);
  }
}

// A road from vertex `r.v0` to `r.v1` in a seat's `color`, as its lines from
// the bottom up: `cast`, its shadow; `casing`, the seat's near-black stroke,
// 1 unit proud of the colour on each side as a building's outline is;
// `fill`, the colour; and along the colour's two sides `light`, on the side
// facing the light, and `shade`, on the other. Round caps throughout, so
// the casing follows the colour's rounded ends. `r.gap0` and `r.gap1` end
// the road that much short of `r.v0` and `r.v1` (roadEndGaps).
function roadLines(r, color) {
  const length = Math.hypot(r.v1.x - r.v0.x, r.v1.y - r.v0.y) || 1;
  const ux = (r.v1.x - r.v0.x) / length, uy = (r.v1.y - r.v0.y) / length;
  // Across the road, toward the light.
  const lit = -uy * LIGHT.x + ux * LIGHT.y > 0 ? 1 : -1;
  const nx = -uy * lit, ny = ux * lit;
  const gap0 = r.gap0 || 0, gap1 = r.gap1 || 0;
  // The road moved by (ox, oy) and cut `trim` short at each end.
  const line = (ox, oy, trim, attrs) => el("line", {
    x1: r.v0.x + ox + ux * (trim + gap0), y1: r.v0.y + oy + uy * (trim + gap0),
    x2: r.v1.x + ox - ux * (trim + gap1), y2: r.v1.y + oy - uy * (trim + gap1),
    "stroke-linecap": "round", ...attrs,
  });
  return {
    cast: line(0, ROAD_CAST, 0, {stroke: "#000000", "stroke-width": 8}),
    casing: line(0, 0, 0, {stroke: color.stroke, "stroke-width": 8}),
    fill: line(0, 0, 0, {stroke: color.fill, "stroke-width": 6}),
    light: line(nx * 1.7, ny * 1.7, 1.5, {class: "road-light"}),
    shade: line(-nx * 1.7, -ny * 1.7, 1.5, {class: "road-shade"}),
  };
}

// Where two seats' roads meet at a vertex nobody has built on, a road that
// carries on through it (another of its own seat's roads ends there too) is
// drawn to the vertex, and a road that ends there alone stops ROAD_END_GAP
// short, so it does not lie across the road it meets. Returns (edge, vertex)
// -> that end's gap. `building`, {id, owner}, counts a road being built that
// the state does not hold yet (playBuild).
function roadEndGaps(building = null) {
  const ownerOf = (e) => (building && e.id === building.id ? building.owner : state.edge_owner[e.id]);
  const owners = new Map();
  for (const e of board.edges) {
    const owner = ownerOf(e);
    if (owner < 0) continue;
    for (const v of [e.v0, e.v1]) {
      if (!owners.has(v)) owners.set(v, []);
      owners.get(v).push(owner);
    }
  }
  return (e, v) => {
    if (state.vertex_owner[v] >= 0) return 0;
    const owner = ownerOf(e);
    const here = owners.get(v) || [];
    const mine = here.filter((o) => o === owner).length;
    return mine === 1 && here.length > 1 ? ROAD_END_GAP : 0;
  };
}

function renderBoardDynamic() {
  const buildingsLayer = document.getElementById("buildings-layer");
  const roadsLayer = document.getElementById("roads-layer");
  const robberLayer = document.getElementById("robber-layer");
  const clickLayer = document.getElementById("clickable-layer");
  const clickEdgeLayer = document.getElementById("clickable-edge-layer");
  const hexTargetLayer = document.getElementById("hex-target-layer");
  buildingsLayer.innerHTML = "";
  roadsLayer.innerHTML = "";
  robberLayer.innerHTML = "";
  clickLayer.innerHTML = "";
  clickEdgeLayer.innerHTML = "";
  hexTargetLayer.innerHTML = "";

  // Roads (roadLines), a kind of line at a time: every shadow, then every
  // casing, then every colour, so that where two seats' roads meet at a
  // vertex nobody has built on yet, the second road's casing lands under the
  // first one's colour and not across it.
  const roads = [];
  const gapAt = roadEndGaps();
  for (const e of board.edges) {
    const owner = state.edge_owner[e.id];
    if (owner < 0) continue;
    roads.push(roadLines({v0: vertexById[e.v0], v1: vertexById[e.v1],
                          gap0: gapAt(e, e.v0), gap1: gapAt(e, e.v1)}, SEAT_COLORS[owner]));
  }
  const casts = el("g", {class: "road-casts"});
  roadsLayer.appendChild(casts);
  for (const r of roads) casts.appendChild(r.cast);
  for (const part of ["casing", "fill", "shade", "light"]) {
    for (const r of roads) roadsLayer.appendChild(r[part]);
  }

  // Settlements & cities
  for (const v of board.vertices) {
    const owner = state.vertex_owner[v.id];
    if (owner < 0) continue;
    const building = state.vertex_building[v.id]; // 1 settlement, 2 city
    buildingsLayer.appendChild(buildingPiece(v, building === 2, SEAT_COLORS[owner]));
  }

  // Robber
  const robberHex = hexById[state.robber];
  if (robberHex) {
    const spot = robberSpot(robberHex);
    robberLayer.appendChild(el("use", {
      href: "#icon-robber", class: "robber",
      x: spot.x - ROBBER_SIZE / 2, y: spot.y - ROBBER_SIZE / 2, width: ROBBER_SIZE, height: ROBBER_SIZE,
    }));
  }
  markBlocked(state.robber);

  if (state.to_move !== state.seat || state.game_over) return;
  const g = groupActions(state.legal_actions);

  // Hexes into their own layer below the pieces, then edges, then vertices
  // here: a hex overlay's boundary coincides exactly with the edges around
  // it, so the broadest target has to sit underneath or it steals clicks
  // meant for a road on its rim (later siblings paint on top in SVG).
  // Vertices are the smallest, most precise targets and go last (clickable-
  // layer, above buildings-layer) so nothing else can shadow them either —
  // edges sit in their own layer under buildings-layer instead of straight
  // after the hexes, purely for paint order: see the comment by
  // clickable-edge-layer's creation.
  const move = robberMove(g);
  for (const [hid, actions] of Object.entries(move ? move.targets : {})) {
    const h = hexById[hid];
    const points = h.vertex_ids.map((v) => `${vertexById[v].x},${vertexById[v].y}`).join(" ");
    const poly = el("polygon", {points, class: "clickable-hex"});
    poly.addEventListener("click", () => {
      if (actions.length === 1) { sendAction(actions[0]); return; }
      // syncModal picks this up on the way through and opens "steal" over it.
      pendingRobberHex = Number(hid);
      render();
    });
    hexTargetLayer.appendChild(poly);
  }
  // A pending robber move owns the board until it's answered or taken back,
  // so the build targets come down with everything else (renderBoardButtons)
  // and its hexes above are all that answers a click. Free for the forced
  // one — the engine offers nothing else in Phase.ROBBER — but the rule is
  // the same either way, so it's written once.
  if (move) return;
  for (const [eid, actions] of Object.entries(g.edge)) {
    const e = board.edges[eid];
    const p0 = vertexById[e.v0], p1 = vertexById[e.v1];
    // The bar stops short of both corners, so it stays clear of whatever
    // stands on them and of the bars of the edges it meets there.
    const [a, b] = EDGE_MARK.map((t) => ({x: p0.x + (p1.x - p0.x) * t, y: p0.y + (p1.y - p0.y) * t}));
    const ends = {x1: a.x, y1: a.y, x2: b.x, y2: b.y};
    const target = el("g", {class: "clickable-edge"},
      el("line", {...ends, class: "edge-mark-rim"}),
      el("line", {...ends, class: "edge-mark"}),
      el("line", {...ends, class: "edge-hit"}));
    target.addEventListener("click", () => sendAction(actions[0]));
    clickEdgeLayer.appendChild(target);
  }
  // A city target reads as a diamond (the same rotated-square mark
  // upgrading it will actually place, see buildingPiece) rather than the
  // settlement/setup circle, so the highlight itself
  // tells you which action a vertex is offering before you click it. Sized
  // in JS rather than through the coarse-pointer CSS bump .clickable-vertex
  // uses for circles: a CSS width/height override on a <rect> would grow it
  // from its fixed x/y corner, not its center, throwing off the diamond's
  // position over the vertex.
  const coarsePointer = window.matchMedia?.("(pointer: coarse)").matches ?? false;
  for (const [vid, actions] of Object.entries(g.vertex)) {
    const v = vertexById[vid];
    let target;
    if (actions[0].type === "BUILD_CITY") {
      // 22 to mirror the settlement circle's own target-vs-actual relationship
      // (r=11 highlight around a rendered r=12 piece) — the actual city is
      // 24x24 (see buildingPiece).
      const side = coarsePointer ? 26 : 22;
      target = el("rect", {
        x: v.x - side / 2, y: v.y - side / 2, width: side, height: side,
        transform: `rotate(45 ${v.x} ${v.y})`, class: "clickable-vertex",
      });
    } else {
      // Unchanged from before: r stays a fixed attribute, and the
      // coarse-pointer CSS rule (.clickable-vertex { r: 18 }) still does the
      // touch-target bump for circles on its own.
      target = el("circle", {cx: v.x, cy: v.y, r: 11, class: "clickable-vertex"});
    }
    target.addEventListener("click", () => sendAction(actions[0]));
    clickLayer.appendChild(target);
  }
}

// The board's four corner buttons, shown exactly when what they do is on
// offer. There is no sidebar list of actions any more: rolling, ending a turn
// and buying a development card are these buttons; building and the robber
// are highlights on the board itself; a development card is played by
// clicking it in hand (devCardPlay); and every choice shaped like a menu —
// trading, discarding, the robber's victim, Monopoly's resource, Year of
// Plenty's pair — is a mode of the one modal.
function renderBoardButtons() {
  // Includes a seat holding its setup turn open: the view reports that seat
  // as `to_move` even though the engine's snake has moved on, so there is no
  // second notion of "whose turn" to keep in step here (_public_mover).
  // `frozen()` covers the game being over, and covers a round already played
  // — where `to_move` really is this seat, which is exactly the trap: the
  // corner buttons would come up on a historical position and POST to the
  // live one.
  const myTurn = !frozen() && state.to_move === state.seat;
  // A robber move is the one choice the game asks for on the board rather
  // than in the modal, and it behaves like a modal mode all the same: nothing
  // behind it is reachable until it's answered, whether Phase.ROBBER was
  // entered off a seven or off a knight -- the engine offers nothing else
  // in that phase either way, so the corners come down with everything else.
  const move = robberMove(groupActions(state.legal_actions));
  const offered = (type) => myTurn && !move && legalAction(type) !== null;
  // Not a legal_actions entry — undo is a session convenience, not a game
  // rule — so it reads the server's own can_undo flag instead of offered().
  // Left out of `offered`'s !move gate on purpose: a self-played Knight
  // stays undoable through the forced robber move it opened (see
  // _UNDOABLE_BUILDS), and can_undo is exactly what tells the two cases
  // apart -- a rolled seven clears it same as ever, since there was never a
  // card to hand back.
  showFab("undo-build", myTurn && Boolean(state.can_undo));
  showFab("roll-dice", offered("ROLL"));
  showFab("end-turn", offered("END_TURN"));
  const buy = offered("BUY_DEV_CARD");
  showFab("buy-dev-card", buy);
  const deck = document.getElementById("buy-dev-card");
  deck.classList.add("dealt");
  deck.disabled = !buy;
  renderDeck();
}

function showFab(id, on) {
  document.getElementById(id).classList.toggle("show", on);
}

// The development cards left in the deck, on the deck's own corner card.
// Public, so every reader sees it; drawn again after each feed entry that
// plays (advance), so a card bought by another seat leaves the deck as it is
// shown being bought.
function renderDeck() {
  const left = state.dev_cards_remaining ?? 0;
  const deck = document.getElementById("buy-dev-card");
  deck.querySelector(".deck-count").textContent = String(left);
  const says = deck.disabled
    ? `Development cards: ${left} left`
    : `Buy development card (${left} left)`;
  deck.title = says;
  deck.setAttribute("aria-label", says);
}

// The bank's resource cards, one pile a resource along the board's top edge.
// Public, so every reader sees it; the piles are made once and their counts
// written on each render and after each feed entry that plays (advance).
function renderBank() {
  const bank = document.getElementById("bank");
  if (!state.bank) return;
  if (!bank.childElementCount) {
    for (const name of Object.keys(RESOURCE_ICONS)) {
      const pile = resourceCardTile(name, {extraClasses: ["bank-pile"]});
      pile.dataset.resource = name;
      const count = html("span", {class: "bank-count"});
      count.style.color = TERRAIN_ICON_INK[RESOURCE_TERRAIN[name]];
      pile.appendChild(count);
      bank.appendChild(pile);
    }
  }
  bank.classList.add("dealt");
  for (const pile of bank.children) {
    const name = pile.dataset.resource;
    const left = state.bank[name] ?? 0;
    pile.querySelector(".bank-count").textContent = String(left);
    pile.classList.toggle("empty", left === 0);
    pile.title = `Bank: ${left} ${name}`;
  }
}

// The wire action of a given type, or null. Read twice for each corner
// button — once to decide whether to show it, once when it's clicked — which
// is cheaper and harder to get wrong than parking three of them in module
// variables and keeping those in step with what's on screen.
function legalAction(type) {
  return state.legal_actions.find((a) => a.type === type) || null;
}

// --- The modal ---------------------------------------------------------------
//
// One modal, six modes — every decision in the game that isn't a place on the
// board. Three are click-driven and three open themselves; see openModal and
// syncModal below for which is which.

// Modes syncModal owns: each one appears the moment its condition does and
// goes away the moment it stops, so nothing else has to remember to open or
// close it. The other three are opened by a click and only ever closed by one.
const MODAL_AUTO = new Set(["discard", "steal"]);

// Modes Escape and a backdrop click may close. The two left out are the two
// the game is actually waiting on: an offer has to be answered, and cards owed
// to the bank after a seven have to be handed over. "steal" is here because
// closing it only backs out to the hex list, not out of the move.
const MODAL_DISMISSIBLE = new Set(["trade", "monopoly", "year-of-plenty", "steal", "new-game", "pick-bot"]);

// One button size everywhere in the modal: a 40px square carrying a glyph
// and nothing else. `label` is the full tooltip/screen-reader sentence — the
// only place the word lives, now that the title row names the state the glyph
// is answering (an X under "Trade Offer" is Cancel, under "Trade Offer
// Received" it is Pass, and a caption saying so was the heading twice).
// `sub` is the one exception, the bank/port square's rate: see bankTradeButton.
function modalActionButton(icon, label, {primary = true, sub = ""} = {}) {
  const classes = ["modal-btn"];
  if (primary) classes.push("primary");
  if (sub) classes.push("with-rate");
  const btn = html("button", {title: label, "aria-label": label, class: classes.join(" ")});
  btn.appendChild(iconSvg(icon));
  if (sub) btn.appendChild(html("span", {class: "modal-btn-cap"}, sub));
  return btn;
}

// The mode's one way out, drawn as a plain glyph at the top right of the
// title row rather than as a button in the action column: an X is the same
// shape in all four trade states and its meaning is the state's, which the
// title already names. Called by every mode that has a way out; a mode that
// doesn't (a forced discard) simply never calls it and the glyph stays
// hidden — see renderModal, which hides it again before each render.
function modalCloseGlyph(label, onClick) {
  const btn = document.getElementById("modal-close");
  btn.hidden = false;
  btn.setAttribute("title", label);
  btn.setAttribute("aria-label", label);
  btn.onclick = onClick;
}

// One card tile — the same visual .card the hand section uses (via
// resourceCardTile), just selectable/dimmable on top of that (see .pick-card
// in the stylesheet). Every mode that picks a resource is built out of these.
// `count` badges only above 1 by default — a bare card already reads as "one"
// everywhere else in the app — but `forceCount` shows it starting at 1 too,
// for the one mode (Year of Plenty) where two single picks of different
// resources would otherwise look identically "just selected".
function pickCard(resourceIdx, {selected, disabled, shortfall, count, forceCount, title, onClick} = {}) {
  const name = board.resources[resourceIdx];
  const classes = ["pick-card"];
  if (selected) classes.push("selected");
  if (disabled) classes.push("disabled");
  if (shortfall) classes.push("shortfall");
  const card = resourceCardTile(name, {extraClasses: classes, title});
  if (count !== undefined && count > (forceCount ? 0 : 1)) {
    card.appendChild(html("div", {class: "count"}, String(count)));
  }
  if (onClick && !disabled) card.addEventListener("click", onClick);
  return card;
}

// The most of one resource this seat can put on the give side: what it holds.
// Nothing else bounds a player trade -- the seat being asked refuses what it
// will not sign -- and a bank sale is bounded by `trade_ratios[r]` (4, or 3,
// or 2 at the right port), which is never more than the hand either. Capping
// the row at three is what used to make bank trades lie: a 4:1 sale drew as
// "1 Wood" and took four. Whichever route the composition ends up taking is
// decided by which button lights up, not by what the row counts to.
function giveCeiling(p, r) {
  return p.hand ? p.hand[board.resources[r]] || 0 : 0;
}

// The composer, and the same one whether an offer is being opened or a
// counter written: give over get with "for" between them, centred across the
// rows' own width rather than the modal's. No YOU GIVE / YOU GET captions —
// two rows in that order, read through the word "for", say it already.
function composerRows(p, {allowAny = false} = {}) {
  const wrap = html("div", {class: "trade-compose"});
  wrap.appendChild(composerRow(p, "give", allowAny));
  wrap.appendChild(html("div", {class: "trade-for"}, "for"));
  wrap.appendChild(composerRow(p, "want", allowAny));
  return wrap;
}

// One side of the trade, editable: all five resources, always, so the row
// doesn't reflow under the cursor between clicks. A tap on a tile adds one of
// that card to this side, up to its ceiling and then no further — it used to
// wrap back to none there, which reads as a misclick rather than as a limit —
// and the "−" under a tile that is in the offer takes one back off. Drawn as
// its own button, not as a tap on the count badge: the badge is a label
