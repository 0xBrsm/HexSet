let liveState = null;      // while a round is pinned: the live game, kept current by settle — see applyLive
let modalDrag = loadModalDrag();  // #modal-inner offset from center, dragged via #modal-head — see wireModalDrag
let tradeGive = [0, 0, 0, 0, 0];   // "trade" mode: counts the human gives, by resource index
let tradeWant = [0, 0, 0, 0, 0];   // "trade" mode: counts the human gets
let tradeGiveAny = 0;              // "trade" mode: any cards the human gives, of the answerer's naming
let tradeWantAny = 0;              // "trade" mode: any cards the human takes, of the answerer's choosing
let counterOf = null;              // {actor, bundle} of the incoming offer being countered, else null
// Nothing caps a player trade's size: what a seat will move is that seat's
// own declaration, and a manual seat declares nothing. The composer bounds a
// give row by the hand, and the offer button lets any covered pile through --
// the seat being asked refuses what it will not sign.
let yopPicks = [];         // 0, 1, or 2 resource indices, "year-of-plenty" mode only
let monopolyPick = null;   // selected resource index, "monopoly" mode only
let newGameBoard = "spiral";  // "new-game" mode: the BOARD_MODES name to deal
let newGameDuel = false;      // "new-game" mode: duel-variant rules rather than standard
let pickBot = null;           // "pick-bot" mode: {seat, model, was}, see renderPickBotMode
let pendingSeat = null;       // {seat, label} a pick shows on its row until the server answers (chooseBot)
let modelsByType = {};     // GET /api/models game_types: game type -> entry -> {name, version, commit}

const SVG_NS = "http://www.w3.org/2000/svg";

function el(tag, attrs, ...children) {
  // Only ever used for SVG elements; HTML elements go through html() below.
  const node = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "text") node.textContent = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c) node.appendChild(c);
  return node;
}

function html(tag, attrs, innerHTML) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  if (innerHTML !== undefined) node.innerHTML = innerHTML;
  return node;
}

// One <svg><use href="#icon-..."></svg> — every icon glyph in the UI (stat
// chips, hand/trade cards, action buttons) is built from this.
function iconSvg(iconId, {fill, cls} = {}) {
  const attrs = {viewBox: "0 0 512 512"};
  if (fill) attrs.fill = fill;
  if (cls) attrs.class = cls;
  return el("svg", attrs, el("use", {href: `#icon-${iconId}`}));
}

// The piece-supply HUD's glyphs, drawn as the same shapes renderBoardDynamic
// puts on the board itself (circle/diamond/line) rather than separate icon
// art, so "what's left" reads as a small version of what's already on screen.
function pieceGlyph(kind, color) {
  if (kind === "road") {
    return el("svg", {viewBox: "0 0 24 24"}, el("line", {
      x1: 4, y1: 20, x2: 20, y2: 4, stroke: color.fill, "stroke-width": 4, "stroke-linecap": "round",
    }));
  }
  if (kind === "city") {
    return el("svg", {viewBox: "0 0 24 24"}, el("rect", {
      x: 6, y: 6, width: 12, height: 12, fill: color.fill, stroke: color.stroke, "stroke-width": 1.5,
      transform: "rotate(45 12 12)",
    }));
  }
  return el("svg", {viewBox: "0 0 24 24"}, el("circle", {
    cx: 12, cy: 12, r: 8, fill: color.fill, stroke: color.stroke, "stroke-width": 1.5,
  }));
}

// A resource .card tile: background tinted to the resource's terrain, icon
// inked for contrast against it — the shared look behind the hand and every
// modal card row/picker (see pickCard, below).
function resourceCardTile(name, {extraClasses = [], title} = {}) {
  const card = html("div", {class: ["card", ...extraClasses].join(" "), title: title ?? name});
  card.style.background = TERRAIN_COLORS[RESOURCE_TERRAIN[name]];
  card.appendChild(iconSvg(RESOURCE_ICONS[name], {fill: TERRAIN_ICON_INK[RESOURCE_TERRAIN[name]]}));
  return card;
}

// An open offer's "any" card: one card of the answerer's naming or choosing
// (see hexset.trading.Offer.any), drawn as a "?".
function anyCardTile({extraClasses = [], title = "Any card"} = {}) {
  return html("div", {class: ["card", "any-card", ...extraClasses].join(" "), title}, "?");
}

// --- Who we are --------------------------------------------------------
//
// One seat at one game, named by a token the server mints and never stores.
// Kept in localStorage so a reload — or coming back tomorrow — sits back
// down rather than dealing a stranger's game, and keyed by code so one
// browser can hold seats at more than one game at once.
//
// `lastCode` is the other half: the game a fresh visit to / falls back to
// when no game we sit at is still going (see activeCode).

const TOKEN_HEADER = "X-HexSet-Token";
let tableCode = location.pathname.replace(/^\/+|\/+$/g, "").toLowerCase();

function tokenFor(code) {
  try { return localStorage.getItem(`hexset.token.${code}`); } catch { return null; }
}

function rememberSeat(code, token) {
  try {
    localStorage.setItem(`hexset.token.${code}`, token);
    localStorage.setItem("hexset.last", code);
  } catch { /* private mode: this session still works, it just won't resume */ }
}

function forgetSeat(code) {
  try {
    localStorage.removeItem(`hexset.token.${code}`);
    localStorage.removeItem(`hexset.active.${code}`);
    if (localStorage.getItem("hexset.last") === code) localStorage.removeItem("hexset.last");
  } catch { /* private mode */ }
}

function lastCode() {
  try { return localStorage.getItem("hexset.last"); } catch { return null; }
}

// When each game this browser sits at last moved, as `{at, version}` under
// `hexset.active.<code>`: `at` is this browser's clock when it first saw the
// table at `version`. Opening a game is not activity — going Back to an old
// table leaves its stamp where it was — only a new version is, and a game
// seen for the first time counts as moving then. A finished game drops out.
function noteActivity(view) {
  if (!view || !view.code || view.seat === null || view.seat === undefined) return;
  const key = `hexset.active.${view.code}`;
  try {
    if (view.game_over) { localStorage.removeItem(key); return; }
    const seen = JSON.parse(localStorage.getItem(key) || "null");
    if (seen && seen.version === view.version) return;
    localStorage.setItem(key, JSON.stringify({at: Date.now(), version: view.version}));
  } catch { /* private mode: nothing kept, so / falls back to lastCode */ }
}

// The game a visit to / opens: the most recently active one this browser
// sits at that is still going, or null for none. Each candidate is asked of
// the table itself, newest first, since a game can end or be evicted while
// we are away; one found over or gone loses its stamp on the way.
async function activeCode() {
  let stamps = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key.startsWith("hexset.active.")) continue;
      const code = key.slice("hexset.active.".length);
      const seen = JSON.parse(localStorage.getItem(key) || "null");
      if (seen && tokenFor(code)) stamps.push({code, at: seen.at});
    }
  } catch { return null; }
  stamps.sort((a, b) => b.at - a.at);
  for (const {code} of stamps) {
    let view = null;
    try { view = await getJSON(`/api/table/${code}`); } catch { view = null; }
    if (view && !view.error && !view.game_over) return code;
    if (view) { try { localStorage.removeItem(`hexset.active.${code}`); } catch { /* private mode */ } }
  }
  return null;
}

// What the menu's History shows of each game this browser has played, kept
// under `hexset.game.<code>` as `{at, type, seat, names, over, winner}`: when
// this browser first saw the game, its game type, our seat, every seat's
// name (null for an empty or closed one), and once it is over the winning
// seat. Written from the seated view whenever one of those changes. Unlike
// `hexset.active.<code>` it outlives the game, and unlike the token it
// outlives a server restart, so `at` stays the day the game was played.
function gameRecord(code) {
  try { return JSON.parse(localStorage.getItem(`hexset.game.${code}`) || "null"); } catch { return null; }
}

// `view` as a record, keeping what `kept` already knew that `view` cannot
// say: a spectator's view has no seat, and only the first sight has a date.
// A game first seen already over was played before records were kept, on a
// day nothing here knows, so it has none.
function recordOf(view, kept) {
  const seat = view.seat ?? kept?.seat ?? null;
  return {
    at: kept ? kept.at : view.game_over ? null : Date.now(), type: view.game_type, seat,
    names: (view.seats || []).map((s) => (s.kind === "empty" ? null : s.name || `Player ${s.seat + 1}`)),
    over: Boolean(view.game_over), winner: view.winner ?? null,
  };
}

function noteGame(view) {
  if (!view || !view.code || view.seat === null || view.seat === undefined) return;
  const kept = gameRecord(view.code);
  const next = recordOf(view, kept);
  if (JSON.stringify(next) === JSON.stringify(kept)) return;
  try { localStorage.setItem(`hexset.game.${view.code}`, JSON.stringify(next)); } catch { /* private mode */ }
}

// Every game this browser holds a seat token or a record for, newest first,
// with its record (null for a game played before records were kept).
function playedGames() {
  const games = new Map();
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const match = /^hexset\.(token|game)\.(.+)$/.exec(localStorage.key(i));
      if (match) games.set(match[2], gameRecord(match[2]));
    }
  } catch { return []; }
  const list = [...games].map(([code, record]) => ({code, record}));
  list.sort((a, b) => (b.record?.at ?? 0) - (a.record?.at ?? 0));
  return list;
}

// The game at `code` as the table has it now, read for a History row the
// record cannot fill: one never recorded, or one in progress when it was.
// Our own seat's view where the token still holds, so an unrecorded game
// learns which seat was ours; the public view otherwise. "gone" for a code
// the server has nothing behind, null for an answer that says nothing.
async function readPlayedGame(code) {
  try {
    const token = tokenFor(code);
    if (token) {
      const res = await fetch("/api/state", {headers: {[TOKEN_HEADER]: token}});
      if (res.ok) return await res.json();
    }
    const res = await fetch(`/api/table/${code}`);
    if (res.status === 404) return "gone";
    return res.ok ? await res.json() : null;
  } catch {
    return null;
  }
}

// One secret per browser, generated once and kept in localStorage the same
// way a seat's token is -- but never sent as-is. What goes on the wire is
// its sha256, purely to correlate this browser's games in the journal and
// to reclaim a seat (POST /api/reclaim) if its token is ever gone (a server
// restart). Not an account: a leaked secret can steal a seat, and that is
// an accepted risk for this experiment rig (see api.py's module docstring).
function clientSecret() {
  try {
    let secret = localStorage.getItem("hexset.secret");
    if (!secret) {
      const bytes = new Uint8Array(32);
      crypto.getRandomValues(bytes);
      secret = Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
      localStorage.setItem("hexset.secret", secret);
    }
    return secret;
  } catch {
    return null; // private mode: this session still plays, it just can't reclaim later
  }
}

// The name this browser last gave itself (renameSelf), sent with every deal and
// join so its seats, and its row in the rankings, go by it.
const NAME_KEY = "hexset.name";

function savedName() {
  try { return localStorage.getItem(NAME_KEY) || null; } catch { return null; }
}

// The server tells a browser seat from a script by what the browser itself
// marks on the request (web.py's from_page), so all this sends is the id and
// the name.
async function clientInfo() {
  const secret = clientSecret();
  const name = savedName();
  if (!secret) return name ? {name} : {};
  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(secret));
  const id = Array.from(new Uint8Array(digest), (b) => b.toString(16).padStart(2, "0")).join("");
  return name ? {id, name} : {id};
}

function authHeaders(extra) {
  const token = tokenFor(tableCode);
  const headers = {...(extra || {})};
  if (token) headers[TOKEN_HEADER] = token;
  return headers;
}

async function getJSON(path) {
  const res = await fetch(path, {headers: authHeaders()});
  return res.json();
}

async function postJSON(path, body) {
  const send = () => fetch(path, {
    method: "POST",
    headers: authHeaders({"Content-Type": "application/json"}),
    body: JSON.stringify(body || {}),
  });
  let res = await send();
  // A seat's token stops working when the server restarts or drops an idle
  // game from memory, and a page waiting on its own turn does not poll, so
  // a refused request is the first it hears of it. The seat is still ours:
  // get a fresh token by secret and send the request once more with it.
  if (res.status === 403 && tableCode && tokenFor(tableCode)) {
    const back = await reclaimSeat(tableCode);
    if (back === "none") {
      forgetSeat(tableCode);
      location.reload();
    } else if (back) {
      res = await send();
    }
  }
  return {ok: res.ok, data: await res.json()};
}

// --- Loading -----------------------------------------------------------

async function loadBoard() {
  // The same layout either way — a board is public, and the seated route
  // only exists because it is the one a token already reaches.
  board = await getJSON(watching() ? `/api/table/${tableCode}/board` : "/api/board");
  vertexById = {};
  for (const v of board.vertices) vertexById[v.id] = v;
  hexById = {};
  for (const h of board.hexes) hexById[h.id] = h;
  drawBoard();
}

// The opponents the seat pickers offer, per game type: a model plays only
// the game types it declares. Which one is on a seat is the seat's own
// business (state.seats), never a preference remembered here.
async function loadModels() {
  const {game_types} = await getJSON("/api/models");
  modelsByType = game_types || {};
}

// The one place that turns a seat number into what a human reads, so the
// status line, the robber prompt and trade offers all agree. The player list
// itself renders a bot seat as a <select>, not this — see renderPlayers.
// Every game is public: the link is all it takes to open one, and a table
// with no seat left still shows its board and its log to whoever follows it.
// `state.seat` is null then — the server answers `GET /api/table/<code>`
// for anyone, with no token and no hand revealed — and this is the one test
// the seat-shaped parts of the page ask before assuming they have one.
function watching() {
  return state.seat === null || state.seat === undefined;
}

// The page asks two different things of a view, and they are not the same
// thing. `reading()` is *whose view is this* — the axis the server redacts on.
// `frozen()` is *is any of it ours to change* — the axis the controls come
// down on. They used to be one predicate, and folding replay into it handed a
// seat that stepped back a spectator's page: its own hand stopped being the
// view's default and became one more row to click open.
//
// Reading the table rather than holding a hand in it: a spectator, or anybody
// once the game is over. Both are states in which every hand is revealed
// (`webplay`'s `reveal = over or omniscient or p == viewer`), so no hand is
// pinned open until a row is picked, and picking rows is how the hand area
// gets steered (`openSeat`).
//
// Stepping back through a game still being played is deliberately not one of
// them. A seat replaying a round of one is still that seat:
// `api.Tables.replay_view` redacts that round for it exactly as the live view
// does, and the view comes back with `seat` on it. Answering "reading" here is
// what threw that away.
//
// A game that was *played out* is the other way again, and `state.game_over`
// is the wrong question to ask about it: that is the replayed round's, and a
// round in the middle of a finished game reads false. Disclosure follows the
// game, so the server sends `replay.finished` and every round of a finished
// game is read in observer footing — which is what the finished live view
// already does, and going back through it should not take that away.
function reading() {
  return watching() || !!state.game_over || replayedFinished();
}

// A replayed round of a game somebody finished. Read off the view in hand
// rather than off `liveState`, so it holds for a link opened straight into a
// replay as much as for one stepped back from live.
function replayedFinished() {
  return Boolean(state.replay && state.replay.finished);
}

// Nothing on the table is ours to change: reading() it, or pinned to a round
// already played. This is what the seat-shaped controls (renderPlayers) and
// the corner buttons (renderBoardButtons) want — `watching()` alone left a
// seated player looking at a finished game with a live name box on their own
// row and a live model picker on every bot's, each one a POST the server
// answers 409 ("the game is already over", `api._not_over`). The seat itself
// is not gone and is still worth having (`reclaimSeat` restores it on purpose,
// on a finished game too): it is what puts our own hand in the view and our
// own name on our own row. It just no longer comes with anything to do.
//
// Replay is here rather than in reading() because a replayed round comes back
// with our own seat on it, and a seat plus a board is all the page needs to
// offer a move — against a position that is already history, to a server that
// would apply it to the live one.
function frozen() {
  return reading() || replaying();
}

function seatLabel(seat) {
  if (seat === state.seat) return "human";
  // What a seat *is* comes from state.seats, not from the player entry:
  // every game deals all four seats whether or not anybody is in them, so
  // state.players has a row for an empty one too and nothing in its own
  // fields tells it apart from a person who never gave a name.
  const info = state?.seats?.[seat];
  if (info && info.kind === "empty") {
    return state?.locked?.includes(seat) ? "(closed)" : "(empty)";
  }
  return (info && (info.label || info.name)) || colorName(seat);
}

// The name a bot entry is shown by at this table's game type: its profile's
// `label` (`GET /api/models`), else the entry itself, which is what the
// server is asked for.
function botLabel(entry) {
  const info = (modelsByType[state.game_type] || {})[entry];
  return (info && info.label) || entry;
}

// Same label, but colour-first — "Purple (mybot)" — for the spots where the
// model name alone would misleadingly read as an opponent's own identity
// (trade offers, robber-victim picks) rather than as one seat's current bot.
// The same form as the log's `_who` (webplay.py).
function seatFullLabel(seat) {
  return `${colorName(seat)} (${seatLabel(seat)})`;
}

// Your own name at this game, as everyone else's log and player list will
// read it from here on (the server keeps one name per seat — see
// api.Tables.rename), and at every game this browser deals or joins after. Trimmed and capped server-side, so a blank one simply
// puts the seat back to unnamed rather than being refused.
async function renameSelf(name) {
  if (inFlight) return;
  if ((name || "").trim() === (state.seats[state.seat].name || "")) return;
  inFlight = true;
  try {
    const {ok, data} = await postJSON("/api/name", {name});
    if (ok) {
      try {
        const chosen = (name || "").trim();
        if (chosen) localStorage.setItem(NAME_KEY, chosen); else localStorage.removeItem(NAME_KEY);
      } catch { /* private mode: this game keeps the name, the next does not */ }
      state = data;
      render();
    } else {
      showNotice(data.error || "Could not change that name.");
    }
  } finally {
    inFlight = false;
  }
}

// Puts a bot on one seat without restarting the game: a fresh one on a seat
// nobody has taken, or a different one in place of the bot already there —
// see api.Tables.seat_bot, which handles both.
async function swapBot(seat, model) {
  if (!model) return;
  if (inFlight) return;
  inFlight = true;
  try {
    const {ok, data} = await postJSON("/api/bot", {seat, model});
    if (ok) {
      state = data;
      render();
    } else {
      showNotice(data.error || "Could not seat that bot.");
    }
  } finally {
    inFlight = false;
  }
}

// The bot cards' choice that closes the seat, beside every model name and ""
// (left open): never a real model.
const CLOSE_SEAT = "__close__";

// Closes an open seat outright: no bot, no person, ever, for the rest of
// this game — the third way an empty seat resolves (see api.Tables.close_seat)
// besides seating a bot on it or somebody opening the link to take it.
async function reopenSeat(seat) {
  if (inFlight) return;
  inFlight = true;
  try {
    const {ok, data} = await postJSON("/api/open", {seat});
    if (ok) {
      state = data;
      render();
    } else {
      showNotice(data.error || "Could not reopen that seat.");
    }
  } finally {
    inFlight = false;
  }
}

async function closeSeat(seat) {
  if (inFlight) return;
  inFlight = true;
  try {
    const {ok, data} = await postJSON("/api/close", {seat});
    if (ok) {
      state = data;
      render();
    } else {
      showNotice(data.error || "Could not close that seat.");
    }
  } finally {
    inFlight = false;
  }
}

async function refreshState() {
  state = await getJSON("/api/state");
  render();
}

// --- Getting to a game -------------------------------------------------
//
// There is no page in front of the board. Opening the site puts you at a
// game: the one you were last at, if it is still going, and a fresh one
// otherwise. Either way the address bar ends up showing that game's code,
// and that address is the whole of it — open it on another screen, or send
// it to somebody, and you are at the same table.
//
// Nothing here is a lobby. A game is dealt live, with every seat but the
// creator's empty, and who else is playing is decided on the board itself:
// each empty seat's row carries a model picker (see renderPlayers), and a
// person who opens the link takes one of the seats still open.

// Moves the address bar to `code` without reloading, so the board that is
// already drawn stays up. replaceState rather than pushState: the game we
// came from is not somewhere Back should return to, and on a fresh visit
// there is nothing behind us worth keeping either.
function showCodeInUrl(code) {
  tableCode = code;
  history.replaceState(null, "", `/${code}`);
}

// Why the last attempt at a game came back with nothing at all — read by
// init() to tell somebody handed a dead link what happened to it. A game
// that exists but has no seat left is not this: that is watching, and it
// works.
let seatError = null;

// Trades this browser's own secret for a fresh token on the seat it holds at
// `code` (POST /api/reclaim). The seat itself survives a restart, or the
// server dropping an idle game from memory: it comes back from the journal,
// claimed, with our client id on it. Its token does not, since a token never
// touches disk, so this handshake is how the page gets back in.
//
// Asked as a probe, so a seat that is not ours is a plain "no" rather than a
// refused request: the page asks at every arrival without a working token,
// whoever is arriving. Returns the seated view, "none" when no seat there is
// ours, or null when the server could not be asked (mid-restart, say) and the
// answer is still unknown.
//
// Works on a finished game too, and is worth doing there: it is the
// difference between watching a game you played and watching a stranger's.
async function reclaimSeat(code) {
  const secret = clientSecret();
  if (!secret) return "none"; // private mode: nothing to prove a seat with
  let res, data;
  try {
    res = await fetch("/api/reclaim", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({code, secret, probe: true}),
    });
    data = await res.json();
  } catch {
    return null;
  }
  if (!res.ok) return null;
  if (!data.token) return "none";
  rememberSeat(code, data.token);
  showCodeInUrl(code);
  return data;
}

// The game named in the URL, or the last one we sat at. Returns its state
// — seated if the seat is ours or there is one to be had, watching
// otherwise — or null if there is no such game to be at: abandoned,
// evicted, or a code with nothing behind it.
//
// Whether a seat there is ours is the server's to say, not this browser's
// token store's: a token goes stale at every restart, and a saved one can be
// lost. So without a token that works, the page asks by secret (reclaim)
// before anything else, and forgets a stale token only once the server has
// said no seat there is ours.
async function resumeGame(code) {
  if (!code) return null;
  tableCode = code;
  if (tokenFor(code)) {
    const view = await getJSON("/api/state");
    if (!view.error && view.code === code) {
      rememberSeat(code, tokenFor(code));
      showCodeInUrl(code);
      return view;
    }
  }
  const mine = await reclaimSeat(code);
  if (mine === "none") {
    if (tokenFor(code)) forgetSeat(code);
  } else if (mine) {
    return mine;
  }
  // No seat here, or not one we can get back. Ask the table itself what it
  // has before knocking: every game is public, so this one read answers both
  // questions — whether the game exists at all, and whether a seat is left.
  //
  // Knocking first and reading the refusal is the same two outcomes and one
  // request fewer for somebody who gets a seat, and it is what this did. But
  // a full table is a *normal* arrival here, not an error — watching is what
  // the link is for — and a refused POST is one the browser writes into the
  // console as a failed request whatever the page then does with it. A page
  // whose ordinary path logs an error has no clean console left to read a
  // real one out of, so the read comes first.
  const view = await getJSON(`/api/table/${code}`);
  if (view.error) {
    seatError = view.error;
    return null;
  }
  // Nothing to join in a game already over, whatever its seats look like —
  // arriving at a finished game to watch it is an ordinary arrival, and the
  // refused POST it used to make is exactly the console noise the read-first
  // ordering above exists to avoid.
  const open = !view.game_over && (view.seats || []).some(
    (s) => s.kind === "empty" && !(view.locked || []).includes(s.seat)
  );
  if (open) {
    // Still a race — somebody else can take the last seat between that read
    // and this — and losing it lands on the view already in hand, which is
    // the right answer anyway. A 409 in the console *there* is a genuinely
    // unusual event rather than the way everyone arrives.
    const {ok, data} = await postJSON("/api/join", {code, client: await clientInfo()});
    if (ok) {
      rememberSeat(code, data.token);
      showCodeInUrl(code);
      return data;
    }
  }
  showCodeInUrl(code);
  return view;
}

// --- Static board drawing ------------------------------------------------

// What the board's drawing reaches past a point it is anchored on: a city's
// corner (half-diagonal 12√2 plus stroke) and the coarse-pointer vertex
// target (r 18) past a vertex; a port marker's circle (r 18, which holds its
// ship and label) plus stroke past its centre.
const VERTEX_REACH = 20;
const PORT_REACH = 20;
// Open water around the board, so it does not run into the header, the
// panels or the screen's edges.
const BOARD_MARGIN = 24;

function boardBounds() {
  // Fitted to what is drawn rather than padded evenly on every side: the
  // ports stand out from the coast on some sides and not others. Widened to
  // be symmetric about the land, so the island sits centred left to right
  // whichever side its ports stand out on.
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  const reach = (x, y, r) => {
    minX = Math.min(minX, x - r); maxX = Math.max(maxX, x + r);
    minY = Math.min(minY, y - r); maxY = Math.max(maxY, y + r);
  };
  for (const v of board.vertices) reach(v.x, v.y, VERTEX_REACH);
  for (const p of board.ports) {
    const pos = portLabelPos(p);
    reach(pos.x, pos.y, PORT_REACH);
  }
  const xs = board.vertices.map((v) => v.x);
  const middle = (Math.min(...xs) + Math.max(...xs)) / 2;
  const half = Math.max(middle - minX, maxX - middle);
  minX = middle - half - BOARD_MARGIN; maxX = middle + half + BOARD_MARGIN;
  minY -= BOARD_MARGIN; maxY += BOARD_MARGIN;
  return {minX, minY, w: maxX - minX, h: maxY - minY};
}

function centroid() {
  let sx = 0, sy = 0;
  for (const h of board.hexes) { sx += h.x; sy += h.y; }
  return {x: sx / board.hexes.length, y: sy / board.hexes.length};
}

function portLabelPos(port) {
  const [v0, v1] = port.vertices;
  const p0 = vertexById[v0], p1 = vertexById[v1];
  const mx = (p0.x + p1.x) / 2, my = (p0.y + p1.y) / 2;
  // The marker sits at the apex of a true equilateral triangle on the port's
  // hex edge — marker-to-v0 and marker-to-v1 both equal v0-to-v1 — rather
  // than at some fixed distance out from the midpoint. Rotate the edge
  // vector 90° for the apex direction, scaled by an equilateral triangle's
  // height (edge length × √3/2).
  const ex = p1.x - p0.x, ey = p1.y - p0.y;
  const edgeLen = Math.hypot(ex, ey) || 1;
  const height = edgeLen * (Math.sqrt(3) / 2);
  const nx = -ey / edgeLen, ny = ex / edgeLen;
  // Two apexes are equilateral, one on each side of the edge; take whichever
  // lands farther from the board's centroid, so the marker sits out past the
  // coast in the water rather than back over the hex.
  const c = centroid();
  const a1 = {x: mx + nx * height, y: my + ny * height};
  const a2 = {x: mx - nx * height, y: my - ny * height};
  const d1 = (a1.x - c.x) ** 2 + (a1.y - c.y) ** 2;
  const d2 = (a2.x - c.x) ** 2 + (a2.y - c.y) ** 2;
  return d1 > d2 ? a1 : a2;
}

// The island's sand base reaches this far past the coast, in board units.
const LAND_RIM = 7;
// The island's shadow: `steps` lines, each `step` wider than the last, drawn
// `south` of the island.
const LAND_SHADOW = {steps: 9, step: 4.5, south: 7};
// A land tile's corners sit this share of the way from its hex's centre to
// the hex's own corners, which leaves about 3 units of sand between two
// tiles, and each corner is rounded from this far along its two sides.
const TILE_INSET = 0.97;
const TILE_ROUND = 7;
// How far south of a tile its shadow falls on the sand.
const TILE_CAST = 1.3;
// The line just inside a tile's outline follows the tile drawn this much
// further in.
const TILE_BEVEL_INSET = 0.022;
// The specks of a tile's grain: how many of each tone, and their radii.
const TILE_GRAIN = {specks: 46, radius: [0.45, 1.25]};
// The side of the square the robber's figure is drawn in.
const ROBBER_SIZE = 48;
// How far south of a number, a port marker or a building its shadow falls,
// and how far south of a road, which lies lower, its own does.
const CAST = 2.2;
const ROAD_CAST = 1.7;
// How far short of an empty vertex a road ends when it has none of its own
// seat's roads there but another seat's (roadEndGaps): its round end then
// clears the other road's casing instead of lying across it.
const ROAD_END_GAP = 10;
// The way to the light, which falls on the board from its upper left.
const LIGHT = {x: -0.35, y: -0.94};
// The part of an edge its road target's bar covers, as shares of the edge.
const EDGE_MARK = [0.27, 0.73];

// A repeatable stream of numbers in [0, 1) from `seed`. The board's texture
// is scattered with it, so a board is drawn the same way every time.
function scatter(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Whether the point (x, y) is inside the polygon `corners`.
function insidePolygon(x, y, corners) {
  let inside = false;
  for (let i = 0, j = corners.length - 1; i < corners.length; j = i++) {
    const a = corners[i], b = corners[j];
    if ((a.y > y) !== (b.y > y) && x < a.x + (b.x - a.x) * (y - a.y) / (b.y - a.y)) inside = !inside;
  }
  return inside;
}

// A land tile's grain: two paths of small round specks scattered over it,
// one for each tone, the same for a hex every time it is drawn.
function tileGrain(h) {
  const next = scatter(7919 * (h.id + 1));
  const corners = h.vertex_ids.map((v) => {
    const p = vertexById[v];
    return {x: h.x + (p.x - h.x) * 0.9, y: h.y + (p.y - h.y) * 0.9};
  });
  const reach = Math.max(...corners.map((c) => Math.hypot(c.x - h.x, c.y - h.y)));
  const [least, most] = TILE_GRAIN.radius;
  const tones = {dark: "", pale: ""};
  for (const tone of Object.keys(tones)) {
    for (let placed = 0, tries = 0; placed < TILE_GRAIN.specks && tries < 400; tries++) {
      const x = h.x + (2 * next() - 1) * reach, y = h.y + (2 * next() - 1) * reach;
      const r = (least + (most - least) * next() * next()).toFixed(2);
      if (!insidePolygon(x, y, corners)) continue;
      tones[tone] += `M${(x - r).toFixed(1)},${y.toFixed(1)}a${r},${r} 0 1,0 ${2 * r},0a${r},${r} 0 1,0 ${-2 * r},0`;
      placed++;
    }
  }
  return tones;
}

// --- The water
//
// Open water as it looks from high above: a fine chop of small waves, and
// over it broad patches a little paler or darker. Both are pictures made
// once when the page loads and laid over the board pane's own gradient. The
// chop is one square tile, repeated: the sum of `waves` sine waves whose
// crests run mostly across the page, each fitting the tile a whole number of
// times so the tile joins itself, with the crests drawn pale and the troughs
// dark. The patches are a small picture of a few long waves stretched over
// the whole pane. Every wave comes from `scatter`, so the water is the same
// every time.
const WATER = {
  tile: 512,              // the chop tile's side, in screen dots
  waves: 46,              // how many waves the chop sums
  crest: [214, 238, 250, 0.22],   // a crest's colour, and how strongly it shows at most
  trough: [3, 20, 38, 0.17],
  patches: [112, 84],     // the patches picture's size
  pale: [96, 190, 214, 0.2],
  deep: [4, 24, 44, 0.24],
};

// `count` waves over a `width` by `height` picture, summed: one value a dot,
// row by row, scaled so that most lie in [-1, 1]. `wave(i)` gives the i-th
// wave's {m, n, phase, amp}: it runs `m` times across the picture and `n`
// times down it.
function waveField(width, height, count, wave) {
  const field = new Float32Array(width * height);
  const across = [new Float32Array(width), new Float32Array(width)];
  const down = [new Float32Array(height), new Float32Array(height)];
  for (let i = 0; i < count; i++) {
    const {m, n, phase, amp} = wave(i);
    // sin(a + b) from the two axes' own sines and cosines, worked out once each.
    for (let x = 0; x < width; x++) {
      const a = 2 * Math.PI * m * x / width + phase;
      across[0][x] = Math.sin(a) * amp;
      across[1][x] = Math.cos(a) * amp;
    }
    for (let y = 0; y < height; y++) {
      const b = 2 * Math.PI * n * y / height;
      down[0][y] = Math.sin(b);
      down[1][y] = Math.cos(b);
    }
    for (let y = 0, at = 0; y < height; y++) {
      const sin = down[0][y], cos = down[1][y];
      for (let x = 0; x < width; x++, at++) field[at] += across[0][x] * cos + across[1][x] * sin;
    }
  }
  let squares = 0;
  for (let at = 0; at < field.length; at++) squares += field[at] * field[at];
  const scale = 1 / (2.2 * Math.sqrt(squares / field.length) || 1);
  for (let at = 0; at < field.length; at++) field[at] *= scale;
  return field;
}

// A picture of `field`: `high` where it is over `from`, `low` where it is
// under -`from`, each [red, green, blue, strength] and showing more the
// further the field is past that; clear between.
function fieldPicture(field, width, height, from, high, low) {
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const context = canvas.getContext("2d");
  const image = context.createImageData(width, height);
  for (let at = 0; at < field.length; at++) {
    const value = field[at];
    const tone = value > 0 ? high : low;
    const past = Math.min(1, Math.max(0, (Math.abs(value) - from) / (1 - from)));
    image.data[4 * at] = tone[0];
    image.data[4 * at + 1] = tone[1];
    image.data[4 * at + 2] = tone[2];
    image.data[4 * at + 3] = Math.round(255 * tone[3] * past * past * (3 - 2 * past));
  }
  context.putImageData(image, 0, 0);
  return canvas;
}

// Makes the water's two pictures and lays them over the water's gradient
// (#water). A browser that cannot make them keeps the gradient alone.
function paintWater() {
  const pane = document.getElementById("board-pane");
  const water = document.getElementById("water");
  const next = scatter(48611);
  const side = WATER.tile;
  // Two thirds of the chop is waves 4 to 12 dots long, their crests within
  // about 55 degrees of level; the rest is a finer ripple, 2 to 5 dots,
  // running any way.
  const chop = waveField(side, side, WATER.waves, (i) => {
    const fine = i >= WATER.waves * 2 / 3;
    const length = fine ? 2.2 + 2.4 * next() : 4 + 8 * next() * next();
    const heading = Math.PI / 2 + (next() - 0.5) * (fine ? Math.PI : 1.9);
    return {
      m: Math.round(side / length * Math.cos(heading)), n: Math.round(side / length * Math.sin(heading)),
      phase: 2 * Math.PI * next(), amp: (fine ? 0.45 : 1) * Math.sqrt(length),
    };
  });
  const [wide, tall] = WATER.patches;
  const patches = waveField(wide, tall, 7, () => ({
    m: (next() - 0.5) * 5, n: (next() - 0.5) * 4, phase: 2 * Math.PI * next(), amp: 0.5 + next(),
  }));
  const pictures = [
    fieldPicture(chop, side, side, 0.16, WATER.crest, WATER.trough),
    fieldPicture(patches, wide, tall, 0.1, WATER.pale, WATER.deep),
  ];
  // The chop is drawn dot for dot up to two dots a pixel, so it stays fine on a dense screen.
  const shown = side / Math.min(2, Math.max(1, window.devicePixelRatio || 1));
  const gradient = getComputedStyle(water).backgroundImage;
  Promise.all(pictures.map((canvas) => new Promise((done) => canvas.toBlob(done)))).then((blobs) => {
    if (blobs.some((blob) => !blob)) return;
    const [chopUrl, patchesUrl] = blobs.map((blob) => URL.createObjectURL(blob));
    water.style.backgroundImage = `url(${chopUrl}), url(${patchesUrl}), ${gradient}`;
    water.style.backgroundSize = `${shown}px ${shown}px, 100% 100%, auto`;
    water.style.backgroundRepeat = "repeat, no-repeat, no-repeat";
    pane.dataset.water = "painted";
  });
}

// A land tile's outline, as a path: its hex drawn in toward its centre (to
// `inset` of the way to its corners), with rounded corners.
function tilePath(h, inset = TILE_INSET) {
  const corners = h.vertex_ids.map((v) => {
    const p = vertexById[v];
    return {x: h.x + (p.x - h.x) * inset, y: h.y + (p.y - h.y) * inset};
  });
  const toward = (a, b) => {
    const share = TILE_ROUND / (Math.hypot(b.x - a.x, b.y - a.y) || 1);
    return `${(a.x + (b.x - a.x) * share).toFixed(2)},${(a.y + (b.y - a.y) * share).toFixed(2)}`;
  };
  return corners.map((p, i) => {
    const before = corners[(i + corners.length - 1) % corners.length];
    const after = corners[(i + 1) % corners.length];
    return `${i ? "L" : "M"}${toward(p, before)}Q${p.x.toFixed(2)},${p.y.toFixed(2)} ${toward(p, after)}`;
  }).join("") + "Z";
}

// The land's outline: every edge with one of `hexes` on one side only, as
// pairs of vertex ids.
function coastEdges(hexes) {
  const sides = new Map();
  for (const h of hexes) {
    h.vertex_ids.forEach((a, i) => {
      const b = h.vertex_ids[(i + 1) % h.vertex_ids.length];
      const key = a < b ? `${a}-${b}` : `${b}-${a}`;
      sides.set(key, (sides.get(key) || 0) + 1);
    });
  }
  return [...sides].filter(([, n]) => n === 1).map(([key]) => key.split("-").map(Number));
}

// Where the robber stands on a hex, as the middle of its figure's square: at
// the left shoulder of the hex's number chip, over the chip's edge and clear
// of its digits, and of whatever stands on the hex's corners and sides; in
// the middle of a hex with no number.
function robberSpot(hex) {
  return hex.token ? {x: hex.x - 23, y: hex.y - 7} : {x: hex.x, y: hex.y - 3};
}

// Dims the number on the hex the robber stands on, and no other.
function markBlocked(hexId) {
  for (const token of document.querySelectorAll("#static-layer .hex-token-g")) {
    token.classList.toggle("blocked", token.id === `hex-token-${hexId}`);
  }
}

// A settlement (a circle) or a city (a diamond) at vertex `v`, with a light
// line just inside its outline. The board's pieces and the one playBuild
// drops are both this.
function buildingPiece(v, city, color) {
  const piece = el("g", {});
  if (city) {
    piece.appendChild(el("rect", {
      x: v.x - 13, y: v.y - 13, width: 26, height: 26, class: "cast",
      transform: `translate(0 ${CAST}) rotate(45 ${v.x} ${v.y})`,
    }));
    piece.appendChild(el("rect", {
      x: v.x - 12, y: v.y - 12, width: 24, height: 24,
      fill: color.fill, stroke: color.stroke, "stroke-width": 2, transform: `rotate(45 ${v.x} ${v.y})`,
    }));
    piece.appendChild(el("rect", {
      x: v.x - 9.6, y: v.y - 9.6, width: 19.2, height: 19.2, class: "piece-edge",
      transform: `rotate(45 ${v.x} ${v.y})`,
    }));
  } else {
    piece.appendChild(el("circle", {cx: v.x, cy: v.y + CAST, r: 13, class: "cast"}));
    piece.appendChild(el("circle", {cx: v.x, cy: v.y, r: 12, fill: color.fill, stroke: color.stroke, "stroke-width": 2}));
    piece.appendChild(el("circle", {cx: v.x, cy: v.y, r: 9.6, class: "piece-edge"}));
  }
  return piece;
}

// Side by side, the captions start at the board's right edge, above the
// bottom-right corner button, and take the water from there to the pane's
// right edge (--cap-left, --cap-width), at least CAPTION_MIN wide. Stacked,
// nothing moves.
const CAPTION_MIN = 220;
function fitCorners() {
  const pane = document.getElementById("board-pane");
  const island = document.getElementById("static-layer");
  const sideBySide = window.matchMedia("(min-width: 821px)").matches;
  const ctm = island && island.getScreenCTM();
  if (!sideBySide || !ctm) {
    for (const name of ["--cap-left", "--cap-width"]) pane.style.removeProperty(name);
    return;
  }
  const box = island.getBBox();
  const right = new DOMPoint(box.x + box.width, box.y).matrixTransform(ctm).x;
  const at = pane.getBoundingClientRect();
  const edge = at.width - 16;
  const start = Math.min(right - at.left + 16, edge - CAPTION_MIN);
  pane.style.setProperty("--cap-left", `${start}px`);
  pane.style.setProperty("--cap-width", `${edge - start}px`);
}

// The header's height, which the page's width cap (the stylesheet's
// `body > header, #layout`) takes off the window's before its 1.4.
function fitPage() {
  const header = document.querySelector("body > header");
  document.documentElement.style.setProperty("--header-height", `${header.offsetHeight}px`);
}

function drawBoard() {
  const svg = document.getElementById("board-svg");
  svg.innerHTML = "";
  const b = boardBounds();
  svg.setAttribute("viewBox", `${b.minX} ${b.minY} ${b.w} ${b.h}`);
  queueMicrotask(fitCorners);

  const defs = el("defs", {});
  svg.appendChild(defs);
  // One shade for every tile, in the tile's own box: lighter toward its upper
  // left, darker toward its lower right.
  defs.appendChild(el("linearGradient", {id: "tile-shade", x1: 0.2, y1: 0, x2: 0.8, y2: 1},
    el("stop", {offset: 0, "stop-color": "#ffffff", "stop-opacity": 0.18}),
    el("stop", {offset: 0.5, "stop-color": "#ffffff", "stop-opacity": 0}),
    el("stop", {offset: 1, "stop-color": "#000000", "stop-opacity": 0.18})));
  // The line just inside a tile's outline, in the tile's own box: pale at its
  // upper left, nothing across its middle, dark at its lower right.
  defs.appendChild(el("linearGradient", {id: "tile-bevel", x1: 0.2, y1: 0, x2: 0.8, y2: 1},
    el("stop", {offset: 0, "stop-color": "#ffffff", "stop-opacity": 0.5}),
    el("stop", {offset: 0.42, "stop-color": "#ffffff", "stop-opacity": 0}),
    el("stop", {offset: 0.58, "stop-color": "#000000", "stop-opacity": 0}),
    el("stop", {offset: 1, "stop-color": "#000000", "stop-opacity": 0.34})));
  // The light a roll puts on the board (playProduction): gold where a number
  // produces, red where the robber stops it.
  for (const [id, color] of [["light-gold", "#ffd75a"], ["light-red", "#ff4d4d"]]) {
    defs.appendChild(el("radialGradient", {id},
      el("stop", {offset: 0, "stop-color": color, "stop-opacity": 0.75}),
      el("stop", {offset: 0.45, "stop-color": color, "stop-opacity": 0.3}),
      el("stop", {offset: 1, "stop-color": color, "stop-opacity": 0})));
  }
  const staticLayer = el("g", {id: "static-layer"});
  svg.appendChild(staticLayer);

  // Under the tiles: the island's shadow, then its sand base. The shadow is
  // the coast drawn again and again a little south of the island, each line
  // wider and all of them faint, so it is darkest at the coast and fades
  // away from it. The base is the land drawn LAND_RIM past its coast.
  const land = board.hexes.filter((h) => h.terrain !== "SEA");
  const outline = land.map((h) =>
    `M${h.vertex_ids.map((v) => `${vertexById[v].x},${vertexById[v].y}`).join("L")}Z`).join("");
  const coast = coastEdges(land).map(([a, b]) =>
    `M${vertexById[a].x},${vertexById[a].y}L${vertexById[b].x},${vertexById[b].y}`).join("");
  for (let i = LAND_SHADOW.steps; i >= 1; i--) {
    staticLayer.appendChild(el("path", {
      d: coast, class: "land-shadow", "stroke-width": 2 * LAND_RIM + i * LAND_SHADOW.step,
      transform: `translate(0 ${LAND_SHADOW.south})`,
    }));
  }
  staticLayer.appendChild(el("path", {d: outline, class: "land-base", "stroke-width": 2 * LAND_RIM}));
  // Every tile's shadow on the sand, under all of the tiles.
  staticLayer.appendChild(el("path", {
    d: land.map((h) => tilePath(h)).join(""), class: "tile-cast", transform: `translate(0 ${TILE_CAST})`,
  }));

  // Hexes
  for (const h of board.hexes) {
    const sea = h.terrain === "SEA";
    const color = TERRAIN_COLORS[h.terrain] || "#ccc";
    // A land tile is drawn in from its hex with its corners rounded, so the
    // sand under it shows between it and its neighbours.
    const shape = sea
      ? {tag: "polygon", attrs: {points: h.vertex_ids.map((v) => `${vertexById[v].x},${vertexById[v].y}`).join(" ")}}
      : {tag: "path", attrs: {d: tilePath(h)}};
    staticLayer.appendChild(el(shape.tag, {...shape.attrs, fill: color, class: "tile"}));
    const icon = TERRAIN_ICONS[h.terrain];
    if (icon) {
      // A glyph box of side S puts its corners S/2*sqrt(2) from the centre, so
      // the hex's 60-unit circumradius — not its 52-unit inradius — is the
      // bound. Clipped regardless, as cheap insurance against any icon's
      // glyph reaching into its corners and spilling onto a neighbouring hex.
      const clip = el("clipPath", {id: `hexclip-${h.id}`});
      clip.appendChild(el(shape.tag, shape.attrs));
      defs.appendChild(clip);
      const size = 76;
      // The clip goes on a wrapping group, not on the <use> itself: a <use> of
      // a <symbol> instantiates its own nested viewport, and clipping that
      // directly is where mobile engines disagree.
      const clipped = el("g", {"clip-path": `url(#hexclip-${h.id})`});
      clipped.appendChild(el("use", {
        href: `#icon-${icon}`, x: h.x - size / 2, y: h.y - size / 2,
        width: size, height: size, class: "hex-icon", fill: TERRAIN_ICON_INK[h.terrain],
      }));
      staticLayer.appendChild(clipped);
    }
    if (!sea) {
      const grain = tileGrain(h);
      for (const tone of Object.keys(grain)) {
        staticLayer.appendChild(el("path", {d: grain[tone], class: `tile-grain ${tone}`}));
      }
      staticLayer.appendChild(el("path", {...shape.attrs, class: "tile-shade", fill: "url(#tile-shade)"}));
      staticLayer.appendChild(el("path", {d: tilePath(h, TILE_INSET - TILE_BEVEL_INSET), class: "tile-bevel"}));
    }
    if (h.token) {
      const pipCount = 6 - Math.abs(7 - h.token);
      // The number's disc, digits and pips as one group: the robber dims it
      // (markBlocked) and a roll of its number makes it jump (playProduction).
      const token = el("g", {id: `hex-token-${h.id}`, class: "hex-token-g"});
      staticLayer.appendChild(token);
      token.appendChild(el("circle", {cx: h.x, cy: h.y + CAST, r: 15.5, class: "cast"}));
      token.appendChild(el("circle", {cx: h.x, cy: h.y, r: 15, fill: "#fdf6e3", stroke: "#3a2f22", "stroke-width": 1}));
      const hot = h.token === 6 || h.token === 8;
      token.appendChild(el("text", {
        x: h.x, y: h.y - 2, class: `hex-token ${hot ? "red" : ""}`,
        // Also a presentation attribute, not the stylesheet alone: belt and
        // suspenders alongside the CSS fill above.
        fill: hot ? "#d00000" : "#000000",
        text: String(h.token),
      }));
      const dotsWidth = (pipCount - 1) * 4;
      // Number sits at h.y-2, pips were at h.y+10 (12 units below it) —
      // nudged up 20% of that gap (2.4 units) to sit a bit closer.
      for (let i = 0; i < pipCount; i++) {
        token.appendChild(el("circle", {
          cx: h.x - dotsWidth / 2 + i * 4, cy: h.y + 7.6, r: 1.5,
          class: "hex-pip", fill: h.token === 6 || h.token === 8 ? "#d00000" : "#000000",
        }));
      }
    }
  }

  // Vertices (faint dots, always visible). The edges between them show as
  // the sand between the tiles.
  for (const v of board.vertices) {
    staticLayer.appendChild(el("circle", {cx: v.x, cy: v.y, r: 2.4, class: "vertex-dot"}));
  }

  // Ports: a marker in the same colour as its resource's actual hex tile
  // (white for 3:1), a ship icon, the ratio alone (the colour already says
  // which resource), and a pier plus a matching-coloured mark on each of the
  // two vertices it serves.
  for (const p of board.ports) {
    const pos = portLabelPos(p);
    const terrain = p.resource ? RESOURCE_TERRAIN[p.resource] : null;
    const fill = terrain ? TERRAIN_COLORS[terrain] : "#ffffff";
    const ink = terrain ? (TERRAIN_ICON_INK[terrain] || "#ffffff") : "#2b2118";
    const ratio = p.resource ? "2:1" : "3:1";

    for (const vid of p.vertices) {
      const v = vertexById[vid];
      staticLayer.appendChild(el("line", {x1: pos.x, y1: pos.y, x2: v.x, y2: v.y, class: "port-link"}));
      staticLayer.appendChild(el("circle", {cx: v.x, cy: v.y, r: 5, fill, class: "port-vertex-mark"}));
    }

    staticLayer.appendChild(el("circle", {cx: pos.x, cy: pos.y + CAST, r: 19, class: "cast"}));
    staticLayer.appendChild(el("circle", {cx: pos.x, cy: pos.y, r: 18, fill, class: "port-marker"}));
    staticLayer.appendChild(el("use", {
      href: "#icon-ship", x: pos.x - 11, y: pos.y - 16, width: 22, height: 22, fill: ink, class: "port-ship",
    }));
    // Ratio text, raised 2px off the marker's own centre (was +12).
    staticLayer.appendChild(el("text", {x: pos.x, y: pos.y + 10, class: "port-label", text: ratio, fill: ink}));
  }

  // Dynamic layers, repopulated by render(). SVG paints in document order,
  // so later groups sit on top — roads before buildings so a settlement/city
  // at a road's endpoint isn't partly covered by it.
  //
  // The robber's target hexes go under all of them. They wash a whole tile
  // in accent colour, and every seat's pieces standing on that tile were
  // being tinted through it — two seats whose colours are already close stop
  // being tellable apart at exactly the moment you have to pick one to rob.
  // Only the targets take clicks, so the pieces above are pointer-transparent
  // (.pieces-layer) and a click anywhere on the tile still reaches the hex.
  //
  // The two kinds of build-target highlight split across buildings-layer
  // rather than sitting together: a phantom road's fat round-capped stroke
  // reaches past its own vertices, so it has to paint under buildings-layer
  // or it washes out over any settlement sitting at one end. A city-upgrade
  // target is the opposite — it's drawn exactly on top of the settlement
  // being upgraded on purpose — so it has to stay above buildings-layer or
  // the settlement's own circle would hide it completely.
  svg.appendChild(el("g", {id: "hex-target-layer"}));
  svg.appendChild(el("g", {id: "roads-layer", class: "pieces-layer"}));
  // A road being built drops into this one (playBuild), over the roads
  // already down and under the buildings.
  svg.appendChild(el("g", {id: "road-anim-layer", class: "pieces-layer"}));
  svg.appendChild(el("g", {id: "clickable-edge-layer"}));
  svg.appendChild(el("g", {id: "buildings-layer", class: "pieces-layer"}));
  svg.appendChild(el("g", {id: "robber-layer"}));
  svg.appendChild(el("g", {id: "clickable-layer"}));
}

// The engine's own Phase names (hexset.game.Phase) — plain English instead of
// the enum spelling for the status line; anything missing falls back to the
// raw name rather than disappearing.
const PHASE_LABELS = {
  SETUP_SETTLEMENT: "PLACE SETTLEMENT",
  SETUP_ROAD: "PLACE ROAD",
  ROLL: "ROLL",
  DISCARD: "DISCARD",
  ROBBER: "PLACE ROBBER",
  MAIN: "BUILD · BUY · TRADE",
  GAME_OVER: "GAME OVER",
};

// The one state where the phase does not describe what a seat is being asked
// to do. A seat holding its setup turn open (GameSession.awaiting_confirm)
// has already placed, and the engine's phase has moved on to the *next*
// seat's SETUP_SETTLEMENT — so the banner told a seat with nothing to place
// to place a settlement.
//
// This was briefly a general rule ("name the single kind of action on
// offer"), which is wrong: player-to-player trading is an engine event, not
// an action (see hexset.trading, and canTrade below gating on the phase
// rather than on legal_actions), so a MAIN phase offering nothing but
// END_TURN is a seat that can still trade. legal_actions is only the whole
// story outside MAIN, and MAIN is exactly where PHASE_LABELS was already
// right. One special case for one special state instead.
const HOLDING_SETUP_TURN_LABEL = "END TURN";

// --- Action grouping -------------------------------------------------------

const VERTEX_TYPES = new Set(["SETUP_SETTLEMENT", "BUILD_SETTLEMENT", "BUILD_CITY"]);
const EDGE_TYPES = new Set(["SETUP_ROAD", "BUILD_ROAD"]);
// PLAY_KNIGHT carries no operand any more (it only spends the card; the
// engine hands the robber move itself to a MOVE_ROBBER decision in the same
// Phase.ROBBER a seven enters), so it is a plain one-click card exactly like
// Road Building rather than a board target.
const SIMPLE_TYPES = new Set(["ROLL", "END_TURN", "BUY_DEV_CARD", "PLAY_ROAD_BUILDING", "PLAY_KNIGHT"]);

function groupActions(actions) {
  const g = {
    vertex: {}, edge: {}, robberByHex: {}, simple: {},
    monopoly: [], yearOfPlenty: [], bankTrade: [], discard: [],
  };
  for (const a of actions) {
    if (VERTEX_TYPES.has(a.type)) (g.vertex[a.a] = g.vertex[a.a] || []).push(a);
    else if (EDGE_TYPES.has(a.type)) (g.edge[a.a] = g.edge[a.a] || []).push(a);
    else if (a.type === "MOVE_ROBBER") (g.robberByHex[a.a] = g.robberByHex[a.a] || []).push(a);
    else if (SIMPLE_TYPES.has(a.type)) g.simple[a.type] = a;
    else if (a.type === "PLAY_MONOPOLY") g.monopoly.push(a);
    else if (a.type === "PLAY_YEAR_OF_PLENTY") g.yearOfPlenty.push(a);
    else if (a.type === "BANK_TRADE") g.bankTrade.push(a);
    else if (a.type === "DISCARD") g.discard.push(a);
  }
  return g;
}

// The robber move, or null if none is pending. A knight now forces one
// exactly the way a seven does -- playing it (devCardPlay) already sent the
// PLAY_KNIGHT action and gotten a fresh Phase.ROBBER state back, so by the
// time this is read there is only ever the one way in: MOVE_ROBBER targets,
// already on the board, with nothing else legal until one is answered.
function robberMove(g) {
  if (Object.keys(g.robberByHex).length) {
    return {targets: g.robberByHex};
  }
  return null;
}

// --- Sending actions --------------------------------------------------

// Nothing left for the loop to wait on: the game is over, or the move is
// this seat's and so the table cannot change without it.
//
// That second half stops being true the moment this seat broadcasts a trade
// offer. `to_move` stays here for the whole round while the other seats
// answer, and their answers are exactly what the page is waiting for — so a
// round with anyone still to answer is watched like anybody else's turn.
// Without this the offer goes out, settle() returns on its first line, and
// the accepts land on the server with nothing left running to fetch them.
// Asked of the game, not of the round on screen: pinned to a past round the
// board stands still but the game does not, and the poll behind it is what
// keeps the title honest (renderStatus/applyLive). Reading `state` here would
// have stopped the loop on whatever the replayed position happened to say.
function nothingToWatch() {
  // The newest view taken in, not the one on screen: while a turn plays back
  // the screen still shows the seat's own move, and the table has gone on.
  const live = newestView();
  if (live.game_over) return true;
  if (watching() || live.to_move !== live.seat) return false;
  return !((live.trade_round || {}).awaiting || []).length;
}

// Waiting for somebody else — a bot, or another person at this table.
//
// This used to be settle(), a loop of POST /api/advance that walked the bot
// cascade one seat per request. Nothing advances a seat from here now: a bot
// is a client like any other, running in the server and submitting its own
// moves through the same route this browser posts to, and the seat next to
// yours might be a person on their own phone. So the client's job is no
// longer to drive the table, only to watch it.
//
// And it watches by asking the table to tell it, not by asking again every
// second and a half: `after` is the version this page is showing, and the
// server holds the request until the table passes it. A bot's move reaches
// the board as fast as the bot played it, and an idle table costs one open
// request rather than forty a minute.
//
// It never sets inFlight — the reader's own actions must never queue behind
// a read that is deliberately sitting still — and it never applies a
// response older than what is already on screen, which is the one thing a
// request that can be seconds old has to guard against.
//
// A render per response, so whatever renderStatus() shows (see its "not our
// turn" branch) is the truth as of that response rather than a guess dressed
// up to look like progress. That was the point of the old per-seat request
// too, and it survives the change.
function settle() {
  const mine = ++watchSeq;  // retires whatever loop was already running
  // Watching, every move is somebody else's, so this never stops until the
  // game does — that is the whole of what a spectator's page does.
  if (nothingToWatch()) return;
  (async () => {
    while (mine === watchSeq) {
      // A seat reads its own view; a spectator has no token to read one
      // with, and asks for the table's public view instead.
      const route = watching() ? `/api/table/${tableCode}` : "/api/state";
      // Always the live view's version, never the one on screen. Pinned to a
      // past round `state.version` is the throwaway stand-in's, which means
      // nothing to this server (`api.Tables.replay_view` says so where it
      // sets it) — polling from it would be asking for changes since a
      // version that never existed here.
      let next = null;
      let stale = false;
      try {
        const res = await fetch(`${route}?after=${newestVersion()}&wait=20`, {headers: authHeaders()});
        // Seated, a 403 is a token gone stale. Watching while a token is
        // still kept means a reclaim that could not be asked at arrival.
        stale = watching() ? Boolean(tokenFor(tableCode)) : res.status === 403;
        next = await res.json();
      } catch (e) {
        next = null;
      }
      if (mine !== watchSeq) return;
      if (stale) {
        // Our token went stale under an open page: the server restarted, or
        // dropped the game from memory while this page slept. The seat is
        // still ours, so ask for it back and start over from the fresh view.
        const back = await reclaimSeat(tableCode);
        if (mine !== watchSeq) return;
        if (back && back !== "none") {
          location.reload();
          return;
        }
        if (back === "none") forgetSeat(tableCode);
      }
      if (!next || next.error || next.version === undefined) {
        // Never a tight loop, whatever the server said.
        await new Promise((done) => setTimeout(done, 1500));
        continue;
      }
      if (next.version > newestVersion()) applyLive(next);
      if (nothingToWatch()) return;
    }
  })();
}

// Where a live view lands. Following the game, that is the screen. Pinned to
// a past round it is `liveState`, behind the board — the position being read
// must not move under the reader, but the parts of the page that describe the
// *game* rather than the position should keep up with it, and the title is
// one (renderStatus reads liveView). This is the whole of why the poll is
// left running while a round is pinned.
function applyLive(next) {
  if (!replaying()) {
    takeView(next);
    return;
  }
  // What happens while a past round is up is not played back on leaving it.
  markSeen(next);
  liveState = next;
  noteActivity(liveState);
  noteGame(liveState);
  renderStatus();
}

// Leaving the page retires the loop with it: a long poll outliving its own
// document is a request nobody will ever read.
window.addEventListener("pagehide", () => { watchSeq++; });

// --- Playback -------------------------------------------------------------
//
// Each action shown as it happens. A view carries `feed`, every action as its
// own entry (hidden for this reader as the log is), numbered by its place in
// the game. A view whose feed holds entries another seat made is not drawn at
// once: it waits in `anim.queue`, the board as it stood before, and `pump`
// plays its entries one after another, then draws the view itself, which
// settles anything the entries could not say. An entry names itself in the
// caption over the board, leaves what it did to each seat's cards on that
// seat's row (`showBadge`), and moves what moved on the board: the dice, a
// piece placed, the robber. Once it has played, the position on screen moves
// on by it (`advance`): the rows, the hand and the board show the table as
// it stood after that entry, and not as it stood before the first of them.
// Each takes long enough to read, so how fast a turn goes by is that, or
// the bots' own time deciding where that is longer. A click on the board
// finishes everything queued.
//
// The seat's own moves are drawn at once (`takeView(view, {own: true})`): a
// roll still shows its dice and what each seat collected, over a board that
// has already moved on.
//
// Nothing is played back across a gap: an undo (a new `epoch`), a reader that
// has fallen out of the feed's window, a hidden tab, or a past round being
// read jumps straight to the view.

const anim = {
  queue: [],        // [{view, entries}], oldest first
  running: false,
  skip: false,      // finish whatever is playing, and the rest of the queue, at once
  epoch: null,      // the feed epoch of the newest view taken in
  last: -1,         // the newest feed entry taken in (played, queued or skipped)
  version: -1,      // the newest table version taken in, which the poll asks past
  view: null,       // the newest live view taken in, queued or shown
  playing: new Set(),  // running Web Animations, finished by a skip
};

const REDUCED_MOTION = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches ?? false;

// How long each part of an entry takes, in milliseconds. `read` is the least
// any entry with a caption is held for.
const PLAY_MS = {
  dice: 650, settle: 300, flash: 520, fly: 560, stagger: 70, drop: 360, robber: 480,
  read: 1500, badge: 3600, caption: 5000, gap: 60,
};

function feedOf(view) {
  return (view && view.feed) || {epoch: 0, events: []};
}

function lastEntry(view) {
  const events = feedOf(view).events;
  return events.length ? events[events.length - 1].n : -1;
}

// Marks everything in `view` as taken in, played or not.
function markSeen(view) {
  if (!view) return;
  const feed = feedOf(view);
  if (anim.epoch !== feed.epoch) { anim.epoch = feed.epoch; anim.last = -1; }
  anim.last = Math.max(anim.last, lastEntry(view));
  if (view.version !== undefined && view.version >= anim.version) {
    anim.version = view.version;
    anim.view = view;
  }
}

// The newest live view taken in: queued behind a playback, or on screen.
function newestView() {
  const live = liveView();
  return anim.view && (!live || anim.view.version > live.version) ? anim.view : live;
}

// The version the poll asks past: the newest taken in, queued views included,
// so a view waiting its turn is not fetched again.
function newestVersion() {
  return Math.max(liveView() ? liveView().version : -1, anim.version);
}

// The entries of `view` not yet taken in, or null where the page must jump
// to it instead of playing them.
function freshEntries(view) {
  const feed = feedOf(view);
  if (anim.epoch === null || feed.epoch !== anim.epoch || document.hidden) return null;
  const events = feed.events;
  if (events.length && events[0].n > anim.last + 1 && lastEntry(view) > anim.last) return null;
  return events.filter((e) => e.n > anim.last);
}

function jumpTo(view) {
  // Anything still queued is older than this, and goes.
  anim.queue = [];
  if (anim.running) anim.skip = true;
  finishAll();
  markSeen(view);
  state = view;
  clearAnimLayer();
  render();
}

// A view to show, by way of whatever it holds that has not been played.
// `own` is the answer to this seat's own move, drawn at once.
function takeView(view, {own = false} = {}) {
  const entries = freshEntries(view);
  if (entries === null) { jumpTo(view); return; }
  markSeen(view);
  if (own && !anim.running) {
    const before = state;
    state = view;
    render();
    endSound(before, view);
    for (const e of entries) {
      // Not awaited: the board is already drawn.
      if (e.kind === "roll") playRoll(e, before).then(() => badgesFor(e));
      else { soundFor(e); badgesFor(e); }
    }
    return;
  }
  if (!entries.length && !anim.running) {
    state = view;
    render();
    return;
  }
  anim.queue.push({view, entries});
  pump();
}

async function pump() {
  if (anim.running) return;
  anim.running = true;
  document.body.classList.add("playing");
  try {
    while (anim.queue.length) {
      const {view, entries} = anim.queue.shift();
      for (const group of groupEntries(entries)) {
        if (anim.skip) break;
        try {
          await playEntry(group);
        } catch (e) {
          // A missing row or a board the entry does not fit: show the view.
          break;
        }
      }
      if (!state || view.version >= state.version) {
        endSound(state, view);
        state = view;
      }
      clearAnimLayer();
      render();
    }
  } finally {
    anim.running = false;
    anim.skip = false;
    document.body.classList.remove("playing");
  }
}

// One seat's discards go to the engine a card at a time; they play as one.
function groupEntries(entries) {
  const out = [];
  for (const e of entries) {
    const prev = out[out.length - 1];
    if (e.kind === "discard" && prev && prev.kind === "discard" && prev.actor === e.actor) {
      prev.cards.push(e.card);
      // What the cards changed together: each card's own, the later over the earlier.
      for (const [seat, row] of Object.entries(e.after || {})) prev.after[seat] = {...prev.after[seat], ...row};
      continue;
    }
    out.push(e.kind === "discard" ? {...e, cards: [e.card], after: {...e.after}} : e);
  }
  return out;
}

function finishAll() {
  for (const a of [...anim.playing]) {
    try { a.finish(); } catch (e) { /* already gone */ }
  }
}

function track(animation) {
  anim.playing.add(animation);
  const done = animation.finished.catch(() => {}).then(() => anim.playing.delete(animation));
  if (anim.skip) animation.finish();
  return done;
}

function pause(ms) {
  if (anim.skip || ms <= 0) return Promise.resolve();
  // A pause is an animation of nothing, so a skip finishes it too.
  const stub = document.body.animate([{}, {}], {duration: ms});
  return track(stub);
}

// Whose turn an entry is part of: its actor, except a discard or a trade
// round's answer, which another seat makes during someone else's turn.
function turnOf(e) {
  if (e.kind === "discard") return null;
  if (e.kind === "round" && e.step !== "offer") return null;
  return e.actor;
}

async function playEntry(e) {
  const turn = turnOf(e);
  if (turn !== null && turn !== state.seat) {
    setSeatText(document.getElementById("phase"), turn, "'S", " TURN");
  }
  const caption = captionOf(e);
  // The badges always tell the newest caption's action; a roll, which the
  // dice tell, clears them.
  if (caption) { clearBadges(); showCaption(caption); }
  else if (e.kind === "roll") clearBadges();
  const held = caption ? pause(PLAY_MS.read) : Promise.resolve();
  switch (e.kind) {
    case "roll": await playRoll(e, state); break;
    case "build": await playBuild(e); break;
    case "robber": await playRobber(e); break;
    default: soundFor(e); break;
  }
  advance(e);
  badgesFor(e, {trades: false});
  await held;
  // The exchanges cleared with it, one at a time, each named.
  for (const trade of e.trades || []) {
    clearBadges();
    showCaption(tradeCaption(trade));
    sound("trade");
    advance(trade);
    tradeBadges(trade);
    await pause(PLAY_MS.read);
  }
  await pause(PLAY_MS.gap);
}

// Moves the position on screen on by one entry that has played, or by one
// exchange cleared with it: the piece it built, the hex it left the robber
// on, its roll on the roller's row, and its `after`, what it changed on each
// seat's row and in each hand this reader is shown. The rows, the hand, the
// pieces left to place and the board are drawn again from that; the phase
// and what the seat may do wait for the view the entry came in.
function advance(step) {
  const after = step.after || {};
  const next = {...state, players: state.players.map((p) => ({...p, ...(after[p.seat] || {})}))};
  if (step.kind === "build" && step.piece === "road") {
    next.edge_owner = state.edge_owner.slice();
    next.edge_owner[step.at] = step.actor;
  } else if (step.kind === "build") {
    next.vertex_owner = state.vertex_owner.slice();
    next.vertex_building = state.vertex_building.slice();
    next.vertex_owner[step.at] = step.actor;
    next.vertex_building[step.at] = step.piece === "city" ? 2 : 1;
  } else if (step.kind === "robber") {
    next.robber = step.hex;
  } else if (step.kind === "buy") {
    next.dev_cards_remaining = Math.max(0, (state.dev_cards_remaining ?? 0) - 1);
  } else if (step.kind === "roll") {
    next.last_roll = step.value;
    const roller = next.players.find((p) => p.seat === step.actor);
    if (roller) roller.last_roll = step.value;
  }
  // An action that moved cards to or from the bank says what it holds now.
  if (step.bank) next.bank = step.bank;
  state = next;
  renderPlayers();
  renderHand();
  renderBoardDynamic();
  renderPieceSupply();
  renderDeck();
  renderBank();
}

// --- What an entry says

// Another seat as a caption names it, by its colour name drawn in its colour
// ({seat}, capSeat); the seat whose turn it is goes unnamed, since the header
// says whose turn it is.
function who(seat) {
  return seat === state.seat ? "you" : {seat};
}

// What an entry says, as {parts, icon, seat}: `parts` are words, or a card
// drawn as its glyph ({card: resource}, {dev: kind}, or {card: null} for one
// this reader is not told); `icon`, the chip's sprite glyph, names the kind
// of action: the hammer building or buying, the star playing a development
// card, the bank or a port's ship trading with them, the robber, a card
// trading or discarding.
function cardParts(counts) {
  const out = [];
  const tally = {};
  for (const name of cardsOf(counts)) tally[name] = (tally[name] || 0) + 1;
  for (const [name, n] of Object.entries(tally)) {
    if (n > 1) out.push(String(n));
    out.push({card: name});
  }
  return out.length ? out : ["nothing"];
}

function captionOf(e) {
  const say = (parts, icon, seat = e.actor) => ({parts, icon, seat});
  switch (e.kind) {
    case "roll": return null;  // the dice say it
    case "build": return say([`${e.setup ? "Placed" : "Built"} a ${e.piece}`], "hammer");
    case "buy": return say(["Bought", {dev: null}], "hammer");
    case "play":
      if (e.card === "Monopoly") {
        const total = Object.values(e.taken || {}).reduce((a, b) => a + b, 0);
        return say(["Played", {dev: e.card}, "for", String(total), {card: e.resource}], "dev-card");
      }
      if (e.card === "Year Of Plenty") {
        return say(["Played", {dev: e.card}, "for", ...(e.resources || []).map((r) => ({card: r}))], "dev-card");
      }
      return say(["Played", {dev: e.card}], "dev-card");
    case "robber":
      if (e.victim === null || e.victim === undefined) return say(["Moved the robber"], "robber");
      if (!e.stole) return say(["Moved the robber:", who(e.victim), "had no cards"], "robber");
      return say(["Stole", {card: e.card || null}, "from", who(e.victim)], "robber");
    case "bank": {
      // Four for one is the bank's rate; fewer is a port's.
      const given = Object.values(e.gave || {}).reduce((a, b) => a + b, 0);
      return say(["Traded", ...cardParts(e.gave), "for", ...cardParts(e.got)], given >= 4 ? "bank" : "ship");
    }
    case "discard": {
      const known = e.cards.filter(Boolean);
      const cards = known.length === e.cards.length
        ? cardParts(Object.fromEntries(known.map((c) => [c, known.filter((k) => k === c).length])))
        : [String(e.cards.length), {card: null}];
      return say([e.actor === state.seat ? "You" : who(e.actor), "discarded", ...cards], "card");
    }
    case "round":
      if (e.step !== "offer" || !e.bundle) return null;
      return say(["Offered", ...cardParts(e.bundle.map((n) => Math.max(0, -n))), "for",
        ...cardParts(e.bundle.map((n) => Math.max(0, n)))], "card");
    default: return null;  // a `trade` entry's `trades` say it
  }
}

function tradeCaption(t) {
  // `t.a` is the seat whose turn it is.
  return {parts: ["Traded", ...cardParts(t.gave), "to", who(t.b), "for", ...cardParts(t.got)], icon: "card", seat: t.a};
}

// A card in a caption: its glyph alone, a resource's in its terrain's colour
// (lightened where the tile is too dark to read on the pill).
const CAPTION_INK = {Wood: "#46ad55", Brick: "#e08a62", Sheep: "#b4e48a", Wheat: "#e8b13a", Ore: "#a9b5c6"};

function capCard(part) {
  const glyph = html("span", {class: "cap-glyph"});
  if (part.dev !== undefined) {
    glyph.title = part.dev || "Development card";
    glyph.appendChild(iconSvg(part.dev ? DEV_CARD_ICONS[part.dev] : "dev-card", {fill: "#e8eaf0"}));
  } else if (part.card) {
    glyph.title = part.card;
    glyph.appendChild(iconSvg(RESOURCE_ICONS[part.card], {fill: CAPTION_INK[part.card]}));
  } else {
    glyph.title = "A card";
    glyph.appendChild(iconSvg("card", {fill: "#8b93a5"}));
  }
  return glyph;
}

// --- Where things are

function animLayer() {
  let layer = document.getElementById("anim-layer");
  if (!layer) {
    layer = el("g", {id: "anim-layer"});
    // Under the robber and the click targets, over everything already built.
    const robber = document.getElementById("robber-layer");
    robber.parentNode.insertBefore(layer, robber);
  }
  return layer;
}

function clearAnimLayer() {
  for (const id of ["anim-layer", "road-anim-layer"]) {
    const layer = document.getElementById(id);
    if (layer) layer.innerHTML = "";
  }
  document.getElementById("fly-layer").innerHTML = "";
}

function seatRow(seat) {
  return document.querySelector(`#players .player-row[data-seat="${seat}"]`);
}

// A board point, in the page's own pixels.
function onScreen(point) {
  const ctm = document.getElementById("board-svg").getScreenCTM();
  return ctm ? new DOMPoint(point.x, point.y).matrixTransform(ctm) : null;
}

function cardsOf(counts) {
  const out = [];
  if (Array.isArray(counts)) {
    counts.forEach((n, r) => { for (let i = 0; i < n; i++) out.push(board.resources[r]); });
  } else {
    for (const [name, n] of Object.entries(counts || {})) for (let i = 0; i < n; i++) out.push(name);
  }
  return out;
}

// --- The captions over the board
//
// Additive: each action adds a pill at the bottom of the stack, the ones
// before it dim and rise, and a fourth pushes the oldest out. Each pill goes
// on its own a little after it came, so a quiet table clears itself.

const CAPTIONS_SHOWN = 3;

function showCaption({parts, icon, seat}) {
  const stack = document.getElementById("captions");
  const color = SEAT_COLORS[seat] || {fill: "#8b93a5", stroke: "#3a3f4c"};
  const pill = html("div", {class: "caption arrive"});
  pill.style.setProperty("--seat", color.fill);
  const chip = html("span", {class: "cap-chip"});
  chip.appendChild(["road", "settlement", "city"].includes(icon) ? pieceGlyph(icon, color) : iconSvg(icon));
  pill.appendChild(chip);
  const text = html("span", {class: "cap-text"});
  for (const part of parts) {
    if (typeof part === "string") {
      const word = html("span", {});
      word.textContent = part;
      text.appendChild(word);
    } else if (part.seat !== undefined) {
      const name = html("span", {class: "cap-seat"});
      name.textContent = colorName(part.seat);
      name.style.color = SEAT_COLORS[part.seat].fill;
      text.appendChild(name);
    } else {
      text.appendChild(capCard(part));
    }
  }
  pill.appendChild(text);
  for (const older of stack.children) older.classList.add("older");
  stack.appendChild(pill);
  while (stack.children.length > CAPTIONS_SHOWN) stack.firstElementChild.remove();
  setTimeout(() => {
    pill.classList.add("gone");
    setTimeout(() => pill.remove(), 400);
  }, PLAY_MS.caption);
}

function clearCaptions() {
  document.getElementById("captions").innerHTML = "";
}

// --- What each seat's cards did, on its row
//
// `rowBadges` outlives the row itself: renderPlayers rebuilds every row on
// each render and puts back any badge still showing.

const rowBadges = new Map();  // seat -> {items: [{card, n}], until}

// `items` is [{card, n}]: `card` a resource name, "dev" for a development
// card, or null for a card this reader is not told; `n` signed.
function showBadge(seat, items) {
  items = items.filter((it) => it.n);
  if (!items.length) return;
  rowBadges.set(seat, {items, until: performance.now() + PLAY_MS.badge});
  const row = document.querySelector(`#players .player-row[data-seat="${seat}"]`);
  if (row) attachBadge(row, seat);
  setTimeout(() => {
    const entry = rowBadges.get(seat);
    if (entry && entry.until <= performance.now()) {
      rowBadges.delete(seat);
      const shown = document.querySelector(`#players .player-row[data-seat="${seat}"] .row-badge`);
