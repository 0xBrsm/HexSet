// How far past TAIL_MAX a lone bubble's tail may reach where nothing nearer
// is free (`placeBubble`); 1 otherwise.
let tailReach = 1;
// Whether a bubble's tails may differ in length, leave from both its flat
// edges and its round ends, and meet a road at a point along it from any
// side (`tailsFor`, `tailTo`): only for a bubble with no spot otherwise.
let tailLoose = false;
// The length a tail reads best at: shorter ones are taken only where nothing else fits.
const TAIL_GOOD = 15;
const TAIL_MAX = 44;

// A bubble's outline (a pill: box `b`, or the box in its own frame) as a
// path around it, clockwise from the left end of its top: `at(s)` the point
// `s` along it and its outward normal, `along(p)` the position of the point on
// it nearest `p`, `length` the whole way round.
function pillPath(b, inset = 0) {
  const r = b.h / 2 - inset, top = b.top + inset, bot = b.top + b.h - inset, cy = b.top + b.h / 2;
  const xa = b.left + b.h / 2, xb = b.left + b.w - b.h / 2, run = Math.max(0, xb - xa), arc = Math.PI * r;
  const length = 2 * run + 2 * arc;
  const at = (s) => {
    s = ((s % length) + length) % length;
    if (s < run) return {p: [xa + s, top], n: [0, -1]};
    s -= run;
    if (s < arc) { const a = -Math.PI / 2 + s / r; return {p: [xb + r * Math.cos(a), cy + r * Math.sin(a)], n: [Math.cos(a), Math.sin(a)]}; }
    s -= arc;
    if (s < run) return {p: [xb - s, bot], n: [0, 1]};
    s -= run;
    const a = Math.PI / 2 + s / r;
    return {p: [xa + r * Math.cos(a), cy + r * Math.sin(a)], n: [Math.cos(a), Math.sin(a)]};
  };
  const along = ([x, y]) => {
    if (x >= xa && x <= xb) return y < cy ? x - xa : run + arc + (xb - x);
    if (x > xb) { const a = Math.atan2(y - cy, x - xb); return run + (a + Math.PI / 2) * r; }
    let a = Math.atan2(y - cy, x - xa); if (a < Math.PI / 2) a += 2 * Math.PI;
    return 2 * run + arc + (a - Math.PI / 2) * r;
  };
  return {at, along, length, run, arc, r, xa, xb, cy};
}

// The tail from box `b` to place `t`, square to the bubble's outline where
// it leaves it: from the straight run of its top or bottom, or from a round
// end. A road (`t.seg`) is met square-on at its centre; any other place at
// the edge of its ring (`t.r`). `{base, tip, len, edge, s}` (`s` the base's
// position round the outline) or `null` where no tail fits; with `flatOnly`,
// from the top or bottom only.
function tailTo(b, t, flatOnly = false) {
  const path = pillPath(b);
  const lo = path.xa + TAIL_HALF + 2, hi = path.xb - TAIL_HALF - 2;
  const options = [];
  const consider = (base, tip, edge) => {
    const len = Math.hypot(tip[0] - base[0], tip[1] - base[1]);
    if (len >= TAIL_MIN && len <= TAIL_MAX * tailReach) options.push({base, tip, len, edge, s: path.along(base)});
  };
  if (t.seg) {
    const [x0, y0, x1, y1] = t.seg;
    const len = Math.hypot(x1 - x0, y1 - y0) || 1;
    const ux = (x1 - x0) / len, uy = (y1 - y0) / len;
    const tip = [(x0 + x1) / 2, (y0 + y1) / 2];
    // The road's normal pointing towards the bubble.
    let n = [-uy, ux];
    if ((b.left + b.w / 2 - tip[0]) * n[0] + (path.cy - tip[1]) * n[1] < 0) n = [-n[0], -n[1]];
    // From a flat edge: the tail runs along the normal to the edge's line.
    for (const [ey, edge] of [[b.top, "top"], [b.top + b.h, "bottom"]]) {
      if (Math.abs(n[1]) < 0.35) continue;
      const L = (ey - tip[1]) / n[1];
      const bx = tip[0] + n[0] * L;
      if (L > 0 && bx >= lo && bx <= hi) consider([bx, ey], tip, edge);
    }
    // From a round end: where the normal's line meets the end's arc, the
    // tail leaving the arc no more than 35 degrees off square.
    if (!flatOnly) {
      for (const [cx, edge] of [[path.xa, "left"], [path.xb, "right"]]) {
        const dx = tip[0] - cx, dy = tip[1] - path.cy, r = path.r;
        const B = dx * n[0] + dy * n[1], C = dx * dx + dy * dy - r * r;
        const disc = B * B - C;
        if (disc < 0) continue;
        for (const L of [-B - Math.sqrt(disc), -B + Math.sqrt(disc)]) {
          if (L <= 0) continue;
          const base = [tip[0] + n[0] * L, tip[1] + n[1] * L];
          const out = [(base[0] - cx) / r, (base[1] - path.cy) / r];
          if ((edge === "left" ? out[0] > -0.05 : out[0] < 0.05)) continue;
          if (-(out[0] * n[0] + out[1] * n[1]) < 0.82) continue;
          consider(base, tip, edge);
        }
      }
    }
  } else {
    for (const [ey, edge, way] of [[b.top, "top", -1], [b.top + b.h, "bottom", 1]]) {
      if ((t.y - ey) * way <= t.r + TAIL_MIN * 0.5) continue;
      const bx = Math.max(lo, Math.min(hi, t.x));
      const d = Math.hypot(t.x - bx, t.y - ey) || 1;
      if (Math.abs(t.x - bx) / d > 0.77) continue;
      consider([bx, ey], [t.x - ((t.x - bx) / d) * (t.r + 2), t.y - ((t.y - ey) / d) * (t.r + 2)], edge);
    }
    if (!flatOnly) {
      for (const [cx, edge] of [[path.xa, "left"], [path.xb, "right"]]) {
        const d = Math.hypot(t.x - cx, t.y - path.cy) || 1, u = [(t.x - cx) / d, (t.y - path.cy) / d];
        if (edge === "left" ? u[0] > -0.05 : u[0] < 0.05) continue;
        const base = [cx + u[0] * path.r, path.cy + u[1] * path.r];
        consider(base, [t.x - u[0] * (t.r + 2), t.y - u[1] * (t.r + 2)], edge);
      }
    }
  }
  // A road no tail meets square-on, in a bubble of several places whose
  // tails need not match (`tailLoose`), is met from any side at its centre,
  // or at the point `t.f` along it (`tailsFor`).
  if (!options.length && t.seg && tailLoose) {
    const [x0, y0, x1, y1] = t.seg, f = t.f ?? 0.5;
    return tailTo(b, {x: x0 + (x1 - x0) * f, y: y0 + (y1 - y0) * f, r: 3}, flatOnly);
  }
  if (!options.length) return null;
  const flat = options.filter((o) => o.edge === "top" || o.edge === "bottom").sort((p, q) => p.len - q.len)[0];
  const any = options.sort((p, q) => p.len - q.len)[0];
  // A round end's tail only where it is clearly shorter.
  return flat && any !== flat && any.len + 8 > flat.len ? flat : any;
}

// The tails from box `b` to each of `points` (`tailTo`), or `null` where any
// has none, or where they would not sit well together: tails leaving the
// outline too close together, tails crossing or running into each other
// anywhere along their length (each tail reads on its own), lengths far
// apart, or some from the flat edges and some from the ends. With
// `tailLoose`, a road no tail meets square-on is met at points along it
// (its centre first) until the tails sit apart.
function tailsFor(b, points) {
  const along = [0.5, 0.65, 0.35, 0.8, 0.2];
  const tries = points.map((t) => (tailLoose && t.seg ? along : [null]));
  let n = 1;
  for (const t of tries) n *= t.length;
  for (let k = 0; k < Math.min(n, 125); k++) {
    let rest = k;
    const at = tries.map((t) => { const f = t[rest % t.length]; rest = Math.floor(rest / t.length); return f; });
    const tails = tailsAt(b, points.map((t, i) => (at[i] === null ? t : {...t, f: at[i]})));
    if (tails) return tails;
  }
  return null;
}

function tailsAt(b, points) {
  let tails = points.map((t) => tailTo(b, t));
  if (tails.some((t) => !t)) return null;
  const isEnd = (t) => t.edge === "left" || t.edge === "right";
  if (!tailLoose && tails.some(isEnd) && !tails.every(isEnd)) {
    tails = points.map((t) => tailTo(b, t, true));
    if (tails.some((t) => !t)) return null;
  }
  const path = pillPath(b);
  const lerp = (t, u) => [t.base[0] + (t.tip[0] - t.base[0]) * u, t.base[1] + (t.tip[1] - t.base[1]) * u];
  for (let i = 0; i < tails.length; i++) {
    for (let j = i + 1; j < tails.length; j++) {
      const a = tails[i], c = tails[j];
      const gap = Math.abs(a.s - c.s), round = Math.min(gap, path.length - gap);
      if (round < 2 * TAIL_HALF + 4) return null;
      if (crosses(a.base, a.tip, c.base, c.tip)) return null;
      // Two tails narrow from 2 * TAIL_HALF at the bubble to a point: kept
      // TAIL_APART pixels apart all the way, they never run into one wedge.
      for (const u of [0, 0.25, 0.5, 0.75, 1]) {
        const p = lerp(a, u), q = lerp(c, u);
        if (Math.hypot(p[0] - q[0], p[1] - q[1]) < 2 * TAIL_HALF * (1 - u) + TAIL_APART) return null;
      }
    }
  }
  const lens = tails.map((t) => t.len);
  if (!tailLoose && Math.max(...lens) > Math.min(...lens) * 1.6 + 4) return null;
  return tails;
}

// How far point `p` lies outside box `b`'s pill (negative inside).
function pillGap(b, [x, y]) {
  const r = b.h / 2, cy = b.top + r, xa = b.left + r, xb = b.left + b.w - r;
  return Math.hypot(x - Math.max(xa, Math.min(xb, x)), y - cy) - r;
}

// Whether segment `p`-`q` passes through box `o` (shrunk a little, so a tail
// may graze a box's corner).
function segmentHits(p, q, o) {
  const l = o.left + 2, r = o.left + o.w - 2, t = o.top + 2, btm = o.top + o.h - 2;
  if (r <= l || btm <= t) return false;
  let t0 = 0, t1 = 1;
  const dx = q[0] - p[0], dy = q[1] - p[1];
  for (const [num, den] of [[p[0] - l, -dx], [r - p[0], dx], [p[1] - t, -dy], [btm - p[1], dy]]) {
    if (den === 0) { if (num < 0) return false; continue; }
    const v = num / den;
    if (den < 0) t0 = Math.max(t0, v); else t1 = Math.min(t1, v);
    if (t0 > t1) return false;
  }
  return true;
}

function crosses(p, q, r, s) {
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  return cross(p, q, r) * cross(p, q, s) < 0 && cross(r, s, p) * cross(r, s, q) < 0;
}

// The bubble and its `tails` drawn as one shape: its outline walked all the
// way round, running out to each tail's point and back where the tail leaves
// it, in the bubble's fill and edge, so a tail is part of the bubble at any
// zoom. The bubble's own background and border step aside for it (`.tailed`).
let guideFillSerial = 0;
function drawBubble(bubble, b, tails) {
  const style = getComputedStyle(bubble);
  const bw = parseFloat(style.borderTopWidth) || 0;
  const local = {left: 0, top: 0, w: b.w, h: b.h};
  const path = pillPath(local, bw / 2);
  const f = (v) => v.toFixed(1);
  const cuts = tails.map((t) => ({s: pillPath(local, bw / 2).along([t.base[0] - b.left, t.base[1] - b.top]),
                                  tip: [t.tip[0] - b.left, t.tip[1] - b.top]})).sort((p, q) => p.s - q.s);
  const pts = [];
  let s = 0;
  const walkTo = (end) => { for (; s < end; s += 2) pts.push(path.at(s).p); };
  for (const c of cuts) {
    walkTo(c.s - TAIL_HALF);
    pts.push(path.at(c.s - TAIL_HALF).p, c.tip, path.at(c.s + TAIL_HALF).p);
    s = c.s + TAIL_HALF;
  }
  walkTo(path.length);
  const d = "M " + pts.map(([x, y]) => `${f(x)} ${f(y)}`).join(" L ") + " Z";
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "guide-shape");
  svg.style.left = `${-bw}px`;
  svg.style.top = `${-bw}px`;
  const shape = document.createElementNS("http://www.w3.org/2000/svg", "path");
  shape.setAttribute("d", d);
  shape.style.fill = style.backgroundColor;
  // A bubble filled with a gradient (Brilliant's platinum) fills its shape,
  // tails and all, with the same gradient, top to bottom over the bubble.
  const stops = style.backgroundImage.startsWith("linear-gradient")
    ? [...style.backgroundImage.matchAll(/(rgba?\([^)]*\)|#[0-9a-fA-F]{3,8})\s+([\d.]+)%/g)] : [];
  if (stops.length) {
    const ns = "http://www.w3.org/2000/svg";
    const id = `guide-fill-${++guideFillSerial}`;
    const gradient = document.createElementNS(ns, "linearGradient");
    gradient.setAttribute("id", id);
    gradient.setAttribute("gradientUnits", "userSpaceOnUse");
    for (const [k, v] of [["x1", 0], ["y1", 0], ["x2", 0], ["y2", b.h]]) gradient.setAttribute(k, v);
    for (const [, color, at] of stops) {
      const stop = document.createElementNS(ns, "stop");
      stop.setAttribute("offset", `${at}%`);
      stop.setAttribute("stop-color", color);
      gradient.appendChild(stop);
    }
    const defs = document.createElementNS(ns, "defs");
    defs.appendChild(gradient);
    svg.appendChild(defs);
    shape.style.fill = `url(#${id})`;
  }
  shape.style.stroke = style.borderTopColor;
  shape.style.strokeWidth = `${bw}px`;
  shape.style.strokeLinejoin = "round";
  svg.appendChild(shape);
  bubble.classList.add("tailed");
  bubble.prepend(svg);
}

// The order a hand's bubbles take on a line of their own.
const GUIDE_GRADE_ORDER = ["brilliant", "best", "good", "inaccuracy", "mistake", "blunder", "forced"];

// The development card in the hand that `action` plays, or null.
function heldCard(action) {
  const dev = action && PLAYED_CARDS[action.type];
  return dev ? document.querySelector(`#hand .card[data-dev="${dev}"]`) : null;
}

// The cards in the hand `action` is about: the development card it plays, or
// for a whole discard the resource cards it gives that the hand still holds.
function heldCards(action) {
  if (action && action.type === "DISCARD_CARDS") {
    return (action.cards || []).flatMap((n, r) => {
      const card = n && document.querySelector(`#hand .card[data-resource="${board.resources[r]}"]`);
      return card ? [card] : [];
    });
  }
  const card = heldCard(action);
  return card ? [card] : [];
}

// The hand's row of resource cards.
function handResourceRow() {
  return document.querySelector("#hand .hand-col:first-child .hand");
}

// The height, in pixels, the hand keeps free under the development cards for
// the guide's bubbles (`placeInHand`), and the height this render wants.
// The guide's bubbles for cards in the hand (`entries`, each `{bubble, kind,
// actions}`: one grade, its bubble built, the moves that play its cards). The
// hand has no room above its cards, where the heading is, so each card is
// marked on itself, ringed in its grade's colour as a place on the board is
// ringed, and each grade's bubble, its grade's word always in it and with no
// tail (the rings say which cards), stands:
// - after the last card of the row the ringed cards are on, side by side in
//   grade order, where every ringed card is on that one row and the bubbles
//   fit there;
// - else on a line of its own under the development cards, left-aligned under
//   the first card it marks, over whatever is below the hand (the hand never
//   grows for it), or above the cards where that runs past the window's foot:
//   several grades side by side on that line where they fit, else one a line
//   in a column left-aligned under the first marked card, Brilliant first.
// The headings, the cards and their counts stay in sight. `[]` takes every
// ring away.
function placeInHand(entries) {
  document.querySelectorAll("#hand .card.guide-ring").forEach((c) => {
    c.classList.remove("guide-ring", ...GUIDE_GRADE_ORDER.map((k) => `ring-${k}`));
    c.style.removeProperty("--ring");
  });
  // A whole discard that gave every card of its kinds rings nothing and
  // stands after the resource row.
  const held = entries.map((e) => ({...e, cards: e.actions.flatMap(heldCards),
    row: e.actions.some((a) => a.type === "DISCARD_CARDS") ? handResourceRow() : null}))
    .filter((e) => e.cards.length || e.row);
  if (!held.length) return;
  held.sort((a, b) => GUIDE_GRADE_ORDER.indexOf(a.kind) - GUIDE_GRADE_ORDER.indexOf(b.kind));
  for (const e of held) {
    for (const c of e.cards) {
      c.classList.add("guide-ring", `ring-${e.kind}`);
      c.style.setProperty("--ring", `var(--grade-${e.kind}, #6aa8ff)`);
    }
  }
  const layer = document.getElementById("guide-float");
  for (const e of held) {
    e.bubble.classList.add("in-hand");
    layer.appendChild(e.bubble);
  }
  const gap = 6;
  const rowOf = held[0].cards.length ? held[0].cards[0].parentElement : held[0].row;
  // Within the column the cards are in: a resource row's bubbles never reach
  // into the development cards beside it.
  const column = rowOf.closest(".hand-col") || document.getElementById("hand");
  const right = Math.min(window.innerWidth, column.getBoundingClientRect().right) - 3;
  const box = (c) => c.getBoundingClientRect();
  const cards = [...rowOf.querySelectorAll(":scope > .card")];
  const sameRow = (a, b) => Math.abs(box(a).top - box(b).top) < 4;
  const ringed = held.flatMap((e) => e.cards);
  const across = held.reduce((t, e) => t + e.bubble.offsetWidth, 0) + gap * (held.length - 1);
  const put = (e, left, top, edge = right) => {
    const w = e.bubble.offsetWidth, h = e.bubble.offsetHeight;
    const b = {left: Math.max(3, Math.min(left, edge - w)), top, w, h};
    e.bubble.style.transform = `translate(${b.left.toFixed(1)}px, ${b.top.toFixed(1)}px)`;
    guideFloatPlaced.push(b);
  };
  if (!ringed.length) {
    // Nothing left to ring: after the row's last card, or at its start.
    const last = cards.length ? box(cards.at(-1)) : box(rowOf);
    let x = cards.length ? last.right + 6 : last.left;
    for (const e of held) {
      put(e, x, last.top + (cards.length ? last.height / 2 : 0) - (cards.length ? e.bubble.offsetHeight / 2 : 0));
      x += e.bubble.offsetWidth + gap;
    }
    return;
  }
  if (ringed.every((c) => sameRow(c, ringed[0]))) {
    const last = box(cards.filter((c) => sameRow(c, ringed[0])).at(-1));
    if (last.right + 6 + across <= right) {
      let x = last.right + 6;
      for (const e of held) {
        put(e, x, last.top + last.height / 2 - e.bubble.offsetHeight / 2);
        x += e.bubble.offsetWidth + gap;
      }
      return;
    }
  }
  // Over the cards' heading, across the hand's whole width, on a desktop,
  // where the strip under the hand is a control to keep clear; elsewhere
  // under the cards, over whatever is below the hand, or above them where
  // that runs past the window's foot. Either way they float over the page
  // and move nothing.
  const firstLeft = (e) => Math.min(...e.cards.map((c) => box(c).left));
  const h = Math.max(...held.map((e) => e.bubble.offsetHeight));
  const wide = Math.min(window.innerWidth, document.getElementById("hand").getBoundingClientRect().right) - 3;
  const oneLine = Math.min(...held.map(firstLeft)) + across <= wide;
  const tall = (oneLine ? 1 : held.length) * (h + gap) - gap;
  const under = Math.max(...cards.map((c) => box(c).bottom)) + 8;
  const above = Math.max(3, Math.min(...cards.map((c) => box(c).top)) - 6 - tall);
  const foot = !reviewCovers() || under + tall > window.innerHeight - 3 ? above : under;
  if (oneLine) {
    let x = firstLeft(held[0]);
    for (const e of held) { put(e, x, foot, wide); x += e.bubble.offsetWidth + gap; }
  } else {
    // One column, left-aligned under the first marked card, Brilliant first.
    const left = Math.min(...held.map(firstLeft));
    held.forEach((e, i) => put(e, left, foot + i * (h + gap)));
  }
}

// Each of `items` (with `anchor`) its own copy of `bubble`, placed in the
// order that leaves none at its default spot where one exists: the order
// given, else reversed. `wire(copy)` gives each copy its handlers.
function placeEach(bubble, items, layer, placed, avoid, wire) {
  for (const order of [items, [...items].reverse()]) {
    const mark = placed.length, made = [];
    let fell = false;
    for (const item of order) {
      const own = bubble.cloneNode(true);
      wire(own);
      made.push(own);
      if (placeBubble(own, item.anchor, layer, placed, null, avoid) === "fallback") fell = true;
    }
    if (!fell || order !== items) return made;
    for (const own of made) own.remove();
    placed.length = mark;
  }
  return [];
}

// How far apart, in the board's own units, the places of good moves may be
// and still share a bubble: one hex, corner to corner (a hex's corners are 60
// from its centre, `board_layout`), with a little over for the places on its
// edge.
const GUIDE_MERGE = 132;

// `items` (each with `action` and `anchor`) in groups, each with the anchor its
// bubble stands at (above the group's highest place, centred on them) and the
// places its arrows point at. Good moves (`gradeOf`) whose places all lie
// within GUIDE_MERGE of each other share one bubble, whatever their kind, since
// they are all as good; a move of any other grade has its own (one best move,
// each brilliant move a find of its own). A move at a corner button, or with
// no place of its own, is never merged.
function guideGroups(items, gradeOf) {
  const o = onScreen({x: 0, y: 0}), u = onScreen({x: 1, y: 0});
  const reach = GUIDE_MERGE * (o && u ? Math.hypot(u.x - o.x, u.y - o.y) : 1);
  const at = (i) => [i.anchor.px ?? i.anchor.x, i.anchor.py ?? i.anchor.y];
  // Good moves at the bank's piles and the deck share one bubble, met from
  // the bank's open side, wherever along the bank they are; they never share
  // one with a move on the board.
  const merges = (i) => gradeOf(i) === "good" && i.anchor.dir !== "left" && !i.anchor.named && !i.anchor.float;
  const together = (a, b) => (a.anchor.bank ? b.anchor.bank === a.anchor.bank : !b.anchor.bank
    && Math.hypot(at(b)[0] - at(a)[0], at(b)[1] - at(a)[1]) <= reach);
  const groups = [];
  for (const item of items) {
    const near = merges(item) && groups.find((g) => g.items.every((other) => merges(other) && together(item, other)));
    if (near) near.items.push(item); else groups.push({items: [item]});
  }
  for (const g of groups) {
    const anchors = g.items.map((i) => i.anchor);
    if (anchors.length === 1) { g.anchor = anchors[0]; g.targets = null; continue; }
    const top = anchors.reduce((a, b) => (b.y < a.y ? b : a));
    g.anchor = {...top, x: anchors.reduce((t, a) => t + a.x, 0) / anchors.length};
    // One arrow to each place: moves at the same place (two trades for the
    // same card, at its pile) share it.
    const seen = new Set();
    g.targets = anchors.map((a) => ({x: a.px ?? a.x, y: a.py ?? a.y, r: a.pr || 0, seg: a.seg}))
      .filter((t) => { const k = `${Math.round(t.x)},${Math.round(t.y)}`; return seen.has(k) ? false : (seen.add(k), true); });
    if (g.targets.length === 1) g.targets = null;
  }
  return groups;
}

// Moves in one line: "Robber on 6 Ore or 9 Ore", "Trade Wood for
// Ore or Wheat", the words they open with said once, three with a serial comma.
// A move after the first opens in lower case ("Buy a development card or
// trade Sheep for Brick"); a card's name and a resource keep their capitals.
function groupName(actions) {
  const names = actions.map(shortMove);
  if (names.length === 1) return names[0];
  const list = (xs) => (xs.length === 2 ? `${xs[0]} or ${xs[1]}` : `${xs.slice(0, -1).join(", ")}, or ${xs.at(-1)}`);
  const res = (i) => board.resources[i] || "a card";
  if (actions.every((a) => a.type === "BANK_TRADE")) {
    if (actions.every((a) => a.a === actions[0].a)) return `Trade ${res(actions[0].a)} for ${list(actions.map((a) => res(a.b)))}`;
    if (actions.every((a) => a.b === actions[0].b)) return `Trade ${list(actions.map((a) => res(a.a)))} for ${res(actions[0].b)}`;
  }
  const words = names.map((n) => n.split(" "));
  let k = 0;
  while (words.every((w) => w.length > k + 1 && w[k] === words[0][k])) k++;
  if (k) return `${words[0].slice(0, k).join(" ")} ${list(words.map((w) => w.slice(k).join(" ")))}`;
  const lower = (n) => (/^(Monopoly|Year of Plenty)\b/.test(n) ? n : n[0].toLowerCase() + n.slice(1));
  return list(names.map((n, i) => (i ? lower(n) : n)));
}

// A group whose moves are of more than one kind and share no reason
// (`whyOf` gives none) is split into a group a kind (`regroup`), so every
// card says a reason true of all its moves.
function explainedGroups(groups, whyOf, regroup) {
  return groups.flatMap((g) => {
    const kinds = [...new Set(g.items.map((i) => i.action.type))];
    if (kinds.length < 2 || whyOf(g.items)) return [g];
    return kinds.flatMap((type) => regroup(g.items.filter((i) => i.action.type === type)));
  });
}

// The guide on the board. While a hint is up: a bubble at each of its
// candidates with the win chance it leaves, the search's own lit in the
// seat's colour and ringed. Otherwise the last graded move: a bubble at the
// move with its grade, a flagged one with the guide's move ringed and its
// win chance beside it; a tap opens it to say what the guide would have
// played, with Take back. A best or good move's bubble fades after
// GUIDE_PRAISE_MS, a flagged one's (and its ring) after GUIDE_NOTE_MS unless
// opened; a tap on the board's empty space puts either away at once.
// The bubbles placed on the page's layer this render (placeBubble).
let guideFloatPlaced = [];
// That layer lives at the page's top level: inside the board pane, which
// isolates its own stacking, it would draw under the rows beside the board.
document.body.appendChild(document.getElementById("guide-float"));
// The hint and the notes a tap on the board's empty space put away, by key.
const guideDismissed = new Set();

// Text for innerHTML. A spot named by its numbers ("the 9-12") never breaks
// at its hyphens.
function escapeText(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]))
    .replace(/\d+(?:-\d+)+/g, (m) => `<span class="nowrap">${m}</span>`);
}

// Where a flagged move's note points instead: the moves about as good as the
// best (a note's `better`, the best first), in general terms. A single move is
// named. Otherwise each kind of move is named by what it does ("end your
// turn", "build a road"), and moves of the played move's own kind point to
// their rings on the board ("one of the marked roads").
// What each kind of better move says on its own ("buy a development card"),
// and for the played move's own kind, marked on the board, the verb and the
// thing marked ("build" "the marked road" / "one of the marked roads").
const BETTER_KINDS = {
  BUILD_ROAD: ["build a road", "build", "road", "roads"], SETUP_ROAD: ["place a road", "place", "road", "roads"],
  BUILD_SETTLEMENT: ["build a settlement", "build", "settlement", "settlements"],
  SETUP_SETTLEMENT: ["place a settlement", "place", "settlement", "settlements"],
  BUILD_CITY: ["build a city", "build", "city", "cities"],
  MOVE_ROBBER: ["move the robber", "move the robber to", "hex", "hexes"],
  BANK_TRADE: ["trade with the bank"],
  PLAY_ROAD_BUILDING: ["play Road Building"], BUY_DEV_CARD: ["buy a development card"],
  END_TURN: ["end your turn"], PLAY_KNIGHT: ["play a Knight"], PLAY_MONOPOLY: ["play Monopoly"],
  PLAY_YEAR_OF_PLENTY: ["play Year of Plenty"], ROLL: ["roll"], DISCARD: ["discard other cards"],
};

// Bank trades named by their cards, one or several ("trade Wood for Ore",
// "trade Wood or Sheep for Ore", "trade Wood for Ore or Brick for Wheat"):
// a trade's bubble marks the bank's pile, which does not say what goes in.
function tradesWords(trades) {
  const res = (i) => board.resources[i] || "a card";
  const or = (xs) => (xs.length < 3 ? xs.join(" or ") : `${xs.slice(0, -1).join(", ")}, or ${xs.at(-1)}`);
  const gets = [...new Set(trades.map((a) => a.b))];
  return gets.length === 1 ? `trade ${or(trades.map((a) => res(a.a)))} for ${res(gets[0])}`
    : `trade ${or(trades.map((a) => `${res(a.a)} for ${res(a.b)}`))}`;
}

// "Better → ..." for a flagged move: the one better move by name, or each
// kind of better move as something to do, in a list ("end your turn, build
// the marked road, or play Year of Plenty").
function betterText(better, played) {
  if (!better || !better.length) return "";
  if (better.length === 1) return `Better → ${shortMove(better[0])}`;
  const kinds = [];
  for (const action of better) if (!kinds.includes(action.type)) kinds.push(action.type);
  const parts = kinds.map((type) => {
    const [verb, mark, one, many] = BETTER_KINDS[type] || [];
    const count = better.filter((a) => a.type === type).length;
    if (type === "BANK_TRADE") return tradesWords(better.filter((a) => a.type === type));
    if (played && played.type === type && one) return `${mark} ${count > 1 ? `one of the marked ${many}` : `the marked ${one}`}`;
    return verb || shortMove(better.find((a) => a.type === type)).toLowerCase();
  });
  const list = parts.length < 3 ? parts.join(" or ") : `${parts.slice(0, -1).join(", ")}, or ${parts.at(-1)}`;
  return `Better → ${list}`;
}

// The sentence a card says for the moves it shows, given their places in a
// list of moves and that list's own reasons (`whys`, by place) and those
// that moves shown on one card share (`groups`, each `{of, why}`): one move's
// own, several the ones they share, else nothing.
function cardWhy(idx, whys, groups) {
  const text = (why) => (why && why.text) || "";
  if (idx.length === 1) return text(whys[idx[0]]);
  const group = (groups || []).find((g) => g.of.length === idx.length && g.of.every((v, k) => v === idx[k]));
  return group ? text(group.why) : "";
}

// A hint card's sentence for the options at `idx` (`cardWhy`). A hint from a
// guide that gives no `groups` says a brilliant move's own reasons and, for
// the others, the reasons every good move shares.
function hintWhy(hint, idx) {
  if (!hint.groups) {
    const o = hint.options[idx[0]];
    return o.class === "brilliant" ? (idx.length === 1 && o.why && o.why.text) || "" : (hint.why && hint.why.text) || "";
  }
  return cardWhy(idx, hint.options.map((o) => o.why), hint.groups);
}

// A better move's card on a flagged note, for the moves of `better` at `idx`
// (`cardWhy`). A note that gives no `better_whys` says its own sentence.
function betterWhy(note, idx) {
  if (!note.better_whys) return (note.why && note.why.text) || "";
  return cardWhy(idx, note.better_whys, note.better_groups);
}

// A flagged move's card in one run of text: the better move or moves to
// make, then why, joined ("A better move is to play a Knight first, which
// takes largest army."; "Better moves are to end your turn or build the
// marked road. They lead to more brick income."; several of one kind said as
// one move, "A better move is to trade Wood or Sheep for Ore. That gets the
// ore for a city on the 8-5-10."). `why` is the note's, its `predicate` the reasons
// without a subject; `whys` its `better_whys`, each better move's own
// reasons; a reason with no predicate stands as its own sentence after the
// move, and a line's `then` (what the move played leads to) after that.
function betterNarrative(better, played, why, whys = null) {
  if (!better || !better.length) return (why && why.text) || "";
  // A whole discard: the better one by its cards.
  if (better[0].type === "DISCARD_CARDS") return `A better discard is ${discardWords(better[0].cards)}.`;
  const first = played && played.type === "ROLL" ? " first" : "";
  const kinds = [];
  for (const action of better) if (!kinds.includes(action.type)) kinds.push(action.type);
  const parts = better.length === 1 ? [moveWords(better[0]) + first] : kinds.map((type) => {
    const [verb, mark, one, many] = BETTER_KINDS[type] || [];
    const count = better.filter((a) => a.type === type).length;
    if (type === "BANK_TRADE") return tradesWords(better.filter((a) => a.type === type)) + first;
    if (played && played.type === type && one) return `${mark} ${count > 1 ? `one of the marked ${many}` : `the marked ${one}`}`;
    return (verb || moveWords(better.find((a) => a.type === type))) + first;
  });
  const list = parts.length < 3 ? parts.join(" or ") : `${parts.slice(0, -1).join(", ")}, or ${parts.at(-1)}`;
  const predicate = why && why.predicate;
  const text = (why && why.text) || "";
  // One move: its reasons run on from it. Several sharing their reasons
  // ("Those ..."): "They" and the reasons. A reason about one named move
  // keeps its own subject.
  const then = why && why.then ? ` ${why.then}` : "";
  if (better.length === 1) return predicate ? `A better move is to ${list}, which ${predicate}.${then}` : `A better move is to ${list}.${then}`;
  const moves = parts.length === 1 ? `A better move is to ${list}.` : `Better moves are to ${list}.`;
  // Said as one move, the reasons they share take that one move's verb.
  const own = (whys || []).map((w) => w && w.predicate).filter(Boolean);
  if (predicate && why.subject === "Those" && parts.length === 1 && own.length === better.length
      && own.every((p) => p === own[0])) return `${moves} That ${own[0]}.`;
  if (predicate && why.subject === "Those") return `${moves} They ${predicate}.`;
  return text ? `${moves} ${text}` : moves;
}

// The card a tap opens on a bubble: what the guide's grade of a move means,
// the win chance after it and, where the guide has one, why.
function guideCard(bubble, html) {
  bubble.classList.add("open");
  bubble.innerHTML = html;
}

// The unit a note's or hint option's numbers are shown in (`x` the note
// or option, or an objective's name): VP for a decision graded on points,
// and for one graded on win chance mixed with VP ("mix") where its VP part
// decided the grade (`unit`), its numbers then divided by the win chance a
// VP was worth there (`weight`); else win chance.
function shownIn(x) {
  const objective = typeof x === "string" ? x : x && x.objective;
  if (objective === "points") return {vp: true, rate: 1};
  if (objective === "mix" && x.unit === "vp" && x.weight > 0) return {vp: true, rate: x.weight};
  return {vp: false, rate: 1};
}

// A card's number line: the win chance a move adds or gives up where that
// clears the guide's noise bound, else "Within N%" of it; nothing more. In
// VP where the decision was graded on it (`shownIn`).
function chanceLine(delta, bound, x) {
  if (delta === null || delta === undefined) return "";
  const {vp, rate} = shownIn(x);
  delta /= rate;
  if (bound !== null && bound !== undefined) bound /= rate;
  if (bound !== null && bound !== undefined && Math.abs(delta) <= bound) {
    return vp ? `<div class="guide-card-gain">Within ${vpText(bound)}</div>`
      : `<div class="guide-card-gain">Within ${Math.max(1, Math.ceil(bound * 100 - 1e-9))}%</div>`;
  }
  if (Math.abs(delta) < (vp ? 0.05 : 0.0005)) return "";
  const sign = delta > 0 ? "+" : "−";
  const size = vp ? vpText(Math.abs(delta)) : `${pct(Math.abs(delta))} win chance`;
  return `<div class="guide-card-gain ${delta > 0 ? "up" : "down"}">${sign}${size}</div>`;
}

// A points gap in tenths of a VP: "0.4 VP", "1 VP".
function vpText(x) {
  const v = Math.max(0.1, Math.round(x * 10) / 10);
  return `${Number.isInteger(v) ? v.toFixed(0) : v.toFixed(1)} VP`;
}

// The spot a person taps to play a move with a place on the board (its
// corner, edge or tile number), as a box for placeBubble to keep clear of.
function placeBox(action, anchor) {
  if (!anchor || anchor.float || anchor.named || anchor.dir === "left" || !movePlace(action)) return [];
  // A road: points along it, which no bubble's pill may touch (`placeBubble`),
  // so a bubble may stand beside it.
  if (anchor.seg) {
    const [x0, y0, x1, y1] = anchor.seg;
    return [0.1, 0.25, 0.4, 0.55, 0.7, 0.85].map((t) => ({pt: [x0 + (x1 - x0) * t, y0 + (y1 - y0) * t]}));
  }
  // A corner or a tile: its ring.
  const r = Math.max(8, (anchor.pr || 12) * 0.9);
  return [{left: anchor.px - r, top: anchor.py - r, w: 2 * r, h: 2 * r}];
}

// The board's buildings, as boxes for placeBubble to keep clear of, and with
// `tokens` the robber's box and the middles of the built roads instead, which
// placeBubble covers only where that keeps a bubble close (`avoid`).
function boardBoxes(layer, tokens = false) {
  const box = layer.getBoundingClientRect();
  const o = onScreen({x: 0, y: 0}), u = onScreen({x: 1, y: 0});
  if (!o || !u) return [];
  const scale = Math.hypot(u.x - o.x, u.y - o.y);
  const square = (point, r) => {
    const p = onScreen(point);
    return {left: p.x - box.left - r * scale, top: p.y - box.top - r * scale, w: 2 * r * scale, h: 2 * r * scale};
  };
  // The robber: covered only where nothing else fits (`avoid`).
  const robber = hexById[state.robber];
  if (tokens) {
    // The robber and built roads: covered where that keeps a bubble close.
    const out = robber ? [square(robberSpot(robber), 22)] : [];
    board.edges.forEach((e, id) => {
      if (!((state.edge_owner || [])[id] >= 0)) return;
      const p0 = onScreen(vertexById[e.v0]), p1 = onScreen(vertexById[e.v1]);
      out.push({pt: [(p0.x + p1.x) / 2 - box.left, (p0.y + p1.y) / 2 - box.top]});
    });
    return out;
  }
  return board.vertices.filter((v) => (state.vertex_owner || [])[v.id] >= 0).map((v) => square(v, 11));
}

// The board's own controls (the corner buttons, the guide's, the piece
// supply, each of the bank's piles with its count, and the deck), as boxes
// for placeBubble to keep clear of: no bubble stands over the bank's cards,
// and a tail to one pile passes no other.
function controlBoxes(layer) {
  const box = layer.getBoundingClientRect();
  const at = (r) => ({left: r.left - box.left - 3, top: r.top - box.top - 3, w: r.width + 6, h: r.height + 6});
  const out = ["#table-controls", "#guide-hint", "#piece-supply", "#undo-build", "#end-turn", "#roll-dice"].flatMap((sel) => {
    const el = document.querySelector(sel);
    const r = el && el.getBoundingClientRect();
    return r && r.width ? [at(r)] : [];
  });
  // A bank laid out as a column is one box, and the deck over it another: no
  // bubble or tail enters either, and a tail meets a pile or the deck from
  // its open side (`guideAnchor`).
  const rect = (sel) => [...document.querySelectorAll(sel)].map((e) => e.getBoundingClientRect()).filter((r) => r.width);
  const piles = rect("#bank .bank-pile"), deck = rect("#buy-dev-card");
  const bank = document.getElementById("bank").getBoundingClientRect();
  if (piles.length && bank.height > bank.width) {
    const left = Math.min(...piles.map((r) => r.left)), right = Math.max(...piles.map((r) => r.right));
    const top = Math.min(...piles.map((r) => r.top)), bottom = Math.max(...piles.map((r) => r.bottom));
    out.push(at({left, top, width: right - left, height: bottom - top}), ...deck.map(at));
  } else {
    out.push(...piles.map(at), ...deck.map(at));
  }
  return out;
}

// An opened card: out of its bubble (`joinCard`) where it has one; else in
// whichever of the top, middle and foot of the board is nearest the move
// without covering its place, centred on it. It does not move; its bubble,
// or a tap off it, closes it (`close`).
function openCard(card, anchor, layer, key, close, action, join = null) {
  if (join && join.bubble) { joinCard(card, join, key, close); return; }
  layer.appendChild(card);
  const W = layer.clientWidth, H = layer.clientHeight;
  const controls = controlBoxes(layer);
  // The free width in a band of the board between the controls it crosses.
  const span = (t, h) => {
    const crossing = controls.filter((o) => t < o.top + o.h + 4 && o.top < t + h + 4);
    const lo = Math.max(6, ...crossing.filter((o) => o.left + o.w / 2 < W / 2).map((o) => o.left + o.w + 6));
    const hi = Math.min(W - 6, ...crossing.filter((o) => o.left + o.w / 2 >= W / 2).map((o) => o.left - 6));
    return [lo, hi];
  };
  const size = (width) => { card.style.width = `${Math.round(width)}px`; return card.offsetHeight; };
  // The foot band sits just above the controls along the board's foot.
  const footTop = Math.min(H - 6, ...controls.filter((o) => o.top > H / 2).map((o) => o.top));
  const usable = anchor && !anchor.float;
  const px = usable ? anchor.x : W / 2;
  const py = usable ? anchor.y + 12 + (action && action.type === "MOVE_ROBBER" ? 18 : 0) : H / 2;
  const tries = [];
  let w, h;
  for (const band of ["top", "middle", "foot"]) {
    w = Math.min(380, W - 12); h = size(w);
    for (let pass = 0; pass < 2; pass++) {
      const t = band === "top" ? 12 : band === "middle" ? (H - h) / 2 : footTop - h - 8;
      const [lo, hi] = span(t, h);
      if (hi - lo < 220) break;
      if (hi - lo < w) { w = hi - lo; h = size(w); continue; }
      const x = Math.max(lo, Math.min(hi - w, px - w / 2));
      tries.push({x, t, w, clear: py < t - 12 || py > t + h + 12, gap: Math.abs(t + h / 2 - py)});
      break;
    }
  }
  tries.sort((a, b) => (b.clear - a.clear) || (a.gap - b.gap));
  const pick = tries[0] || {x: 6, t: 12, w: Math.min(380, W - 12)};
  w = pick.w; h = size(w);
  card.style.left = `${pick.x}px`;
  card.style.top = `${Math.max(6, Math.min(H - h - 6, pick.t))}px`;
  card.addEventListener("click", (e) => e.stopPropagation());
}

// What an opened card keeps clear of, as boxes in the window's pixels:
// `hard` never covered (the places the card talks about, the corner
// controls, the bank's piles and the deck, the captions, every bubble, so
// each stays in reach, and the side panel: the strip, the players, the hand
// and the log), `soft` covered least where it can be (the ports, the number
// tokens, the buildings, the robber).
function cardObstacles(join) {
  const hard = [], soft = [];
  const rect = (r, pad = 0) => ({left: r.left - pad, top: r.top - pad, w: r.width + 2 * pad, h: r.height + 2 * pad});
  const o = onScreen({x: 0, y: 0}), u = onScreen({x: 1, y: 0});
  const scale = o && u ? Math.hypot(u.x - o.x, u.y - o.y) : 1;
  const disc = (point, r) => {
    const q = onScreen(point);
    return q ? {left: q.x - r * scale, top: q.y - r * scale, w: 2 * r * scale, h: 2 * r * scale} : null;
  };
  document.querySelectorAll("#board-svg .port-marker").forEach((e) => soft.push(rect(e.getBoundingClientRect(), 3)));
  for (const h of board.hexes) if (h.token) soft.push(disc(h, 18));
  for (const v of board.vertices) if ((state.vertex_owner || [])[v.id] >= 0) soft.push(disc(v, 14));
  const robber = hexById[state.robber];
  if (robber) soft.push(disc(robberSpot(robber), 22));
  for (const action of join.places || []) {
    const place = action && movePlace(action);
    if (place && place.circle) hard.push(disc({x: place.circle.x, y: place.circle.y}, place.circle.r + 4));
    if (place && place.line) {
      const {x1, y1, x2, y2} = place.line;
      for (let t = 0; t <= 1.001; t += 0.25) hard.push(disc({x: x1 + (x2 - x1) * t, y: y1 + (y2 - y1) * t}, 9));
    }
  }
  for (const sel of ["#table-controls", "#guide-hint", "#piece-supply", "#undo-build", "#end-turn", "#roll-dice", "#buy-dev-card",
                     "#bank .bank-pile", "#replay-bar", "#captions .caption", "body > header"]) {
    document.querySelectorAll(sel).forEach((e) => { const r = e.getBoundingClientRect(); if (r.width) hard.push(rect(r, 2)); });
  }
  // The side panel (the strip, the players, the hand and the log) is never
  // covered, but by the card of a bubble in it (the hand's): that card keeps
  // clear of the hand's cards alone.
  const side = document.getElementById("sidebar").getBoundingClientRect();
  const own = join.bubble && join.bubble.isConnected ? join.bubble.getBoundingClientRect() : null;
  const inSide = own && side.width && own.left < side.right && side.left < own.right && own.top < side.bottom
    && side.top < own.bottom;
  if (side.width && !inSide) hard.push(rect(side, 2));
  if (inSide) document.querySelectorAll("#hand .card").forEach((e) => hard.push(rect(e.getBoundingClientRect(), 2)));
  document.querySelectorAll(".guide-bubble:not(.open)").forEach((b) => {
    const r = b.getBoundingClientRect();
    if (r.width) hard.push(rect(r, 4));
  });
  return {hard: hard.filter(Boolean), soft: soft.filter(Boolean)};
}

// The gap, in pixels, between a joined card and its bubble: the notch that
// joins them, no longer than a bubble's own tail.
const JOIN_GAP = 9;

// A card opened out of its bubble (`join.bubble`): against it, on whichever
// side and wherever along it covers nothing it must keep clear of
// (`cardObstacles`) and least of the rest, joined by a short notch in the
// grade's colour; where no such spot fits in the window, against the bubble
// below it (or above), held inside the window. As wide as its longest line
// up to the stylesheet's cap. It does not move; its bubble closes it.
function joinCard(card, join, key, close) {
  const layer = document.getElementById("guide-float");
  card.classList.add("joined");
  if (join.grade) card.style.setProperty("--join", `var(--grade-${join.grade}, var(--border))`);
  layer.appendChild(card);
  // Its natural width (its longest line, up to the cap), and two narrower
  // ones, each with its height, for a spot the natural one does not fit;
  // never narrower than its title, which stays on one line.
  const natural = Math.ceil(card.getBoundingClientRect().width);
  const chrome = card.offsetWidth - card.clientWidth + parseFloat(getComputedStyle(card).paddingLeft)
    + parseFloat(getComputedStyle(card).paddingRight);
  const title = Math.max(0, ...[...card.querySelectorAll(".guide-card-move")].map((t) => {
    const range = document.createRange();
    range.selectNodeContents(t);
    return range.getBoundingClientRect().width + parseFloat(getComputedStyle(t).paddingRight || 0);
  })) + chrome + 2;
  const floor = Math.min(natural, Math.max(280, Math.ceil(title)));
  const sizes = [...new Set([natural, Math.round(natural * 0.78), Math.round(natural * 0.62)].map((x) => Math.max(floor, x)))]
    .map((x) => { card.style.width = `${x}px`; return [x, card.offsetHeight]; });
  let [w, H] = sizes[0];
  const W = window.innerWidth, Vh = window.innerHeight;
  const bubble = join.bubble && join.bubble.isConnected ? join.bubble.getBoundingClientRect() : null;
  const {hard, soft} = cardObstacles(join);
  const area = (b, list) => list.reduce((t, o) => t + Math.max(0, Math.min(b.left + b.w, o.left + o.w) - Math.max(b.left, o.left))
    * Math.max(0, Math.min(b.top + b.h, o.top + o.h) - Math.max(b.top, o.top)), 0);
  let pick = null;
  if (bubble) {
    const B = bubble;
    // Against the bubble: the card's edge one short notch (JOIN_GAP, no
    // longer than a bubble's own tail) from the bubble's, on any side, and
    // anywhere along it that still faces the bubble's middle.
    sizes.forEach(([cw, ch], narrow) => {
      const tries = [];
      const g = JOIN_GAP;
      for (let x = B.left + B.width / 2 - cw + 22; x <= B.left + B.width / 2 - 22; x += 8) {
        tries.push({left: x, top: B.bottom + g, side: "below"});
        tries.push({left: x, top: B.top - g - ch, side: "above"});
      }
      for (let y = B.top + B.height / 2 - ch + 16; y <= B.top + B.height / 2 - 16; y += 6) {
        tries.push({left: B.left - g - cw, top: y, side: "left"});
        tries.push({left: B.right + g, top: y, side: "right"});
      }
      for (const t of tries) {
        const b = {left: t.left, top: t.top, w: cw, h: ch};
        if (b.left < 4 || b.top < 4 || b.left + cw > W - 4 || b.top + ch > Vh - 4) continue;
        // What it must keep clear of counts far more than the rest: a spot
        // that covers none of it always wins, and else the one covering least.
        const blocked = area(b, hard);
        const along = t.side === "below" || t.side === "above"
          ? Math.abs(b.left + cw / 2 - (B.left + B.width / 2)) : Math.abs(b.top + ch / 2 - (B.top + B.height / 2));
        const score = blocked * 1000 + area(b, soft) / 200 + 0.05 * along + 18 * narrow;
        if (!pick || score < pick.score) pick = {...b, side: t.side, blocked, score};
      }
    });
    if (pick) { w = pick.w; H = pick.h; }
  }
  if (!pick) {
    // No clear spot against the bubble: below it where the card fits under
    // it in the window, else above, at its natural width, held inside the
    // window and facing the bubble's middle.
    const B = bubble || {left: W / 2, right: W / 2, top: Vh / 2, bottom: Vh / 2, width: 0, height: 0};
    const below = B.bottom + JOIN_GAP + H <= Vh - 4;
    const left = Math.max(4, Math.min(W - w - 4, B.left + B.width / 2 - w / 2));
    const top = below ? B.bottom + JOIN_GAP : Math.max(4, B.top - JOIN_GAP - H);
    pick = {left, top, w, h: H, side: bubble ? (below ? "below" : "above") : null};
    pick.blocked = area(pick, hard);
  }
  // No spot against the bubble clears everything it must keep clear of.
  if (pick.blocked) card.dataset.clear = "none";
  card.style.width = `${w}px`;
  // How much of what it must keep clear of the spot taken covers (0: none).
  card.dataset.blocked = pick && pick.blocked !== undefined ? String(Math.round(pick.blocked)) : "";
  const left = pick.left, top = pick.top;
  card.style.left = `${left}px`;
  card.style.top = `${top}px`;
  const tail = pick.side && bubble ? joinTail(card, pick, bubble) : null;
  if (tail) layer.insertBefore(tail, card);
  // The card stays where it opened, joined to its bubble: the bubble puts
  // it away (`close`, by its own click), a tap on the card does nothing.
  card.addEventListener("click", (e) => e.stopPropagation());
}

// The tail from a joined card (box `b`, on `b.side` of its bubble) to the
// bubble's edge (`bubble`, a client rect): a wedge 16 pixels wide where it
// leaves the card, under the card's edge, filled as the card is and edged
// in its grade's colour.
// Where a joined card's tail leaves the card (`base`, the middle of its
// root on the card's edge facing the bubble) and meets the bubble (`tip`).
function tailEnds(b, side, bubble, inset = 3) {
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  if (side === "below" || side === "above") {
    const x = clamp(bubble.left + bubble.width / 2, b.left + 18, b.left + b.w - 18);
    return {base: [x, side === "below" ? b.top + inset : b.top + b.h - inset],
            tip: [clamp(x, bubble.left + 10, bubble.right - 10), side === "below" ? bubble.bottom - 1 : bubble.top + 1]};
  }
  const y = clamp(bubble.top + bubble.height / 2, b.top + 14, b.top + b.h - 14);
  return {base: [side === "left" ? b.left + b.w - inset : b.left + inset, y],
          tip: [side === "left" ? bubble.left + 1 : bubble.right - 1, clamp(y, bubble.top + 6, bubble.bottom - 6)]};
}

function joinTail(card, b, bubble) {
  const {base: [x, y], tip} = tailEnds(b, b.side, bubble);
  const half = 7;
  const flat = b.side === "below" || b.side === "above";
  const base = flat ? [[x - half, y], [x + half, y]] : [[x, y - half], [x, y + half]];
  const style = getComputedStyle(card);
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "guide-join");
  const pts = [base[0], tip, base[1]].map((p) => p.map((v) => v.toFixed(1)).join(",")).join(" ");
  svg.innerHTML = `<polygon points="${pts}" fill="rgb(22, 24, 31)" stroke="${style.borderTopColor}" stroke-width="2" stroke-linejoin="round"/>`;
  return svg;
}

// The cards flagged for review whose flag this page changed and the server
// has not yet echoed, by card key.
const flagOverride = new Map();

function cardFlagged(key) {
  const guide = guideView();
  const server = Boolean(guide && (guide.flags || []).includes(key));
  if (flagOverride.has(key) && flagOverride.get(key) === server) flagOverride.delete(key);
  return flagOverride.has(key) ? flagOverride.get(key) : server;
}

function flagSvg(on) {
  return `<svg viewBox="0 0 24 24" fill="${on ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" ` +
    `stroke-linejoin="round" stroke-linecap="round"><path d="M5 21V4"/><path d="M5 4h12l-2.5 4.5L17 13H5"/></svg>`;
}

// A card's review flag (`info`: its key `card`, `of` "note" or "hint", that
// note's or hint's `id`, `step`, `grade`, `played`, `best`): a tap flags the
// card or takes the flag off, kept on the server with the game
// (`POST /api/flag`) with the card's text as shown.
function flagCard(card, info) {
  const on = cardFlagged(info.card);
  const button = document.createElement("button");
  button.type = "button";
  button.className = "guide-flag";
  button.title = on ? "Flagged for review" : "Flag for review";
  button.setAttribute("aria-label", button.title);
  button.setAttribute("aria-pressed", String(on));
  button.innerHTML = flagSvg(on);
  button.addEventListener("pointerdown", (e) => e.stopPropagation());
  button.addEventListener("pointerup", (e) => e.stopPropagation());
  button.addEventListener("click", (e) => {
    e.stopPropagation();
    const next = !cardFlagged(info.card);
    const text = [...card.children].filter((c) => c !== button).map((c) => c.innerText).join("\n").trim();
    flagOverride.set(info.card, next);
    button.setAttribute("aria-pressed", String(next));
    button.innerHTML = flagSvg(next);
    button.title = next ? "Flagged for review" : "Flag for review";
    postJSON("/api/flag", {...info, round: info.round ?? state.round ?? 0, text, flagged: next}).then(({ok, data}) => {
      if (!ok) { flagOverride.delete(info.card); showNotice((data && data.error) || "The flag was not kept."); render(); }
      else if (data && data.guide && liveView() && liveView().guide) liveView().guide.flags = data.guide.flags || [];
    });
  });
  card.appendChild(button);
}

// The hint the guide gave at the replayed step, where the page shows the
// guide and the step was a decision of the seat's with a saved reading
// (`replay.hint`); null live and everywhere else.
function replayHint() {
  if (!replaying() || !state.replay) return null;
  const played = state.replay.played || [];
  if (!state.replay.hint && !played.length) return null;
  const guide = guideView();
  const seated = liveView() && liveView().seat !== null && liveView().seat !== undefined;
  if (!(seated && guide && guide.offered && guideWanted())) return null;
  // A decision whose reading was not saved still shows the moves played there.
  return state.replay.hint || {id: `played:${replayStep}`, move: null, options: [], why: null, groups: []};
}

// Every move the seat played at the replayed decision, kept or taken back,
// with what its guide said of it (`replay.played`).
function replayPlayed() {
  return (replaying() && state.replay && state.replay.played) || [];
}

// A hint's key for its dismissal and its open card: a replayed step's is
// its own, so putting one away leaves the live hint and other steps' alone.
function hintKeyOf(hint) {
  return hint === replayHint() ? `hint:replay:${replayStep}:${hint.id}` : `hint:${hint.id}`;
}

function renderGuideBubbles() {
  drawGuideBubbles();
}

function drawGuideBubbles() {
  const layer = document.getElementById("guide-bubbles");
  layer.innerHTML = "";
  document.getElementById("guide-float").innerHTML = "";
  guideFloatPlaced = [];
  placeInHand([]);
  const guide = guideView();
  const seated = liveView() && liveView().seat !== null && liveView().seat !== undefined;
  // Stepping back, the seat's own decision shows the hint its guide gave
  // there (`replay.hint`), and nothing else of the guide.
  const replayed = replayHint();
  if (!replayed && (!(seated && guide && guide.offered && guide.on) || frozen() || !guideWanted())) { markHint(null); return; }
  const label = (kind) => `<span class="guide-class ${kind}">${GUIDE_BUBBLE_WORDS[kind]}</span>`;
  const head = (kind, action) => `<div class="guide-card-move"><span class="guide-class ${kind}">${GUIDE_CARD_WORDS[kind]}</span> → ${shortMove(action)}</div>`;
  const line = (text) => (text ? `<div class="guide-card-line">${escapeText(text)}</div>` : "");
  // Whether the seat played the card's move, set apart from the guide's own words.
  const playedLine = (back) =>
    `<div class="guide-card-line guide-played">${back ? "You played this move and took it back." : "You played this move."}</div>`;
  // A grade's opening words ("The only good move.") start the sentence after them, on one line.
  const opened = (meaning, text) => line([meaning, text].filter(Boolean).join(" "));
  const hint = replayed || guide.hint;
  if (hint) {
    const hintKey = hintKeyOf(hint);
    if (guideDismissed.has(hintKey)) { markHint(null); return; }
    // The discard's own window shows its hint (renderDiscardMode).
    if (discardHint(hint) && modalMode === "discard") { markHint(null); return; }
    markHint(hint.options.map((o) => o.action));
    const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
    const best = hint.options.find((o) => same(o.action, hint.move));
    // The search's own move stands out only where it is clearly the best.
    const clear = Boolean(best && ["best", "brilliant", "forced"].includes(best.class));
    // Good moves close together share a bubble (`guideGroups`), with an
    // arrow to each; its card names them in one line.
    const items = hint.options.map((o, i) => ({action: o.action, option: o, i, anchor: guideAnchor(o.action, layer)}))
      .filter((i) => i.anchor);
    const gradeOf = (i) => i.option.class;
    const hintSays = (its) => hintWhy(hint, its.map((i) => i.i));
    const groups = explainedGroups(guideGroups(items.filter((i) => !i.anchor.float), gradeOf), hintSays,
      (its) => guideGroups(its, gradeOf));
    // Cards in the hand: one bubble a grade, marked in the hand (`placeInHand`).
    const inHand = items.filter((i) => i.anchor.float);
    const handGroup = (its) => [{items: its, anchor: its[0].anchor, targets: null, hand: true}];
    for (const kind of new Set(inHand.map((i) => i.option.class))) {
      groups.push(...explainedGroups(handGroup(inHand.filter((i) => i.option.class === kind)), hintSays, handGroup));
    }
    const hand = [];
    // Every candidate's own place stays tappable: no bubble lands on one.
    const tokens = boardBoxes(layer, true);
    const placed = [...controlBoxes(layer), ...boardBoxes(layer),
      ...items.flatMap((i) => placeBox(i.action, i.anchor))];
    const owns = (g) => g.items.some((i) => same(i.action, hint.move));
    // The guide's own first, so it keeps its side of its place.
    const order = [...groups].sort((a, b) => Number(owns(b)) - Number(owns(a)));
    let card = null, cardAt = null;
    order.forEach((group, n) => {
      const options = group.items.map((i) => i.option);
      const bubble = bubbleDiv("guide-bubble hint", {role: "button", tabindex: "0"});
      if (owns(group)) {
        bubble.classList.add("own");
        if (clear) bubble.classList.add("top");
      }
      // A bubble is only a grade, in its grade's colour; its card names the moves.
      bubble.innerHTML = label(options[0].class);
      bubble.classList.add(options[0].class);
      const cardKey = `${hintKey}:${options.map((o) => JSON.stringify(o.action)).join("|")}`;
      bubble.addEventListener("click", (event) => {
        event.stopPropagation();
        guideOpenHint = guideOpenHint === cardKey ? null : cardKey;
        renderGuideBubbles();
      });
      let shown = bubble;
      if (group.hand) {
        hand.push({bubble, kind: options[0].class, actions: group.items.map((i) => i.action)});
      } else if (!placeBubble(bubble, group.anchor, layer, placed, group.targets, tokens)) {
        // No clean spot for one bubble: each move its own, opening the same card.
        shown = placeEach(bubble, group.items, layer, placed, tokens, (own) => own.addEventListener("click", (event) => {
          event.stopPropagation();
          guideOpenHint = guideOpenHint === cardKey ? null : cardKey;
          renderGuideBubbles();
        }))[0] || null;
      }
      if (guideOpenHint !== cardKey) return;
      // The card for the group, over the bubbles, which stay up.
      card = bubbleDiv("guide-bubble hint open", {role: "button", tabindex: "0"});
      const hintStep = replayed ? replayStep : guide.step;
      cardAt = {anchor: group.anchor, key: cardKey, action: options[0].action,
        join: {bubble: shown, grade: options[0].class, places: hint.options.map((x) => x.action),
               cards: group.hand ? group.items.flatMap((i) => heldCards(i.action)) : []},
        flag: {card: `hint:${hintStep}:${options.map((x) => JSON.stringify(x.action)).join("|")}`, of: "hint",
               id: hint.id, step: hintStep, grade: options[0].class, played: null, best: options[0].action}};
      const o = options[0];
      const named = `<div class="guide-card-move"><span class="guide-class ${o.class}">${GUIDE_CARD_WORDS[o.class]}</span> → ` +
        `${escapeText(groupName(options.map((x) => x.action)))}</div>`;
      if (hint.forced) { card.innerHTML = named + line(GUIDE_MEANING.forced); return; }
      // Each card says why for its own moves (`hintWhy`). A brilliant move
      // adds what it gives the win chance; the guide's own move and those as
      // good change it by nothing, so carry no number.
      const meaning = options.length === 1 ? GUIDE_MEANING[o.class] : "";
      const why = hintWhy(hint, group.items.map((i) => i.i));
      // A move of this card the seat played there, kept or taken back, says so.
      const tried = replayed ? replayPlayed().filter((n) => options.some((x) => same(x.action, n.played))) : [];
      const played = tried.length ? playedLine(!tried.some((n) => !n.taken_back)) : "";
      card.innerHTML = named + opened(meaning, why) +
        (o.class === "brilliant" ? chanceLine(o.lead, o.bound, o.objective ? o : hint) : "") + played;
    });
    // Replayed, the moves the seat played there that the hint does not show,
    // each with its note: the grade on the board, the guide's words on its card.
    if (replayed) {
      for (const n of replayPlayed()) {
        if (hint.options.some((o) => same(o.action, n.played))) continue;
        const anchor = guideAnchor(n.played, layer);
        if (!anchor) continue;
        const noteKey = `${hintKey}:played:${n.id}`;
        const bubble = bubbleDiv(`guide-bubble note ${n.class}`, {role: "button", tabindex: "0"});
        bubble.innerHTML = label(n.class);
        bubble.addEventListener("click", (event) => {
          event.stopPropagation();
          guideOpenHint = guideOpenHint === noteKey ? null : noteKey;
          renderGuideBubbles();
        });
        if (anchor.float) hand.push({bubble, kind: n.class, actions: [n.played]});
        else placeBubble(bubble, anchor, layer, placed, null, tokens);
        if (guideOpenHint !== noteKey) continue;
        const flaggedOne = flaggedNote(n);
        card = bubbleDiv(`guide-bubble note ${n.class} open`, {role: "button", tabindex: "0"});
        cardAt = {anchor, key: noteKey, action: n.played,
          join: {bubble, grade: n.class, places: [n.played], cards: anchor.float ? heldCards(n.played) : []},
          flag: {card: `note:${n.seat}:${n.step}:${n.id || 0}`, of: "note", id: n.id || 0, step: n.step,
                 round: n.round, grade: n.class, played: n.played, best: n.best}};
        const said = flaggedOne ? betterNarrative(n.better || [], n.played, n.why, n.better_whys) : (n.why && n.why.text) || "";
        card.innerHTML = head(n.class, n.played) + opened(flaggedOne ? "" : GUIDE_MEANING[n.class] || "", said) +
            (n.class === "brilliant" ? chanceLine(n.lead, n.bound, n)
            : flaggedOne ? chanceLine(-n.loss, n.bound, n) : "") +
          playedLine(n.taken_back);
      }
    }
    placeInHand(hand);
    if (card) {
      flagCard(card, cardAt.flag);
      openCard(card, cardAt.anchor, layer, cardAt.key, () => { guideOpenHint = null; renderGuideBubbles(); }, cardAt.action,
               cardAt.join);
    }
    return;
  }
  const notes = guide.notes || [];
  const last = notes.length ? notes[notes.length - 1] : null;
  // A table playing a game on from another's keeps the moves before as
  // history: their notes are the review's, not a bubble on arrival.
  const branchStep = liveView().branch ? liveView().branch.step : null;
  // A move played whose grade is still being read is marked at once and
  // stays marked until its note lands, through any playback (its own dice,
  // the other seat's moves).
  const pending = guide.pending;
  if (pending && pending.played && (!last || pending.step > last.step)) {
    const bubble = bubbleDiv("guide-bubble note thinking", {});
    bubble.textContent = "Thinking…";
    const at = guideAnchor(pending.played, layer);
    if (at && at.float) placeInHand([{bubble, kind: "thinking", actions: [pending.played]}]);
    else if (at) placeBubble(bubble, at, layer, [...controlBoxes(layer), ...boardBoxes(layer)], null, boardBoxes(layer, true));
    markHint(null);
    return;
  }
  if (!last || (branchStep !== null && last.step < branchStep)) { markHint(null); return; }
  const key = noteKey(last);
  if (guideDismissed.has(`note:${key}`)) { markHint(null); return; }
  const playedType = last.played && last.played.type;
  // A note keeps its time on the board even when the seat moves next, as
  // after setup's last road; a note two rounds old (a page opened later) is
  // not shown, nor End turn's once the seat is to move, where its button has
  // given the corner to the roll.
  const stale = (state.round || 0) - (last.round || 0) >= 2;
  if (stale || (state.to_move === last.seat && playedType === "END_TURN")) { markHint(null); return; }
  // A note's time on the board starts once its move has played back (a
  // roll's dice, a build's piece), so a quick bubble is not gone before it is
  // seen; End turn's starts at once, the other seat's moves being no part of it.
  const waiting = playedType === "ROLL" ? rollsPlaying > 0
    : playedType !== "END_TURN" && (anim.running || rollsPlaying > 0);
  if (!guideNoteSeen.has(key) && !waiting) guideNoteSeen.set(key, Date.now());
  const flagged = flaggedNote(last);
  const open = guideOpenNote === key;
  const anyOpen = open || (guideOpenNote || "").startsWith(`${key}:best`);
  // A best move's bubble on the board fades soon, any other's later (time to
  // tap it or the best move's bubble), unless a card is open. End turn's
  // fades soon unless flagged: the other seat's turn has begun.
  const quick = !flagged;
  const lasts = quick ? GUIDE_PRAISE_MS : GUIDE_NOTE_MS;
  const shownFor = guideNoteSeen.has(key) ? Date.now() - guideNoteSeen.get(key) : 0;
  if (!anyOpen && shownFor >= lasts) { markHint(null); return; }
  if (!anyOpen && !guideNoteSeen.has(key)) {
    // Its time has not begun: look again shortly rather than count from now.
    clearTimeout(guideFadeTimer);
    guideFadeTimer = setTimeout(renderGuideBubbles, 250);
  } else if (!anyOpen) {
    clearTimeout(guideFadeTimer);
    guideFadeTimer = setTimeout(() => {
      if (guideOpenNote === key || (guideOpenNote || "").startsWith(`${key}:best`)) return;
      layer.querySelectorAll(".guide-bubble").forEach((b) => b.classList.add("fading"));
      guideFadeTimer = setTimeout(renderGuideBubbles, 400);
    }, lasts - shownFor);
  }
  // A flagged move's note points to the moves about as good as the best: each
  // ringed, each with its own bubble, "Best" where it is the only one.
  const better = flagged && last.better && last.better.length ? last.better : [];
  const tokens = boardBoxes(layer, true);
  const placed = [...controlBoxes(layer), ...boardBoxes(layer),
    ...[last.played, ...better].flatMap((a) => (a ? placeBox(a, guideAnchor(a, layer)) : []))];
  let bestCard = null;
  markHint(better.length ? better : null);
  // Each better move marked with its own grade (`better_classes`), moves of
  // one kind and grade close together sharing a bubble.
  const classes = last.better_classes || better.map(() => (better.length === 1 ? "best" : "good"));
  // A better whole discard is named on the note's card, not ringed over the
  // note's own cards.
  const marked = better.map((action, i) => ({action, i, kind: classes[i] || "good",
    anchor: action.type === "DISCARD_CARDS" ? null : guideAnchor(action, layer)}))
    .filter((m) => m.anchor && (movePlace(m.action) || m.anchor.float));
  const noteSays = (its) => betterWhy(last, its.map((m) => m.i));
  const marks = explainedGroups(guideGroups(marked.filter((m) => !m.anchor.float), (m) => m.kind), noteSays,
    (its) => guideGroups(its, (m) => m.kind));
  // Better moves that are cards in the hand: one bubble a grade, in the hand.
  const inHand = marked.filter((m) => m.anchor.float);
  const handGroup = (its) => [{items: its, anchor: its[0].anchor, targets: null, hand: true}];
  for (const kind of new Set(inHand.map((m) => m.kind))) {
    marks.push(...explainedGroups(handGroup(inHand.filter((m) => m.kind === kind)), noteSays, handGroup));
  }
  const hand = [];
  marks.forEach((group, n) => {
    const actions = group.items.map((m) => m.action);
    const kind = group.items[0].kind;
    const mark = bubbleDiv(`guide-bubble hint ${kind}${kind !== "good" ? " top" : ""}`, {role: "button", tabindex: "0"});
    mark.innerHTML = label(kind);
    const markKey = n ? `${key}:best:${n}` : `${key}:best`;
    mark.addEventListener("click", (event) => {
      event.stopPropagation();
      guideOpenNote = guideOpenNote === markKey ? null : markKey;
      renderGuideBubbles();
    });
    group.el = mark;
    if (group.hand) {
      hand.push({bubble: mark, kind, actions});
    } else if (!placeBubble(mark, group.anchor, layer, placed, group.targets, tokens)) {
      group.el = placeEach(mark, group.items, layer, placed, tokens, (own) => own.addEventListener("click", (event) => {
        event.stopPropagation();
        guideOpenNote = guideOpenNote === markKey ? null : markKey;
        renderGuideBubbles();
      }))[0] || null;
    }
    if (guideOpenNote === markKey) {
      // The guide's own move carries the win chance the move played gave up.
      bestCard = bubbleDiv("guide-bubble hint open", {role: "button", tabindex: "0"});
      bestCard.dataset.at = markKey;
      bestCard.dataset.i = n;
      bestCard.innerHTML = `<div class="guide-card-move"><span class="guide-class ${kind}">${GUIDE_CARD_WORDS[kind]}</span> → ` +
        `${escapeText(groupName(actions))}</div>` + line(betterWhy(last, group.items.map((m) => m.i))) +
        // The guide's own move follows the brilliant ones in `better`.
        (group.items.some((m) => m.i === classes.filter((c) => c === "brilliant").length)
          ? chanceLine(last.loss, last.bound, last) : "");
    }
  });
  const bubble = bubbleDiv(`guide-bubble note ${last.class}`, {role: "button", tabindex: "0"});
  const playedAt = guideAnchor(last.played, layer);
  // A bubble is only the grade; its card names the move.
  bubble.innerHTML = label(last.class);
  bubble.addEventListener("click", (event) => {
    event.stopPropagation();
    guideOpenNote = open ? null : key;
    renderGuideBubbles();
  });
  // A card played that the hand still holds one of is marked in the hand too.
  if (playedAt && playedAt.float) hand.unshift({bubble, kind: last.class, actions: [last.played]});
  else placeBubble(bubble, playedAt, layer, placed, null, tokens);
  placeInHand(hand);
  if (bestCard) {
    const group = marks[Number(bestCard.dataset.i)];
    const kind = group.items[0].kind;
    flagCard(bestCard, {card: `note:${last.seat}:${last.step}:${last.id || 0}:better:${bestCard.dataset.i}`, of: "note",
                        id: last.id || 0, step: last.step, round: last.round, grade: kind, played: last.played,
                        best: group.items[0].action});
    openCard(bestCard, group.anchor, layer, bestCard.dataset.at,
      () => { guideOpenNote = null; renderGuideBubbles(); }, group.items[0].action,
      {bubble: group.el, grade: kind, places: [last.played, ...better],
       cards: group.hand ? group.items.flatMap((m) => heldCards(m.action)) : []});
    return;
  }
  if (!open) return;
  // Best, Brilliant and Forced open with what they mean; the other grades say it in their label.
  const meaning = GUIDE_MEANING[last.class] || "";
  // The same card as the hint gives the move: grade and move, where to look instead, win chance.
  const card = bubbleDiv(`guide-bubble note ${last.class} open`, {role: "button", tabindex: "0"});
  // The win chance the move changes: a brilliant move's gain over the
  // guide's own, a flagged move's cost; the guide's own move and those as
  // good change it by nothing.
  const bestLine = last.class === "brilliant" ? chanceLine(last.lead, last.bound, last)
    : flagged ? chanceLine(-last.loss, last.bound, last) : "";
  // Compact: the win chance and Take back share the card's last row.
  card.innerHTML = head(last.class, last.played) +
    (flagged ? line(betterNarrative(better, last.played, last.why, last.better_whys)) : opened(meaning, last.why && last.why.text)) +
    (flagged && guide.takeback ? `<div class="guide-note-actions">${bestLine || "<span></span>"}<button type="button">Take back</button></div>`
      : bestLine);
  const takeback = card.querySelector("button");
  if (takeback) {
    takeback.addEventListener("click", (e) => { e.stopPropagation(); guideOpenNote = null; guidePost("/api/takeback"); });
  }
  flagCard(card, {card: `note:${last.seat}:${last.step}:${last.id || 0}`, of: "note", id: last.id || 0, step: last.step,
                  round: last.round, grade: last.class, played: last.played, best: last.best});
  openCard(card, playedAt, layer, key, () => { guideOpenNote = null; renderGuideBubbles(); }, last.played,
           {bubble, grade: last.class, places: [last.played, ...better],
            cards: playedAt && playedAt.float ? heldCards(last.played) : []});
}

// The review of the game: the summary, the seat's win chance over the game
// as a filled graph that steps the board where it is dragged or tapped (as
// the strip does), the game's card swing, and the key moments in the order
// played: the brilliant moves, the mistakes and the blunders, kept or taken
// back. A move taken back is tagged so, with the grade of the move that
// stood in its place; tries taken back that were as good as the guide's own
// are left out, and the same move tried again is one row. Counts, average
// and the graph's curve are of the game as played. Always the whole game,
// whatever position the board shows; the playhead marks that one. On a
// desktop the review stands down the right side and leaves the board in
// view; on a phone it is a sheet from the foot that lowers while the graph
// is dragged.
const REVIEW_KEY = new Set(["brilliant", "inaccuracy", "mistake", "blunder"]);
// The position the review last marked a row for (`renderGuideReview`).
let reviewShownStep = null;
function reviewMoments(notes, back) {
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const kept = notes.filter((n) => REVIEW_KEY.has(n.class)).map((n) => ({note: n, back: false}));
  const tries = [];
  for (const n of back.filter((x) => REVIEW_KEY.has(x.class))) {
    const twin = tries.find((t) => t.note.step === n.step && same(t.note.played, n.played));
    if (twin) { twin.times += 1; continue; }
    // What stood at that position in the end: the move kept there.
    const stood = notes.find((k) => k.step === n.step && k.seat === n.seat) || null;
    tries.push({note: n, back: true, times: 1, stood});
  }
  return [...kept, ...tries].sort((a, b) => a.note.step - b.note.step || Number(b.back) - Number(a.back));
}

function renderGuideReview(all) {
  // A forced move had nothing to choose: the review counts graded moves only.
  const notes = all.filter((n) => n.class !== "forced");
  const sheet = document.getElementById("guide-sheet");
  sheet.hidden = !(guideReviewOpen && notes.length);
  // Opened or closed, the sidebar changes width under the bubbles placed
  // at the hand: they are placed again once it has.
  if (document.body.classList.contains("reviewing") !== !sheet.hidden) {
    document.body.classList.toggle("reviewing", !sheet.hidden);
    requestAnimationFrame(() => renderGuideBubbles());
  }
  if (sheet.hidden) return;
  const guide = guideView();
  // The average win chance given up is over the moves shown in win chance;
  // a move shown in VP (`shownIn`) gives up VP instead.
  const onWin = notes.filter((n) => !shownIn(n).vp);
  const mean = onWin.length ? onWin.reduce((a, n) => a + Math.max(0, n.loss), 0) / onWin.length : 0;
  const given = (n, sign, x) => {
    const {vp, rate} = shownIn(n);
    return vp ? `${sign}${vpText(x / rate)}` : `${sign}${pct(x)}`;
  };
  const count = (c) => notes.filter((n) => n.class === c).length;
  const plural = {brilliant: "brilliant", blunder: "blunders", mistake: "mistakes", inaccuracy: "inaccuracies"};
  // Inaccuracies only in games graded before the guide had two error grades.
  const tally = ["brilliant", "blunder", "mistake", ...(count("inaccuracy") ? ["inaccuracy"] : [])]
    .map((c) => `${count(c)} ${count(c) === 1 ? c : plural[c]}`).join(", ");
  const moments = reviewMoments(notes, (guide && guide.taken_back) || []);
  const tried = moments.filter((m) => m.back).length;
  // The game's dice and robber numbers, you beside your opponent (the
  // opponents' mean at more seats), as the live runner's reports give them.
  const stats = guide && guide.stats;
  let numbers = "";
  if (stats && stats.you) {
    const you = stats.you, them = stats.them || {};
    const view = liveView();
    const others = (view.players || []).filter((p) => p && p.seat !== view.seat && !(view.locked || []).includes(p.seat));
    const one = others.length === 1 ? others[0] : null;
    const theirName = one ? escapeText(one.name || "Opponent") : "Opponents";
    // Dice and the total in tenths of a card (the dice against their average);
    // the robber and discards in whole cards (an opponents' mean in tenths).
    const signed = (x, tenths) => {
      if (x === null || x === undefined) return '<td class="zero">–</td>';
      const whole = !tenths && Number.isInteger(x);
      const text = Math.abs(x) < 0.05 ? "0" : `${x > 0 ? "+" : "−"}${Math.abs(x).toFixed(whole ? 0 : 1)}`;
      return `<td class="${text === "0" ? "zero" : x > 0 ? "up" : "down"}">${text}</td>`;
    };
    // Discards count against the seat, and the total takes them in.
    const lost = (r) => (r.discarded === null || r.discarded === undefined ? null : -r.discarded);
    const total = (r) => (r.net === null || r.net === undefined ? null : r.net + (lost(r) || 0));
    const dot = (seat) => (seat === null ? "" : `<i style="background:${SEAT_COLORS[seat].fill}"></i>`);
    const row = (name, seat, r) => `<tr><th scope="row">${dot(seat)}${name}</th>${signed(total(r), true)}` +
      `${signed(r.dice, true)}${signed(r.robber)}${signed(lost(r))}</tr>`;
    numbers = `<table class="guide-stats"><colgroup><col class="who"><col><col><col><col></colgroup>` +
      `<thead><tr><th>Card swing</th><th>Total</th><th>Dice</th><th>Robber</th><th>Discards</th></tr></thead><tbody>` +
      row("You", view.seat, you) + row(theirName, one ? one.seat : null, them) +
      `</tbody></table>`;
  }
  // A key moment: the move and what it gave or cost, then its grade and
  // where to look instead ("Mistake · A better move would be to ..."). A
  // move taken back says so, then the grade of the move played there in its
  // place and that move; where to look instead only where that move was not
  // as good as the guide's own either.
  const here = replaying() ? replayStep : null;
  const momentRow = (m) => {
    const n = m.note;
    const value = n.class === "brilliant" ? `<span class="guide-gain">${given(n, "+", n.lead || 0)}</span>`
      : flaggedNote(n) ? `<span class="guide-loss">${given(n, "−", n.loss)}</span>` : "<span></span>";
    const grade = (x) => `<span class="guide-class ${x.class}">${GUIDE_CLASS_WORDS[x.class]}</span>`;
    // "Mistake · Taken back → Good · End turn": the grade of the move kept
    // there, then that move.
    const then = m.back
      ? `<span class="guide-move-then"> · Taken back${m.times > 1 ? ` ×${m.times}` : ""}` +
        (m.stood ? ` → ${grade(m.stood)} · ${escapeText(shortMove(m.stood.played))}` : "") + `</span>`
      : "";
    const better = n.better && n.better.length && !(m.back && m.stood && !flaggedNote(m.stood))
      ? `<span class="guide-move-then"> · ${escapeText(reviewBetter(n.better))}</span>` : "";
    const at = here !== null && (n.opened ?? n.step) === here ? " here" : "";
    return `<div class="guide-move${m.back ? " taken-back" : ""}${at}" data-step="${n.opened ?? n.step}"><span class="guide-move-what">` +
      `<span class="guide-move-round">${n.round ? `Round ${n.round}` : "Setup"}</span> ${escapeText(shortMove(n.played))}</span>${value}` +
      `<span class="guide-move-sub">${grade(n)}${then}${better}</span></div>`;
  };
  const summary = `<div class="guide-summary"><b>${notes.length}</b> move${notes.length === 1 ? "" : "s"} graded` +
