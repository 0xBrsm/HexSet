<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HexSet rankings</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<style>
  /* The game page's palette (index.html :root), so moving between the two
     reads as one site. */
  :root {
    color-scheme: only dark;
    --bg: #14161c;
    --panel: #1c1f27;
    --ink: #e8eaf0;
    --muted: #8b93a5;
    --border: #2c3140;
    /* The board's ocean (index.html --water): this page's one highlight. */
    --water: #225e8c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.6rem 1rem;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header .logo { width: 1.75rem; height: 1.75rem; }
  header h1 { flex: 1; font-size: 1.05rem; margin: 0; }
  a { color: var(--ink); }
  main { max-width: 56rem; margin: 0 auto; padding: 1rem; }
  #tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
  #tabs button {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 0.35rem 0.8rem; cursor: pointer;
  }
  #tabs button[aria-pressed="true"] { background: var(--water); border-color: var(--water); }
  #status { color: var(--muted); font-size: 0.9rem; }
  #status { margin-top: 1rem; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 0.45rem 0.6rem; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; text-align: left; }
  td.number, th.number { text-align: right; }
  /* The visitor's own row, matched by the client id the game page sends. */
  tr.you td { background: var(--water); font-weight: 600; }
  td.empty { color: var(--muted); }
  /* A rating the ranker holds fixed: a small pin before the rating, which
     keeps a right-aligned column's digits in line. */
  svg.pin { width: 0.8em; height: 0.8em; margin-right: 0.35rem; vertical-align: -0.05em; fill: var(--muted); }
  /* Click a row for its details in a card above the table, a second for the
     two head to head: the first picked in blue, the second in the game's
     first seat red (index.html SEAT_COLORS), with a lighter shade of each
     for text on the dark panel. */
  :root { --side-a: #3b82f6; --side-a-ink: #8ab4ff; --side-b: #d62828; --side-b-ink: #ff7b7b; }
  tbody tr.pickable { cursor: pointer; }
  tbody tr.pickable:hover td { background: rgba(255, 255, 255, 0.04); }
  tbody tr.pickable:focus-visible { outline: 2px solid var(--muted); outline-offset: -2px; }
  tbody tr.side-a td { background: rgba(59, 130, 246, 0.17); }
  tbody tr.side-b td { background: rgba(214, 40, 40, 0.18); }
  tbody tr.side-a:hover td { background: rgba(59, 130, 246, 0.23); }
  tbody tr.side-b:hover td { background: rgba(214, 40, 40, 0.24); }
  tr.side-a td:first-child { box-shadow: inset 3px 0 0 var(--side-a); }
  tr.side-b td:first-child { box-shadow: inset 3px 0 0 var(--side-b); }
  #hint { color: var(--muted); font-size: 0.85rem; margin: 0 0 0.6rem; }
  #versus {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 0.55rem 1.25rem 0.9rem; margin-bottom: 1rem;
  }
  #versus .head { display: flex; align-items: center; justify-content: space-between; margin: 0 -0.7rem 0.45rem 0; }
  #versus .head h2 {
    margin: 0; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  }
  #versus .close {
    font: inherit; font-size: 1.15rem; line-height: 1;
    color: var(--muted); background: none; border: 0; border-radius: 6px; padding: 0.2rem 0.45rem; cursor: pointer;
  }
  #versus .close:hover { color: var(--ink); background: var(--border); }
  #versus .face { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 1rem; }
  #versus .side.b { text-align: right; }
  #versus .name { font-weight: 600; font-size: 1.05rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #versus .side .name::before, #versus .side.b .name::after {
    content: ""; display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 50%; vertical-align: 0.05em;
  }
  #versus .side.a .name::before { background: var(--side-a); margin-right: 0.45rem; }
  #versus .side.b .name::before { display: none; }
  #versus .side.b .name::after { background: var(--side-b); margin-left: 0.45rem; }
  #versus .sub { color: var(--muted); font-size: 0.85rem; margin-top: 0.15rem; font-variant-numeric: tabular-nums; }
  #versus .meta { color: var(--muted); font-size: 0.78rem; margin-top: 0.1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* One row picked: the card waits for a second, an empty slot on the
     right, and shows the first one's details below; the second fills the
     slot. What a click adds fades in. */
  #versus .score.totals { display: flex; justify-content: center; gap: 1.6rem; }
  #versus .score .total { font-size: 2rem; font-weight: 700; line-height: 1.1; }
  #versus .details { margin-top: 1rem; font-size: 0.9rem; }
  #versus .details p { margin: 0.5rem 0 0; color: var(--ink); overflow-wrap: anywhere; }
  #versus .details a { color: var(--side-a-ink); }
  .enter { animation: enter 200ms ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .enter { animation: none; } }
  #versus .score { text-align: center; font-variant-numeric: tabular-nums; }
  #versus .wins { font-size: 2rem; font-weight: 700; line-height: 1.1; white-space: nowrap; }
  #versus .wins .dash { color: var(--muted); font-weight: 400; margin: 0 0.35rem; }
  #versus .a { color: var(--side-a-ink); }
  #versus .b { color: var(--side-b-ink); }
  #versus .games { color: var(--muted); font-size: 0.85rem; margin-top: 0.1rem; white-space: nowrap; }
  /* One bar: the share the ratings expect, lighter across the range they
     give, with what each actually won at its ends (the expected shares,
     muted, for two who never met). */
  #versus .shares { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center;
    gap: 0.6rem; margin-top: 1rem; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  #versus .shares.unmet .pa, #versus .shares.unmet .pb { opacity: 0.6; }
  #versus .bar { display: flex; height: 0.5rem; border-radius: 999px; overflow: hidden; background: var(--border); }
  #versus .bar .fill-a { background: var(--side-a); }
  #versus .bar .fill-b { background: var(--side-b); }
  #versus .bar .band-a { background: rgba(59, 130, 246, 0.38); }
  #versus .bar .band-b { background: rgba(214, 40, 40, 0.38); }
  /* A phone: the names side by side above the score. */
  @media (max-width: 520px) {
    #versus .face { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "a b" "score score"; row-gap: 0.6rem; }
    #versus .side.a { grid-area: a; }
    #versus .side.b { grid-area: b; }
    #versus .score { grid-area: score; }
  }
</style>
</head>
<body>
<header>
  <img class="logo" src="/icon.svg" alt="">
  <h1>Rankings</h1>
</header>
<main>
  <div id="tabs" role="group" aria-label="Boards"></div>
  <div id="board"></div>
  <div id="status">Loading...</div>
</main>
<script>
"use strict";

// What the server last sent (GET /api/rankings), and this browser's client
// id: the sha256 of the secret index.html keeps in localStorage, never made
// here, so a visitor who has never played has none and no row is marked.
let data = null;
let myId = null;

const REFRESH_MS = 60000;

// What a client says of itself beside its name, as the open profile lists it.
const PROFILE_LABELS = {version: "Version", owner: "Owner", url: "Link", description: "About"};
// The rows picked to compare, by board key: their ids in the order clicked,
// at most two. Kept across the refresh.
const chosen = {};
// The picks the card was last drawn with, so that only what a click adds
// fades in, not every refresh.
let drawn = "";

async function clientId() {
  let secret = null;
  try { secret = localStorage.getItem("hexset.secret"); } catch { return null; }
  if (!secret || !window.crypto?.subtle) return null;
  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(secret));
  return Array.from(new Uint8Array(digest), (b) => b.toString(16).padStart(2, "0")).join("");
}

function node(tag, attrs = {}, text) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (text !== undefined) el.textContent = text;
  return el;
}

// A cell as the ranker sent it: text as is, a number to two places at most.
// A percentage is text the ranker wrote, aligned as a number is.
const PERCENT = /^-?\d+(\.\d+)?%$/;

function isNumeric(value) {
  return typeof value === "number" || (typeof value === "string" && PERCENT.test(value));
}

function cellText(value) {
  if (value === null || value === undefined) return "–";
  if (typeof value === "boolean") return value ? "yes" : "no";
  if (typeof value === "number") return Number.isInteger(value) ? String(value) : value.toFixed(2);
  return String(value);
}

// Where a pinned row's pin goes: its rating, the column keyed "rating", or
// the board's first column when it has none.
function pinColumn(board) {
  return (board.columns.find((c) => c.key === "rating") || board.columns[0] || {}).key;
}

// A push pin, scaled from Material Icons' "push_pin" glyph (Apache 2.0), as
// index.html borrows its check and send glyphs.
function pinIcon() {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("class", "pin");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "Rating pinned");
  const title = svg.appendChild(document.createElementNS("http://www.w3.org/2000/svg", "title"));
  title.textContent = "Rating pinned";
  const path = svg.appendChild(document.createElementNS("http://www.w3.org/2000/svg", "path"));
  path.setAttribute("d", "M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z");
  return svg;
}

function picked(board) {
  const ids = new Set(board.rows.map((r) => r.id).filter(Boolean));
  chosen[board.key] = (chosen[board.key] || []).filter((id) => ids.has(id));
  return chosen[board.key];
}

// A click on a row: picked first, then second; a third replaces the second,
// and a picked row clicked again is let go.
function pick(board, id) {
  const now = picked(board);
  chosen[board.key] = now.includes(id) ? now.filter((x) => x !== id) : now.length < 2 ? [...now, id] : [now[0], id];
  render();
}

// A pair's share for its first row (`a`) and the complement, as whole
// percents adding up to 100, in the order shown: swapped when the card
// shows the pair's second row first, so either order of picking shows the
// same two numbers.
function percents(share, flip = false) {
  const first = Math.round(100 * share);
  return flip ? [`${100 - first}%`, `${first}%`] : [`${first}%`, `${100 - first}%`];
}

// The comparison card, for one picked row or two, the first picked on the
// left. One: its name, rating, version and owner where they will stay, its
// other columns where the score will be, an empty slot on the right for the
// second, and below, its description and link. Two: the second in the slot, the wins between them, as the ranker
// counted them (the board's `pairs`), and one bar split at the share the
// ranker expected, lighter across the range it gives, with the share each
// won at its ends (the expected shares for two who never met). The server only takes http(s) addresses; a link
// is checked again rather than trusting one this page did not make.
function card(board, picks) {
  const row = (id) => board.rows.find((r) => r.id === id);
  const [a, b] = [row(picks[0]), picks[1] ? row(picks[1]) : null];
  const before = drawn.split("|");
  drawn = `${board.key}|${picks.join("|")}`;
  const isNew = (i) => before[0] !== board.key || before[i + 1] !== picks[i];
  const fresh = (el, i) => { if (isNew(i)) el.classList.add("enter"); return el; };
  const rating = board.columns.find((c) => c.key === "rating");

  const box = node("section", {id: "versus", "aria-label": b ? `${a.name} against ${b.name}` : a.name});
  if (before[0] !== board.key || before.length < 2 || !before[1]) box.classList.add("enter");
  const head = box.appendChild(node("div", {class: "head"}));
  head.appendChild(node("h2", {}, "Head to head"));
  const close = head.appendChild(node("button", {class: "close", type: "button", "aria-label": "Close"}, "×"));
  close.addEventListener("click", () => { chosen[board.key] = []; render(); });

  const face = box.appendChild(node("div", {class: "face"}));
  const side = (r, which) => {
    const el = node("div", {class: `side ${which}`});
    el.appendChild(node("div", {class: "name"}, r.name));
    if (rating && r.rating !== null && r.rating !== undefined) el.appendChild(node("div", {class: "sub"}, `${rating.label} ${cellText(r.rating)}`));
    const meta = [r.version, r.owner].filter(Boolean).join(" · ");
    if (meta) el.appendChild(node("div", {class: "meta", title: r.description || ""}, meta));
    return el;
  };
  face.appendChild(fresh(side(a, "a"), 0));
  const score = face.appendChild(node("div", {class: "score"}));
  if (!b) {
    // its other columns where the score will be, in the score's style
    score.classList.add("totals");
    for (const c of board.columns) {
      if (c === rating) continue;
      const total = fresh(score.appendChild(node("div")), 0);
      total.appendChild(node("div", {class: "total"}, cellText(a[c.key])));
      total.appendChild(node("div", {class: "games"}, c.label.toLowerCase()));
    }
    face.appendChild(node("div", {class: "side b empty"}));
    if (!a.description && !(a.url && /^https?:\/\//i.test(a.url))) return box;
    const details = box.appendChild(fresh(node("div", {class: "details"}), 0));
    if (a.description) details.appendChild(node("p", {}, a.description));
    if (a.url && /^https?:\/\//i.test(a.url)) {
      details.appendChild(node("p")).appendChild(
        node("a", {href: a.url, target: "_blank", rel: "noopener noreferrer nofollow"}, a.url));
    }
    return box;
  }

  const found = (board.pairs || []).find((p) => (p.a === a.id && p.b === b.id) || (p.a === b.id && p.b === a.id));
  const flip = found && found.a !== a.id;
  const turn = (x) => (x === null || x === undefined ? null : flip ? 1 - x : x);
  const games = found ? found.games : 0;
  const wins = found ? (flip ? [found.b_wins, found.a_wins] : [found.a_wins, found.b_wins]) : [0, 0];
  const expected = found ? turn(found.expected) : null;
  // the range, its ends swapped with the sides
  const range = found && found.expected_low !== null && found.expected_low !== undefined
    ? [turn(flip ? found.expected_high : found.expected_low), turn(flip ? found.expected_low : found.expected_high)] : null;
  fresh(score, 1);
  const decided = wins[0] + wins[1];
  if (games) {
    const line = score.appendChild(node("div", {class: "wins"}));
    line.appendChild(node("span", {class: "a"}, String(wins[0])));
    line.appendChild(node("span", {class: "dash"}, "–"));
    line.appendChild(node("span", {class: "b"}, String(wins[1])));
    const others = games - decided;
    score.appendChild(node("div", {class: "games"},
      `${games} game${games === 1 ? "" : "s"}` + (others ? ` · ${others} won by others` : "")));
  } else {
    score.appendChild(node("div", {class: "games"}, "Not met yet"));
  }
  face.appendChild(fresh(side(b, "b"), 1));

  if (expected === null && !decided) return box;
  const won = decided ? wins[0] / decided : null;
  const [left, right] = percents(decided ? found.a_wins / decided : found.expected, flip);
  const shares = box.appendChild(fresh(node("div", {class: won === null ? "shares unmet" : "shares"}), 1));
  shares.appendChild(node("span", {class: "pa a"}, left));
  const split = expected === null ? won : expected;
  const bar = shares.appendChild(node("div", {class: "bar", role: "img", "aria-label":
    (won === null ? "" : `${a.name} won ${left}, ${b.name} ${right}. `) +
    (expected === null ? "" : `Expected ${percents(found.expected, flip).join(" to ")}.`)}));
  const parts = range
    ? [["fill-a", range[0]], ["band-a", split - range[0]], ["band-b", range[1] - split], ["fill-b", 1 - range[1]]]
    : [["fill-a", split], ["fill-b", 1 - split]];
  for (const [cls, width] of parts) bar.appendChild(node("div", {class: cls, style: `width: ${100 * width}%`}));
  shares.appendChild(node("span", {class: "pb b"}, right));
  return box;
}

function chosenKey() {
  const wanted = decodeURIComponent(location.hash.slice(1));
  const keys = data.boards.map((b) => b.key);
  return keys.includes(wanted) ? wanted : keys[0];
}

function render() {
  const tabs = document.getElementById("tabs");
  const holder = document.getElementById("board");
  const status = document.getElementById("status");
  tabs.replaceChildren();
  holder.replaceChildren();
  if (!data.boards.length) {
    status.textContent = data.updated ? "Nothing ranked yet." : "Ranking...";
    return;
  }
  const key = chosenKey();
  if (data.boards.length > 1) {
    for (const b of data.boards) {
      const button = node("button", {"aria-pressed": String(b.key === key), "data-board": b.key}, b.title);
      button.addEventListener("click", () => { location.hash = encodeURIComponent(b.key); });
      tabs.appendChild(button);
    }
  }
  const board = data.boards.find((b) => b.key === key);
  if (data.boards.length === 1) holder.appendChild(node("h2", {}, board.title));
  const picks = picked(board);
  const comparable = board.rows.filter((r) => r.id).length > 1;
  if (picks.length) holder.appendChild(card(board, picks));
  else {
    drawn = "";
  }
  if (!picks.length && board.rows.some((r) => r.id)) {
    holder.appendChild(node("div", {id: "hint"},
      comparable ? "Click a row for its details, or two to compare them head to head." : "Click a row for its details."));
  }
  const numeric = new Set(board.columns
    .filter((c) => board.rows.some((r) => isNumeric(r[c.key])))
    .map((c) => c.key));
  const table = node("table");
  const head = node("tr");
  head.appendChild(node("th", {}, "Name"));
  for (const c of board.columns) head.appendChild(node("th", numeric.has(c.key) ? {class: "number"} : {}, c.label));
  table.appendChild(node("thead")).appendChild(head);
  const body = table.appendChild(node("tbody"));
  if (!board.rows.length) {
    const tr = node("tr");
    tr.appendChild(node("td", {colspan: String(board.columns.length + 1), class: "empty"}, "No one to show."));
    body.appendChild(tr);
  }
  for (const row of board.rows) {
    const at = picks.indexOf(row.id);
    const classes = [myId && row.id === myId ? "you" : "", row.id ? "pickable" : "", ["side-a", "side-b"][at] || ""];
    const tr = node("tr", {class: classes.filter(Boolean).join(" ")});
    if (row.id) {
      tr.setAttribute("tabindex", "0");
      tr.setAttribute("aria-selected", String(at >= 0));
      tr.addEventListener("click", () => pick(board, row.id));
      tr.addEventListener("keydown", (event) => {
        if (event.target === tr && (event.key === "Enter" || event.key === " ")) { event.preventDefault(); pick(board, row.id); }
      });
    }
    tr.appendChild(node("td", {}, row.name));
    for (const c of board.columns) {
      const td = tr.appendChild(node("td", numeric.has(c.key) ? {class: "number"} : {}, cellText(row[c.key])));
      if (row.pinned && c.key === pinColumn(board)) td.prepend(pinIcon());
    }
    body.appendChild(tr);
  }
  const scroll = node("div", {class: "scroll"});
  scroll.appendChild(table);
  holder.appendChild(scroll);
  status.textContent = data.min_games > 1 ? `Only players with ${data.min_games} or more games are shown.` : "";
}

async function load() {
  let response;
  try {
    response = await fetch("/api/rankings", {cache: "no-store"});
  } catch {
    document.getElementById("status").textContent = "Could not reach the server.";
    return;
  }
  if (response.status === 404) {
    data = null;
    document.getElementById("status").textContent = "This server keeps no rankings.";
    return;
  }
  if (!response.ok) {
    document.getElementById("status").textContent = "Could not load the rankings.";
    return;
  }
  data = await response.json();
  render();
}

window.addEventListener("hashchange", () => { if (data) render(); });
document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape" || !data || !data.boards.length) return;
  chosen[chosenKey()] = [];
  render();
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) load(); }, REFRESH_MS);
clientId().then((id) => { myId = id; return load(); });
</script>
</body>
</html>
