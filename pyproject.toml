[project]
name = "catan-web"
version = "0.1.0"
description = "Human-vs-bot Catan web demo — ONNX Runtime inference"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.18",
]

# pytest is not needed to run the game, only to check it. Install with
# `pip install -e ".[test]"`.
[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["catan*"]

# setuptools only auto-includes .py files under `packages.find` — web/
# index.html (the entire frontend) is a static asset living inside the
# catan package directory and needs to be listed explicitly, or a real
# `pip install .` silently omits it (found by actually building and running
# the Docker image, not by reading the config: FileNotFoundError on GET /).
[tool.setuptools.package-data]
catan = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
