[project]
name = "hexset"
# Keep in sync with hexset.__version__; checked by tests/test_versions.py.
version = "0.49.1"
description = "A Catan rules engine with search bots, batched training environments, reproducible evaluation, and browser play"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
]

# pytest is not needed to run the game, only to check it. Install with
# `pip install -e ".[test]"`.
#
# ONNX Runtime is loaded only for model inference. The browser, HTTP/MCP
# server and handcrafted bots work with the base NumPy dependency.
[project.optional-dependencies]
test = ["pytest>=8"]
server = ["onnxruntime>=1.18"]
clients = ["onnxruntime>=1.18"]
export = ["onnx>=1.16", "onnxruntime>=1.18"]
# Pin the reference engine so comparison results identify an exact implementation.
catanatron = ["catanatron @ git+https://github.com/bcollazo/catanatron.git@ecf931181b9a65bb4116a2153fb78c16f1438e00"]
# hexset.gym: a PettingZoo AEC environment (`HexSetAEC`) and a Gymnasium
# wrapper (`HexSetEnv`, registered as "HexSet-v0"). `import hexset` stays
# numpy-only, and so does `hexset.gym.lanes` -- only the two environments
# that implement these APIs need them, so the extra is checked where they
# are reached rather than at `import hexset.gym`.
gym = ["pettingzoo>=1.27", "gymnasium>=1.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hexset", "hexset.*"]

# The browser frontend must also be present in installed wheels.
[tool.setuptools.package-data]
"hexset.server" = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Optional full-game integration checks can be selected with pytest -m slow.
addopts = "-m \"not slow\""
markers = [
    "slow: full-game / behaviour-preservation tests too slow (~20s+) for the default run; select with `pytest -m slow`",
]
