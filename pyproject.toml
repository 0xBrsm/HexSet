[project]
name = "hexset-ui"
version = "0.1.0"
description = "HexSet — a human-vs-bot hex-tile strategy board game in the browser, ONNX Runtime inference"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# `hexset` is the engine, the bots and the ONNX record contract, consumed
# from the repo that owns them (0xBrsm/dev-hexset, `src/`) rather than copied
# in. This package is the gym around it: the HTTP API, the MCP server, the
# browser client, the journal, and the ONNX-runtime serving layer. Until
# `hexset` is published, install it from a checkout:
#     pip install -e /path/to/dev-hexset/src -e ".[test]"
# See `docs/engine-divergence-2026-09-02.md` for what the copy used to hold
# and what came back the other way.
dependencies = [
    "hexset>=0.13",
    "numpy>=1.26",
    "onnxruntime>=1.18",
]

# pytest is not needed to run the game, only to check it. Install with
# `pip install -e ".[test]"`.
[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hexset_ui*"]

# setuptools only auto-includes .py files under `packages.find` —
# static/index.html (the entire frontend) is a static asset living inside the
# hexset_ui package directory and needs to be listed explicitly, or a real
# `pip install .` silently omits it (found by actually building and running
# the Docker image, not by reading the config: FileNotFoundError on GET /).
[tool.setuptools.package-data]
hexset_ui = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
