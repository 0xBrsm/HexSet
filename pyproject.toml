[project]
name = "hexset"
version = "0.13.0"
description = "Graph-native Settlers of Catan engine and self-play agent"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

# torch itself isn't listed here — see hexset.netbot's docstring: it's
# provisioned separately (the training/GPU image), not a hard dependency of
# the base package, so anything that only needs the torch-free engine stays
# installable without it. `export` is the one thing that needs torch *and*
# these two, for hexset.export_onnx's .pt -> .onnx conversion.
[project.optional-dependencies]
export = ["onnx>=1.16", "onnxruntime>=1.18"]
# hexset.catanatron: the Catanatron adapter (`hexset/catanatron/`). Pinned to
# the exact commit the R-H1c gate measured against (`agents/reference/heximax.md`,
# "R-H1c take 2"; confirmed via the installed dist's PEP 610 `direct_url.json`
# inside `catan-bridge:ledger`) rather than floating on catanatron's default
# branch, since `pyproject.toml` pinning to a git URL with no revision was the
# reproducibility gap that provenance stamping (`hexset.catanatron.duel.provenance`)
# exists to catch.
catanatron = ["catanatron @ git+https://github.com/bcollazo/catanatron.git@d3f4ad05bb78d8b2309631d6d3cfa8fcb6fda816"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hexset*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
