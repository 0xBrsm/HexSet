[project]
name = "hexset-ui"
# Bumped together with `engine/pyproject.toml`'s `version` -- HexSet has
# adopted the engine's 0.13.x line as its single version. See
# `engine/tests/test_versions.py`, which fails the moment the two drift.
version = "0.13.0"
description = "HexSet — a human-vs-bot hex-tile strategy board game in the browser, ONNX Runtime inference"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# `hexset` — the engine, the bots and the ONNX record contract — now lives in
# this repo too, under `engine/` (imported with history from dev-HexNet's
# `refactor/hexnet-package-split`; see `engine/README.md` for the exact SHA).
# `heximax` — the honest handcrafted baseline bot, HexSet's sample bot rather
# than part of the engine — is a sibling top-level package under the same
# directory (`engine/heximax/`), registering itself with `hexset.arena`/
# `hexset.tuning` on import rather than being imported by either. Both are
# second/third package roots rather than separate distributions: `where`
# below lists both `src` (hexset_ui) and `engine` (hexset, heximax,
# benchmarks), so a single `pip install -e .` provides `import hexset_ui`,
# `import hexset` and `import heximax` without a path dependency or extra
# pip invocations. This is the simplest thing that works with plain
# setuptools — a path dependency (`hexset @ file://...`) would need an
# absolute, non-portable URL baked into this file, and running separate
# `pip install -e` commands per package is one more step than the tests
# below rely on. `engine/pyproject.toml` is kept for when `engine/` is later
# split into its own repo or published; it does not govern this repo's
# install.
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.18",
]

# pytest is not needed to run the game, only to check it. Install with
# `pip install -e ".[test]"`. `export` and `catanatron` are the engine's own
# extras (see `engine/pyproject.toml` for what each is for), re-exposed here
# so `pip install -e ".[test,export,catanatron]"` still works from the repo
# root now that `hexset` is not a separate install.
[project.optional-dependencies]
test = ["pytest>=8"]
export = ["onnx>=1.16", "onnxruntime>=1.18"]
catanatron = ["catanatron @ git+https://github.com/bcollazo/catanatron.git@d3f4ad05bb78d8b2309631d6d3cfa8fcb6fda816"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "engine"]
include = [
    "hexset_ui", "hexset_ui.*",
    "hexset", "hexset.*",
    "heximax", "heximax.*",
    "benchmarks", "benchmarks.*",
]

# setuptools only auto-includes .py files under `packages.find` —
# static/index.html (the entire frontend) is a static asset living inside the
# hexset_ui package directory and needs to be listed explicitly, or a real
# `pip install .` silently omits it (found by actually building and running
# the Docker image, not by reading the config: FileNotFoundError on GET /).
[tool.setuptools.package-data]
hexset_ui = ["static/*.html"]

# hexset_ui's own suite. `pytest engine/tests` runs the engine's torch-free
# slice instead — it carries its own `engine/pyproject.toml` ini section
# (pytest resolves the nearest ancestor config to the args given, so pointing
# at `engine/tests` picks that file up, not this one), which is why this
# section does not also list `engine/tests` here.
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
