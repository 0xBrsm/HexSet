  </button>
</header>
<div id="log-sheet">
  <header>
    <button id="close-log" class="icon-btn" title="Close" aria-label="Close game log">
      <svg viewBox="0 0 512 512"><use href="#icon-close"></use></svg>
    </button>
    <h1>Game log</h1>
    <div class="status"></div>
  </header>
  <div id="log-full"></div>
</div>
<!-- The one modal every choice that isn't a place on the board goes
     through — six modes, listed with what opens each above openModal().
     Layout is the same for all of them: the mode's own body on the left,
     a docked column of icon-only buttons on the right (renderModal). -->
<div id="modal">
  <div id="modal-inner">
    <div id="modal-main">
      <div id="modal-head">
        <h3 id="modal-title"></h3>
      </div>
      <div id="modal-body"></div>
    </div>
    <div id="modal-actions"></div>
  </div>
</div>
<div id="layout">
  <div id="board-pane">
    <svg id="board-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="overlay-blocker"></div>
    <!-- Visibility is set in renderBoardButtons(); the click handler is
         wired at the bottom of the script. Shares its corner with #end-turn —
         see the CSS comment on .board-fab. -->
    <!-- Own corner, no sharing — see the CSS comment on #undo-build. Only
         ever offered right after the human's own last road/settlement/city
         or bank/port trade, whether that was a setup placement or a paid
         Main-phase build (see GameSession.undo_last_build); anything else in
         between, including a second placement, takes it away again. -->
    <button id="undo-build" class="board-fab" title="Undo last action" aria-label="Undo last action">
      <svg viewBox="0 0 24 24"><use href="#icon-undo"></use></svg>
    </button>
    <button id="roll-dice" class="board-fab" title="Roll dice" aria-label="Roll dice">
      <svg viewBox="0 0 512 512"><use href="#icon-dice"></use></svg>
    </button>
    <button id="end-turn" class="board-fab" title="End turn" aria-label="End turn">
      <svg viewBox="0 0 512 512"><use href="#icon-end-turn"></use></svg>
    </button>
    <button id="buy-dev-card" title="Buy development card"
            aria-label="Buy development card">
      <span class="board-card-face">
        <svg viewBox="0 0 512 512"><use href="#icon-dev-card"></use></svg>
      </span>
      <span class="board-btn-label">BUY</span>
    </button>
    <button id="cancel-robber" class="board-fab labeled" title="Cancel playing the Knight"
            aria-label="Cancel playing the Knight">
      <svg viewBox="0 0 512 512"><use href="#icon-close"></use></svg>
      <span class="board-btn-label">CANCEL</span>
    </button>
    <div id="piece-supply"></div>
  </div>
  <div id="sidebar">
    <div id="play-area">
      <div id="players"></div>
      <div id="hand"></div>
      <div id="notice"></div>
    </div>
    <div id="log"></div>
  </div>
</div>
<script>
"use strict";

// Chosen against the terrain palette (TERRAIN_COLORS below), not in the
// abstract: a hue absent from every hex — purple, cyan — survives a piece
// sitting on any tile, where a hue that's merely a different shade of a
// terrain color (the old yellow vs Fields/Gold, the old green vs Pasture)
// doesn't. Red is the one hue no terrain tile uses at all, so it's
// untouched. Strokes lean near-black rather than a darker version of the
// fill's own hue — a green stroke that's merely dark still reads as
// "Forest-colored" next to Forest itself; near-black doesn't, on any tile.
//
// The stroke is what carries a piece, not the fill's own contrast with the
// tile under it: several of these fills sit at near-identical luminance to
// some tile (this green against Pasture is 1.01:1) and read fine anyway,
// because the near-black outline separates the shape from the tile before
// the fill has to. Which is why every piece needs one — see the casing under
// the roads in renderBoardDynamic, the one piece that was drawn without.
const SEAT_COLORS = [
  {fill: "#d62828", stroke: "#7a0d0d"},
  {fill: "#00e676", stroke: "#04241a"}, // vivid green, near-black stroke — Forest/Pasture-proof
  {fill: "#a855f7", stroke: "#581c87"}, // purple — no terrain tile is purple
  {fill: "#06b6d4", stroke: "#083344"}, // cyan — saturated enough to read against Sea/Mountains' muted blues
];

// Hues are kept a full step apart because the two pairs that share one read as
// the same tile at a phone's size: forest/pasture were both green, and
// fields/gold both yellow.
// Terrain -> glyph, and the resource each one yields. Desert and sea get none.
const TERRAIN_ICONS = {
  FOREST: "wood", HILLS: "brick", PASTURE: "sheep", FIELDS: "wheat", MOUNTAINS: "ore",
};
const RESOURCE_ICONS = {Wood: "wood", Brick: "brick", Sheep: "sheep", Wheat: "wheat", Ore: "ore"};
const RESOURCE_TERRAIN = {
  Wood: "FOREST", Brick: "HILLS", Sheep: "PASTURE", Wheat: "FIELDS", Ore: "MOUNTAINS",
};
const DEV_CARD_ICONS = {
  Knight: "knight", "Road Building": "road-building", Monopoly: "monopoly",
  "Year Of Plenty": "year-of-plenty", "Victory Point": "victory-point",
};
// The face is --dev-card-bg, set in the stylesheet so the board's buy button
// (which is a card too, see #buy-dev-card) can wear exactly the same one.
const DEV_CARD_INK = "#e8eaf0";
// A white glyph lands at 1.7:1 on pasture and 2.1:1 on fields, so the light
// tiles take a dark one instead.
const TERRAIN_ICON_INK = {
  FOREST: "#ffffff", MOUNTAINS: "#ffffff",
  // HILLS moved here from the white group: same hue as its tile below, just
  // darkened, matching PASTURE's own light-tile/dark-ink pattern instead of
  // white-on-medium-dark like the other three.
  HILLS: "#2d1910", PASTURE: "#1f2d10", FIELDS: "#4a3208",
};

const TERRAIN_COLORS = {
  FOREST: "#14532d",
  // Lightened from #c1440e — same hue, but lightness/saturation now matched
  // to PASTURE's tile instead of sitting dark enough to need a white glyph.
  HILLS: "#d99577",
  PASTURE: "#a3d977",
  FIELDS: "#e3a72f",
  MOUNTAINS: "#64748b",
  DESERT: "#e8d3a6",
  SEA: "#225e8c", // matches --water — see its comment
  GOLD: "#ffe066",
};

let board = null;          // static layout, fetched once
let state = null;          // latest state_view()
let vertexById = {};
let hexById = {};
let pendingRobberHex = null;  // when a hex has more than one victim option
let knightArmed = false;   // Knight card clicked: the board is offering its robber targets — see renderHand
let inFlight = false;
let logSheetOpen = false;  // the full-history sheet is only drawn while it's up — see renderLog
let modalMode = null;      // which decision the modal is showing, if any — see openModal
let tradeGive = null;      // selected resource index, "propose" mode only
let tradeWant = null;
let tradeSide = "give";    // "give" | "want" — which side the picker row is currently choosing for, "propose" mode only
let modelNames = [];       // GET /api/models, in MODEL_OPTIONS order
let currentBotModels = []; // this game's (or the next one's) 3 non-human-seat picks, ascending seat order

const SVG_NS = "http://www.w3.org/2000/svg";

function el(tag, attrs, ...children) {
  // Only ever used for SVG elements; HTML elements go through html() below.
  const node = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "text") node.textContent = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c) node.appendChild(c);
  return node;
}

function html(tag, attrs, innerHTML) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  if (innerHTML !== undefined) node.innerHTML = innerHTML;
  return node;
}

// One <svg><use href="#icon-..."></svg> — every icon glyph in the UI (stat
// chips, hand/trade cards, action buttons) is built from this.
function iconSvg(iconId, {fill, cls} = {}) {
  const attrs = {viewBox: "0 0 512 512"};
  if (fill) attrs.fill = fill;
  if (cls) attrs.class = cls;
  return el("svg", attrs, el("use", {href: `#icon-${iconId}`}));
}

// The piece-supply HUD's glyphs, drawn as the same shapes renderBoardDynamic
// puts on the board itself (circle/diamond/line) rather than separate icon
// art, so "what's left" reads as a small version of what's already on screen.
function pieceGlyph(kind, color) {
  if (kind === "road") {
    return el("svg", {viewBox: "0 0 24 24"}, el("line", {
      x1: 4, y1: 20, x2: 20, y2: 4, stroke: color.fill, "stroke-width": 4, "stroke-linecap": "round",
    }));
  }
  if (kind === "city") {
    return el("svg", {viewBox: "0 0 24 24"}, el("rect", {
      x: 6, y: 6, width: 12, height: 12, fill: color.fill, stroke: color.stroke, "stroke-width": 1.5,
      transform: "rotate(45 12 12)",
    }));
  }
  return el("svg", {viewBox: "0 0 24 24"}, el("circle", {
    cx: 12, cy: 12, r: 8, fill: color.fill, stroke: color.stroke, "stroke-width": 1.5,
  }));
}

// A resource .card tile: background tinted to the resource's terrain, icon
// inked for contrast against it — the shared look behind the hand and every
// modal card row/picker (see pickCard, below).
function resourceCardTile(name, {extraClasses = [], title} = {}) {
  const card = html("div", {class: ["card", ...extraClasses].join(" "), title: title ?? name});
  card.style.background = TERRAIN_COLORS[RESOURCE_TERRAIN[name]];
  card.appendChild(iconSvg(RESOURCE_ICONS[name], {fill: TERRAIN_ICON_INK[RESOURCE_TERRAIN[name]]}));
  return card;
}

async function getJSON(path) {
  const res = await fetch(path);
  return res.json();
}

async function postJSON(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body || {}),
  });
  return {ok: res.ok, data: await res.json()};
}

// --- Loading -----------------------------------------------------------

async function loadBoard() {
  board = await getJSON("/api/board");
  vertexById = {};
  for (const v of board.vertices) vertexById[v.id] = v;
  hexById = {};
  for (const h of board.hexes) hexById[h.id] = h;
  drawBoard();
}

// Fetches MODEL_OPTIONS' names and seeds currentBotModels the first time
// only, so a mid-game swap (see swapBot) survives a re-render.
async function loadModels() {
  const {models} = await getJSON("/api/models");
  modelNames = models;
  if (!currentBotModels.length) {
    currentBotModels = [0, 1, 2].map((i) => modelNames[i % modelNames.length]);
  }
}

// The one place that turns a seat number into what a human reads, so the
// status line, the robber prompt and trade offers all agree. The player list
// itself renders a bot seat as a <select>, not this — see renderPlayers.
function seatLabel(seat) {
  if (seat === state.human_seat) return "human";
  const p = state?.players.find((p) => p.seat === seat);
  return p && p.bot ? p.bot : `Player ${seat}`;
}

// Re-seats one live seat's bot without restarting the game. `slot` is that
// seat's position among the non-human seats (ascending), so the choice also
// updates currentBotModels — the next New game remembers it.
async function swapBot(seat, slot, model) {
  currentBotModels[slot] = model;
  if (inFlight) return;
  inFlight = true;
  try {
    const {ok, data} = await postJSON("/api/bot", {seat, model});
    if (ok) {
      state = data;
      render();
    } else {
      showNotice(data.error || "Could not switch that bot.");
    }
  } finally {
    inFlight = false;
  }
}

async function refreshState() {
  state = await getJSON("/api/state");
  render();
}

// --- Static board drawing ------------------------------------------------

function boardBounds() {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const v of board.vertices) {
    minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x);
    minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y);
  }
  // Wide enough to clear a port marker sitting at a true equilateral
  // triangle's apex off the coast (edge length × √3/2, bigger than the old
  // fixed 30-unit push) plus its own radius and ship icon.
  const pad = 80;
  return {minX: minX - pad, minY: minY - pad, w: (maxX - minX) + pad * 2, h: (maxY - minY) + pad * 2};
}

function centroid() {
  let sx = 0, sy = 0;
  for (const h of board.hexes) { sx += h.x; sy += h.y; }
  return {x: sx / board.hexes.length, y: sy / board.hexes.length};
}

function portLabelPos(port) {
  const [v0, v1] = port.vertices;
  const p0 = vertexById[v0], p1 = vertexById[v1];
  const mx = (p0.x + p1.x) / 2, my = (p0.y + p1.y) / 2;
  // The marker sits at the apex of a true equilateral triangle on the port's
  // hex edge — marker-to-v0 and marker-to-v1 both equal v0-to-v1 — rather
  // than at some fixed distance out from the midpoint. Rotate the edge
  // vector 90° for the apex direction, scaled by an equilateral triangle's
  // height (edge length × √3/2).
  const ex = p1.x - p0.x, ey = p1.y - p0.y;
  const edgeLen = Math.hypot(ex, ey) || 1;
  const height = edgeLen * (Math.sqrt(3) / 2);
  const nx = -ey / edgeLen, ny = ex / edgeLen;
  // Two apexes are equilateral, one on each side of the edge; take whichever
  // lands farther from the board's centroid, so the marker sits out past the
  // coast in the water rather than back over the hex.
  const c = centroid();
  const a1 = {x: mx + nx * height, y: my + ny * height};
  const a2 = {x: mx - nx * height, y: my - ny * height};
  const d1 = (a1.x - c.x) ** 2 + (a1.y - c.y) ** 2;
  const d2 = (a2.x - c.x) ** 2 + (a2.y - c.y) ** 2;
  return d1 > d2 ? a1 : a2;
}

function drawBoard() {
  const svg = document.getElementById("board-svg");
  svg.innerHTML = "";
  const b = boardBounds();
  svg.setAttribute("viewBox", `${b.minX} ${b.minY} ${b.w} ${b.h}`);

  const defs = el("defs", {});
  svg.appendChild(defs);
  const staticLayer = el("g", {id: "static-layer"});
  svg.appendChild(staticLayer);

  // Hexes
  for (const h of board.hexes) {
    const points = h.vertex_ids.map((v) => `${vertexById[v].x},${vertexById[v].y}`).join(" ");
    staticLayer.appendChild(el("polygon", {
      points, fill: TERRAIN_COLORS[h.terrain] || "#ccc", stroke: "#3a2f22", "stroke-width": 1.5,
    }));
    const icon = TERRAIN_ICONS[h.terrain];
    if (icon) {
      // A glyph box of side S puts its corners S/2*sqrt(2) from the centre, so
      // the hex's 60-unit circumradius — not its 52-unit inradius — is the
      // bound. Clipped regardless, as cheap insurance against any icon's
      // glyph reaching into its corners and spilling onto a neighbouring hex.
      const clip = el("clipPath", {id: `hexclip-${h.id}`});
      clip.appendChild(el("polygon", {points}));
      defs.appendChild(clip);
      const size = 76;
      // The clip goes on a wrapping group, not on the <use> itself: a <use> of
      // a <symbol> instantiates its own nested viewport, and clipping that
      // directly is where mobile engines disagree.
      const clipped = el("g", {"clip-path": `url(#hexclip-${h.id})`});
      clipped.appendChild(el("use", {
        href: `#icon-${icon}`, x: h.x - size / 2, y: h.y - size / 2,
        width: size, height: size, class: "hex-icon", fill: TERRAIN_ICON_INK[h.terrain],
      }));
      staticLayer.appendChild(clipped);
    }
    if (h.token) {
      const pipCount = 6 - Math.abs(7 - h.token);
      staticLayer.appendChild(el("circle", {cx: h.x, cy: h.y, r: 15, fill: "#fdf6e3", stroke: "#3a2f22", "stroke-width": 1}));
      const hot = h.token === 6 || h.token === 8;
      staticLayer.appendChild(el("text", {
        x: h.x, y: h.y - 2, class: `hex-token ${hot ? "red" : ""}`,
        // Also a presentation attribute, not the stylesheet alone: belt and
        // suspenders alongside the CSS fill above.
        fill: hot ? "#d00000" : "#000000",
        text: String(h.token),
      }));
      const dotsWidth = (pipCount - 1) * 4;
      // Number sits at h.y-2, pips were at h.y+10 (12 units below it) —
      // nudged up 20% of that gap (2.4 units) to sit a bit closer.
      for (let i = 0; i < pipCount; i++) {
        staticLayer.appendChild(el("circle", {
          cx: h.x - dotsWidth / 2 + i * 4, cy: h.y + 7.6, r: 1.5,
          class: "hex-pip", fill: h.token === 6 || h.token === 8 ? "#d00000" : "#000000",
        }));
      }
    }
  }

  // Edges (faint, always visible)
  for (const e of board.edges) {
    const p0 = vertexById[e.v0], p1 = vertexById[e.v1];
    staticLayer.appendChild(el("line", {
      x1: p0.x, y1: p0.y, x2: p1.x, y2: p1.y, class: "edge-line", id: `edge-line-${e.id}`,
    }));
  }

  // Vertices (faint dots, always visible)
  for (const v of board.vertices) {
    staticLayer.appendChild(el("circle", {cx: v.x, cy: v.y, r: 3, class: "vertex-dot"}));
  }

  // Ports: a marker in the same colour as its resource's actual hex tile
  // (white for 3:1), a ship icon, the ratio alone (the colour already says
  // which resource), and a dashed link plus a matching-coloured ring on each
  // of the two vertices it serves — position near the coast was not enough
  // to tell which corners could actually use it.
  for (const p of board.ports) {
    const pos = portLabelPos(p);
    const terrain = p.resource ? RESOURCE_TERRAIN[p.resource] : null;
    const fill = terrain ? TERRAIN_COLORS[terrain] : "#ffffff";
    const ink = terrain ? (TERRAIN_ICON_INK[terrain] || "#ffffff") : "#2b2118";
    const ratio = p.resource ? "2:1" : "3:1";

    for (const vid of p.vertices) {
      const v = vertexById[vid];
      staticLayer.appendChild(el("line", {x1: pos.x, y1: pos.y, x2: v.x, y2: v.y, class: "port-link"}));
      staticLayer.appendChild(el("circle", {cx: v.x, cy: v.y, r: 5, fill, class: "port-vertex-mark"}));
    }

    staticLayer.appendChild(el("circle", {cx: pos.x, cy: pos.y, r: 18, fill, class: "port-marker"}));
    staticLayer.appendChild(el("use", {
      href: "#icon-ship", x: pos.x - 11, y: pos.y - 16, width: 22, height: 22, fill: ink, class: "port-ship",
    }));
    // Ratio text, raised 2px off the marker's own centre (was +12).
    staticLayer.appendChild(el("text", {x: pos.x, y: pos.y + 10, class: "port-label", text: ratio, fill: ink}));
  }

  // Dynamic layers, repopulated by render(). SVG paints in document order,
  // so later groups sit on top — roads before buildings so a settlement/city
  // at a road's endpoint isn't partly covered by it.
  //
  // The robber's target hexes go under all of them. They wash a whole tile
  // in accent colour, and every seat's pieces standing on that tile were
  // being tinted through it — two seats whose colours are already close stop
  // being tellable apart at exactly the moment you have to pick one to rob.
  // Only the targets take clicks, so the pieces above are pointer-transparent
  // (.pieces-layer) and a click anywhere on the tile still reaches the hex.
  svg.appendChild(el("g", {id: "hex-target-layer"}));
  svg.appendChild(el("g", {id: "roads-layer", class: "pieces-layer"}));
  svg.appendChild(el("g", {id: "buildings-layer", class: "pieces-layer"}));
  svg.appendChild(el("g", {id: "robber-layer"}));
  svg.appendChild(el("g", {id: "clickable-layer"}));
}

// The engine's own Phase names (hexset_ui.game.Phase) — plain English instead of
// the enum spelling for the status line; anything missing falls back to the
// raw name rather than disappearing.
const PHASE_LABELS = {
  SETUP_SETTLEMENT: "PLACE SETTLEMENT",
  SETUP_ROAD: "PLACE ROAD",
  ROLL: "ROLL",
  DISCARD: "DISCARD",
  ROBBER: "PLACE ROBBER",
  MAIN: "BUILD · BUY · TRADE",
  TRADE_RESPOND: "TRADE",
  GAME_OVER: "GAME OVER",
};

// --- Action grouping -------------------------------------------------------

const VERTEX_TYPES = new Set(["SETUP_SETTLEMENT", "BUILD_SETTLEMENT", "BUILD_CITY"]);
const EDGE_TYPES = new Set(["SETUP_ROAD", "BUILD_ROAD"]);
// MOVE_ROBBER and PLAY_KNIGHT are the same move — put the robber somewhere
// new, then rob one of that hex's neighbours — reached two different ways.
// They get separate buckets here only so robberMove() below can tell which
// way you came, because that is the sole thing the rest of the page needs.
const SIMPLE_TYPES = new Set(["ROLL", "END_TURN", "BUY_DEV_CARD", "PLAY_ROAD_BUILDING", "ACCEPT_TRADE", "DECLINE_TRADE"]);

function groupActions(actions) {
  const g = {
    vertex: {}, edge: {}, robberByHex: {}, knightByHex: {}, simple: {},
    monopoly: [], yearOfPlenty: [], bankTrade: [], proposeTrade: [], discard: [],
  };
  for (const a of actions) {
    if (VERTEX_TYPES.has(a.type)) (g.vertex[a.a] = g.vertex[a.a] || []).push(a);
    else if (EDGE_TYPES.has(a.type)) (g.edge[a.a] = g.edge[a.a] || []).push(a);
    else if (a.type === "MOVE_ROBBER") (g.robberByHex[a.a] = g.robberByHex[a.a] || []).push(a);
    else if (a.type === "PLAY_KNIGHT") (g.knightByHex[a.a] = g.knightByHex[a.a] || []).push(a);
    else if (SIMPLE_TYPES.has(a.type)) g.simple[a.type] = a;
    else if (a.type === "PLAY_MONOPOLY") g.monopoly.push(a);
    else if (a.type === "PLAY_YEAR_OF_PLENTY") g.yearOfPlenty.push(a);
    else if (a.type === "BANK_TRADE") g.bankTrade.push(a);
    else if (a.type === "PROPOSE_TRADE") g.proposeTrade.push(a);
    else if (a.type === "DISCARD") g.discard.push(a);
  }
  return g;
}

// The robber move, or null if none is pending — and the one place on this
// page that knows there are two ways into it. Everything downstream (the
// highlighted hexes, the exclusivity, the victim modal, the header, the
// CANCEL corner) reads this rather than the two action types, because past
// this function they are the same interaction:
//
//   forced  a seven was rolled, so the robber has to go somewhere
//           (Phase.ROBBER). The targets are on the board the moment the
//           state arrives, and only answering clears them. The engine offers
//           no other action in that phase, so "a robber move owns the board"
//           is already true here without the client enforcing anything.
//   knight  the Knight card was clicked (Phase.ROLL or MAIN). The identical
//           question, volunteered rather than imposed — so it can be taken
//           back, and since the engine is still offering everything else
//           meanwhile, the client is what has to hold the rest of the page
//           down while it's open.
//
// Never both: MOVE_ROBBER belongs to Phase.ROBBER, PLAY_KNIGHT to ROLL and
// MAIN, and render() disarms a Knight the moment playing one stops being
// legal. Forced is checked first regardless, so a stale flag can't win.
function robberMove(g) {
  if (Object.keys(g.robberByHex).length) {
    return {targets: g.robberByHex, source: "forced", cancellable: false};
  }
  if (knightArmed && Object.keys(g.knightByHex).length) {
    return {targets: g.knightByHex, source: "knight", cancellable: true};
  }
  return null;
}

// Takes back a robber move that was volunteered rather than imposed — which
// means a Knight, since a seven leaves nothing to take back. Puts the board,
// the hand and the corner buttons back the way they were before the card was
// clicked.
//
// Reachable four ways — the card itself, the CANCEL corner, a click on the
// bare water, and Escape — because this is the only pending choice with no
// modal standing in front of it, and the header is the one other thing
// saying you're in it.
function cancelRobberMove() {
  knightArmed = false;
  pendingRobberHex = null;
  render();
}

// --- Sending actions --------------------------------------------------

// Each POST here plays at most one seat's turn server-side (GameSession's
// advance_one_seat, not the whole-cascade advance_bots) and returns that
// seat's own already-applied state. A 350ms-a-seat *narration* was tried
// here once and removed — it announced who had acted while the board still
// showed the state before they did. This isn't that: settle() below drives
// a real request per seat, so whatever renderStatus() shows (see its
// "not the human's turn" branch) is the truth as of that response, not a
// guess dressed up to look like progress.

// Every call that might hand the table to a bot funnels through settle()
// afterward, which keeps requesting POST /api/advance — one seat, one
// response, one render() — until it's the human's move again, the game
// ends, or a setup road's handoff is waiting on the human's own confirm.
async function settle() {
  while (!state.game_over && !state.awaiting_confirm && state.to_move !== state.human_seat) {
    const {ok, data} = await postJSON("/api/advance", {});
    state = data;
    render();
    if (!ok) {
      showNotice(data.error || "Something went wrong.");
      break;
    }
  }
}

// Every action that touches the server has the same shape: refuse to
// overlap with one already running, dim the board while it's out, and
// undim it whatever happens. Only what goes in the middle differs.
async function blocking(body) {
  if (inFlight) return;
  inFlight = true;
  const overlay = document.getElementById("overlay-blocker");
  overlay.classList.add("show");
  try {
    await body();
  } finally {
    inFlight = false;
    overlay.classList.remove("show");
  }
}

function sendAction(action) {
  return blocking(async () => {
    // Any half-made client-side choice is spent the moment an action goes
    // out: the state coming back is the one that decides what's open now.
    pendingRobberHex = null;
    knightArmed = false;
    const {ok, data} = await postJSON("/api/action", action);
    state = data;
    showNotice(ok ? "" : (data.error || "That was not legal."));
    render();
    if (ok) await settle();
  });
}

function newGame() {
  return blocking(async () => {
    const {data} = await postJSON("/api/new", {bot_models: currentBotModels});
    state = data;
    await loadBoard();
    showNotice("");
    render();
  });
}

function undoBuild() {
  return blocking(async () => {
    const {ok, data} = await postJSON("/api/undo", {});
    state = data;
    showNotice(ok ? "" : (data.error || "Nothing to undo."));
    render();
  });
}

// Lets the bots' turn(s) actually run after a setup road handed off to one
// — see state.awaiting_confirm and GameSession.confirm_setup_turn. Shares
// the #end-turn button/corner with sendAction(END_TURN) itself; which one a
// click means is decided where that's wired, at the bottom of the script.
function confirmSetupTurn() {
  return blocking(async () => {
    const {ok, data} = await postJSON("/api/confirm", {});
    state = data;
    showNotice(ok ? "" : (data.error || "Could not continue."));
    render();
    if (ok) await settle();
  });
}

function showNotice(text) {
  const notice = document.getElementById("notice");
  notice.textContent = text;
  notice.classList.toggle("show", Boolean(text));
}

// --- Rendering ----------------------------------------------------------

function render() {
  if (!state || !board) return;
  // The highlight colour throughout the page (build targets, selection
  // borders, the active player row, ...) is the human's own seat colour
  // rather than one fixed purple — every CSS rule that used to hardcode a
  // shade of #6d5ce8 now derives it from this custom property instead (see
  // the color-mix() rules on .clickable-vertex etc.). Set on every render
  // rather than once, since a new game can seat the human differently.
  document.documentElement.style.setProperty("--accent", SEAT_COLORS[state.human_seat].fill);
  // Arming a Knight is purely client-side, so nothing else clears it: a new
  // state where playing one is no longer legal (it was played, the turn moved
  // on, the game ended) has to. legal_actions is empty whenever it isn't the
  // human's decision, so this covers the turn case too.
  if (knightArmed && !state.legal_actions.some((a) => a.type === "PLAY_KNIGHT")) {
    knightArmed = false;
    pendingRobberHex = null;
  }
  renderStatus();
  renderPlayers();
  renderHand();
  renderBoardDynamic();
  renderPieceSupply();
  renderBoardButtons();
  renderLog();
  syncModal();
}

function renderStatus() {
  const phaseEl = document.getElementById("phase");
  if (state.game_over) {
    phaseEl.textContent = state.winner === null
      ? "GAME OVER — NO WINNER"
      : `PLAYER ${state.winner + 1} WINS`;
    return;
  }
  // Whoever settle() just requested a seat's turn for (or is about to) — not
  // the human's decision to make, so the phase underneath it is beside the
  // point. Excludes awaiting_confirm: to_move has already moved on to
  // whoever's next by then, but the human still has the confirm button to
  // press first (see state.awaiting_confirm), so the phase label stays put
  // until they do. True the instant this renders either way: every
  // /api/advance response is that seat's own already-applied move, not a
  // name announced ahead of the board (see the comment above settle()).
  if (!state.awaiting_confirm && state.to_move !== state.human_seat) {
    phaseEl.textContent = `PLAYER ${state.to_move + 1}'S TURN`;
    return;
  }
  // The same move either way, so the same words either way — PHASE_LABELS
  // already reads "PLACE ROBBER" for the forced one. A Knight is a phase the
  // server knows nothing about, so it gets the prefix instead of a label of
  // its own: it says a card is being spent and can still be taken back, which
  // is the only part that differs.
  phaseEl.textContent = knightArmed
    ? `KNIGHT — ${PHASE_LABELS.ROBBER}`
    : PHASE_LABELS[state.phase] || state.phase;
}

// One icon + (optional) number, for the player list's stat row — glyphs
// throughout rather than "3 VP", "Longest road" as English text.
function statChip(iconId, value, extraClass, title) {
  // A double-digit value is wide enough, inside the player row's fixed-width
  // stat columns (see .player-row's grid-template-columns), to crowd right
  // into the next column's glyph if the icon-to-number gap stays put — .wide
  // shrinks that gap instead, so the extra digit eats padding that was
  // never doing much rather than eating the next stat's breathing room.
  const wide = value !== undefined && String(value).length > 1 ? " wide" : "";
  const classes = `stat${extraClass ? ` ${extraClass}` : ""}${wide}`;
  const chip = html("span", {class: classes, title});
  chip.appendChild(iconSvg(iconId, {cls: "stat-icon"}));
  if (value !== undefined) chip.appendChild(document.createTextNode(String(value)));
  return chip;
}

// A hand column's own header: the same card/star glyph its cards use, next
// to the label — continuing the icon-forward style the player stat row
// established rather than switching back to plain text here.
function handColHeader(iconId, text) {
  const header = html("div", {class: "player-meta hand-col-header"});
  header.appendChild(iconSvg(iconId, {cls: "stat-icon"}));
  header.appendChild(document.createTextNode(text));
  return header;
}

function renderPlayers() {
  const container = document.getElementById("players");
  container.innerHTML = "";
  let slot = 0;
  for (const p of state.players) {
    const color = SEAT_COLORS[p.seat];
    const row = html("div", {class: `player-row${state.to_move === p.seat ? " active" : ""}`});
    const swatch = html("div", {class: "swatch"});
    swatch.style.background = color.fill;
    swatch.style.borderColor = color.stroke;
    row.appendChild(swatch);

    const nameEl = html("div", {class: "player-name"});
    if (p.seat === state.human_seat) {
      nameEl.classList.add("player-name-plain");
      nameEl.textContent = "human";
    } else {
      // The picker *is* the player line: changing this seat's bot mid-game
      // goes straight through swapBot, no separate "apply" step.
      const mySlot = slot++;
      const select = html("select", {});
      for (const name of modelNames) select.appendChild(html("option", {value: name}, name));
      select.value = p.bot || currentBotModels[mySlot] || modelNames[0];
      select.addEventListener("change", () => swapBot(p.seat, mySlot, select.value));
      nameEl.appendChild(select);
    }
    row.appendChild(nameEl);

    const cards = p.hand !== undefined
      ? board.resources.map((r) => p.hand[r]).reduce((a, b) => a + b, 0)
      : p.hand_size;
    // Each chip is its own grid cell now (see .player-row's
    // grid-template-columns), appended straight onto the row rather than
    // into a wrapping div — that's what lets every row share the same
    // column tracks instead of each row sizing its own flex children.
    row.appendChild(statChip("victory-point", p.victory_points, "", "Victory points"));
    row.appendChild(statChip("card", cards, "", "Resource cards"));
    row.appendChild(statChip("dev-card", p.dev_card_count, "", "Development cards"));
    // Route length and Knights played sit in every row, always — comparable
    // seat to seat, tinted only for whoever actually holds the title right
    // now (see statChip's "held" class, gated in CSS on
    // .stat.road.held/.stat.army.held).
    row.appendChild(
      statChip("road", p.road_length, `road${p.longest_road ? " held" : ""}`, "Longest road")
    );
    row.appendChild(
      statChip("knight", p.knights_played, `army${p.largest_army ? " held" : ""}`, "Largest army")
    );
    // Each seat's own last roll, not one global value — lets you compare
    // who's been running hot or cold rather than only ever seeing whoever
    // rolled most recently. It's the row's last (and only ever-absent)
    // column, so leaving it out when a seat hasn't rolled yet still leaves
    // every other row's columns aligned.
    if (p.last_roll) row.appendChild(statChip("dice", p.last_roll, "roll", "Last roll"));
    container.appendChild(row);
  }
}

// What clicking a dev card in hand does, or null if that card can't be
// played right now (it isn't legal, or it's a Victory Point, which is never
// "played" at all — it just counts). Playing a dev card is only ever done
// this way now; nothing in the actions list plays one.
//
// Three shapes, by what the card still needs to know:
//   - nothing (Road Building) — send it and let the board take the two roads
//   - a resource (Monopoly, Year of Plenty) — open the modal that picks one
//   - a hex (Knight) — arm the board, since a modal can't point at a tile
// The first two are cancelled by closing the modal; the Knight, having none,
// keeps its own four ways out (see cancelRobberMove).
function devCardPlay(name, g) {
  // While a Knight is armed it is the only card that answers a click: the
  // rest stand down with the board and the corner buttons (see
  // renderBoardButtons), so a half-made choice can't be walked away from by
  // quietly starting another one.
  if (robberMove(g) && name !== "Knight") return null;
  if (name === "Knight" && Object.keys(g.knightByHex).length) {
    return {
      title: knightArmed ? "Cancel Knight" : "Play Knight",
      run: () => {
        if (knightArmed) { cancelRobberMove(); return; }
        knightArmed = true;
        pendingRobberHex = null;
        render();
      },
    };
  }
  if (name === "Road Building" && g.simple.PLAY_ROAD_BUILDING) {
    return {title: "Play Road Building", run: () => sendAction(g.simple.PLAY_ROAD_BUILDING)};
  }
  if (name === "Monopoly" && g.monopoly.length) {
    return {title: "Play Monopoly", run: () => openModal("monopoly")};
  }
  if (name === "Year Of Plenty" && g.yearOfPlenty.length) {
    return {title: "Play Year of Plenty", run: () => openModal("year-of-plenty")};
  }
  return null;
}

// The human's own cards, kept in a fixed spot below the seat list (in actual
// seat order) rather than tied to wherever their seat happens to fall.
function renderHand() {
  const container = document.getElementById("hand");
  container.innerHTML = "";
  const p = state.players.find((p) => p.seat === state.human_seat);
  if (!p || p.hand === undefined) return;

  // What a click on a card does is decided by what's actually legal, which
  // is to say by the phase — and in most phases it does nothing at all.
  // legal_actions arrives empty unless the human is the one to move (see
  // GameSession.legal_wire_actions), so reading it is the whole test; there's
  // no separate game_over/to_move check to keep in sync with it.
  const g = groupActions(state.legal_actions);
  // The same condition the old floating trade button gated its own
  // visibility on: a bank trade or a player offer is proposable right now.
  // Discarding is the other thing a resource card can do, but it happens in
  // the modal that DISCARD opens over the whole page (see syncModal), not
  // here — these cards aren't reachable while that's up.
  const canTrade = !robberMove(g) && (g.bankTrade.length > 0 || g.proposeTrade.length > 0);

  // Two columns, side by side, both always present — the header and the
  // row's height hold their place even at zero cards, so buying a first dev
  // card doesn't shove the resources column around.
  const resCol = html("div", {class: "hand-col"});
  resCol.appendChild(handColHeader("card", "Resource Cards"));
  const resHand = html("div", {class: "hand"});
  for (const r of board.resources) {
    const n = p.hand[r];
    if (!n) continue;
    const idx = board.resources.indexOf(r);
    const card = resourceCardTile(r, {title: `${r}: ${n}`});
    card.appendChild(html("div", {class: "count"}, String(n)));
    if (canTrade) {
      card.classList.add("hand-card-clickable");
      card.addEventListener("click", () => openModal("propose", {give: idx}));
    }
    resHand.appendChild(card);
  }
  resCol.appendChild(resHand);
  container.appendChild(resCol);

  const devCol = html("div", {class: "hand-col"});
  devCol.appendChild(handColHeader("dev-card", "Development Cards"));
  const devHand = html("div", {class: "hand"});
  for (const c of board.dev_cards) {
    const n = p.dev_cards[c];
    if (!n) continue;
    const play = devCardPlay(c, g);
    const classes = ["card"];
    if (play) classes.push("hand-card-clickable");
    // Only the Knight can be lit: it's the only card whose choice is made on
    // the board rather than in a modal, so it's the only one with a state to
    // show while the choice is still open.
    if (c === "Knight" && knightArmed) classes.push("hand-card-armed");
    const card = html("div", {class: classes.join(" "), title: play ? play.title : `${c}: ${n}`});
    card.style.background = "var(--dev-card-bg)";
    card.appendChild(iconSvg(DEV_CARD_ICONS[c], {fill: DEV_CARD_INK}));
    card.appendChild(html("div", {class: "count"}, String(n)));
    if (play) card.addEventListener("click", play.run);
    devHand.appendChild(card);
  }
  devCol.appendChild(devHand);
  container.appendChild(devCol);
}

// How many of each piece the human still has to place — supply caps come
// from the engine (board.piece_supply, see board_layout in webplay.py) so
// this can't drift from what can_place_settlement/_road/_city actually
// enforce; built counts are just what's already on the board in this seat's
// colour.
function renderPieceSupply() {
  const container = document.getElementById("piece-supply");
  container.innerHTML = "";
  const seat = state.human_seat;
  const color = SEAT_COLORS[seat];
  const roadsBuilt = state.edge_owner.filter((o) => o === seat).length;
  const settlementsBuilt = state.vertex_owner.filter(
    (o, v) => o === seat && state.vertex_building[v] === 1
  ).length;
  const citiesBuilt = state.vertex_owner.filter(
    (o, v) => o === seat && state.vertex_building[v] === 2
  ).length;
  const remaining = {
    settlement: board.piece_supply.settlement - settlementsBuilt,
    city: board.piece_supply.city - citiesBuilt,
    road: board.piece_supply.road - roadsBuilt,
  };
  for (const kind of ["settlement", "city", "road"]) {
    const tile = html("div", {
      class: `supply-tile supply-${kind}`, title: `${kind}s left: ${remaining[kind]}`,
    });
    tile.appendChild(pieceGlyph(kind, color));
    tile.appendChild(html("div", {class: "count"}, String(remaining[kind])));
    container.appendChild(tile);
  }
}

// One of the two lines a road is made of — the casing or the colour, which
// differ only in stroke and width. Round caps on both, so the casing follows
// the colour's own rounded ends instead of squaring them off.
function roadLine(r, stroke, width) {
  return el("line", {
    x1: r.v0.x, y1: r.v0.y, x2: r.v1.x, y2: r.v1.y,
    stroke, "stroke-width": width, "stroke-linecap": "round",
  });
}

function renderBoardDynamic() {
  const buildingsLayer = document.getElementById("buildings-layer");
  const roadsLayer = document.getElementById("roads-layer");
  const robberLayer = document.getElementById("robber-layer");
  const clickLayer = document.getElementById("clickable-layer");
  const hexTargetLayer = document.getElementById("hex-target-layer");
  buildingsLayer.innerHTML = "";
  roadsLayer.innerHTML = "";
  robberLayer.innerHTML = "";
  clickLayer.innerHTML = "";
  hexTargetLayer.innerHTML = "";

  // Roads, each one drawn twice: the seat's near-black stroke a little wider
  // underneath, then the colour on top of it. A line has no outline of its
  // own the way the buildings below have theirs, so a road was the one piece
  // whose fill had to survive the tile unaided — which a light fill on a
  // light tile doesn't. The casing is 1 unit proud on each side, the same
  // margin a building's stroke-width 2 leaves around its own shape.
  //
  // Every casing goes down before any of the colour so that where two seats'
  // roads meet at a vertex nobody has built on yet, the second road's casing
  // lands under the first one's colour rather than across it.
  const roads = [];
  for (const e of board.edges) {
    const owner = state.edge_owner[e.id];
    if (owner < 0) continue;
    roads.push({v0: vertexById[e.v0], v1: vertexById[e.v1], color: SEAT_COLORS[owner]});
  }
  for (const r of roads) roadsLayer.appendChild(roadLine(r, r.color.stroke, 8));
  for (const r of roads) roadsLayer.appendChild(roadLine(r, r.color.fill, 6));

  // Settlements & cities
  for (const v of board.vertices) {
    const owner = state.vertex_owner[v.id];
    if (owner < 0) continue;
    const building = state.vertex_building[v.id]; // 1 settlement, 2 city
    const color = SEAT_COLORS[owner];
    if (building === 2) {
      // 50% larger than the original 16x16 (8 -> 12 half-width).
      buildingsLayer.appendChild(el("rect", {
        x: v.x - 12, y: v.y - 12, width: 24, height: 24,
        fill: color.fill, stroke: color.stroke, "stroke-width": 2, transform: `rotate(45 ${v.x} ${v.y})`,
      }));
    } else {
      // 50% larger than the original r=8.
      buildingsLayer.appendChild(el("circle", {
        cx: v.x, cy: v.y, r: 12, fill: color.fill, stroke: color.stroke, "stroke-width": 2,
      }));
    }
  }

  // Robber
  const robberHex = hexById[state.robber];
  if (robberHex) {
    robberLayer.appendChild(el("use", {
      href: "#icon-robber", class: "robber",
      x: robberHex.x - 21, y: robberHex.y - 25.5, width: 42, height: 51,
    }));
  }

  if (state.to_move !== state.human_seat || state.game_over) return;
  const g = groupActions(state.legal_actions);

  // Hexes into their own layer below the pieces, then edges, then vertices
  // here: a hex overlay's boundary coincides exactly with the edges around
  // it, so the broadest target has to sit underneath or it steals clicks
  // meant for a road on its rim (later siblings paint on top in SVG).
  // Vertices are the smallest, most precise targets and go last so nothing
  // else can shadow them either.
  const move = robberMove(g);
  for (const [hid, actions] of Object.entries(move ? move.targets : {})) {
    const h = hexById[hid];
    const points = h.vertex_ids.map((v) => `${vertexById[v].x},${vertexById[v].y}`).join(" ");
    const poly = el("polygon", {points, class: "clickable-hex"});
    poly.addEventListener("click", () => {
      if (actions.length === 1) { sendAction(actions[0]); return; }
      // syncModal picks this up on the way through and opens "steal" over it.
      pendingRobberHex = Number(hid);
      render();
    });
    hexTargetLayer.appendChild(poly);
  }
  // A pending robber move owns the board until it's answered or taken back,
  // so the build targets come down with everything else (renderBoardButtons)
  // and its hexes above are all that answers a click. Free for the forced
  // one — the engine offers nothing else in Phase.ROBBER — but the rule is
  // the same either way, so it's written once.
  if (move) return;
  for (const [eid, actions] of Object.entries(g.edge)) {
    const e = board.edges[eid];
    const p0 = vertexById[e.v0], p1 = vertexById[e.v1];
    const line = el("line", {x1: p0.x, y1: p0.y, x2: p1.x, y2: p1.y, class: "clickable-edge"});
    line.addEventListener("click", () => sendAction(actions[0]));
    clickLayer.appendChild(line);
  }
  // A city target reads as a diamond (the same rotated-square mark
  // upgrading it will actually place, see renderBoardDynamic's buildings
  // loop) rather than the settlement/setup circle, so the highlight itself
  // tells you which action a vertex is offering before you click it. Sized
  // in JS rather than through the coarse-pointer CSS bump .clickable-vertex
  // uses for circles: a CSS width/height override on a <rect> would grow it
  // from its fixed x/y corner, not its center, throwing off the diamond's
  // position over the vertex.
  const coarsePointer = window.matchMedia?.("(pointer: coarse)").matches ?? false;
  for (const [vid, actions] of Object.entries(g.vertex)) {
    const v = vertexById[vid];
    let target;
    if (actions[0].type === "BUILD_CITY") {
      const side = coarsePointer ? 26 : 16;
      target = el("rect", {
        x: v.x - side / 2, y: v.y - side / 2, width: side, height: side,
        transform: `rotate(45 ${v.x} ${v.y})`, class: "clickable-vertex",
      });
    } else {
      // Unchanged from before: r stays a fixed attribute, and the
      // coarse-pointer CSS rule (.clickable-vertex { r: 18 }) still does the
      // touch-target bump for circles on its own.
      target = el("circle", {cx: v.x, cy: v.y, r: 11, class: "clickable-vertex"});
    }
    target.addEventListener("click", () => sendAction(actions[0]));
    clickLayer.appendChild(target);
  }
}

// The board's four corner buttons, shown exactly when what they do is on
// offer. There is no sidebar list of actions any more: rolling, ending a turn
// and buying a development card are these buttons; building and the robber
// are highlights on the board itself; a development card is played by
// clicking it in hand (devCardPlay); and every choice shaped like a menu —
// trading, discarding, the robber's victim, Monopoly's resource, Year of
// Plenty's pair — is a mode of the one modal.
function renderBoardButtons() {
  // awaiting_confirm counts as "my turn" too: to_move has already moved on
  // to whoever's next (see GameSession.apply_human_action), but the human
  // still has the one decision left — confirm — before that's real. Nothing
  // else legal_actions-based reads this differently, since the server
  // empties legal_actions the moment to_move isn't the human regardless.
  const myTurn = !state.game_over && (state.to_move === state.human_seat || state.awaiting_confirm);
  // A robber move is the one choice the game asks for on the board rather
  // than in the modal, and it behaves like a modal mode all the same: nothing
  // behind it is reachable until it's answered. When it came from a Knight,
  // rolling and ending a turn are both still legal server-side and both would
  // silently throw the choice away, so they come down with the rest.
  const move = robberMove(groupActions(state.legal_actions));
  const offered = (type) => myTurn && !move && legalAction(type) !== null;
  // Not a legal_actions entry — undo is a session convenience, not a game
  // rule — so it reads the server's own can_undo flag instead of offered().
  showFab("undo-build", myTurn && !move && Boolean(state.can_undo));
  showFab("roll-dice", offered("ROLL"));
  // The same button doubles as the setup-road confirm — see the click
  // handler wired at the bottom of the script, which is what tells the two
  // apart (offered("END_TURN") vs awaiting_confirm) rather than this line.
  showFab("end-turn", offered("END_TURN") || (myTurn && !move && Boolean(state.awaiting_confirm)));
  showFab("buy-dev-card", offered("BUY_DEV_CARD"));
  // Not an action at all, this one: it's the way back out of a robber move
  // that was volunteered, which is the only kind there is a way back out of.
  // It takes over the same corner BUY just gave up — see the CSS on the pair.
  showFab("cancel-robber", Boolean(move && move.cancellable));
}

function showFab(id, on) {
  document.getElementById(id).classList.toggle("show", on);
}

// The wire action of a given type, or null. Read twice for each corner
// button — once to decide whether to show it, once when it's clicked — which
// is cheaper and harder to get wrong than parking three of them in module
// variables and keeping those in step with what's on screen.
function legalAction(type) {
  return state.legal_actions.find((a) => a.type === type) || null;
}

// --- The modal ---------------------------------------------------------------
//
// One modal, six modes — every decision in the game that isn't a place on the
// board. Three are click-driven and three open themselves; see openModal and
// syncModal below for which is which.

// Modes syncModal owns: each one appears the moment its condition does and
// goes away the moment it stops, so nothing else has to remember to open or
// close it. The other three are opened by a click and only ever closed by one.
const MODAL_AUTO = new Set(["respond", "discard", "steal"]);

// Modes Escape and a backdrop click may close. The two left out are the two
// the game is actually waiting on: an offer has to be answered, and cards owed
// to the bank after a seven have to be handed over. "steal" is here because
// closing it only backs out to the hex list, not out of the move.
const MODAL_DISMISSIBLE = new Set(["propose", "monopoly", "year-of-plenty", "steal"]);

// A right-column icon-only button. `label` is the tooltip/screen-reader text,
// not shown — the whole column is glyphs.
function modalActionButton(icon, label, {primary = true} = {}) {
  const attrs = {title: label, "aria-label": label};
  if (primary) attrs.class = "primary";
  const btn = html("button", attrs);
  btn.appendChild(iconSvg(icon));
  return btn;
}

// One card tile — the same visual .card the hand section uses (via
// resourceCardTile), just selectable/dimmable on top of that (see .pick-card
// in the stylesheet). Every mode that picks a resource is built out of these.
function pickCard(resourceIdx, {selected, disabled, count, title, onClick} = {}) {
  const name = board.resources[resourceIdx];
  const classes = ["pick-card"];
  if (selected) classes.push("selected");
  if (disabled) classes.push("disabled");
  const card = resourceCardTile(name, {extraClasses: classes, title});
  if (count !== undefined && count > 1) {
    card.appendChild(html("div", {class: "count"}, String(count)));
  }
  if (onClick && !disabled) card.addEventListener("click", onClick);
  return card;
}

// A bundle (as the wire format carries it: one count per resource index),
// display-only — the "respond" mode's read of what's being offered.
// bundle.length must match board.resources.length (both are NUM_RESOURCES);
// the server and tradePicker below share that assumption too.
function tradeCardRow(bundle) {
  const row = html("div", {class: "pick-row"});
  for (let r = 0; r < bundle.length; r++) {
    if (!bundle[r]) continue;
    row.appendChild(pickCard(r, {count: bundle[r]}));
  }
  return row;
}

// Every trade the human sees reads the same way round and in the same words,
// whichever modal it's in and whoever started it: what leaves their hand on
// the left, what arrives on the right. Both sides are their own hand, which
// is why neither label says whose — the title says who the other party is
// ("Trade offer from Red"), and the exchange is always the human's own view
// of it.
const GIVE_LABEL = "Give";
const GET_LABEL = "Get";

// The read-only version of that row, for an offer someone else has made.
// Bundles are the wire format's own (one count per resource index), and
// they arrive from the *proposer's* point of view — see renderRespondMode,
// which flips them, since a bundle they called "give" is one the human gets.
function tradeExchangeRow(giveBundle, getBundle) {
  const row = html("div", {class: "trade-exchange"});
  const giveSide = html("div", {class: "trade-side"});
  giveSide.appendChild(html("div", {class: "trade-side-label"}, GIVE_LABEL));
  giveSide.appendChild(tradeCardRow(giveBundle));
  const getSide = html("div", {class: "trade-side"});
  getSide.appendChild(html("div", {class: "trade-side-label"}, GET_LABEL));
  getSide.appendChild(tradeCardRow(getBundle));
  row.appendChild(giveSide);
  row.appendChild(html("div", {class: "trade-arrow"}, "→"));
  row.appendChild(getSide);
  return row;
}

// The "propose" mode's give/want row: the shape of the trade being built,
// and the target of the picker below it. Each side shows its own current
// card (or an empty slot before anything's chosen) and tapping either aims
// the picker at that side.
function tradeProposeRow() {
  const row = html("div", {class: "trade-exchange"});
  row.appendChild(tradeProposeSide("give", GIVE_LABEL));
  row.appendChild(html("div", {class: "trade-arrow"}, "→"));
  row.appendChild(tradeProposeSide("want", GET_LABEL));
  return row;
}

// `which` is the wire format's own word for the side ("want" is what the
// human gets), so it stays as-is; the label above it is what's read.
function tradeProposeSide(which, label) {
  const picked = which === "give" ? tradeGive : tradeWant;
  const side = html("div", {class: "trade-side"});
  side.appendChild(html("div", {class: "trade-side-label"}, label));
  const slot = html("div", {class: "trade-slot" + (tradeSide === which ? " active" : "")});
  slot.appendChild(picked !== null
    ? pickCard(picked, {})
    : html("div", {class: "trade-slot-empty"}, "?"));
  slot.addEventListener("click", () => { tradeSide = which; renderModal(); });
  side.appendChild(slot);
  return side;
}

// One picker row for both sides, aimed at whichever is active. All five
// resources every time — held counts on the give side, the dimmed ones being
// what can't be picked there (nothing held, for "give"; whatever "give" is
// already, for "want") — so the row holds its shape between taps instead of
// reflowing the way a per-side list of just the legal options would.
//
// Choosing a give auto-advances to want, but only while want is still empty:
// once there's a whole trade on the table, coming back to change one side
// shouldn't move the picker off the side just changed.
function tradePicker(p) {
  const isGive = tradeSide === "give";
  const wrap = html("div", {class: "trade-picker"});
  wrap.appendChild(html("div", {class: "trade-picker-label"},
    isGive ? "Pick what you'll give" : "Pick what you'll get"));
  const row = html("div", {class: "pick-row"});
  for (let r = 0; r < board.resources.length; r++) {
    const held = p.hand ? p.hand[board.resources[r]] : 0;
    row.appendChild(pickCard(r, {
      selected: r === (isGive ? tradeGive : tradeWant),
      disabled: isGive ? !held : r === tradeGive,
      count: isGive ? held : undefined,
      onClick: () => {
        if (isGive) {
          tradeGive = r;
          if (tradeWant === r) tradeWant = null;
          if (tradeWant === null) tradeSide = "want";
        } else {
          tradeWant = r;
        }
        renderModal();
      },
    }));
  }
  wrap.appendChild(row);
  return wrap;
}

// The six modes, and what puts each one up:
//   "propose"        clicking a resource card in hand (renderHand)
//   "monopoly"       clicking the Monopoly card in hand (devCardPlay)
//   "year-of-plenty" clicking the Year of Plenty card in hand (devCardPlay)
//   "respond"        an incoming offer waiting on the human (syncModal)
//   "discard"        cards owed to the bank after a seven (syncModal)
//   "steal"          a robber hex with more than one victim (syncModal)
function openModal(mode, {give = null} = {}) {
  modalMode = mode;
  if (mode === "propose") {
    // `give` pre-selects the resource clicked in the hand (see renderHand());
    // "want" always starts fresh regardless, since that choice hasn't been
    // made yet either way.
    tradeGive = give;
    tradeWant = null;
    // Straight to the half that's still open: coming in from a card in hand
    // has already answered "give".
    tradeSide = give === null ? "give" : "want";
  }
  document.getElementById("modal").classList.add("show");
  renderModal();
}

function closeModal() {
  // Closing the victim list is backing out to the hex list, not out of the
  // move: the board's highlights were never cleared to get here, so dropping
  // the pending hex is the whole undo — and it's also what stops syncModal
  // from putting the same list straight back up on the next render.
  if (modalMode === "steal") pendingRobberHex = null;
  modalMode = null;
  document.getElementById("modal").classList.remove("show");
}

// Called every render(). The three MODAL_AUTO modes are conditions rather
// than clicks — an offer is waiting, cards are owed, a hex with more than one
// neighbour has been picked — so this is the single place that decides which
// of them (if any) should be up, and closes whichever no longer should be.
// The click-driven three are left alone entirely.
function syncModal() {
  const g = groupActions(state.legal_actions);
  const live = state.offer && state.to_move === state.human_seat && !state.game_over ? "respond"
    : g.discard.length ? "discard"
    : pendingRobberHex !== null ? "steal"
    : null;
  if (live) {
    if (modalMode !== live) openModal(live);
    else renderModal();
  } else if (MODAL_AUTO.has(modalMode)) {
    closeModal();
  }
}

function renderModal() {
  const title = document.getElementById("modal-title");
  const body = document.getElementById("modal-body");
  const actions = document.getElementById("modal-actions");
  body.innerHTML = "";
  actions.innerHTML = "";
  const g = groupActions(state.legal_actions);

  if (modalMode === "respond") renderRespondMode(g, title, body, actions);
  else if (modalMode === "discard") renderDiscardMode(g, title, body);
  else if (modalMode === "steal") renderStealMode(g, title, body, actions);
  else if (modalMode === "monopoly") renderMonopolyMode(g, title, body, actions);
  else if (modalMode === "year-of-plenty") renderYearOfPlentyMode(g, title, body, actions);
  else renderProposeMode(title, body, actions);

  // A forced discard has nothing to put in the button column, and an empty
  // 96px gutter reads as a button that failed to render rather than as no
  // button at all.
  actions.style.display = actions.children.length ? "" : "none";
}

function renderRespondMode(g, title, body, actions) {
  const offer = state.offer;
  // Who it's from goes in the title so the exchange row below can stay
  // just the cards themselves plus a one-word attribution each.
  title.textContent = `Trade offer from ${seatLabel(offer.proposer)}`;
  // Flipped into the human's own point of view: what the proposer `want`s is
  // what leaves this hand, so it's the left/"Give" side here, and what they
  // offered to `give` is what arrives. Same direction as the propose modal,
  // which is the whole point — an offer shouldn't read backwards just
  // because someone else started it.
  body.appendChild(tradeExchangeRow(offer.want, offer.give));

  if (g.simple.ACCEPT_TRADE) {
    const btn = modalActionButton("check", "Accept trade");
    btn.addEventListener("click", () => { closeModal(); sendAction(g.simple.ACCEPT_TRADE); });
    actions.appendChild(btn);
  }
  if (g.simple.DECLINE_TRADE) {
    const btn = modalActionButton("close", "Decline trade", {primary: false});
    btn.addEventListener("click", () => { closeModal(); sendAction(g.simple.DECLINE_TRADE); });
    actions.appendChild(btn);
  }
}

// One card at a time, which is how the engine models it too (see
// `legal_actions` under Phase.DISCARD): this comes straight back up with one
// fewer owed until the quota is met, so there's nothing to confirm and no
// button column at all.
function renderDiscardMode(g, title, body) {
  const owed = state.discard_quota[state.human_seat];
  title.textContent = `Discard ${owed} card${owed === 1 ? "" : "s"}`;
  body.appendChild(html("div", {class: "modal-note"}, "Half your hand, rounded down — pick one."));
  const p = state.players.find((pl) => pl.seat === state.human_seat);
  const byResource = {};
  for (const a of g.discard) byResource[a.a] = a;
  const row = html("div", {class: "pick-row"});
  for (let r = 0; r < board.resources.length; r++) {
    const name = board.resources[r];
    const a = byResource[r];
    // All five, with the ones the human doesn't hold dimmed rather than
    // dropped: the row keeps the same shape from one discard to the next
    // instead of reflowing under the cursor between clicks.
    row.appendChild(pickCard(r, {
      count: p.hand[name], disabled: !a,
      title: a ? `Discard ${name}` : name,
      onClick: () => sendAction(a),
    }));
  }
  body.appendChild(row);
}

// The second half of a robber move: the hex is already picked (it's the one
// still highlighted behind this), and this is who to rob on it. Seats, not
// resources, so plain buttons with the player list's own colour swatch.
function renderStealMode(g, title, body, actions) {
  const move = robberMove(g);
  const options = (move && move.targets[pendingRobberHex]) || [];
  title.textContent = "Steal from";
  const row = html("div", {class: "steal-row"});
  for (const a of options) {
    const btn = html("button", {class: "steal-option"});
    if (a.b < state.players.length) {
      const swatch = html("div", {class: "swatch"});
      swatch.style.background = SEAT_COLORS[a.b].fill;
      swatch.style.borderColor = SEAT_COLORS[a.b].stroke;
      btn.appendChild(swatch);
      btn.appendChild(document.createTextNode(seatLabel(a.b)));
    } else {
      btn.appendChild(document.createTextNode("Nobody"));
    }
    btn.addEventListener("click", () => { closeModal(); sendAction(a); });
    row.appendChild(btn);
  }
  body.appendChild(row);

  const cancel = modalActionButton("close", "Back to the hexes", {primary: false});
  cancel.addEventListener("click", closeModal);
  actions.appendChild(cancel);
}

function renderMonopolyMode(g, title, body, actions) {
  title.textContent = "Play Monopoly";
  body.appendChild(html("div", {class: "modal-note"},
    "Take every card of one resource from every other player."));
  const row = html("div", {class: "pick-row"});
  for (const a of g.monopoly) {
    row.appendChild(pickCard(a.a, {
      title: `Take every ${board.resources[a.a]}`,
      onClick: () => { closeModal(); sendAction(a); },
    }));
  }
  body.appendChild(row);
  actions.appendChild(modalCancelButton());
}

// Fifteen pairs at most (every combination of two resources, repeats
// included), and fewer when the bank can't cover one — so they're laid out as
// whole pairs to click rather than as two sequential picks, which would need
// its own half-made state and a way to back out of it.
function renderYearOfPlentyMode(g, title, body, actions) {
  title.textContent = "Play Year of Plenty";
  body.appendChild(html("div", {class: "modal-note"}, "Take two cards from the bank."));
  const row = html("div", {class: "pick-row"});
  for (const a of g.yearOfPlenty) {
    const [r0, r1] = board.year_of_plenty_pairs[a.a];
    const pair = html("div", {class: "pick-pair", title: `${r0} + ${r1}`});
    pair.appendChild(pickCard(board.resources.indexOf(r0), {}));
    pair.appendChild(pickCard(board.resources.indexOf(r1), {}));
    pair.addEventListener("click", () => { closeModal(); sendAction(a); });
    row.appendChild(pair);
  }
  body.appendChild(row);
  actions.appendChild(modalCancelButton());
}

function renderProposeMode(title, body, actions) {
  title.textContent = "Propose a trade";
  const p = state.players.find((pl) => pl.seat === state.human_seat);

  // Resolved before the body is built, not after: which of the two the picked
  // pair lands on decides both what the preview's give side costs and which
  // glyph the primary button carries (see the end of this function).
  let bank = null, offer = null;
  if (tradeGive !== null && tradeWant !== null) {
    bank = state.legal_actions.find(
      (a) => a.type === "BANK_TRADE" && a.a === tradeGive && a.b === tradeWant
    );
    // Found, never built: the server's own `legal_wire_actions` always
    // includes every (give held, want different) pair as a PROPOSE_TRADE
    // option — see GameSession._proposable_options — regardless of whether
    // anyone else could currently cover it. Hands are private in HexSet, so
    // that's deliberate: whether a trade is "available" depends on hidden
    // opponent hands, which nothing here may act on, and this find() always
    // succeeds as a result. Building the action from parts instead would
    // break the one hard rule this whole page follows (see the module
    // docstring): the client only ever echoes back a wire object the server
    // itself offered.
    offer = state.legal_actions.find(
      (a) => a.type === "PROPOSE_TRADE" && a.give[tradeGive] === 1 && a.want[tradeWant] === 1
    );
  }

  // The trade as it stands on top, the one picker row aimed at whichever
  // half is being chosen underneath. Both are drawn whatever's been picked
  // so far, so nothing in here changes height between taps. One-for-one,
  // which is the shape of the offer to the table; what the bank would charge
  // instead is on its own button (the rate under the glyph), since the two
  // are alternatives and the row can only show one.
  body.appendChild(tradeProposeRow());
  body.appendChild(tradePicker(p));

  // Both routes, whenever both are open: the bank or a port takes the cards
  // now at its own rate, the table might take them one-for-one or might not.
  // Neither is the default — they are different trades, not two ways of
  // making the same one — so both sit in the primary slot and the human
  // picks.
  //
  // Always all three, disabled until the trade they'd send actually exists:
  // this column is centered on its own axis, so a button appearing as the
  // second half of the pair lands would shove the others off the position
  // the finger was already heading for.
  actions.appendChild(bankTradeButton(bank));
  const send = modalActionButton("send", "Offer to the other players");
  if (offer) send.addEventListener("click", () => { closeModal(); sendAction(offer); });
  else send.disabled = true;
  actions.appendChild(send);
  actions.appendChild(modalCancelButton());
}

// The bank's own rate, which is the worst one available; anything cheaper is
// a port the human has a building on — 3:1 generic or 2:1 for this one
// resource. See hexset_ui.board.ports (BASE_TRADE_RATIO / GENERIC_RATIO /
// SPECIFIC_RATIO) and hexset_ui.economy.trade_ratios, which returns the cheapest
// rate per resource without saying where it came from; the number is the only
// thing that distinguishes them, so it's what this reads.
const BANK_RATE = 4;

// Give-N-for-1 to the bank, or to a port if the human has settled one that
// covers this resource. The glyph says which — a ship for a port, matching
// the markers on the board's own coast, and a bank front otherwise — and the
// rate goes under it, so "give 2" and "give 4" don't look like the same
// button.
//
// `action` is null while there's no such trade to make yet (a half-picked
// pair, or a rate the hand can't cover): the button stays put and disabled,
// and once a give is picked it still carries that resource's rate, which is
// the reason it's out of reach when it is.
function bankTradeButton(action) {
  const ratio = tradeGive === null ? null : state.trade_ratios[board.resources[tradeGive]];
  const viaPort = ratio !== null && ratio < BANK_RATE;
  const label = ratio === null
    ? "Trade with the bank"
    : `Trade ${ratio} for 1 with ${viaPort ? `your ${ratio}:1 port` : "the bank"}`;
  const btn = modalActionButton(viaPort ? "ship" : "bank", label);
  // Non-breaking space, not "": the rate line has to keep its height or the
  // glyph above it shifts when the first give is picked.
  btn.appendChild(html("span", {class: "modal-btn-rate"}, ratio === null ? "\u00a0" : `${ratio}:1`));
  if (action) btn.addEventListener("click", () => { closeModal(); sendAction(action); });
  else btn.disabled = true;
  return btn;
}

// The shared way out of every dismissible mode — the same thing Escape and a
// backdrop click do (see the boot wiring), just as a button you can see.
function modalCancelButton() {
  const btn = modalActionButton("close", "Cancel", {primary: false});
  btn.addEventListener("click", closeModal);
  return btn;
}

// The inline sidebar log only ever shows the current round's lines (every
// seat's actions within one lap of the table, not just one seat's). The full
// history is one tap away via the hamburger's full-screen sheet, which keeps
// everything — and is drawn only while it's actually up (see setLogOpen),
// since by the late game that's hundreds of rows to rebuild for something
// nobody is looking at.
function renderLog() {
  const currentRound = (entry) => entry.slice(0, entry.indexOf("\t")) === String(state.round);
  drawLog("log", state.log.filter(currentRound));
  if (logSheetOpen) drawLog("log-full", state.log);
}

function drawLog(id, entries) {
  const logEl = document.getElementById(id);
  const atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
  logEl.innerHTML = "";
  for (const entry of entries) {
    // "round\ttext" from the server — split once so the number gets its own
    // fixed-width column (.log-turn) and every line's text lines up
    // regardless of digit count.
    const tab = entry.indexOf("\t");
    const row = html("div", {class: "log-line"});
    row.appendChild(html("span", {class: "log-turn"}, tab === -1 ? "" : entry.slice(0, tab)));
    row.appendChild(html("span", {}, tab === -1 ? entry : entry.slice(tab + 1)));
    logEl.appendChild(row);
  }
  if (atBottom) logEl.scrollTop = logEl.scrollHeight;
}

// --- Boot -----------------------------------------------------------------

document.getElementById("new-game").addEventListener("click", newGame);
// A corner button is only on screen when its action is on offer (see
// renderBoardButtons), so re-reading it here always finds the same one that
// put the button up.
for (const [id, type] of [["roll-dice", "ROLL"], ["buy-dev-card", "BUY_DEV_CARD"]]) {
  document.getElementById(id).addEventListener("click", () => {
    const action = legalAction(type);
    if (action) sendAction(action);
  });
}
// #end-turn doubles as the setup-road confirm (see confirmSetupTurn) — an
// actual END_TURN if one's on offer, the confirm otherwise, since the two
// are never both true at once (legal_actions is empty whenever
// awaiting_confirm is, per GameSession.apply_human_action).
document.getElementById("end-turn").addEventListener("click", () => {
  const action = legalAction("END_TURN");
  if (action) sendAction(action);
  else if (state.awaiting_confirm) confirmSetupTurn();
});
document.getElementById("cancel-robber").addEventListener("click", cancelRobberMove);
document.getElementById("undo-build").addEventListener("click", undoBuild);
// Clicking the water backs out of an armed Knight, the same way clicking a
// modal's backdrop backs out of it. Only the bare <svg> reports itself as the
// target — every hex, road and vertex is a filled child that would be the
// target instead — so this fires on the empty sea and nothing else.
document.getElementById("board-svg").addEventListener("click", (e) => {
  if (e.target.id === "board-svg" && knightArmed) cancelRobberMove();
});
// Backdrop click closes the modes that are safe to walk away from — see
// MODAL_DISMISSIBLE. The two it leaves alone are the two the game is waiting
// on, and they'd reopen themselves via syncModal on the next render anyway.
document.getElementById("modal").addEventListener("click", (e) => {
  if (e.target.id === "modal" && MODAL_DISMISSIBLE.has(modalMode)) closeModal();
});

const logSheet = document.getElementById("log-sheet");
function setLogOpen(open) {
  logSheetOpen = open;
  logSheet.classList.toggle("show", open);
  if (!open) return;
  // Drawn on the way up rather than on every render — renderLog skips it
  // while it's closed.
  drawLog("log-full", state.log);
  const full = document.getElementById("log-full");
  full.scrollTop = full.scrollHeight;
}
document.getElementById("open-log").addEventListener("click", () => setLogOpen(true));
document.getElementById("close-log").addEventListener("click", () => setLogOpen(false));
// Escape unwinds the innermost thing first: whichever modal mode can be
// walked away from, then an armed Knight (the one open choice with no modal
// to close, since its answer is a tile on the board), then the log sheet.
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (MODAL_DISMISSIBLE.has(modalMode)) { closeModal(); return; }
  if (knightArmed) { cancelRobberMove(); return; }
  setLogOpen(false);
});

(async function init() {
  await Promise.all([loadBoard(), loadModels()]);
  await refreshState();
})();
</script>
</body>
</html>
